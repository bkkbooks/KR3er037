body:
  text: 卷之一脈訣脈學大要凡診脈之法先要定得三部位分明白又要曉得十二經絡五臟六腑及五臟配合五行四時生克之理又要知得脈之息數分別浮沉遲數滑澀及諸脈陰陽主病之原也何謂三部謂人兩手俱有寸關尺也凡診脈先以中指揣摩掌後有小高骨就是關脈然後下前後二指關前至魚際得同身之一寸故名為寸口為陽關後至尺澤得同身之一寸故名為尺部為陰又寸脈六分關脈六分其上三分入於寸內是陽得寸內九分陽數九也尺內七分關下三分入於尺內是陰得尺內一寸陰數十也終始一寸九分此也又長人脈長當疏排指短人脈短當密排指人瘦小則輕取之人肥大則重取之性急人脈急性緩人脈緩又有反關脈在三部之後或臂側若過寸口上魚際者名曰魚際脈有左大右小者有左小右大者有貴人兩手清微而無脈者有兩手俱洪大者須用心診視凡診脈先須調平自己氣息男左女右初輕按消息之次中按消息之再重按消息之推而上消息之上即關之前也推而下消息之下即關之後也推而內消息之內即臟之脈也推而外消息之外即腑之脈也然後自寸關尺逐步尋究一呼一吸之間要以脈行四至為率閏以太息脈五至是為平脈也其有太過不及則為病脈也凡人十二經動脈循環一晝夜五十周朝於寸口會於平旦內經凡診平人之脈常以平旦至診病脈則不以晝夜拘也難經獨取寸口者即手太陰之經也上古診法有三其一各於十二經動脈見處分為三部天地人以候各臟腑其二寸口人迎參之以驗引繩四時之大小以決病其三獨取寸口以內外分臟腑以高下定身形斯叔和所取以為寸口臟腑之位也何謂五臟六腑蓋五臟者心肝脾肺腎也六腑者膽胃大腸小腸膀胱三焦也左手關前一分為人迎右手關前一分為氣口左手寸口心與小腸之脈所出君火也左手關部肝與膽之脈所出風木也左手尺部腎與膀胱之脈所出寒水也右手寸口肺與大腸之脈所出燥金也右手關部脾與胃之脈所出濕土也右手尺部命門與三焦之脈所出相火也蓋五臟者藏精氣而不瀉滿而不能實六腑者傳化物而不藏實而不能滿故脈始於中焦飲食入口藏胃精微之化注於手太陰肺手陽明大腸足陽明胃足太陰脾手太陰心手太陽小腸足太陽膀胱足少陰腎手厥陰心胞手少陽三焦足少陽膽足厥陰肝復還注於手太陰肺循環灌溉朝於寸口人迎以處百病而決死生也然以對待之位言之則左寸火克右寸金左關木克右關土左尺水克右尺火左剛右柔有夫婦之別也然左手屬陽右手屬陰左寸君火以尊而在上右尺相火以卑而在下有君臣之道也又以循環之序言之蓋以右寸金生左尺水水又生左關木木又生左寸火火復通右尺相火相火又生右關土土又生右寸金而金復生水此五行更相生養循環無端有子母之親也蓋子能令母實母能令子虛是也治法云虛則補其母實則瀉其子如水生木是水為母木為子木復生火是木受竊氣故水怒而剋火所謂子逢竊氣母乃力爭火又生土是火為母土為子土見火被水克故怒而剋水所謂母被鬼傷子來力救假如肝木有餘是肺金不足金不能剋木故木無所畏其氣有餘反搏激肺金而乘其脾土也故曰搏所不勝而乘所勝也此五臟之氣內相淫併為疾也又如肝木氣少不及則不能以制土土無所畏而遂妄行乃凌其腎水矣故曰所勝妄行而所生者受病也肝木之氣不平則肺金之氣自搏故曰所不勝搏之也蓋木氣不平土金交搏相迫為疾故曰氣迫也相生相剋相勝展轉無窮舉一以例其餘也何謂五臟配合五行四時五音蓋五行者金木水火土也四時者春夏秋冬也五音者宮商角徵羽也肝主筋其華在爪其藏魂其聲呼其液泣應角音調而直屬木應乎春令其色青其味酸心主血脈其榮在色其藏神其養血其候音其聲言其液汗應徵音和而長屬火應乎夏令其色赤其味苦肺主皮毛其華在毛其藏魄其聲器其液涕應商音輕而徑屬金應乎秋令其色白其味辛腎主骨其華在發其充在骨其藏精與志其候耳其聲呻其液唾應羽音沉而深屬水應乎冬令其色黑其味鹹脾主肌肉其華在唇四白其充在肌其藏意與志其聲歌其液涎應宮音大而和屬土應乎四季月其色黃其味甘是五臟配合五行四時五音也何謂四季之脈謂春弦夏鉤秋毛冬石然春脈弦者謂正月寅二月卯木旺春日脈浮如魚遊在波雖出猶未全浮故其脈弦而長以應東方肝木之氣也夏脈鉤者謂四月巳五月午火上炎夏日在膚陽氣太盛故其脈來有力浮大而數以應南方心火之氣也秋脈毛者謂七月申八月酉金旺而金性輕浮秋日下膚隨陽氣漸降將欲藏去故其脈來浮澀而短以應西方肺金之氣也冬脈石者謂十月玄十一月子水旺而水性下流冬日在骨陽氣伏藏故其脈沉濡軟滑以應北方腎水之氣也辰戌丑未四季月脈遲緩者謂土性厚重其脈來和緩而大以應中央脾土之氣也四時之脈雖有弦鉤毛石之分然春三月六部中俱帶弦夏三月俱帶洪秋三月俱帶浮冬三月俱帶沉六部內按之又兼和緩為有胃氣此無病之脈也若乃見弦鉤毛石而無和緩此是真臟之脈人不病而死也大抵脈者氣血之先也氣血盛則脈盛氣血衰則脈衰氣血熱則脈數氣血寒則脈遲氣血壯則脈大氣血微則脈小氣血和則脈平試以脈之大綱言之初持脈輕手候之脈見於皮膚之間者陽也腑也心脈之應也蓋心肺在上故其脈皆浮若浮大而散者心也浮澀而短者肺也重手按之脈附於肌肉之下者陰也臟也肝腎之應也蓋肝腎在下故其脈皆沉若弦而長者肝也沉而軟滑者腎也不輕不重中而取之脈應於肌肉之間陰陽相適中和之應脾胃之候也蓋脾居中州故脈緩而大此五臟不病之平脈也診視者必熟知平脈然後可以辨病脈也若短小而見於皮膚之間者陰乘陽也洪大而見於肌肉之下者陽乘陰也寸尺皆然又以脈之十二經細分之脈有浮沉診有輕重也左寸先以輕手得之是小腸屬表後以重手如六菽之重得之是心屬裡心在肺下主血脈心脈循血脈而行按至血脈而得為浮稍加力脈道粗大為大又稍加力脈道潤軟而散此乃浮大而散不病之脈也若出於血脈之上見於皮膚之間是其浮也入於血脈之下見於筋骨之分是其沉也左關先以輕手得之是膽屬表後以重手如十二菽之重取之是肝屬裡肝在脾下主筋肝脈循筋而行按至筋平脈道如箏弦者為弦次稍加力脈道迢迢為長此弦長為不病之脈也若出於筋上見於皮膚血脈之間是其浮也入於筋下見於骨上是其沉也左尺先以輕手得之是膀胱屬表後以重手取之度如十五菽之重而得之是腎屬裡腎在肝下主骨腎脈循骨而行按至骨上得之為沉又重手按之脈道無力者為濡舉指來疾流利者為滑此乃沉濡而滑不病之脈也若出於骨上見於皮膚血脈筋肉之間是其浮也入而至骨是其沉也右寸先以輕手得之是大腸屬表後以重手取之如三菽之重得之是肺屬裡肺居最高主皮毛肺脈循皮毛而行按至皮毛而得者為浮稍加力脈道不利為澀又稍加力脈道縮入關中上半指不動下半指微動者為短此浮澀而短不病之脈也若出於皮毛之上見於皮膚之表是其浮也入於血脈筋肉之分是其沉也右關先以輕手得之是胃屬表後以重手取之如九菽之重得之是脾屬裡脾在心下主肌肉脾脈循肌肉而行按至肌肉脈道如微風楊柳梢之狀為緩又稍加力脈道敦實者為大此為緩大不病之脈也若出於肌肉之上見於皮毛之間者是其浮也入於肌肉之下見於筋骨之分者是其沉也右尺先以輕手得之是三焦為表後以重手得之是命門屬裡為相火氣與腎通也又有三部九候之訣三部者寸關尺也九候者浮中沉也凡三部每部各有浮中沉三候三而三之為九候也浮主皮膚候表及腑中主肌肉以候胃氣沉主筋骨候里及臟也寸為陽為上部法天為心肺以應上焦主心胸以上至頭之有疾也關為陰陽之中為中部法人為肝脾以應中焦主膈以下至臍之有疾也尺為陰為下部法地為腎命以應下焦主臍以下至足之有疾也此三部診候之大法也又脈有上下來去至止此六字不明則陰陽虛實不別也上者來者至者為陽下者去者止者為陰上者自尺部上於寸口陽生於陰也下者自寸口下於尺部陰生於陽也來者自骨肉之分而出於皮膚之際氣之升也去者自皮膚之際而還於骨肉之分氣之降也應曰至息曰止也何謂生克之理謂五行有相剋相生也相生者謂金生水水生木木生火火生土土生金是也相剋者謂金剋木木剋土土剋水水剋火火剋金是也凡脈遇相生者吉相剋者凶何也蓋心若見沉細肝見短澀腎見遲緩肺見洪大脾見弦長皆遇克也為鬼賊相侵危證也又心若見緩肝見洪肺見沉之類是子扶養於母遇我之脈生也雖病易瘥至而腎病傳肝肝病傳心之類此母來抑子病雖不死亦延綿日久矣又我克者為妻假如春屬木脈見脾土是夫得妻脈也妻來乘夫雖非正克然春中獨見脾脈土乘木衰土乘之則生金來剋木耳若肝脈弦緩而本體尚存脾土雖乘之為微邪不足慮也若本脈全無而獨見脾緩之脈為害必矣脈賦云假令春得肺脈為鬼得心脈則為肝兒腎為其母脾則為妻故春得脾而莫療冬見心而不治夏得肺而難瘥秋得肝亦何疑此即四時休旺以例生克之義也然人脈之息數出氣為呼入氣為吸一呼一吸為之一息一息之間脈來四至或五至為平和不大不小和緩舒暢此無病之脈也至於三遲二敗冷而危也六數七極熱之甚也八脫九死極於十一二至與夫奄奄兩息一至則又散而為變也如六數七極熱也脈中有力為有神矣當泄其熱三遲二敗寒也脈中有力為有神矣當去其寒若數極遲敗中不復有力為無神也將何所悖耶可與之決死期矣然脈理大要元人又謂不出於浮沉遲數滑澀六脈也浮脈輕手取之沉脈重手取之遲數之脈以己之呼吸而取之滑澀之脈則又察乎往來之形也浮者陽也脈在肉上行也輕手乃得而芤洪散大長濡弦皆輕手而得之類也沉者陰也脈在肉下行也重手乃得而伏石短細牢實皆重手而得之類也遲者脈不急也一息二三至而濡緩皆遲之類也數者脈來速也一息六七至而疾促皆數之類也至於滑澀之脈則以往來察其形狀也浮為陽在表為風為虛沉為陰在裡為濕為實數則在腑為熱為陽為燥遲則在臟為寒為冷為陰滑為血多氣少澀為氣多血少滑為血有餘澀為氣獨滯是浮沉遲數滑澀六脈此診家之要法也男子左手脈常大於右手者為順女子右手脈常大於左手者為順男脈在關上女脈在關下男子尺脈常弱寸脈常盛女子尺脈常盛寸脈常弱是其常也反者男得女脈為不足女得男脈為太過是以男子不可久瀉女子不可久吐上部有脈下部無脈其人當吐不吐不死上部無脈下部有脈病雖重不死何也蓋人有遲脈謂有元氣猶樹之有根也凡人左手屬陽右手屬陰汗多亡陽下多亡陰諸陰為寒諸陽為熱至於疾病為證又有陰陽表裡之辨蓋六淫之邪襲於經絡而未入於胃腑如左手人迎脈緊盛大於氣口一倍為外感風寒皆屬於表為陽也腑也七情之氣鬱於心腹之內不能越散飲食五味之傷留於腸胃之間不能通泄如右手氣口脈大人迎一倍脈緊盛為內傷飲食皆屬於里為陰也臟也若人迎氣口俱緊盛此為夾食傷寒為內傷外感俱見也又陽經取決於人迎陰經取決於氣口左脈不和為病在表為陽主四肢右脈不和為病在裡為陰主腹臟至於諸脈又有表裡陰陽主病之異何也蓋謂脈有七表八里九道凡二十四種是也自六朝以前診視固無此說然此起於高陽生之議論義雖未得其統要然智者緣此而進亦足以察病之原委焉七表者何謂浮芤滑實弦緊洪也歌曰浮按不足舉有餘芤脈中空兩畔居滑體如珠中有力實形逼逼與長俱弦如始按弓弦狀緊若牽繩轉索狀洪舉按之皆極大此名七表不同途其見於病曰浮為中風芤失血滑吐實下分明別弦為拘急緊為疼洪大從來偏主熱八里如何微沉緩澀遲伏濡弱也歌曰微來如有又如無沉舉全無按有餘遲緩息間三度至濡來散止細仍虛伏須切骨沉相類弱脈沉微指下圖澀脈如刀輕刮竹分明入里坦如途其見於病曰遲寒緩結微為痞澀因血少沉氣滯伏為積聚濡不足弱則筋痿少精氣九道者何長短促結虛細代牢動也歌曰長脈流利通三部短脈本部不及些虛脈遲大無力軟促脈來數急促歟結脈時止而遲緩代脈不還真可籲牢脈如弦沉更實動脈鼓動無定居細脈雖有但如線九道之形乃自殊其見於病曰長為陽毒三焦熱短氣壅鬱未得倡促陽氣拘時兼滯虛為血少熱生驚代主氣耗細氣少牢氣滿急時主疼結主積氣悶兼痛動是虛勞血痢崩然七表屬陽八里屬陰九道有陰有陽各隨寸關尺及臟腑診之若在寸口膈以上病在關中胃以下病在尺內臍以下病大抵元氣之來力和而緩邪氣之至力強而峻凡尺脈上不至關為陰絶寸脈下不至關為陽絶陰陽相絶人何以依脈之大概如斯而已脈體捷法浮脈按之不足輕舉有餘滿指浮上曰浮為風虛運動之候為病在表為風應人迎為氣應氣口為熱為痛為嘔為脹為痞為喘為滿不食浮大為傷風鼻塞浮滑疾為宿食浮大長為風弦癲疾浮細而滑為傷飲芤脈浮大而軟按之中空旁實如按蔥葉中心空虛曰芤為失血之候大抵氣有餘血不足血不能充氣故虛而大若芤之狀滑脈往來流利應指圓滑如珠曰滑為血實氣壅之候蓋不勝於氣也為嘔吐為痰逆為宿食為經閉滑而不斷絶者經不閉其有斷絶者經閉也上為吐逆下為氣結滑數為熱結實脈浮中沉三字皆有力曰實為三焦氣滿之候為熱為嘔為痛為氣塞為氣聚為食積為利為伏陽在內弦脈端直以長如弦隱指曰弦為氣血收斂不舒之候為陽之伏陰或經絡間為寒所滯為痛為飲為瘧為疝為拘急為寒熱為血虛盜汗為寒凝氣結為冷痹為勞倦弦數為勞瘧弦緊為惡寒雙弦脅痛弦長為積隨左右上下緊脈舉按急數指下如牽繩轉索之狀曰緊為邪風激搏伏於榮衛之間為寒為痛浮緊為傷寒身痛沉緊為腹中有寒為風癇緊數為寒熱洪脈極大在指下來大去長而滿指曰洪為榮衛大熱血氣燔灼之候為表裡皆熱為煩為滿為咽乾為大小便不通洪實為癲洪緊為癰疽喘急亦為脹滿不食微脈極細而軟無浮沉之別曰微為血氣俱虛之候為虛弱為嘔為泄為虛汗為拘急為崩漏敗血不止微弱為少氣浮而微者為陽不足主臟寒下痢沉脈輕手不見重手乃得曰沉為陰逆陽郁之候為氣為水為寒為喘為停飲為癥瘕為脅脹為厥逆為洞泄沉細為少氣臂不能舉沉遲為痼冷沉滑為宿食沉伏為霍亂沉而數主內熱沉而遲主內寒沉而弦主心腹冷痛緩脈舉按大而慢一息四至曰緩為風為虛為痹為弱為疼在上為項強在下為腳弱浮緩沉緩血氣弱澀脈按之則散而復來舉之則細而不足曰澀為氣多血少之候為血痹為亡汗為傷精女人有孕為胎漏無孕為敗血病遲脈呼吸之間脈僅三至隨浮沉而見曰遲為陰盛陽虛之候為寒為痛浮而遲表有寒沉而遲里有寒居寸為氣不足居尺為血不足氣寒則縮血寒則凝伏脈輕手取之絶然不見重手取之亦不得必按至於骨乃見曰伏為陰陽潛伏關格閉寒之候為積聚為疝瘕為霍亂為溏泄為停食為榮衛氣閉而厥逆關前得之為陽伏關後得之為陰伏濡脈極軟而浮細輕手乃得不任尋按曰濡為血氣俱不足之候為虛為痹為少氣為無血為自汗為下冷弱脈極軟而沉細按之欲絶指下曰弱由精氣不足故脈痿弱而不振也為元氣虛損為痿弱不同為痼冷為哄熱為泄精為虛汗長脈按之則洪大而長出於木位曰長氣血俱有餘也為陽毒內蘊三焦煩郁為壯熱若傷寒得長脈欲汗出而自解也短脈兩頭無中間有不及本位曰短為氣不足以前導其血也為陰中伏陽為三焦氣壅為宿食不消虛脈按之不足遲大而軟輕舉指下豁然而空曰虛為氣血兩虛之候為暑為煩滿多汗為恍惚多驚為小兒驚風促脈按之來去數時一止復來曰促陽獨盛而陰不能相和也或怒逆上亦令脈促為氣捔為狂悶為瘀血發狂又為氣血飲食痰蓋先以氣熱脈數而五者或有一流滯乎其間則因之而為促結脈按之往來遲緩時一止復來曰結陰獨盛而陽不能相入也為癥結為七情所郁浮結為寒邪滯經沉結為積氣在內又為氣血飲食痰蓋先以氣寒脈緩而五者或一有流滯於其間則因之而為結故張仲景謂結促皆病脈然漸加即死漸退即生代脈動而中止不能自還因而復動由是復止尋之良久乃復強起曰代主形容羸瘦口不能言若不因病而人羸瘦其脈代止是一臟無氣他臟代之真危亡之兆也若因病而氣血驟損以致元氣不續或風家痛家脈見代止只為病脈故傷寒家亦有心悸而脈代者心腹痛亦有結澀止代不勻者蓋凡痛之脈不可准也又妊娠亦有脈代此必二月胎也牢脈沉而有力動而不移曰牢為裡實表虛胸中氣促為勞傷痿極大抵近乎無胃氣故諸家皆以為危殆亦有骨間疼痛氣居於表動脈狀如豆大厥厥動搖尋之有舉之無不往不來不離其處多於關部見之為痛為驚為虛勞體痛為崩為泄利陽動則汗出陰動則發熱細脈按之則縈縈如蛛絲如欲絶舉之如無而似有且微曰細蓋血冷氣虛不足以充故也為元氣不足乏力無精內外俱冷痿弱洞泄憂勞過度為傷濕為積為病在內及在下數脈一息六至過平脈兩至曰數為煩滿上為頭疼上熱中為脾熱口臭胃翻嘔逆左關為肝熱目赤右尺為小便赤黃大便閉澀浮數表有熱沉數里有熱散脈舉之則似浮而散大無力按之則滿指散而聚來去不明漫無根底為氣血耗散臟腑氣絶在病脈主陽虛不斂又主心氣不足諸脈相類微與濡弱相類極軟而浮細曰濡極軟而沉細曰弱極細而軟無浮沉之別者微脈也微與澀結何以別細而短又遲於微來往蹇滯曰澀細而稍大常有曰細細稍長似有似無曰微緩與遲二脈相類緩脈大而慢遲脈細而衰緩者衛有餘而營不足遲者陰氣盛而陽氣衰二診不同遲脈一息三至緩脈一息四至是也止脈諸脈有止者澀促結代也脈細而遲往來難時一止者為澀脈來數時一止者為促脈來緩時一止者為結分人迎氣口脈訣脈贊曰關前一分人命之主左為人迎右為氣口神門決斷在兩關後故曰人迎緊盛則傷於寒氣口緊盛則傷於食此人迎氣口所以有內傷外感之辨也左為人迎以候天之六氣風寒暑濕燥火之外感者也人迎浮盛則傷風緊盛則傷寒虛弱則傷暑沉細則傷濕虛數則傷熱皆外所因法當表散滲泄則愈右為氣口以候人之七情喜怒憂思悲恐驚內傷之邪其喜則脈散怒則脈激憂則脈澀思則脈結悲則脈緊恐則脈沉驚則脈動皆內所因看與何部相應即知何臟何經受病方乃不失病機法當溫順以消平之其如診按表裡名義情狀姑如後說但經所謂神者脈之主脈者血之府氣者神之御脈者氣之使長則氣治短則氣病數則煩心大則病進文藻雖雅義理難明動靜之辭有博有約博則二十四字不濫絲毫約則浮沉遲數總括綱紀辭理粲然浮為風為虛沉為濕為實遲為寒為冷數為熱為燥風寒濕熱屬於外虛實冷燥屬於內內外既分三因須別學者宜詳觀覽不可憚煩也內因脈喜怒憂思悲恐驚內應氣口喜則傷心脈必虛思傷脾結脈中居因憂傷肺脈必澀怒氣傷肝脈便濡恐則於腎脈沉是緣驚傷膽動相須脈緊因悲傷胞絡七情氣口內因之外因脈風寒暑濕燥火外應人迎緊則傷寒腎不移虛因傷暑向胞推澀緣傷燥須觀肺細緩傷濕要觀脾浮則傷風肝部應弱為傷火察心知六部各脈須當審免使將寒作熱醫不內不外因脈勞神役慮定傷心虛澀之中仔細尋勞役陰陽傷腎部忽然緊脈必相侵房帷任意傷心絡微澀之中宜忖度疲極筋力便傷肝指下尋之脈弦虛飲食飢飽並傷脾未可輕將一例推飢則緩弦當別議若然滑實飽無疑叫呼損氣因傷肺燥弱脈中宜熟記能通不內外中因生死吉凶都在是死絶脈雀啄連來三五啄屋漏半日一點落彈石硬來尋即散搭指散亂真解索魚翔似有亦似無蝦游靜中跳一躍寄語醫家仔細看六脈見一休下藥動止脈一動一止兩日死兩動一止四日邇三動一止六日亡四動一止八日事五動一止只十日十動一止一年春春草生時即死期二十一動二年住清明節後始傾亡三十動止三年次立秋節後病則危四十動止四年次小麥一熟是死期五十一止五年試草枯水寒時死矣此為太素脈玄祕諸脈宜忌類傷寒熱病宜洪大忌沉細咳嗽宜浮濡忌沉伏腹脹宜浮大忌虛小下痢宜微小忌大浮洪狂疾宜實大忌沉細霍亂宜浮洪忌微遲消渴宜數大忌虛小水氣宜浮大忌沉細鼻衄宜沉細忌浮大心腹痛宜沉細忌浮大弦長頭痛宜浮滑忌短澀中風宜浮遲忌急實大數喘急宜浮滑忌澀脈唾血宜沉弱忌實大上氣浮腫宜浮滑忌微細中惡宜緊細忌浮大金瘡宜微細忌緊數中毒宜洪大忌微細婦人帶下宜遲滑忌浮虛吐血宜沉小忌實大腸澼下膿血宜浮小沉遲忌數疾婦人已産宜小實忌虛浮又宜沉細緩滑微小忌實大弦急牢緊內傷宜弦緊忌小弱風痹痿弱宜虛濡忌緊疾急溫病發熱甚忌脈反小下痢身熱脈忌數腹中有積脈忌虛弱腹痛宜虛小遲忌堅大疾病熱忌脈靜泄忌脈大脫血而脈實病在中脈虛病在外脈澀皆所忌也驗諸死證脈溫病穰穰大熱脈細小者死頭目痛卒視無所見者死溫病汗不出出不至足者死瘧病久腰脊強急瘛瘲者不可治熱病得汗脈安靜者生躁急者死及大熱不退者亦死瘦脫形發熱脈堅急者死皮肉著骨者死形瘦脈大胸中多氣者死熱病七八日當汗反不得汗脈絶者死真臟脈見者死黑色入耳目鼻漸入口者死張口如魚出氣不反者死循衣摸床者死妄語錯亂及不能語者不治熱病不在此例尸臭不可近者死面無光牙齦黑者死髮直如麻者死遺尿不知者死舌卷卵縮者死面腫色蒼黑者死五臟內絶神氣不守其聲嘶者死目直視者死汗出身體不涼者死歸空十法一法天鼓不鳴叩齒不響命終二法天柱倒上燈後用左手按己額上觀臂許大命終三法樓頭鼓響兩手掩耳次將指彈不響音命終四法神光不在燈後不見黑影暗中用手掐眼皮睛中不光起命終五法曹溪神水乾舌津液不出者若無命命終六法釣罷竿腎子縮入腹左三右四命終七法地獄鬨動忽然左腳有似針刺命終八法己影向燈後見影命終九法丹府水火相推腹中腎痛寒毛豎起命終十法神明不在遍身如蟻子行胸前蛇走命終病機雜病賦病機玄蘊脈理幽深雖聖經之備載匪師授而罔明處百病而決死生須探陰陽脈候訂七方而施藥石當推苦樂志形邪之所客標本莫逃乎六氣病之所起樞機不越乎四因一辨色二辨音乃醫家聖神妙用三折肱九折臂原病者感受輿情能窮浮沉遲數滑澀大緩八脈之奧便知表里虛實寒熱邪正八要之名八脈為諸脈綱領八要是衆病權衡澀為血少精傷責責然往來澀滯如刀刮竹之狀滑為痰多氣盛替替然應指圓滑似珠流動之形遲寒數熱紀至數多少浮表沉里在舉按重輕緩則正復和若春風柳舞大則病進勢如秋水潮生六脈同等者喜其勿藥六脈偏盛者憂其採薪表宜汗解里即下平救表則桂枝耆芍救里則姜附參苓病有虛實之殊虛者補而實者瀉邪有寒熱之異寒者溫而熱者清外邪是風寒暑濕燥之所客內邪則虛實賊微正之相乘正乃胃之真氣良由國之鯁臣驅邪如逐寇盜必亟攻而盡剿養正如待小人在修已而正心地土厚薄究有餘不足之稟賦運氣勝復推太過不及之流行脈病既得乎心法用藥奚患乎弗靈原夫中風當分真僞真者見六經形證有中臟腑血脈之分僞者遵三子發揮有屬濕火氣虛之謂中臟命危中腑肢廢在經絡則口眼喎斜中血脈則半身不遂僵仆卒倒必用補湯痰氣擁塞可行吐劑手足瘛瘲曰搐背項反張曰痓或為風痱偏枯或變風痹風懿癱瘓痿易四肢緩而不仁風濕寒並三氣合而為痹雖善行數變之莫測皆木勝風淫之所致雪霜凜冽總是寒邪酷日炎蒸皆為暑類傷寒則脈緊身寒中暑則脈虛熱熾暑當斂補而清寒可溫散而去諸痙強直體重附腫由山澤風雨濕蒸諸澀枯涸幹徑皴揭皆天地肅清燥氣濕則害其皮肉燥則涸其腸胃西北風高土燥嘗苦渴閉癰瘍東南地卑水濕多染疸腫泄痢其邪有傷有中蓋傷之淺而中之深在人有壯有怯故壯者行而怯者劇天人七火君相五志為工者能知直折順性之理而術可通神善醫者解行反法求屬之道而病無不治虛火實火補瀉各合乎宜濕熱火熱攻發必異乎劑既通六氣之機可垂千古之譽嘗聞血屬陰不足則生熱斯河間之確論氣屬陽有餘便是火佩丹溪之格言氣盛者為喘急為脹滿為痞塞兼降火必自己血虛者為吐衄為勞瘵為煩蒸非清熱而難痊理中湯治脾胃虛冷潤下丸化胸膈痰涎暴嘔吐逆為寒所致久嗽咯血是火之愆平胃散療濕勝濡泄不止益榮湯治怔忡恍忽無眠枳殼散達生散令孕婦束胎而易産麻仁丸潤腸丸治老人少血而難便定驚悸須索牛黃琥珀化仗鶴蝨雷丸通閉以葵菜菠䔖取其滑能利竅消癭以昆布海藻因其咸能軟堅斯先腎之祕妙啓後進之無傳所謂夏傷於暑秋必作瘧近而暴者即時可廖遠而痎者三日一發若疸瘧但用清肌在陰分勿行截藥人參養胃治寒多熱少而虛柴胡清脾理熱多寒少而渴自汗陽虧盜汗陰弱嗽而無聲有痰兮脾受濕侵咳而有聲無痰兮肺由火爍霍亂有寒有暑何局方議乎辛溫積聚有虛有實豈世俗偏於峻削當知木鬱可令吐達金鬱泄而土鬱奪水鬱折而火鬱發泄發即汗利之稱折奪是攻抑之別倒倉廩去陳莝中州蕩滌良方開鬼門潔淨府上下分消妙法如斯瞑眩反掌生殺輒有一失悔噬臍之莫追因而再逆恥方成之弗約大抵暴病非熱久病非寒臀背生疽良由熱積所致心腹卒痛卻乃暴寒所幹五泄五疸因濕熱惟利水為尚三消三衄為燥火若滋陰自安嘔吐咳逆咎歸於胃陰㿗疝瘕統屬於肝液歸心而作汗斂之者黃耆六一熱內熾而發疹消之者人參化斑身不安兮為躁心不寧兮為煩忽然寒僵起粟昏冒者名為尸厥卒爾跌僕流涎時醒者號曰癲癇腹滿吞酸此是胃中留飲胸膨噯氣蓋緣膈上停痰欲挽回春之力當修起死之丹竊謂陰陽二證療各不同內外兩傷治須審別內傷外傷辨口鼻呼吸之情陰證陽證察尺寸往來之脈既明內外陰陽便知虛實冷熱曰濁曰帶有赤有白或屬痰而或屬火白於氣而赤於血本無寒熱之分但有虛實之說痢亦同然瘀積濕熱勿行淡滲兜澀湯丸可用汗下寒溫湧泄導赤散通小便癃閉溫白丸解大腸痛結地骨皮散退勞熱偏宜青礞石丸化結痰甚捷火鬱者必捫其肌胎死者可驗其舌玄胡苦楝醫寒疝控引於二丸當歸龍薈瀉濕熱痛攻於兩脅諳曉陰陽虛實之情便是醫家玄妙之訣當以諸痛為實諸癢為虛虛者精氣不足實者邪氣有餘泄瀉有腸垢鶩溏若滑脫則兜澀為當腹痛有食積鬱熱倘陰寒則姜附可施厥心痛者客寒犯胃手足溫者溫散即已真頭痛者入連於腦爪甲黑者危篤難醫結陽則肢腫有準結陰則便血無疑足膝屈弱曰腳氣腫痛者濕多熱甚腰痛不已曰腎虛閃挫者氣滯血瘀巔頂苦疼藥尊藁本鼻淵不止方選莘荑手麻有濕痰死血手木緣風濕氣虛淋瀝似欲通不通氣虛者清心蓮子便血審先糞後糞陰結者平胃地榆蓋聞溲便不利謂之類飲食不下謂之格乃陰陽有所偏乘故脈息因而復溢咳血與嘔血不同咳血嗽起嘔血逆來吞酸與吐酸各別吞酸刺心吐酸湧出水停心下曰飲水積脅下曰癖行水以澤瀉茯苓攻癖以芫花大戟控涎丹雖云峻利可逐伏痰保和丸性味溫平能消食積溺血則血去無痛有痛者自是赤淋短氣乃氣難布息粗息者卻為喘急胃脘當心而痛要分客熱客寒遍身歷節而疼須辨屬風屬濕通聖散專療諸風越鞠丸能開六郁虛弱者目眩頭暈亦本痰火而成濕熱者精滑夢遺或為思想而得緣雜病緒緊無據機要難明非傷寒經絡有憑形證可識臨病若能三思用藥終無一失略舉衆疾之端俾為後學之式病機賦竊謂臣雖小道乃寄死生最要變通不宜固執明藥脈病治之理悉望聞問切之情藥推寒熱溫涼平和之氣辛甘淡苦酸咸之味升降浮沉之性宣通瀉補之能脈究浮沉遲數滑澀之形表里寒熱實虛之應阿阿嫩柳之和弦鉤毛石之順藥用君臣佐使脈分老幼瘦肥藥乃天地之精藥宜切病脈者氣血之表脈貴有神病有外感內傷風寒暑熱燥火之機治用宣通瀉補滑澀濕燥重輕之劑外感異乎內傷寒證不同熱證外感宜瀉而內傷宜補寒證可溫而熱證可清補瀉得宜須臾病愈清溫失度頃刻人亡外感風寒宜分經而解散內傷飲食可調胃以消熔胃陽主氣司納受陽常有餘脾陰主血司運化陰常不足胃乃六腑之本脾為五臟之源胃氣弱則百病生脾陰足而萬邪息調理脾胃為醫中之王道節戒飲食乃卻病之良方病多寒冷鬱氣氣鬱發熱或出七情動火火動生痰有因行臟動靜以傷暑邪或是出入雨水而中濕氣亦有飲食失調而生濕熱倘或房勞過度以動相火制伏相火要滋養其真陰祛除濕熱須燥補其脾胃外濕宜表散內濕宜淡滲陽暑可清熱陰暑可散寒尋火尋痰分多分少而治究表究里或汗或下而施痰因火動治火為先火因氣生理氣為本治火輕者可降重者從其性而升消理氣微則宜調甚則究其源而發散實火可瀉或瀉表而或瀉里虛火宜補或補陰而或補陽暴病之謂火怪病之謂痰寒熱濕燥風五痰有異溫清燥潤散五治不同有因火而生痰有因痰而生火或郁久而成病或病久而成郁金木水火土五郁當分泄折達發奪五法宜審鬱則生火生痰而成病則耗氣耗血以致虛病有微甚治有逆從微則逆治甚則從攻病有本標急則治標緩則治本法分攻補虛而用補實而用攻少壯新邪專攻是則老衰久病兼補為規久病兼補虛而兼解鬱陳症或蕩滌而或銷熔積在胃腸可下而愈塊居經絡宜消而痊女人氣滯於血宜開血而行氣男子陽多乎陰可補陰以配陽蓯蓉山藥男子之佳珍香附縮砂女人之至寶氣病血病二者當分陽虛陰虛兩般勿紊陽虛氣病晝重而夜輕血病陰虛晝輕而夜重陽虛生寒寒生濕濕生熱陰虛生火火生燥燥生風陽盛陰虛則生火火逼血而錯經妄行陰盛陽虛則生寒寒滯氣而周身浮腫陽虛畏外寒陰虛生內熱補陽補氣用甘溫之品滋陰滋血以苦寒之流調氣貴用辛涼和血必須辛熱陽氣為陰血之引導陰血乃陽氣之依歸陽虛補陽而陰虛滋陰氣病調氣而血病和血陰陽兩虛惟補其陽陽生而陰長氣血俱病只調其氣氣行而血隨藏冰發冰以節陽氣之燔滋水養水以制心火之亢火降水升斯人無病陰平陽祕我體常春小兒純陽而無陰老者多氣而少血肥人氣虛有痰宜豁痰而補氣瘦者血虛有火可瀉火以滋陰膏粱無厭發癰疽熱燥所使淡薄不堪生腫脹寒濕而然北地聳高宜清熱而潤燥南方汙下可散濕以溫寒病機既明用藥勿忒以方加減存乎人要審病而合宜用藥補瀉在於味須隨時而換氣奇偶復七方須知初中末三治要察寒因熱用熱因寒用通因通用塞因塞用高者抑之下者舉之外者發之內者奪之寒則堅凝熱則開行風能勝濕濕能潤燥辛能散結甘能緩中淡能利竅苦以泄逆酸以收耗咸以軟堅升降浮沉則順之寒熱溫涼宜逆也病有淺深治有難易初感風寒乍傷飲食一藥可愈舊存痃癖久患虛勞萬方難療復霜之疾亟療無妄之藥勿試病若挾虛宜半攻而半補醫稱多術或用灸而用針針有劫病之功灸獲回生之驗針能去氣病而作痛灸則消血癥以成形臟寒虛脫者治以灸焫脈病攣痹者療以針刺血實蓄結腫熱者宜以砭石氣壅痿厥寒熱者當仿導引經絡不通病生於不仁者須覓醪醴血氣凝泣病生於筋脈者可行尉藥病剽悍者按而收之乾霍亂者刮而行之醫業十三科宜精一派病情千萬變仔細推詳姑撮碎言以陳管見後之學者庶達迷津病機抄略病本十形風寒燥濕暑火二分內傷外傷內積外積六氣四因病機以明氣固形實形虛中風或為寒熱或為熱中或為寒中或為厲風或為偏枯半身不遂此率多痰或屬血虛在左死血在右屬痰痰壅盛者口眼喎斜不能言語皆用吐法氣虛卒倒降痰益氣火熱而甚燥熱潮熱治經隨之陰虛補陰勿驟涼治輕可降散實則可瀉重者難療從治可施中寒感寒陰毒陰逆四肢厥冷腹痛唇青退陰正陽急可溫中傷寒所致痓病有二發熱惡寒頭項強痛腰脊反張口噤而赤瘛瘲如癇有汗柔暑無汗名剛春傷於風夏必飧泄復傷於暑秋必痎瘧秋傷於濕冬必咳嗽冬傷於寒春必溫病夏月身熱汗出惡寒身重脈微渴乃中暍春時病溫溫疫溫毒溫瘧風溫脈證分異五種疾因中濕風濕暑成濕溫三種可別濕熱可分寒痰腳氣食積勞煩要知四證乃似傷寒傷寒之病見中風脈中風之病得傷寒脈大小青龍治劑必識調衛調營斯須兩得瘧木傷寒或痰或食老瘧瘧母久則羸疲三日一發病經一歲間日發者受病半年一日一發新病所以連二日發住一日者氣血俱病或用截法或隨經治嗽多感寒當分六氣六本一標病機所祕風熱與寒隨證治之暑燥清金濕則利水有聲無痰咳少痰可降蠲咳隨本治喘有氣虛或有痰壅或因氣逆或倚息使痢本濕熱或因食致腹痛下血後重不利治可通散勿使澀住濕熱未消成休息痢泄瀉多濕熱食氣虛如本脾泄脹而嘔吐洞泄不禁腸泄則疼瘕泄不便後重莖痛胃泄色黃食飲不化太素分五溏泄騖泄飧濡滑泄滲閉闌門泄實對證疸乃濕熱酓曲相似消渴熱因水腫氣致自汗陽虧盜汗陰虛東垣有法對證可施頭風頭痛有痰者多血虛與熱分經可治頭旋眩暈火積其痰或本氣虛治痰為先腰痛濕熱或本腎虛或兼惡血脅痛多氣或肝火盛或有死血或痰流注勞瘵陰虛癲狂陽熾嘔吐略衄氣虛脈洪火載血上錯經妄行溺血便血病同所因夢遺精滑濕熱之乘便濁本熱有痰有虛白濁屬衛赤濁屬榮熱極成淋氣滯不通血虛驚悸氣虛耳聾噦因胃病疝本肝經痿唯濕熱氣弱少榮厥多痰氣虛熱所乘手麻氣虛手木濕痰或死血病霍亂吐瀉感風濕暍心痛脾疼陰寒之說氣熱煩勞令人煎厥氣逆太甚使人薄厥濁氣在上則生䐜脹清氣在下則生飧泄陰火之動發為喉痹陽水變病飧泄方是三陽病結乃發寒熱下身壅腫及為痿厥二陽之病病發心脾男子少精女子不月一陽發病少氣嗽泄寒客在上胃寒陽熱水穀不化痞脹而泄熱氣居上腸寒胃熱消穀善飢腹脹便澀蘊熱怫鬱乃生諸風風寒與濕合而為痹膏粱之變饒生大疔榮氣不從逆於內里乃生癰腫瘡瘍憑脈治乃不惑身重脈緩濕勝除濕身熱脈大躁熱發腫退熱涼榮眩暈動搖痛而脈弦降痰去風氣澀衛滯躁渴脈澀補血瀉氣食少惡寒脈來緊細宜瀉寒水辨經部分詳審為治濕熱生蟲水積痰飲目痛赤腫精散榮熱牙痛齦宣寒熱亦別五臟本病熱爭重疸六腑不和留結為癰五臟不和九竅不通臟腑相移傳變為病不可勝紀間臟者存傳其所生七傳者死傳其所制五臟有積肝曰肥氣在左脅下大如覆杯或有頭足久則變病咳逆痎瘧連歲不已心積伏梁病起臍上其大如臂上至心下如久不愈令人煩心脾積痞氣其在胃脘復大如盤久而不愈四肢不舉乃發黃疸雖食而瘦肺積息齎在右脅下復大如杯久而不愈令人喘急骨痿少氣鼓脹發蠱中滿郁痞開提其氣升降是宜人身之本脾胃為主頭痛耳鳴九竅不利腸胃所生胃氣之虛虛極變病五亂互作東垣所論王道之學一虛一實五實五虛五勞七傷六極乃痿五郁七情九氣所為怒則氣上喜則氣緩悲則氣消恐則氣下寒則氣收暑則氣泄驚則氣亂勞則氣耗思則氣結憂愁思慮甚則傷心形寒飲冷過則傷肺喜怒氣逆逆則傷肝飲食勞倦甚乃傷脾坐臥濕地強力入水故乃腎傷皆因氣動形神自病喜怒不節勞形厥氣氣血偏勝陰陽相乘陽乘陰病陰乘陽病陽乘則熱陰乘則寒重寒則熱重熱則寒寒則傷形熱則傷氣氣傷則病形傷則腫先痛後腫氣傷形也先腫後痛形傷氣也陰陽變病標本寒熱如大寒甚熱之不熱是無火也熱來復去晝見夜伏夜發晝見時節而動是無火也當助其心如大熱甚寒之不寒是無水也熱動復止倏忽往來時動時止是無水也當助其腎內格嘔逆食不得入是有火也病嘔而吐食入反出是無火也暴逆注下食不及化是有火也溏泄而久止發無常是無水也心盛生熱腎盛生寒又熱不寒是無火也寒不得熱是無水也寒之不寒責其無水熱之不熱責其無火熱之不久責心之虛寒之不久責腎之少審察病機無失氣宜紀於水火餘氣可知室女病多帶下赤白癥瘕㿗疝氣血為病經閉不行或漏不止經過作痛虛中有熱行而痛者血實之證如不及期血熱乃結過期血少閉或血枯淡者痰多紫者熱故熱極則黑調榮降火調理妊娠清熱養血一當産後如無惡阻大補氣血雖有他證以末治之大凡小兒過暖生熱熱極生風風痰積熱隨病為治生有胎惡月里生驚生赤生嘔生黃不便臍風撮口變蒸發熱風癇癲癇急慢驚風瘛瘲驚愕驚悸虛冒暴急吐晛腹脹齁嗽中惡天吊鵝口重舌木舌弄舌客忤夜啼膿耳鼻疳眉煉丹瘤陰腫便濁舌爛口臭斷蝕牙疳蟲痛吐蛔疳瘦解顱便青頰赤食吐飲水吐瀉青白昏睡露睛呵缺面黃呷牙咬齒瀉痢脫肛癰瘍癮疹瘡痘發斑驚疳諸積大率為病肝與脾經脈治憑允錢氏方論男女病情飲食起居暴樂暴苦始樂後苦皆傷精氣先富後貧病曰失精先貴後賤雖不中邪病從內生名曰脫營身體日減氣虛無精良工勿失脈病證治知微可已舉腹痛經陰證治例海藏所云玄機之祕
