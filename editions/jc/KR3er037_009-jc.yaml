body:
  text: 卷之九頭痛脈頭痛陽強浮風緊寒風熱洪數濕細而堅氣虛頭痛雖弦必澀痰厥頭痛腎厥堅實又曰頭痛短澀應須死浮滑風痰必易除寸口緊急或短或浮或弦皆主頭痛病東垣曰東風生於春病在肝俞在項頸故春氣者病在頭又諸陽會於頭面如足太陽膀胱之脈起於目內眥上額交巔之上入絡腦還出別下項病沖頭痛又足少陽膽之脈起於目銳眥上抵頭角病則頭角額痛夫風從上受之風寒傷上邪從外入客於經絡令人振寒頭痛身重惡寒治在風池風府調其陰陽不足則補有餘則瀉汗之則愈此傷寒頭痛也頭痛耳鳴九竅不利者腸胃之所生乃氣虛頭痛也心煩頭痛者病在耳中過在手巨陽少陰乃濕熱頭痛也如氣上不下頭痛癲疾者下虛上實也過在足少陰巨陽甚則入腎寒濕頭痛也如頭半寒痛者先取手少陽陽明後取足少陽陽明偏頭痛也有真頭痛者甚則腦盡痛手足寒至節死不治有厥逆頭痛者所犯大寒內至骨髓髓者頭腦為主腦逆故令頭痛齒亦痛凡頭痛者皆以為風治之者總其大體而言之也高巔之上惟風可到故味之薄者陰中之陽乃自地昇天者也然亦有三陰三陽之異治故太陽頭痛惡風脈緊川芎羌活獨活麻黃之類為主少陽經頭痛脈弦細往來寒熱柴胡為主陽明頭痛自汗發熱惡寒脈浮緩長實者升麻乾葛白芷石膏為主太陰頭痛必有痰體重或腹痛為痰癖其脈沉緩蒼朮半夏南星為主少陰頭痛三陰三陽經不流行而足寒氣逆為寒厥其脈細麻黃細辛附子為主厥陰頭痛或吐痰沫厥冷其脈浮緩吳茱萸湯主之血虛頭痛當歸川芎為主氣虛頭痛黃耆人參為主氣血俱虛頭痛調中益氣湯少加川芎細辛蔓荊子其效如神白朮半夏天麻湯治痰厥頭痛藥也羌活附子湯治厥陰頭痛藥也如濕氣在頭者以苦吐之不可執方而治先師嘗病頭痛發時兩頰青黃眩暈眼不欲開懶言身體沉重兀兀欲吐潔古曰此厥陰太陰合病名曰風痰以局方玉壺丸治之更灸俠谿穴即愈丹溪云多主於痰其痛甚者火多諸經氣滯亦能頭痛勞役下虛之人似傷寒發熱汗出兩太陽作痛此相火自下衝上宜補中益氣多加川芎當歸甚者加知母蔓荊子又曰自魚尾上攻而痛屬血虛川芎當歸酒黃柏偏頭風在右屬痰屬熱痰用蒼朮半夏熱用酒片芩在左屬風屬血虛風用荊芥薄荷血虛用芎歸芍藥酒黃柏節齋云久病頭痛略感風寒便發寒月須重綿厚帕包裹者此屬鬱熱而標寒世人不識悉用溫辛散之藥暫時得效誤認為寒殊不知因其本有鬱熱毛竅常疏故風易入外寒束其內熱閉逆而為痛辛熱之藥雖能開通閉逆散其標之寒熱然以熱濟熱病本益深惡寒愈甚矣惟當瀉火涼血而佐以辛溫散表之劑以從法治之則病可愈而根可除也方春用香蘇散加川芎白芷羌活胡恆齋傳夏用五苓散加香薷厚朴扁豆羌活秋用金佛草散加桔梗石膏防風羌活冬用十神湯加羌活隨時倍真羚羊角服之如神川芎茶調散批按此方治風氣頭痛之劑治諸風上攻頭目昏沉偏正頭痛鼻塞聲重憎寒壯熱肢體煩肌肉蠕動膈熱痰盛婦人血攻注太陽穴痛但感風氣皆然南薄荷四錢香附米四錢炒荊芥穗川芎各二錢羌活白芷甘草炙各一錢防風七錢半上為細末每服二錢食後茶清調下薑蔥煎服亦可一方加菊花一錢細辛五分殭蠶三分蟬蛻三分名菊花茶調散白朮半夏天麻湯批按此方治痰厥頭痛之劑治痰厥頭痛其證眼黑頭眩噁心煩悶氣短促上喘無力以言心神顛倒目不敢開如在風雲中頭苦痛如裂身重如山四肢厥冷不得安臥此乃胃氣虛損停痰而致也黃耆三分半人參三分半白茯苓三分半白朮五分陳皮七分半半夏湯泡薑汁炒三分半神麯炒五分麥芽炒七分半蒼朮米泔浸炒三分半乾薑炒黑二分黃柏一分半酒洗澤瀉二分半天麻三分半上銼一劑生薑三片水煎食前熱服可一劑而愈當歸補血湯批按此方治血虛頭痛之劑治血虛頭痛當歸生地黃川芎白芍各一錢防風五分荊芥四分藁本四分黃芩一錢酒炒柴胡五分蔓荊子五分上銼一劑水煎服補中益氣湯批按此方治氣虛頭痛之劑治氣虛頭痛方見內傷門依本方加川芎白芷細辛蔓荊子調中益氣湯批按此方治氣血兩虛頭痛之劑治氣血俱虛頭痛其效如神陳皮三分黃柏酒炒三分升麻柴胡去蘆各四分人參甘草炙各六分細辛二分黃耆一錢川芎六分蔓荊子三分上銼作一服水二鍾煎至一鍾去渣溫服一方有木香二分無黃柏如大便虛坐不得或了而不了腹中逼迫此血虛血澀也加當歸身五分芎芷散治遠年近日偏正頭風疼痛難忍諸藥不效收功如神川芎三錢白芷三錢上為末黃牛腦子一個擦藥在上瓷器內加酒頓熟乘熱和酒食之儘量一醉睡後酒醒其疾如失都梁丸治偏正頭風一切頭痛香白芷二兩切碎曬乾上為細末煉蜜為丸如龍眼大每服二三丸食後細嚼茶清下補血祛風湯秘方治婦人頭風十居其半每發必掉眩如立舟車之上蓋因肝血虛損風邪乘虛而襲之耳當歸川芎生地黃防風荊芥細辛藁本蔓荊子半夏石膏甘草旋覆花上銼薑棗煎食後服一方加羌活加減芎辛湯秘方治頭風攻目川芎白芷石膏藁本細辛皂角羌活防風荊芥桔梗薄荷甘草菊花蔓荊子上銼水煎食後服選奇方治眉稜骨痛屬風熱與痰痛不可忍者羌活防風各二錢甘草一錢夏生冬炙用酒片芩一錢半冬不用甚者冬亦可用上銼水煎食後服一方加薑製半夏二錢回首散治頭項強急筋痛或挫枕轉項不得者用烏藥順氣散方見中風門加羌活獨活木瓜鬚髮醫者所謂人須發眉雖皆毛類而所主五臟各異故有老而須白眉發不白者或發白而鬚眉不白者臟氣有所偏故也大率發屬心稟火氣故上生須屬腎稟水氣故下生眉屬肝稟木氣故側生男子腎氣外行上為須下為勢故女人宦人無勢則亦無須而眉發無異於男子則知不屬腎也明矣方天下烏須第一方高閣老傳五倍子不拘多少捶碎去灰入砂鍋內炒盡煙為度以青布巾打濕扭干包裹腳踹成餅為末聽用每用一錢半烏黑霜即炒黃好細面四兩當歸尾一兩為末白芨末一兩三味攪勻每用一分半紅銅末不拘多少火內燒極紅投入水碗中取出再燒再投取其水內自然之末用水淘淨將好醋煮數沸至干隨炒黑色所用每用一分半明礬末一分半青鹽一分二釐沒石子二釐半訶子二釐半二味俱用麵包入砂鍋內將柴炭同拌炒至焦乾上用細茶滷調如糊瓷器內重湯煮洗淨搽上幹了洗去京師秘傳烏須方五倍子製法如前每用二錢紅銅末製法如前每用六分食鹽三分明礬末六分白灰面一分半上合火酒調搽無酒濃茶亦可調勻以酒盞盛貯用鐵杓注水煮至如糖香鏡臉方可取用先將皂角水洗淨鬚髮然後塗藥包裹一夜次早洗去即黑如須少只用半張旱蓮膏馬翰林傳烏須黑髮神方旱蓮草十六斤在六月下半月七月上半月採十六斤不許水洗扭干取汁對日曬過五日不住手攪一午時方加真生薑汁一斤蜜一斤和汁同前曬攪至數日似稀糖成膏瓷碗收藏每日空心用無灰好酒一鍾藥一匙服午後又一服至二十一日將白鬚發拔去即長出黑鬚發神仙烏雲丹吳侍郎傳烏須黑髮返老還童壯筋骨補真精固元陽神效無比何首烏半斤入砂鍋內以黑豆同蒸半日去豆用好酒浸一七曬乾再蒸浸七次破故紙酒洗一斤砂鍋內炒黃色旱蓮汁二兩如無汁旱蓮為末亦可槐角子二兩為末梧桐淚即木律為末二兩上共一處為細末棗肉二斤核桃仁半斤共為處搗為丸如梧桐子大每服五十丸空心鹽湯下服三個月勿斷一日旱蓮丸王史目傳烏須黑髮服一月已白者退再生者黑其效如神士大夫不可一日無此藥旱蓮汁曬半斤生薑三斤取汁曬半斤生地黃二斤酒泡去汁曬半斤細辛一兩破故紙一斤麵炒杜仲半斤炒五加皮半斤酒浸赤茯苓半斤乳汁浸枸杞子四兩川芎四兩沒石子二兩上為末核桃仁去皮半斤棗肉同和為丸如梧桐子大每服五十丸黃酒送下五煎膏劉太府傳烏鬚髮固牙齒壯筋骨旱蓮汁黑桑椹何首烏生地黃白茯苓上五味各自為咀片煎汁濾淨渣熬成膏合一處和勻置瓷器內封固埋土七日每服二三匙一日三服一醉不老丹劉僉憲專養血化痰烏須黑髮男女皆可服蓮花蕊生地黃槐角子五加皮各三兩沒石子六個三陰三陽上將藥用木石臼搗碎以生絹袋盛藥用無灰好酒十斤入不滲壇內春冬浸一月秋二十日夏十日緊封壇口浸滿日任意服之以醉為度須連日服盡久則恐味變也酒盡而鬚髮白者自黑若未黑再製服不過三兩次神效蒲公散劉小亭傳烏須生發蒲公英淨四兩炒血餘洗淨四兩青鹽四兩研上用瓷罐一個盛蒲公英一層血餘一層青鹽一層鹽泥封固淹春秋五日夏三日冬七日桑柴火煅令煙盡為度候冷取出碾為末每服一錢清晨酒調服三仙丸賀蘭峰傳治頭髮脫落神效側柏葉八兩焙乾當歸全身四兩上忌鐵器為末水糊為丸如梧桐子大每服五七十丸早晚各一服黃酒鹽湯任下生頭髮方大附子一個要一兩重者佳為末用烏骨黑雞一隻取其油攪藥末擦頭其發即生面病病難經曰人面獨能耐寒者何也蓋人頭者諸陽之會也諸陰脈皆至頸胸中而還獨諸陽脈皆上至頭故令面耐寒也一云手只六陽之經雖皆上至頭而足陽明胃之經起鼻交額中入齒中俠口環唇倚頰車上耳前過客主人穴或其胃中風熱或風熱乘之令人面腫或面鼻色紫風刺癮疹或面熱面寒隨其經證而治之方升麻黃連湯治面熱升麻一錢半葛根一錢半白芍七分半川芎四分半白芷二分薄荷三分荊芥三分蒼朮八分半黃連五分酒洗黃芩六分酒洗犀角四分半甘草五分上銼一服水煎食後服升麻白芷湯治面唇紫黑乃陽明經氣不足也升麻一錢葛根一錢半芍藥三分防風一錢白芷一錢蒼朮三分黃耆七分人參七分甘草四分上銼一劑薑棗煎服宜早飯後午時前取天氣上升於中使陽易達於面也連翹散治面生谷嘴瘡俗名粉刺連翹川芎白芷黃連苦參荊芥貝母甘草桑白皮山梔子上銼水煎食後臨臥服清上防風湯清上焦火治頭面瘡癤風熱毒防風一錢荊芥五分連翹八分梔子五分黃連五分黃芩七分酒炒薄荷五分川芎七分白芷八分桔梗八分枳殼五分甘草三分上銼一劑水煎食後服加竹瀝尤效薑黃丸治頭面腫大疼痛並喉痹殭蠶一兩大黃二兩上為末薑汁丸如彈子大每服一丸井水入蜜少許研徐徐食後呷服苦參丸治肺風皮膚瘙癢或生癮疥癬有人病遍身風熱細疹癢痛不可忍者連胸脛臍腹及近隱處皆然涎痰亦多夜不得睡苦參一斤為末皂角去皮並子上用水一斗將皂角浸揉去濃汁濾去渣熬成膏和苦參末為丸如梧桐子大每服三十丸荊芥薄荷酒下惟酒下亦可麥門冬膏黃賓江治面上肺風瘡麥門冬去心一斤橘紅去白四兩上用水煎汁熬成膏入蜜二兩再熬成入水中一夜去火毒每服五匙滾水化開食後服夜將後春容散擦之春容散黃賓江白附子六錢枯礬三錢硫黃五錢黑鉛炒枯三錢密陀僧二兩輕粉一錢黃丹飛過一錢麝香二分上為末先將冷水擦紅處濕後以末藥擦之不可擦破忌酒色惱怒玉容散治面生皯𪒟或生小瘡或生痙痱粉刺之類並皮膚瘙癢能去垢膩皂角三斤去皮升麻八兩楮實子五兩甘松五錢三奈三錢砂仁連皮五錢天花粉一兩白芷一兩白芨一兩糯米一升另研白丁香五錢須臘月收者綠豆一兩另研上為末和勻量用洗面不惟馨香亦且去垢一方加藿香五錢樟腦一錢為末煉蜜為丸如彈子大清晨洗面最奇如玉散宗橘泉批按此方治外之劑治面上一切酒刺風刺黑靨斑子白芷藿香牙皂去皮子各一錢甘松三奈水澤白丁香另研各一錢天花粉白茯苓各一錢半杏仁去皮另研細辛蜜陀僧各一錢樟腦五分另研白芨少許上為末臨臥用津唾調或乳汁調敷面上明早溫水洗去其面如玉治抓破面皮用生薑自然汁調輕粉搽患處更無痕跡耳病脈腎脈浮而盛為風洪而實為熱短而澀為虛兩尺脈短而微或大而數皆屬陰虛相火上炎其人必遺精而兩耳蟬鳴或聾病夫耳者腎之竅也其為病亦有數種有氣厥而聾者有挾風而聾者有勞傷而聾者有熱氣乘虛隨脈入耳而為膿耳者有耳出津液風熱搏之結核塞耳亦令暴聾而為聤耳者然又有左聾者有右聾者有左右俱聾者不可不分經而治之也治夫左耳聾者因有所忿怒過度則動少陽膽火故從左起以龍薈丸主之右耳聾者因有所色欲過度則動太陽膀胱相火故從右起以六味地黃丸主之左右俱聾者因有所醇酒厚味過度則動足陽明胃火故從中起以通聖散滾痰丸主之蓋左耳聾者婦人多有之以其多忿怒故也右耳聾者男子多有之以其多色欲故也左右俱聾者膏粱之家多有之以其多肥甘故也總三者而論之忿怒致耳聾者為多丹溪曰厥陰少陽熱多當用開痰散風熱其此之謂乎方通明利氣湯治虛火上升痰氣鬱於耳中或閉或鳴痰氣熾盛或憂鬱痞滿咽喉不利煩躁不寧蒼朮一錢鹽水炒白朮一錢瓦焙撫芎八分陳皮二錢半香附一錢童便炒生地黃一錢薑汁浸貝母三錢黃連一錢半酒浸豬膽汁拌炒黃芩一錢半酒浸豬膽汁拌炒黃柏二錢酒炒梔子仁二錢炒玄參二錢酒洗木香五分檳榔一錢甘草炙四分上銼二劑生薑水煎入竹瀝服加減龍薈丸批按此方治耳鳴之劑聰耳瀉火當歸一兩酒洗龍膽草一兩酒洗梔子仁一兩炒黃芩一兩大黃五錢酒蒸蘆薈五錢青黛五錢木香二錢半柴胡五錢青皮一兩膽星三錢麝香五分上為末神麵糊為丸綠豆大每二十丸薑湯下日進三服一七後用針砂酒以通其氣針砂一兩穿山甲末一錢拌針砂養一晝夜播出山甲以酒一碗將針砂浸三四日噙酒口內外用磁石一塊綿裹塞耳忌怒戒色玄參貝母湯陳白野方治耳熱出汁作癢乃痰也腎火上炎也防風天花粉貝母黃柏鹽水炒白茯苓玄參蔓荊子白芷天麻各一錢生甘草五分半夏一錢泡上銼一劑生薑三片水煎食後溫服黃龍散批按此方治耳膿之劑治膿耳因腎經氣實其熱上衝於耳遂使津液壅滯為膿久不瘥變成耳聾亦有小兒沐浴水入耳中停留搏於氣血醞釀成熱亦成膿耳枯白礬一錢龍骨一錢研黃丹一錢飛胭脂一錢燒灰麝香少許上為末先以綿杖子捲去耳中膿水以藥摻入內日日用之勿令風入鼠黏子湯陳白野方治耳內生腫如櫻桃痛極連翹黃連酒炒玄參桔梗梔子炒生甘草牛蒡子炒龍膽草炒板藍根即靛子上銼水煎食後服隨飲酒一二盞感腦加香附子一錢批按此方治耳腫痛之劑治耳內忽太痛如有蟲在內奔走或有血水或干痛不可忍者蛇蛻燒存性為末以鵝翎管吹入耳中聰耳湯雲林制治耳重聽當歸酒洗一錢白芍酒炒一錢川芎一錢生地黃酒洗一錢知母酒洗一錢陳皮一錢烏藥一錢白芷一錢防風酒洗一錢羌活酒洗一錢獨活酒洗一錢細辛七分薄荷一錢蔓荊子一錢藁本酒洗一錢黃柏酒炒一錢上作一劑水煎食後服用藥後頭低睡一時獨勝丸專治耳鳴耳聾黃柏八兩人乳拌勻酒浸曬乾再用鹽水炒褐色去皮上為末水糊丸梧子大每服百丸空心鹽湯下熏耳神方習南泉傳專治氣聾不論遠年近日者神效實聾難治蘄艾一兩為粗末後用磁石七錢燒過當門子即麝香三粒珍珠七顆用鐵筒套在鐵鍋底上煅過上三味研為細末合一處令勻卻將白綿紙一張鋪熱鐵器上用黃蠟五錢搽紙上分作數片紙上攤艾艾上摻藥卷作筒子點火吹滅側耳熏之重者三四根即通力能隔耳透咽既通且用艾塞不可見風透鐵關法賈蘭峰傳批按此方治耳聾之劑治耳聾用好活磁石二塊銼如棗大頭尖搽麝香少許於磁石尖上塞兩耳孔口中噙生鐵一塊候一時兩耳氣透颯颯有聲為度勤用三五次即愈鼻病脈左寸脈浮緩為傷風鼻塞鼻流清涕右寸脈浮洪而數為鼻衄鼻齄病鼻塞不聞香臭或但遇寒月多塞或略感風寒便塞不時舉發者世俗皆以為肺寒而用表解通利辛溫之藥不效殊不知此是肺經多有火邪郁甚則喜多熱而惡見寒故遇寒便塞遇感便發治治法清金降火為主而佐以通利之劑若如常鼻塞不聞香臭者再審其平素只作肺熱治之清肺火瀉火消痰或丸藥噙化或末藥輕調緩服久服無不效又平素原無鼻塞之病一時偶感風寒而致鼻塞聲重或流清涕者只作風寒治之方麗澤通氣湯治鼻不聞香臭黃耆一分蒼朮羌活獨活防風升麻葛根各六分炙甘草四分白芷川芎各二分麻黃不去節冬月加上銼作一劑生薑三片棗二枚蔥白三根水煎食遠溫服忌冷物風寒涼處坐臥通竅湯批按此方治不聞香臭之劑治感風寒鼻塞聲重流涕防風羌活藁本升麻乾葛川芎蒼朮各一錢麻黃白芷五分川椒細辛甘草各三分上銼一劑生薑三片蔥白一根水煎熱服蒼耳散治鼻流濁涕不止名曰鼻淵是膽移熱於腦也辛夷仁五錢蒼耳子一錢半炒白芷一兩薄荷葉一錢上為末蔥茶調下二錢黃連通聖散治腦漏膽移熱於腦則辛額鼻淵即防風通聖散加黃連薄荷水煎熱服天竺黃丸秘方治鼻淵當歸川芎白芷人參茯苓麥門冬防風荊芥薄荷蒼耳子香附子蔓荊子秦艽甘草各二兩天竺黃三錢上為細末煉蜜為丸如梧桐子大每服三四十丸米湯送下批按此方治鼻淵之劑治鼻中時時流臭黃水甚者腦下時痛俗名控腦砂有蟲食腦中用絲瓜藤近根三尺許燒存性為末酒調服洗肺散治鼻中生瘡天門冬去心麥門冬去心各一兩黃芩二錢半夏二錢杏仁去皮一錢五味子一錢半甘草五分上銼一劑生薑五片水煎食後服清肺飲子秘方治鼻紅肺風山茶花一兩黃芩二兩胡麻仁二兩山梔子二兩連翹一兩薄荷三兩荊芥一兩芍藥一兩防風一兩葛花二兩苦參二兩甘草二兩上為末茶清調服三錢後用搽藥搽鼻去紅方秘方治鼻紅肺風白礬一錢杏仁四十九個水銀一錢輕粉七分白楊七個大楓子四十九個京墨一錢五味子四十九個核桃七個上共為末雞子清調搽患處治鼻中肉贅臭不可近痛不可搖以白礬末加硇砂少許吹其上頃之化水而消與勝濕湯瀉白散二帖此厚味擁濕熱蒸於肺門如雨霽之地突生芝蘭也參歸丸治酒渣鼻乃血熱入肺苦參淨末四兩當歸淨末二兩上用酒糊丸如梧桐子大每服七八十丸食後熱茶下口舌病內經曰中央黃色入通於脾開竅於口藏精於脾故病在舌夫口之為病或為重舌木舌或為糜爛生瘡或見酸苦辛鹹味原其所因未有不因七情煩擾五味過傷之所致也經曰陰之五宮本在五味陰之五宮傷在五味是也是以肝熱則口酸心熱則口苦脾熱則口甘肺熱則口辛腎熱則口咸有口淡者知胃熱也外有謀慮不決肝移熱於膽而口苦者亦有脾胃氣弱木乘土位而口酸者或膀胱移熱於小腸膈腸不便上為口糜生瘡潰爛則傷寒狐惑之證上唇生瘡蟲食其臟下唇生瘡蟲食其肛也又舌吐不收名曰陽強舌縮不能言名曰陰強方綠袍散治口瘡黃柏去粗皮一兩青黛三錢上為末摻患處噙之吐出涎即愈一方加密陀僧一錢赴宴散段干兵傳批按此方治口瘡外敷之劑治口瘡黃連黃柏黃芩梔子細辛乾薑上各等分為細末先用米泔水漱口後搽藥於患處吐咽不拘神效升麻散治上膈癰毒舌上生瘡咽喉腫痛升麻赤芍人參桔梗乾葛各錢半甘草七分上銼一劑水煎徐徐服之內經曰膀胱移熱於小腸膈腸不便上口為糜五苓散合導赤散一服而愈批按此方治口瘡內服之劑凡口瘡服涼藥不愈者乃中氣虛相火泛上無制用理中湯治之即愈甚者加附子或用官桂末摻之上清丸王天中傳批按此方治口瘡噙化之劑治口舌痛生瘡薄荷葉三兩硼砂五錢天花粉一兩天竺黃五錢風化硝百藥煎防風孩兒茶各一兩桔梗七錢甘草一兩上為細末煉蜜為丸如彈子大每服一丸噙口中徐化下香茶餅清膈化痰香口孩兒茶四兩桂花一兩南薄荷葉一兩硼砂五錢上為末用甘草煮汁熬膏作餅噙化嚥下美味香甜硼砂丸王天中傳批按此方清上香口之劑治口氣口乾口舌生瘡硼砂二錢片腦麝香各一分馬牙硝風化四錢寒水石煅一錢上為末用甘草膏為丸如麻子大不拘時含一丸咽津口唇緊小不能開口不能飲食不治即死用白布作燈炷如指大安刀斧上燃燒令刀上汗出拭取敷唇上日二三度或用舊青布燒灰調清服或和豬脂塗敷又以蛇蛻燒灰先拭淨敷之又宜燒亂髮蜂房六畜毛灰豬脂調敷治唇緊燥裂生瘡橄欖不拘多少燒灰豬脂和敷患處治口唇裂破成瘡劉太府方爐甘石二錢火煅文蛤一兩黃柏一兩蒼朮五錢除甘石外三味同炒赤色共研極細入片腦三分再研用蠟油調敷唇上補唇舌方太醫院傳用鮮蟹燒灰每二錢用乳香沒藥各二分半塗之即生肉如多去唇舌用川烏草烏為末攤紙一條以涼水調合貼之即不覺疼可用刀取如流血以陳石灰塗之即止愈後舌硬用雞冠血點之即軟舌強腫如豬胞以針刺舌下兩傍大脈血出即消勿刺著中央脈令人血不止則以火燒銅箸烙之或以雜草燒鑊鏽醋調敷舌上下脫去再敷須臾即消此患人多不識失治則死凡舌腫舌下必有蟲狀如螻蛄臥蠶有頭有尾頭小白可燒鐵釘烙頭上即消治舌上腫硬百草霜海鹽各等分上為末井花水調敷又方真蒲黃末頻摻舌上內以黃連一味煎湯服之以瀉心火病機云舌長過寸研冰片敷之即收治舌無故出血如線以槐花為末摻之即止治舌忽脹出口外俗云是蜈蚣毒用雄雞血一小盞浸之即縮入牙齒脈右關脈洪數或弦而洪腸胃中有風熱而痛尺脈洪大而虛者腎虛主齒動搖疏豁相火上炎而痛病夫齒者腎之標骨之餘也足陽明胃之脈貫絡於齒上齦手陽明大腸之脈貫絡於齒下齦手陽明惡寒飲而喜熱飲足陽明惡熱飲而喜寒飲有開口呷風則痛甚者腸胃中有風邪也有開口則噦臭不可近者腸胃中有積熱也有痛而動搖者腎元虛也有蟲食而痛者蓋腸胃中有濕熱而生蟲也治治之宜瀉陽明之濕熱更以擦牙誅蟲之劑以治其標則齒自然而固矣一牙痛之證其人腸胃素有濕熱上出於牙齦之間適被風寒或飲冷所郁則濕熱不得外達故作痛也一牙痛胃脈弱而無力者以補中益氣湯加生地黃牡丹皮方清胃散治上下牙齒疼痛不可忍牽引頭腦滿面發熱大痛此因服補胃熱藥或食辛熱之物過多之所致也此藥神效當歸身生地黃酒洗黃連夏月倍用牡丹皮各三錢升麻一兩上銼一劑水煎稍冷服如痛甚加石膏二錢細辛三分黃芩一錢細茶三錢大黃蒸一錢腫加防風荊芥各一錢治胃有實熱齒痛或上爿痛尤甚者用涼膈散大黃以酒蒸為君加知母石膏升麻為佐頻頻噙咽即愈細辛湯治上爿牙疼屬足少陰腎虛熱升麻一兩細辛二兩黃連一兩蔓荊子一兩半牛蒡子兩半蓽茇兩半薄荷五錢黃柏七錢知母七錢防己一兩上銼水煎溫服白芷湯批按此方清火止痛之劑治下爿牙疼屬手陽明虛熱有風防風荊芥連翹白芷薄荷赤芍石膏上銼水煎溫服千金一笑散翟敬帣傳治牙痛不可忍登時即止巴豆一個入大火略燒去殼胡椒三粒上同一處搗令爛用薄綿包藥入口上下痛齒咬定流出涎水勿咽良久取出即止若是三兩個牙痛多是蟲牙痛去胡椒用花椒如法使塞耳藥宋蘭皋方治牙疼用壁錢包胡椒末如左邊痛塞右耳右邊痛塞左耳手掩枕之側臥少時額上微汗即愈殺蟲丸俞元河方治蟲牙方見黑鵝小線好信不拘多少量加黃丹少許以黃蠟熔成一塊旋用旋丸如黃豆大用白薄絲綿包裹留尾如右牙痛則塞右耳左牙痛則塞左耳兩邊俱痛則兩耳俱塞必深入耳孔一夜其蟲即死一生永不復痛矣哭來笑去散齊雙泉傳治牙齒痛神效雄乳胡椒麝蓽茇良薑細哭將來笑將去上各等分為末每用少許吹男左女右鼻中立止如牙痛臉腫用紙卷藥末在內作條蘸香油點著燎牙痛處火滅再燃再燎條燒盡則止牙疼噙漱藥李益庵傳蜂房一個每一孔內納胡椒花椒各一粒用碗盛之入水令滿加黃柏如指大三片於內以碟蓋住用紙封固或麵糊固住亦可重湯煮令一炷香盡取出候溫漱噙良久吐出再漱即止漱牙止痛三方何通府傳批按此方牙疼外治之劑一方用蛇床子不拘多少煎水熱噙漱之即止一方用白蒺藜不拘多少水煎噙漱一用燒酒煎亦效一方用小麥不拘多少炒焦淬入燒酒去渣噙漱立止甘露飲子治男婦胃中客熱口氣齒齦腫悶宣露心中多煩餓不欲食喜眠睡及咽喉中有瘡天門冬泡去心麥門冬泡去心生地黃熟地黃黃芩枳殼山茵陳石斛枇杷葉甘草各等分上銼作劑水煎食後溫服若齒齦宣露腫悶煎藥漱之冷熱皆可玉池散治牙流膿血變骨槽風者及骨已出者或搖不牢牙痛牙癢地骨皮白芷升麻防風細辛川芎槐花當歸去頭藁本去土甘草生各一錢上作一劑水煎去渣溫熱漱口冷則吐之煎服尤妙張龍圖去地骨皮加獨活治牙宣出血劉清汶傳香附一兩炒黑存性側柏葉五錢青鹽三錢石膏一兩上四味俱炒出大毒為末每清晨擦牙漱吐之牢牙散治牙齦肉綻有牙疳腫痛牙動搖欲落牙不長牙黃口臭升麻四兩羌活一兩龍膽草酒洗兩半羊脛骨燒灰四兩上為末和勻臥時貼在牙齦上神功丸治牙齒疳蝕牙齦肉將脫血不止並治多食肉口臭不可近當歸一錢生地黃酒浸三錢黃連五錢升麻二錢藿香一錢木香一錢砂仁五錢甘草生三錢蘭香葉一錢上為末湯浸蒸餅為丸如綠豆大每服一百丸加至三百丸食遠白湯下兼治血痢血崩血下不止血下褐色或紫色黑色及腸癖下血空心米湯下其脈洪大而緩者及治麻木厥氣上衝逆氣上行立效散治走馬牙疳青黛黃柏末白礬五倍子炒各一錢上為末先用米泔水漱口摻患處神燈照眼法俞監生傳治牙床上下腫爛作痛或因楊梅瘡多服輕粉致筋骨疼痛而作牙匡腫爛者乳香二錢沒藥二錢雄黃一錢硃砂八分水銀錢半唾研錫花錢半銀硃一錢川烏錢半草烏錢半白芷一錢自然銅二錢上為末綿紙裹作條子香油透點燈以瓦片盛置鬥內或桶內將手掩其口鼻以目觀燈先將被覆其身手勿令透氣即愈或有汗為妙固齒丹太醫院傳骨碎補一味水洗淨銅刀切片用銅鍋炒以槐枝不住攪炒取出候冷又上火炒微黑色又住火冷後又炒至老黑色以文武火炒之研為末不時擦牙極能堅骨固齒補髓去骨中毒風氣止筋骨痛治牙則痛不復作如牙將落動搖者頻頻服之立住再不復動烏須固齒補腎散劉司寇傳當歸酒浸小川芎荊芥穗香附米白芍藥甘枸杞各二兩半熟地黃二兩半川牛膝去蘆二兩酒浸細辛三錢破故紙兩半升麻五錢青鹽三兩上為末用老米一升煮飯合成丸陰乾入瓦砂罐內封固炭火或桑柴火燒成灰存性研為末用鉛盒盛之清晨鴛鴦手擦牙滾湯漱嚥下至老牙不痛齒不落士大夫年至四十者能常用此藥於鬚髮未白之先可免染須之勞深為有益也擦牙固齒方張小庵傳黑鉛四兩用柳枝切碎炒半日黃色成灰青鹽二兩半炒當歸五錢細辛三錢硃砂二錢上為細末擦牙漱口烏須固齒擦牙散太醫院傳細辛川芎蓮鬚香附生地黃當歸以上俱燒過存性青鹽生用各等分上為細末清晨擦牙溫水漱咽日日不可間斷不忌三白烏須還少丹京師傳批按此方擦牙烏須固齒之劑川芎一兩旱蓮草二兩當歸一兩牙皂五錢白茯苓一兩青鹽二兩半黃柏五錢上為末入砂罐內封固炭火煅煙盡為度取出為細末瓷罐收貯每早擦牙牙落重生京師傳公鼠骨一副取骨法用鼠一個剝去皮用滷一擦上三日肉爛化盡取骨瓦上焙乾用香附一兩白芷川芎桑皮地骨皮川椒蒲公英旱蓮草青鹽川槿皮各三錢上為細末擦百日其牙復生良驗生牙齒方京師傳用未開眼嫩老鼠三四個外用白芨白芷青鹽細辛當歸熟地黃各五錢除地黃搗爛將前五味研為末用地黃搗爛如泥和勻一餅包老鼠在藥內外用濕紙包裹文武火燒盡煙閉死研末擦上即生牙眼目脈左寸脈洪數心火炎也關弦而洪肝火盛也右寸關俱弦洪肝木挾相火之勢而來侮所不勝之金制已所勝之土也治世謂目病而痛多由火熱及血太過予竊謂目病固由火熱然外無風寒閉之目亦不病雖病亦不甚痛蓋人感風寒則腠理閉密火熱不得外泄故上行走竅而目病矣散其外之風寒則火熱泄而痛自止洗肝散之類用涼藥內退火熱雖系一治然過多則傷脾胃往往不能食或致瀉泄甚不可治也出血之治亦不可常用蓋傷其本故也目得血而能視血少則目昏矣若因血虛而目昏者則滋陰地黃丸養肝丸皆可服也附太上玄真人進還睛丸表伏以醫有聖神工巧之妙人不可不知藥有溫涼寒熱之性醫不可不辨昔黃帝嘗百藥而著本草叔和察六脈而燭病源所以扶世道而救民命者良有在也上古之人咸臻壽考況世之最貴者莫貴於人人之最貴者莫貴於目夫目者五臟六腑之精華百骸九竅之至寶洞觀萬物朗視四方皎潔如珠包含天地內連肝膽外應睛瞳眼雖屬於肝門竅乃居於腎臟腎屬北方壬癸水心屬南方丙丁火心腎不和水火交戰交戰則血氣停留不散膽損肝虛定見眼中受病凡療眼疾須補腎元次修肝木肝乃腎之苗腎乃肝之本修肝則神魂安靜補腎則精魄流注精魄既得安和眼目自然明朗譬如種木當在修根根壯則枝葉茂盛根損則花葉凋零且如黑睛屬腎腎虛則眼淚下流竅門通肝肝風則冷淚常出白眼屬肺肺冷則赤脈流通於睛上下瞼屬脾脾風則拳毛倒睫大小眥屬心心熱則攀睛胬肉眼有五輪外應五行木火土金水內應五臟肝心脾肺腎五輪者風血肉氣水八廓者天地水火風雲山澤苟有病患須究根源勿用庸醫復行鉤割夫子好服丹藥脾胃損傷終夜憂思精神耗憊或膽中受熱或肺上受寒或食五辛太多或縱七情忒甚或瞻星望月或近火沖煙故使三焦受熱致令雙矅失明或迎風有淚或視物如煙覷空中如霜雪之形視太陽如同底蓋五臟虛耗夜夢鬼交眼前自見黑花繚亂目中誰知白翳昏蒙臣竊憫矣陛下戒之今按本草製成仙方能養性安神搜風明目去熱除邪修肝補腎雖遠年內瘴而可明矧近日赤腫而弗治藥共二十九味名曰還睛丸修卻奇異有君臣佐使之功制不尋常有炮制銼煉之妙不問老幼陰陽即見光明清白恭維皇帝陛下修凝道德攝養精神端居九重之中明見萬里之外固不賴於此藥亦可保於未然伏願普頒百姓請嘗試之俯賜群臣僉曰俞也臣無任瞻天仰聖激切屏營之至謹錄其方隨表拜進以聞方還睛丸治遠年近日一切目疾內外翳障攀睛胬肉爛弦風眼及年老虛弱目昏多眵迎風冷淚視物昏花久成內障此藥最能降火升水可宜久服夜能讀細字揀人參一兩半天門冬泡去心三兩麥門冬泡去心三兩生地黃酒洗三兩熟地黃一兩酒蒸當歸酒洗一兩川芎七錢白茯苓去皮一兩山藥一兩蒸菟絲子酒飲爛搗餅焙乾一兩甘枸杞一兩半肉蓯蓉酒浸兩半川牛膝去蘆兩半川杜仲酒炒兩半石斛一兩半五味子七錢川黃連七錢川黃柏一兩酒炒知母二兩酒炒杏仁泡去皮一兩半枳殼麵炒一兩防風八錢去蘆菊花酒洗一兩青葙子一兩草決明一兩白蒺藜炒一兩羚羊角一兩鎊烏犀角八錢甘草七錢炙上為細末煉蜜為丸如梧桐子大每服三五十丸空心鹽湯送下洞然湯西園公制治一切眼病歸尾川芎赤芍黃連黃芩黃柏梔子連翹薄荷防風荊芥獨活前胡菊花木通車前子甘草燈草七根水煎食後服撥雲散金光明傳治一切眼腫疼痛及暴發赤眼風熱壅實等證歸尾川芎赤芍生地黃連翹黃芩山梔子黃連防風荊芥羌活白芷梢枳殼桔梗軟石膏大黃甘草上銼水煎食後服如眼生翳障加白蒺藜如眼胞紅腫如桃倍大黃加芒硝如眼目被人打傷青腫倍大黃如杖瘡腫痛未破作憎寒壯熱或打重血氣攻心並效如打撲傷損內重瘀血不散服之即愈速效散京師傳黃連黃芩黃柏梔子連翹薄荷荊芥穗柴胡歸尾生地黃地骨皮天花粉甘菊花蔓荊子牛蒡子白蒺藜草決明枳殼甘草上銼水煎食後服如大眥頭紅肉堆起乃心經實熱宜菊湯補腎加黃連生地黃減菊花牛蒡子小眥頭紅絲血脹乃心經虛熱宜補心補腎加茯苓蓮肉減荊芥蔓荊子大烏睛上有紅白翳障乃肝經病宜洗肝補腎加柴胡連翹白珠上死血紅加地骨皮天花粉減薄荷若白珠有紅箭翳膜清肺為主加羚羊角為君上瞼胞腫如桃此脾經病瀉脾加砂仁連翹減草決明天花粉日夜疼痛加防己玄參火眼後昏暗加柴胡遊草大明覆光散京師傳當歸尾酒洗生地黃酒浸黃柏酒炒黃連黃芩柴胡白茯苓枳殼羌活防風荊芥石膏煅甘菊花蟬蛻車前子炒密蒙花白蒺藜炒木賊童便浸焙青葙子炒羚羊角石決明煅甘草上銼每服一兩食後溫服大眥赤者乃心經實熱加龍膽草赤芍白朮減車前荊芥小眥赤者乃心經虛也加白茯苓黃耆硃砂去青葙子石決明赤而不痛乃肝經實熱加柴胡陳皮白朮減荊芥赤而昏者乃肝之虛也加蒼朮楮實子減蒺藜羞明怕日乃脾之實加密蒙花減柴胡視物不真乃脾之虛加蒼朮細辛減防風木賊眵多結硬乃肺之實加桑白皮茅根白朮減蟬蛻石膏眵虛不結乃肺虛加阿膠陳皮減歸尾枳殼迎風出淚乃腎虛加熟地黃石斛減生地黃菊花白珠鮮紅常痛加山梔子乳香沒藥防風黃芩減青葙子蒺藜胬肉侵睛加大黃牽牛牛蒡子減石膏枳殼白膜侵睛加蒺藜木賊連翹車前子荊芥癢極難當加殭蠶草烏減菊花木賊風中淚出加旋覆花草烏煨減歸尾石決明坐起生花加山藥熟地黃減防風荊芥忌酒戒欲兩瞼胋睛加藿香白芷茯苓荊芥清肺散京師傳批按此方治一切眼疾清涼之劑治肺氣上攻眼目白睛腫脹日夜疼痛者桑白皮黃芩菊花枳殼防風荊芥柴胡升麻赤芍歸尾玄參苦參蒺藜木賊旋覆花甜葶藶甘草上銼水煎食後服抑清明目湯雲林制治婦人因怒氣傷肝眼目昏暗如雲霧中當歸白芍生地黃白朮茯苓陳皮半夏龍膽草柴胡黃連梔子牡丹皮白豆蔻甘草生薑煎服明目大補湯治氣血俱損眼目昏花神光不足及久患眼服涼藥過多氣血凝滯雙目昏蒙全不通路服此以鎮陽光壯腎水即十全大補湯加沉香大附子制白豆蔻羊肝丸金光明傳治一切眼疾不問內外翳障青盲等證黃連一兩菊花當歸川芎防風荊芥羌活薄荷葉各三錢上為末用白乳羊肝一具以竹刀刮去筋膜生搗再用藥搗爛為丸如梧桐子大每服五七十丸漿水送下白水亦可內障昏暗加熟地黃一兩翳障加蒺藜木香各五錢明目壯水丸雲林制治肝腎不足眼目昏暗常見黑花多有冷淚此藥壯水以鎮陽光明目補腎養肝生心血揀人參一兩當歸酒洗一兩熟地黃酒蒸二兩生地黃酒洗二兩天門冬去心二兩麥門冬去心二兩石棗酒蒸去核二兩枸杞子酒洗一兩六錢五味子一兩菟絲子酒製一兩白茯神去皮木二兩乾山藥一兩川牛膝去蘆酒洗一兩三錢柏子仁去殼一兩炒澤瀉一兩牡丹皮酒洗一兩家菊花去梗三兩黃柏一兩半乳汁拌勻炒知母二兩半乳汁拌勻曬乾炒白豆蔻去殼淨三錢能去眼中一切塵垢翳膜上為末煉蜜為丸如梧桐子大每服百丸空心淡鹽湯送下忌生冷萊菔養肝丸周古川傳批按此方補虛明目之劑治肝經不足眼目昏花或生眵淚久視無力婦人血虛目疾當歸川芎白芍藥熟地黃酒蒸防風楮實子炒車前子酒炒蕤仁去殼湯泡去皮上為末煉蜜丸如梧桐子大每服七十丸食遠白湯下滌光散秘方治目疾屢服寒涼藥不愈兩眼蒸熱如火之熏赤而不痛滿目紅絲血脈貫睛瞀悶昏暗羞明畏日或上瞼赤爛或冒風沙而內外眥皆破洗之立效枯白礬五分銅青三分上為末水和藥瓷器盛重湯煮三五沸隔紙蘸洗日三五次決明散傅東山傳治翳障眼三服即退石決明葛花澤瀉木賊大黃上銼一劑水煎服治雀目如神汪聖峰傳黃蠟不拘多少熔化取出入蛤粉相和所得成球每用以刀切下二錢以豬肝二兩批開摻藥在內麻繩扎定水一碗入銚內煮熟取出乘熱熏眼至溫餐食之日二次以明為度治眼出冷淚虛則補肝四物湯加木賊防風實則用木賊蒼朮白蒺藜防風羌活川芎甘草為末米泔水調下咽喉脈兩寸脈浮洪而溢者喉痹也脈微而伏者死病夫喉以候氣咽以咽物咽則通水穀接三脘以通胃喉有九節通五臟以系肺並行兩異氣谷攸分諸臟熱則腫塞不通腑寒則縮而硬硬如有物常欲癢痛多涎唾皆使喉閉風燥亦然若夫卒然腫痛水漿不入語言不通死在須臾誠可驚駭其會厭兩旁腫者俗謂之雙乳蛾易治會厭一邊腫者謂之單乳蛾難治古方通謂之喉痹皆相火之所沖逆耳治治宜先大涌其痰或以鈹針刺其腫處此急則治其標之法也內當從治而以桔梗甘草玄參升麻防風羌活荊芥人參白朮茯苓之類少加乾薑附子等藥為嚮導徐徐頻服不可頓服切不可驟用寒涼之藥而正治之非徒無益而且促其死矣單乳蛾雙乳蛾喉閉雙喉閉子舌脹木舌脹纏喉風走馬喉蓋因濕氣上行轉於喉之兩旁近外腫作以其形似乳蛾一為單二為雙其乳蛾差小者名喉閉熱結於舌下復生一小舌子名子舌脹熱結於舌中舌為之腫名木舌脹木者強而不柔和也熱結於咽喉腫繞於外且麻且癢腫而大者名纏喉風喉閉暴發暴死者名走馬喉風喉閉之症其人胸膈素有痰涎或因飲酒過度或因忿怒失常或因房事不節而發作也何則飲酒過度是胃火動也忿怒失常是肝火動也房事不節是腎火動也火動痰上而為痰熱燔灼壅塞於喉嗌之間所以內外腫痛而水漿不入也治療之法急則治其標緩則治其本標則用丸散以吐痰散熱治本用湯藥以降火補虛方甘桔湯甘草防風荊芥薄荷黃芩各一錢桔梗三錢加玄參一錢上銼一劑水煎食後頻頻噙咽咳逆加陳皮咳嗽加知母貝母咳發渴加五味子唾膿血加紫菀肺痿加阿膠面目腫加茯苓嘔加半夏生薑少氣加人參麥門冬膚痛加黃耆目赤加梔子黃連咽痛加鼠黏子竹茹聲啞加半夏桂枝疫毒頭痛腫加鼠黏子大黃芒硝胸膈不利加枳殼心胸痞加枳實不得臥加梔子發斑加防風荊芥酒毒加乾薑陳皮之類清咽利膈散批按此方治咽痛清火之劑連翹黃芩梔子薄荷防風荊芥桔梗玄參黃連大黃金銀花牛蒡子朴硝甘草上銼一劑水煎服綿球散王伯泉傳草烏一個重一錢余藥各一錢生胡椒蓽茇紅豆細辛牙皂上為末用烏梅去核拈作餅包藥末在內仍以藥末摻之以綿裹縛筋頭上先用鵝翎管削針刺破將綿球蘸淡醋繳喉中患處去痰為度如牙關不開先用開關散搐鼻嗅涕即開開關散用楊梅樹皮向東者曬乾去粗皮為末吹鼻中噴嚏為驗金鎖匙秘方硃砂三分三釐硼砂一分二釐枯礬一分六釐雄膽一分焰硝一分片腦一分麝香少許上為細末竹筒吹入喉中春風散治咽喉腫痛纏喉風閉塞臘月初一日取豬膽五六個用殭蠶黃連俱銼朴硝白礬青黛俱各五錢裝入膽內縛定用青紙裹了將地掘一方坑長闊一尺上用竹竿橫吊以膽懸定於內候至立春日取出置當風處吹乾去皮以藥研末密收吹喉吹喉散宋舉人傳批按此方止痛外治之劑壁錢燒存性枯白礬發灰上各等分研末吹喉清火補陰湯治虛火上升喉痛並喉生瘡喉閉熱毒最能降火補虛當歸一錢川芎一錢白芍一錢二分熟地黃一錢二分黃柏一錢童便炒知母一錢生用天花粉一錢甘草一錢加玄參三錢上銼一劑水煎入竹瀝溫服通隘散方外人傳喉痛生瘡聲啞白硼砂二錢孩兒茶一錢蒲黃六分青黛一錢牙硝六分枯礬六分片腦二分黃連五分末滑石一錢寒水石一錢黃柏五分末上共為末以葦筒藥少許吹入喉中即效清上丸太醫院傳批按此方治陰虛咽痛之劑治喉中熱毒腫痛喉閉乳蛾等證雄膽一錢雄黃五分硼砂一錢薄荷葉五錢青鹽五分膽礬少許上為細末煉化白砂糖為丸如雞頭子大臥時舌壓一丸自化入喉神效清音散治聲音不清訶子三錢半生半泡熟木通二錢半生半泡熟桔梗生用甘草三錢半生半炙上銼水煎用生地黃搗爛入藥貼錢笛丸批按此方治失聲之劑治聲失音或不清當歸一兩生地黃一兩熟地黃一兩天門冬鹽炒五錢黃柏一兩蜜炙麥門冬五錢鹽炒知母五錢人參三錢白茯苓一兩去皮訶子五錢阿膠五錢烏梅十五個人乳一碗牛乳一碗梨汁一碗上為末煉蜜為丸如黃豆大每服八十丸訶子湯下或蘿蔔湯下亦可驅風解毒散治痄腮腫痛防風荊芥羌活連翹牛蒡子甘草各等分上銼一劑水煎食後頻服外用後方敷藥赤豆散赤小豆為細末醋調敷腫處恐毒氣入喉難治白灰散批按此方治痄腮之劑石灰不拘多少炒七次地下窨七次醋調敷腫處立消結核病結核者火因痰注而不散鬱結堅硬如果中核也或在頸脅或在手足或在頭額或在臂或在腋如腫毒不紅不痛不作膿不必潰發但令熱氣散則核自消治大法宜二陳湯加竹瀝多服為妙方開氣消痰湯治胸中胃脘至咽門窄狹如線疼痛及手足俱有核如胡桃者陳皮一錢半夏七分泡枯芩一錢前胡八分桔梗一錢二分枳殼一錢枳實七分香附一錢二童便炒木香五分殭蠶一錢二分羌活七分荊芥七分檳榔八分射干七分威靈仙七分甘草六分上銼一劑生薑三片水煎服治頸項下生痰核二陳湯加酒炒大黃黃連連翹桔梗柴胡生薑煎服治臂核作痛二陳湯加連翹川芎防風黃芩酒炒蒼朮皂角刺治耳後項各一塊牛膽南星白殭蠶大黃酒炒青黛上為末煉蜜丸噙化治一身俱是塊二陳湯加白芥子炒黃連薑汁炒治頸項結核或腫痛李小陘傳夏枯草不拘多少水煎頻頻服之即愈批按此方治結核內消之劑一婦人遍身痰核不紅腫不疼痛陳皮半夏茯苓當歸川芎白芍藥枳實黃連香附桔梗連翹防風羌活柴胡龍膽草甘草各等分上銼一劑生薑煎服治痰核用南星淮烏各等分共為細末薑汁調如膏敷核上立消批按此方治結核外敷之劑治項後側少陽經中瘩瘩不變肉色不問大小及年深月久或亦赤硬腫痛生山藥去皮一塊蓖麻子三個去殼共研勻攤帛上貼之即消梅核氣梅核氣者窒礙於咽喉之間咯之不出咽之不下有如梅核之狀是也始因喜怒太過積熱蘊隆乃成厲痰鬱結致斯疾耳治治宜導痰開鬱清熱順氣如陳皮半夏香附川芎山梔黃芩枳殼蘇子之類是也如老痰凝結不開以咸能軟堅立藥海石立明籵之類是也方加味四七湯治梅核氣證妙不可述蘇梗一錢半夏一錢厚朴薑製一錢茯苓一錢陳皮一錢青皮七分枳實一錢砂仁一錢白豆蔻六分檳榔三分南星一錢益智仁三分神麯一錢炒上銼一劑生薑五片水煎食遠服加味二陳湯治梅核氣陳皮半夏茯苓枳殼桔梗黃芩蘇子白豆蔻山梔子甘草各等分上銼一劑生薑煎服行氣散治梅核氣咽喉氣脹上攻胸膈痛紫蘇陳皮香附烏藥枳殼桔梗厚朴半夏大黃酒炒甘草上銼燈心十根水煎服癭瘤病夫癭瘤皆因氣血凝滯結而成之癭則喜怒所生多著於肩項皮寬不急捶捶而垂是也瘤則隨留住初作如梅李之狀皮嫩而光漸如杯卵是也癭有五種其肉色不變者謂之肉癭其筋脈現露者謂之筋癭若赤脈交絡者名曰血癭若隨憂惱而消長者名曰氣癭若堅硬而不可移者名曰石癭瘤亦有六種一曰骨瘤二曰脂瘤三曰肉瘤四曰膿留五曰血瘤六曰石瘤癭瘤二者雖無癢痛最不可決破恐膿血崩潰滲漏無已必致殺人其間肉瘤不可攻療治脂瘤氣瘤之類當用海藻昆布軟堅之藥治之如東垣散腫潰堅湯亦可多服庶得消散矣方消癭五海飲海帶海藻海昆布海蛤海螵蛸各三兩半木香三稜莪朮桔梗細辛香附各二兩豬琰子七個陳壁土炒去酒焙乾上為末每服七分半食遠米湯下南星膏治皮膚手足頭面生瘡瘤大者如拳小者如慄或軟或堅而不痛生大南星一枚細研稠黏滴好醋三七滴為膏如如生者以乾者為末醋調作膏先將小針刺瘤上令氣透貼之癢則頻貼一方加草烏細辛白芷
