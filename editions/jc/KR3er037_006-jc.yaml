body:
  text: 卷之六諸氣脈下手脈沉便知是氣沉極則伏澀弱難治其或沉實氣兼痰飲又曰沉弦細動皆氣痛證心痛在寸腹痛在關下部在尺脈象顯然證夫天地之氣常則安變則病況人稟天地之氣五運迭侵於外七情交戰於中是以聖人嗇氣如持至寶庸人投物而反傷太和此軒岐所以論諸病皆因於氣有病皆生於氣遂有九氣不同之說氣本一也因所觸而為九怒喜悲恐寒暑驚思勞也其言曰怒則氣上喜則氣緩悲則氣消恐則氣下寒則氣收暑則氣泄驚則氣亂思則氣結勞則氣耗夫人身之正氣與血為配血行脈中氣行脈外一呼脈行三寸一吸脈行三寸氣血並行周流乎一身之中灌溉乎百骸之內循環無端運行不悖此為生生不息之妙用也經云一息不運則機緘窮一毫不續則穹壤判若內無七情之所傷外無六淫之所感何氣病之有哉其不善攝生者五志之火無時不起五味之偏無時不傷是以釀成膠痰固積留滯於六腑鬱火邪氣充塞乎三焦使氣血失其常候臟腑不能傳導是故外邪得以乘虛而湊襲矣以致清陽不升濁陰不降而諸般氣痛朝輟暮作而為膠固之疾非良工妙手莫易治焉若夫為脅痛為心腹痛為周身刺痛甚則為翻胃為膈噎等證即此之由也大抵男子屬陽得氣易散女子屬陰得氣易郁是以男子之氣病常少女人之氣病常多故治婦人宜以順氣為主而兼乎散血治男子宜以養榮為主而調氣次之斯得氣證治法之大要也氣之為病非止一端有七情氣有鬱氣有怒氣有熱氣有冷氣有厥氣有逆氣有痰氣有虛氣有中滿氣有腹脹氣務要詳究不可雷同一例治之治治諸氣須用上下分消不可驟用局方金石烏附燥熱等劑一七情憂結遂成鬱氣難治必須自能知戒庶幾一鬱氣宜開鬱如蒼朮香附川芎青皮竹茹山梔子枳殼連翹木香澤瀉之類一枳殼破滯氣然多服損胸中至高之氣青皮瀉肝氣多服損真氣香附快滯氣陳皮泄逆氣紫蘇散表氣厚朴瀉胃氣檳榔瀉至高之氣藿香之馨香上行胃氣沉香升降真氣腦麝散真氣木香行中下焦氣若此之類氣實所宜其中有行散者有損泄者用之能治氣之標而不能制氣之本方四七湯治喜怒悲思憂恐驚之氣結成痰涎狀如破絮或如梅核在咽喉之間咯之不出咽之不下此七情所為也或中脘痞滿氣不舒快或痰涎壅盛上氣喘急或因痰飲中阻嘔逆噁心並宜服之半夏五兩茯苓四兩厚朴四兩紫蘇二兩上銼作十劑生薑七片棗一枚水煎熱服梅核氣加桔梗枳實一方加檳榔分心氣飲批按此方治諸氣平和之劑治男子女人一切氣不和多因憂愁思慮忿怒傷神或臨食憂感或事不遂意使抑鬱之氣留滯不散停於胸膈之間不能流暢致心胸兩脅痞滿虛脹噎塞不通噫氣吞酸噁心嘔噦目眩頭暈面色痿黃口苦舌乾飲食減少四肢怠倦日漸尫羸或大病之後胸中虛痞不思飲食並皆治之青皮五錢陳皮五錢半夏三錢五分白茯苓三錢五分紫蘇二兩腹皮五錢肉桂三錢五分赤茯苓三錢桑皮五錢木通三錢五分羌活五錢甘草二錢五分上銼分五劑生薑三片棗一枚燈心十莖水煎服一方去芍藥羌活加木香檳榔香附枳殼莪朮藿香桔梗善治憂思鬱怒諸氣痞滿性急加柴胡多怒加黃芩食少加砂仁炒神麯咳嗽加桔梗半夏胸膈痞悶加枳實香附三焦不和加烏藥氣閉加萊菔子枳殼氣滯腰疼加木瓜枳殼上焦熱盛加黃芩下焦熱盛加黃柏翻胃加沉香磨服水氣面目浮腫加豬苓澤瀉車前子木瓜葶藶麥門冬氣塊加三稜莪朮檳榔青皮利氣丸治一切氣滯心腹滿悶疼痛脅肋膨脹嘔吐酸水痰涎不利頭目眩暈並食積酒毒及米穀不化或下痢膿血大小便結滯不快風壅積熱口苦煩躁涕唾稠黏此藥最能流濕潤燥推陳致新滋陰抑陽散郁破結活血通經治氣分之聖藥也大黃生用六兩黑醜頭末六兩木香一兩檳榔一兩枳殼麩炒一兩香附炒四兩青皮炒一兩廣皮一兩莪朮煨一兩黃連一兩黃柏三兩上為細末水丸如梧桐子大每服一百臨臥以淡薑湯送下以大便通利為度如不利再加丸數服務使通利為愈一塊氣批按此方治諸氣專攻之劑治諸氣食積及噎膈痞滿胸脅刺痛癥瘕疝氣並皆治之青皮一兩陳皮一兩三稜一兩蓬朮一兩香附便制一兩神麯炒三錢麥芽三錢炒蘿蔔子三錢炒白醜頭末三錢檳榔三錢鬱金三錢黃連酒炒三錢枳實三錢皂莢二錢五分百草霜二錢五分上為末麵糊為丸綠豆大每三十丸視疾之上下為食之先後熱酒薑湯送下青筋證夫青筋之證原氣逆而血不行俾惡血上攻於心也多由一切怒氣相沖或憂鬱氣結不散或惱怒復傷生冷或房勞後受寒濕以致精神恍惚心忡氣喘噎塞上壅嘔噦噁心頭目昏眩胸膈痞滿心腹絞刺脅肋腰背頭腦疼痛口苦舌乾面青唇黑四肢沉困百節痠疼或憎寒壯熱遍身麻痹不仁手足厥冷顫掉默默不已不思飲食等症皆惡血攻心而致之也自古以來無人論此但有患此疾者無方可治惟以砭針於兩手曲池青筋上刺之出紫血不勝其數而疾有即愈者有不愈者而變為大患者常慣病此者或有一月一次或兩三次者屢患屢刺莫之能愈愚惟慮人之生命以氣血為主故丹溪曰氣血和一疾不生虧則百病生焉況此病先傷於氣而後復損其血不致於夭枉者蓋亦鮮矣雖然未有退血之法又不得不刺不刺則惡血攻心須臾不救治予制一方屢獲效驗名白虎丸白虎者西方肺金之謂也青筋者東方肝木之屬也以白虎而治青筋是金能剋木故耳何病之不愈哉此方之妙不惟代刺青筋之苦愈青筋之病而亦免後日之患其惠也不亦大乎此方兼治男子久患痢疾便血婦人崩漏帶下並一切打撲內損血不能散心腹痛欲死者服之其效不啻桴鼓之影響也按此青筋之病北人多患之南方有即痧症也方白虎丸雲林制歌曰白虎丸丹古石灰穀神子制救人災柏中為末水飛過手上成丸日曬來引宜燒酒一二盞每服須吞五十枚保全世患青筋證廣積陰功遍九垓千年古石灰不拘多少刮去雜色泥土杵為末水飛過上曬勿令太燥量可丸即收丸如梧桐子大每服五十丸看輕重加減燒酒送下此藥能順氣散血化痰消滯治青筋初覺頭疼噁心或腹痛或腰痛或遍身作痛不思飲食即進一服當時血散若過三五日青筋已老多服取效又治心腹痛及婦人崩漏帶下或因氣惱致病或久患赤白痢疾或打撲內損血不能散服之大效大公丸宋杏川傳治緊陰青筋心腹疼痛乾薑二兩白礬枯過二兩上為末用糯米糊為丸如綠豆大每服三十丸滾水下如不止再飲滾水三口治婦人因氣打青筋後即心慌發熱口乾腹脹噁心嘔噦等症宜服分心氣飲加麥門冬黃連生地痞滿脈胸痞脈滑為有痰結弦伏亦痞澀則氣劣證夫痞與否同不通泰也由陰伏陽蓄氣與血不運而成處心下位中央填滿痞塞皆土邪之為病也與脹滿有輕重之分痞則內覺痞悶而外無脹急之形脹滿則內脹而外亦有形也前人皆指誤下而致之蓋誤下則裡氣虛故傷寒之表邪乘虛入於心下雜病則所受之邪氣亦蓄心下因而致痞也亦有不因誤下而得之者有中氣虛弱不能運化精微而為痞者有飲食痰積不能施化而為痞者有濕熱太甚土來心下為痞者治古方治痞用黃連黃芩枳實之苦以泄之厚朴半夏生薑之辛以散之人參白朮之甘苦以補之茯苓澤瀉之淡以滲之大概與濕同治使上下分消可也又曰肥人多是濕痰宜蒼朮半夏砂仁茯苓滑石以燥之瘦人多是中焦鬱熱宜枳實黃連以導之葛根升麻以發之如飲食後因感風寒以致飲食不消而作痞者宜藿香砂仁草豆蔻吳茱萸以溫化之如脾氣虛弱轉運不調飲食不化為痞者當消導其胸中窒塞宜陳皮白朮神麯麥芽山楂以助化之或以保和丸枳實導滯丸木香化滯湯主之有傷寒下早而作痞桔梗湯小陷胸湯主之有傷寒下多則亡陽而痞者四物湯加參苓白朮柴胡升麻少佐陳皮枳殼以疏之有大病後元氣未復而胸滿氣短者補中益氣湯橘皮枳朮丸主之又有虛實之殊焉實痞大便閉而能食者厚朴枳實湯主之虛痞大便利者芍藥陳皮治之上逆兀兀欲吐者則宜吐之所謂在上者因而越之世人苦於痞塞喜行利藥以求速效雖暫時通快痞若再作益以滋甚是皆不察夫下多所謂亡陰之意也方木香化滯湯治因憂鬱氣結於中脘腹中微痛心下痞滿不思飲食當歸梢四兩枳實炒四兩陳皮六分乾薑六分木香六分柴胡七分草豆蔻一錢半夏一錢五分紅花少許甘草炙一錢上銼一劑生薑煎食遠服黃連消痞丸批按此方治氣鬱實痞專消之方治心下痞滿壅滯不散喘促不安黃連一兩黃芩二兩炒枳實七錢麩炒半夏九錢湯泡陳皮五錢茯苓三錢白朮三錢豬苓五錢澤瀉一錢薑黃一錢乾薑二錢甘草炙三錢上為末蒸餅為丸如梧桐子大每服五七十丸白滾湯任下加減益氣湯即補中益氣加減方見內傷治內傷元氣痞滿脈緩有痰而痞加半夏黃連脈弦四肢乏力便難而心下痞加黃連柴胡甘草大便閉燥加黃連桃仁少加大黃當歸心下痞劣悶加白芍藥黃連心下痞腹脹加白芍藥砂仁五味子如天寒少加乾薑或加中桂心下痞中寒者加附子黃連心下痞嘔逆者加陳皮生薑黃連冬月加黃連少加丁香藿香能食而心下痞加枳實桔梗黃連如不能食心下痞者勿加但依本方食已心下痞則服橘皮枳朮丸枳實消痞丸治右關脈弦心下虛痞惡食懶倦人參三錢白朮三錢白茯苓二錢黃連五錢枳實五錢半夏曲三錢厚朴薑製四錢麥芽炒二錢乾薑二錢甘草炙二錢上為末湯浸蒸餅為丸如梧桐子大每服七十丸食遠白湯下大消痞丸批按此方治內傷虛痞消補兼施之劑治一切心下痞及年久不愈者黃連土炒八錢黃芩土炒六錢枳實麩炒五錢半夏泡四錢陳皮四錢厚朴薑製四錢白朮土炒二兩豬苓二錢五分澤瀉三錢薑黃一兩乾薑二錢人參四錢神麯炒二錢砂仁二錢甘草炙二錢上為末蒸餅為丸如梧桐子大每服五十丸至百丸空心白湯送下腹中窄狹附腹中窄狹須用蒼朮若肥人自覺腹中窄狹乃是濕痰流灌臟腑氣不升降燥飲用蒼朮行氣用香附如瘦人自覺胸中窄狹乃是濕熱熏蒸臟腑宜黃連蒼朮方枳朮散治心下窄狹不快枳實麩炒三錢白朮土炒三錢上銼一劑水二鍾煎一鍾溫服蟠桃酒治氣結聚心下不散用桃樹上不落干桃子三兩為末每服二錢空心溫酒調下脹滿脈腹脹浮大是出厄虛小命殂須努力浮大當發汗虛小當利小便也脹滿脈弦脾制於肝洪數熱脹遲弱陰寒浮為虛滿緊則中實浮則可治虛則危急證夫中滿腹脹者其面目四肢不腫而肚腹脹起中空似鼓者是也丹溪曰心肺陽也居上肝腎陰也居下脾居中亦陰也經曰飲食入胃遊溢精氣上輸於脾脾氣散精上歸於肺肺朝百脈通調水道下輸膀胱水精四布五經並行是脾具坤靜之德而有乾健之運故能使心肺之陽降肝腎之陰升而成天地交之泰是為平人也今也七情內傷六淫外浸或飲食之不節或房勞之致虛則脾土之陰受傷而轉輸之官失職胃雖受骨亦不能運化故陽自升陰自降而成天地不交之否清濁相干隧道壅塞氣化濁血瘀鬱而為熱熱留而久氣化成濕濕熱相生遂成脹滿經曰鼓脹是也以其外雖堅滿中空無物有似於鼓故名曰鼓其病膠固難治又名蠱者若蠱侵蝕有蟲之義理宜補脾次養肺金以制木使脾無賊邪之慮滋腎水以制火使肺得清化之令卻鹽味以防助邪斷妄想以保母氣遠音樂戒暴怒無有不安醫者不察病起於虛急於獲效病者苦於脹滿喜行利藥以求欲速殊不知即得一時之快不一二日之間脹滿復作愈盛於前真元已耗去死則不遠矣古方惟禹餘糧丸制肝補脾殊為切當然恐其溫熱之藥太多亦須隨證順時加減用之俗謂氣無補法者以其痞滿壅塞似難於補不思正氣虛而不能運行邪氣著而不出所以為病經曰壯者氣行則愈怯者著而成病氣虛不補何由以行且此病之起固非一年根深勢篤欲取速效自求禍耳知王道者可以語此其或受病之淺脾胃尚壯積滯不固者惟可略疏導若以峻攻之策吾不敢也治凡胸腹脹初得是氣脹宜行氣疏導之劑木香檳榔枳殼青皮陳皮厚朴之類久則成水脹宜行濕利水之劑一肥胖之人腹脹者宜利濕為主胃苓湯主之一瘦人腹脹者是熱宜黃連厚朴白芍香附之類一色白腹脹者必是氣虛用人參白朮茯苓陳皮厚朴之類一因有故蓄血而腹脹者用桃仁紅花甚者用桃仁承氣湯利之一因食積而腹脹者有熱宜利氣丸或保和丸加木香檳榔阿魏之類有寒者用丁香砂仁木香厚朴香附神麯之類一因外寒鬱內熱而腹脹者用升麻乾葛藿香官桂之類一因多怒而腹脹者用青皮陳皮香附木香梔子蘆薈之類一心腹脹滿或痛咳嗽痰涎喘促大便閉前後心背痛分心氣飲加三稜莪朮檳榔香附烏藥方家傳正氣散批按此方理脾消脹平和之劑治心腹脹滿或出遠方不服水土蒼朮陳皮厚朴藿香半夏烏藥枳殼香附子大腹皮甘草上銼生薑棗子煎溫服和榮順氣湯雲林制治脾弱血虛心腹脹悶兩足虛腫當歸酒洗一錢川芎六分白芍酒洗一錢白朮土炒一錢半茯苓一錢蒼朮米泔制一錢陳皮去白一錢枳實炒一錢烏藥一錢神麯炒一錢香附醋炒一錢牛膝酒洗一錢木瓜一錢獨活酒洗一錢澤瀉一錢薏苡仁炒一錢半木通一錢甘草三錢上銼一劑生薑煎服行濕補氣養血湯治氣血虛弱單鼓腹脹浮腫人參大補元氣白朮補脾白茯苓滲濕當歸養血川芎行血蘇梗利氣白芍藥斂脹陳皮泄滿厚朴寬脹大腹皮寬膨木通利水萊菔子消食木香運氣海金沙甘草調諸藥扶胃氣上銼散薑棗煎服氣虛倍參朮茯苓血虛倍芎歸白芍小便短少加豬苓澤瀉滑石服後腫脹俱退惟面目不消此陽明經氣虛倍用白朮茯苓消脹飲子彭大參傳批按此方治脹滿消補兼施之劑治蠱脹單腹脹豬苓澤瀉人參白朮茯苓半夏陳皮青皮厚朴紫蘇香附砂仁木香檳榔大腹皮木通萊菔子甘草各等分上銼生薑五片棗一枚水煎服廣朮潰堅湯批按此方治熱脹之劑治中滿腹脹有積聚如石堅硬令人坐臥不寧二便澀滯上氣喘促或通身虛腫厚朴善制黃連黃芩益智仁草豆蔻當歸半夏廣朮升麻紅花吳茱萸生甘草柴胡澤瀉神麯炒青皮陳皮口乾加甘葛上銼一劑生薑煎食遠溫服忌醋酒濕面香樸湯批按此方治寒脹之劑治中寒下虛心腹膨脹不喜飲食脈浮遲而弱厚朴姜炒大附子泡去皮臍七錢木香三錢上銼姜七片棗二枚水煎服金陵酒丸王進士傳治鼓腫真沉香一兩牙皂一兩廣木香二兩半檳榔一兩上為末用南京燒酒浸十次曬乾用京酒為丸每服三錢重者四錢五更燒酒送下水鼓水自小便而出氣鼓放屁水鼓加苦葶藶五錢炒酒送下再服調胃散蒼朮白朮茯苓白芍藥桔梗紫蘇檳榔陳皮甘草小便閉加車前子腹脹加枳殼金蟾散李桐峰傳批按此方治氣鼓之劑治氣鼓如神大蝦蟆一個以砂仁推入其口使吞入腹以滿為度用泥罐封固炭火煅令透紅煙盡取出候冷去泥研末為一服或酒或陳皮湯送下候撒屁多乃見其效大三稜煎丸批按此方治實脹之劑治心腹堅脹脅下緊硬胸中痞塞喘滿短氣常服順氣寬中消積滯除膨脹大治癥瘕積塊消脹軟堅累獲良驗三稜生細銼半斤搗為末以酒三升於銀石器內熬成膏青皮二兩蘿蔔子炒二兩神麯炒二兩麥芽炒二兩硇砂用瓷罐研細入水少許調坐於溏灰火中候水乾取出為末乾漆炒三兩杏仁湯去皮尖炒黃色三兩上為末三稜膏為丸如梧桐子大每服十五丸至二十丸食遠米湯下調中健脾丸批按此方治虛脹之劑治單腹脹及脾虛腫滿膈中閉塞及胃口作痛黃耆二兩蜜炙人參二兩白朮六兩共土水拌炒茯苓二兩陳皮三兩鹽水制紫蘇子二兩半炒蘿蔔子一兩半炒山楂肉三兩炒草豆蔻一兩酒炒澤瀉三兩半炒薏苡仁三兩炒沉香六錢另研五加皮三兩炒栝蔞一兩用大栝蔞二個鏤一孔每個入川椒三錢多年糞底一錢敲米粒大俱納入栝蔞內外以綿紙糊完再用綿筋鹽泥封固炭火煅通紅為度取山擇去泥其黑皮一併入藥上共為細末煎荷葉大腹皮湯打黃米糊為丸如梧桐子大每服百丸日進三次白湯下此藥不傷脾氣大有補益勿輕視之牛皮丸方外人傳治腹中水響如雷上攻即嘔吐胸膈脹滿或手足作腫黑醜頭末九錢木香九錢陳皮九錢上為末黃蠟化開為丸如梧桐子大每服三十丸黃酒送下水腫脈水腫之證有陰有陽察脈觀色問證須詳陰脈沉遲其色青白不渴而瀉小便清澀脈或沉數色赤而黃燥糞赤溺兼渴為陽病夫腫者鍾也寒熱氣所鍾聚也為病有十水之分其本乃濕熱所致內經曰諸濕腫滿皆屬脾土夫脾虛不能制水水漬妄行故通身面目四肢皆浮而腫名曰水腫或腹大如鼓而面目四肢不腫者名曰蠱脹朝寬暮急是血虛暮寬朝急是氣虛朝暮急血氣俱虛治治法身有熱者水氣在表可汗之身無熱者水氣在裡可下之其間通利小便順氣和脾俱不可緩然證雖可下又當度其輕重不可過用大戟芫花甘遂等利水猛烈之劑一發不收峻決者易固閉者難水氣復來而無可治之也一凡腫病見大便滑泄與夫唇黑缺盆平臍突足平背平或肉硬或手掌平又或男從腳下腫而上女從身上腫而下並不治也又曰膨病水氣人面黑者肝絕也兩眉凸起肺絕也臍中突出者脾絕也兩手無絞者心絕也下疰腳腫者腎絕也此五證內顯一證不可治也一患人腹上用手按之有窩者可治脈壯者易治脈微者難痊一遍身腫煩渴小便赤澀大便閉身熱脈沉數者此屬陽水以八正散主之一遍身腫不煩渴大便溏小便少不澀身不熱脈沉者此屬陰水以胃苓湯主之一水氣浮腫因於氣者以分心氣飲加豬苓澤瀉車前子葶藶子木瓜麥門冬一通身皮膚光腫如泡手按成窟舉手即滿者是因脾虛不能制水水漬妄行故也法當補脾使脾氣得實則自健運切不可下忌食羊肉腰以上腫宜發汗腰以下腫宜行小便此仲景之妙法一病人六脈數四肢腫滿腹痛發熱小便少大便閉治以溫中養胃非也皆由三焦蓄熱大小便閉無發泄故流出經絡五臟充溢而成腫脹宜敗毒散加麻黃防風枳實發散次以利氣丸下之或八正散方消腫調脾順氣湯劉司寇傳治水腫消脹滿順氣和脾除濕利水蒼朮陳皮厚朴草果砂仁豬苓木香檳榔男雄女雌大腹皮香附枳殼澤瀉桔梗三稜莪朮官桂大茴香木通人參木瓜桑白皮牽牛女用黑男用白大黃甘草上銼生薑煎服加減胃苓湯雲林制批按此方消中利水和藥之劑治腫蒼朮米泔制一錢半陳皮去白一錢厚朴姜炒八分甘草炙三分豬苓八分澤瀉一錢白朮去蘆一錢赤茯苓去皮一錢神麯炒八分山楂去核七分砂仁炒七分香附薑汁炒六分檳榔八分木瓜一錢大腹皮六分上銼一劑生薑燈心煎服蘇沉破結湯車少參傳紫蘇薄荷枳實麥門冬當歸川芎大黃木通甘遂白殭蠶白豆蔻木香沉香減半以上三味另為末牙皂生薑細茶各一錢上作二服水煎五更早服忌口回生丹治浮腫腹脹退水青皮陳皮三稜莪朮連翹以上各三錢用巴豆去殼一兩半與砂鍋同炒入藥木香甘遂炒商陸澤瀉木通炒乾漆炒盡煙蘿蔔子炒各三錢赤茯苓桑白皮炒椒目炒各五錢胡椒炒一錢黑牽牛一兩生上為末醋糊為丸如綠豆大每服十五丸至二十丸第一服用生蔥二十四根擂碎同溫酒五更下第二服用陳皮桑白皮煎湯第三服用射干湯下切忌食鹽推車丸毛惟中傳批按此方治消腫峻攻之劑治水腫氣腫單腹脹沉香一錢木香一錢巴豆一錢半生半熟胡椒一錢炒爆上為末棗肉為丸如梧桐子大每服五六十丸消上用蔥白舂爛熱酒下次日消中用陳皮湯下三次消下用牛膝湯下去三五次不補自止後用拾皮散緊皮雞醴飲劉同知傳治一切肚腹四肢發腫不問水腫氣腫濕腫皆效乾雞糞一升鍋內炒黃以好酒三碗淬下煮作一碗細濾去渣令病人飲之少頃腹中氣大轉動作鳴從大便利下於腳膝及臍上下先作皺起其腫漸消復如利未盡再服一劑以田螺二枚用滾酒淖熟食之即止續以溫粥調理愈秘方吳友竹傳治水腫脹滿癩蝦蟆二三枚裝在豬肚內好酒煮一伏時去蝦蟆將豬肚與酒服盡大便屁如雷或水下其腫自消加砂仁尤妙一方加胡椒一歲一粒同煮尤妙法蒸蓖麻膏批按此方消腫專攻之劑治十腫水氣五蠱瘴氣蓖麻子去殼用麻布包壓去油薄攤在木杓內仰放在鍋中水面上以鍋排蓋住煮二十餘沸以藥無白色為度取出每服六錢滾水化開空心溫服不過二三劑以小便太利為效導水餅秘方治腫脹不服藥自去水真水銀粉二錢巴豆肉研去油四錢生硫黃一錢上三味研成餅令勻先用新綿一塊鋪臍上次以餅當臍掩之外用帛縛如人行三五里自然瀉下惡水待行三五次除去藥以溫白粥補之消河餅秘方批按此方消腫外治之劑治水腫膨脹大田螺四個大蒜去皮五個車前子三錢為末上三味研成餅貼臍中以手帕縛之貼藥後少頃小便出一二餅即愈積聚脈脈來細而附骨者積也在寸口積在胸中在關上積在臍旁在尺部積在氣衝脈在左積在左脈在右積在右脈兩出積在中央脈來小沉而實者脾胃中有積聚不下食食則吐病夫積者陰氣也其發有常處其痛不離其部上下有所終始左右有所窮處聚者陽氣也其始無根本上下無所留止其痛無常處氣之所積名曰積氣之所聚名曰聚故積者五臟所生聚者六腑所成其肝積名曰肥氣在左脅下如覆杯有頭足久不愈令人發咳逆病瘧連歲不愈心之積名曰伏梁起臍上大如臂上至心下久不愈令人煩心脾之積名曰痞氣在胃脘覆大如盤久不愈令人四肢不收發黃疸飲食不為肌膚肺之積名息奔在右脅下大如覆杯久不愈令人灑淅寒熱喘咳發肺癰腎之積名曰奔豚在小腹上至心下若豚狀或上或下無時久不愈令人喘逆骨痿少氣皆因陰陽不和臟腑虛弱風邪搏之憂喜乘之傷五臟逆四時乃留結而為積聚也癥者徵也腹中堅硬按之應手曰癥瘕者猶假也腹中雖硬而忽聚忽散無有常處曰瘕症因傷食瘕是血生痞原傷氣癖則傷精痃癖者本因邪氣積聚而生也痃者在腹內近臍左右各有一條筋脈急痛如臂如指如弦之狀癖者僻側在兩肋之間有時而痛曰癖夫痃之與癖皆陰陽不和經絡痞隔飲食停滯不得宣流邪冷之氣搏結不散得冷則發作疼痛故曰痃癖也治丹溪曰塊乃有形之物氣不能成形痰與食積死血也在中為痰飲在右為食積在左為死血大法咸以軟之堅以削之行氣開痰為主不可專用下藥徒損其氣病亦不去當消導使之熔化其死血塊去須大補痞塊在皮裡膜外須用補藥香附開之兼二陳湯加補氣藥先須斷厚味方大七氣湯治五積六聚狀如癥瘕隨氣上下發作有時心腹疼痛上氣窒塞小腹脹滿大小便不利三稜莪朮青皮陳皮桔梗藿香益智仁香附肉桂甘草上銼生薑三片棗一枚水煎服心脾痛加烏藥枳殼脾滯合和四聖散一方加大黃檳榔治大人小兒諸般痞積面色痿黃四肢無力皆緣內有蟲積或好食生米或好食生壁土或好食茶炭咸辣等物只此一服除根用水煎一服露一宿空心溫服不得些少飲食不然則藥力減而蟲積不行矣服後少頃肚腹心疼當下如魚凍或長蟲或血鱉至日午蟲積下盡方用溫粥止之消積保中丸雲林制批按此方治積聚之總司也順氣化痞理脾消滯散痞結除積塊進飲食清鬱熱陳皮二兩去白半夏一兩湯泡七次薑汁炒白茯苓去皮一兩白朮三兩土炒香附一兩醋浸炒青皮四錢去穰油炒木香三錢不見火檳榔七錢莪朮八錢醋浸炒三稜八錢醋浸炒萊菔子一兩炒砂仁四錢炒神麯炒一兩麥芽炒六錢白芥子炒一兩黃連姜炒一兩真阿魏醋浸三錢山梔子薑汁炒一兩乾漆炒盡煙五錢上為細末薑汁酒糊為丸如梧桐子大每服八十丸食後白湯送下千金化氣丸太醫傳治男子腹中氣塊痞痛青皮陳皮枳殼香附砂仁白豆蔻各一兩乾薑木香五錢丁皮二錢藿香半夏草果檳榔一兩半川芎白芷三稜莪朮玄胡索各一兩小茴香五錢厚朴大腹皮白芍藥各一兩甘草三錢上銼生薑三片水煎半空心溫服千金導氣湯太醫院傳治婦人滿腹氣塊遊走不定漉漉有聲丁香木香砂仁白豆蔻香附烏藥枳實倍當歸川芎白芍藥酒炒白芷白朮青皮陳皮乾薑煨桔梗厚朴制肉桂三稜醋炒莪朮醋炒角茴小茴牛膝紅花杜仲炒乳香沒藥乾漆醋炒盡煙甘草上銼半水半酒薑蔥煎熱服如飽悶不食加神麯麥芽山楂發熱加柴胡黃芩勝紅丸批按此方治寒積之劑治脾積氣滯胸膈滿悶氣促不安嘔吐清水丈夫酒積婦人血積氣積小兒食積皆治陳皮莪朮二味同醋煮青皮三稜醋煮乾薑炮良薑各一兩香附炒去皮一兩上為末醋糊丸如梧桐子大每服五十丸薑湯下食前服開懷散雲林制治心下積塊作痞悶或發熱者青皮去穰陳皮半夏姜炒白茯苓去皮三稜醋炒莪朮醋炒香附檳榔草豆蔻倍用柴胡倍用紅花枳實麩炒甘草上銼一劑生薑煎服口乾加乾葛柴香散治心腹有氣一塊略痛又理心腹疼痛膨脹寒熱往來柴胡七分黃芩七分赤芍藥五分枳實一錢厚朴五分香薷五分黃連五分地骨皮一錢三稜一錢莪朮一錢玄胡索五分甘草三分上銼一劑水煎服三稜煎丸治飲食過傷痞悶疼痛食不消化久而成癖又治婦人血積血塊乾血氣經閉不通大黃八兩為末三稜莪朮各一兩二味濕紙包裹煨為末上先將大黃銀石器內好醋漬令平慢火熬干入二味為丸如綠豆大每服二三十丸食後白湯下量虛實加減不問男子婦人小兒諸般積塊皆可服三稜化積丸李九河方批按此方治熱積之劑三稜六兩醋煮莪朮一兩醋煮木香一兩檳榔六兩青皮一兩陳皮一兩香附一兩醋炒枳實一兩麩炒厚朴一兩砂仁一兩神麯一兩炒山楂四兩去子麥芽一兩炒南星一兩薑湯泡半夏一兩薑製蘿蔔子炒大黃三兩酒蒸黃連一兩炒桃仁一兩去皮尖乾漆一兩炒甘草一兩上為細末醋糊為丸如梧桐子大每服四十丸漸漸加用白湯送下神化丹秘方批按此方治積聚專攻之劑消癖積破血氣下鬼胎通經脈及諸癖積血氣塊硇砂乾漆炒血竭各三兩紅娘子二十去翅乳香一錢半斑蝥二十個去翅足上為末棗肉為丸如豌豆大每一丸至二五丸臨臥或棗湯或薑湯或紅花蘇木湯下五疸脈五疸實熱脈必洪數其或微澀證屬虛弱脈沉渴欲飲水小便不利者必發黃也病夫疸者黃病也其證有五曰黃汗曰黃疸曰酒疸曰谷疸曰女勞疸須有五者之分而病原不過濕與熱鬱蒸於脾使面目肢體發黃如梔子水染也治治法但利小便為先溺白黃自退矣若食積黃者量其虛實下之一外有傷寒病陽明內實當下而不得下當汗而不得汗當利而不得利故使濕熱怫鬱內甚皆能令人發黃病也先哲制茵陳五苓散茵陳湯茯苓滲濕湯之類以治之一又有時氣傷寒傷風伏暑解散未盡亦令人發黃如有其狀口淡怔忡耳鳴腳弱微寒微熱小便白濁此為虛證不可妄用涼藥愈傷氣血一疸病面黑黃色而作渴腹脹者難治方腎疸湯批按此方治腎疸用風藥以勝濕也治腎疸目黃甚至渾身黃小便赤澀羌活防風藁本獨活柴胡各五分白朮五分白茯苓二分澤瀉三分豬苓四分蒼朮一錢黃柏二分人參三分葛根五分神麯六分升麻五分甘草三分上銼作二劑水煎稍熱食前服茯苓滲濕湯治濕熱發黃汗黃尿赤豬苓澤瀉蒼朮茯苓陳皮枳實黃連炒黃芩梔子防己茵陳木通如不思飲食加砂仁神麯炒麥芽炒各等分上銼生薑煎服加減胃苓湯批按此方治黃疸滲濕利水之劑治黃胖飲食無味四肢無力行步倦怠脈澀而濡蒼朮米泔制一錢半陳皮去白一錢厚朴姜炒八分甘草炙三分豬苓八分澤瀉一錢白朮去蘆一錢赤茯苓去皮一錢神麯炒八分山楂去核七分砂仁炒七分香附薑汁炒六分檳榔八分木瓜一錢大腹皮六分藿香半夏蘿蔔子三稜莪朮青皮各七分上銼一劑水煎服牛黃散子批按此方治五疸實熱之劑治酒疸食黃及水氣蠱證酒疸飲酒太過食黃宿食積久以此面目甚黃遍身浮腫蠱證肚大如盆黑牽牛春八分夏九分秋七分冬一錢大黃春八分夏九分秋七分冬一錢檳榔春八分夏九分秋七分冬四分甘草春八分夏九分秋七分冬四分上為細末每服五錢五更時面朝東南用井花水調服疾隨下而不動面朝太陽吸氣三口疾速下蠱症全消酒疸宿食俱愈忌生冷發物後服烏藥順氣散一二帖再服十全大補湯數帖酒煮茵陳湯蔣雲山傳治酒疸遍身眼目發黃如金黃色者茵陳一兩好陳酒一鍾半煎至八分食遠溫服不數劑而愈五疸神丹孔柳塘傳批按此方治黃疸專攻之劑治五疸黃腫綠礬不拘多少炒至白色為度入瓶中火煅白尤佳上為細末煮棗肉為丸如櫻桃大每服五丸早晨午間晚上各一服用冷陳酒送下忌醋生冷發物若有蠱服之亦吐出神效退金丸鄢陵蹇太尹傳治黃腫及癖疾發熱砂罐一個裝青礬令八分滿外以鹽泥固濟炭火煅令通紅去泥埋土中以徹去火毒將砂罐及礬俱為末水打麵糊丸如梧桐子大每服二三十丸肉湯送下日進三服滾湯亦可忌魚腥麵筋等發物鐵砂丸思恆傳治黃疸腹內有塊蒼朮三兩米泔制炒香附三兩醋炒白朮一兩豬苓一兩澤瀉一兩茯苓一兩茵陳一兩五錢牛膝一兩檳榔一兩木瓜一兩草果一兩砂仁一兩枳殼一兩五錢麩炒青皮一兩陳皮一兩五錢三稜一兩醋炒莪朮一兩醋炒當歸一兩神麯二兩青礬三兩麩炒黑上為末醋糊丸如梧桐大每服九十丸溫酒送下醋湯亦可發熱脈經曰脈大無力為陽虛脈數無力為陰虛無力為虛有力曰實病夫發熱者謂怫怫然發於皮膚之間則成熱也與潮熱寒熱若同而異潮熱者有時而熱不失其時寒熱者寒已而熱相繼而發至於發熱則無時而發也世間發熱證類傷寒者數種治各不同外感內傷乃大關鍵張仲景論傷寒傷風此外感也因風寒之邪感於外自表入里故宜發汗解散之此麻黃桂枝之義也以其感於春冬之間寒冷之月即時發病故謂之傷寒而藥用辛熱以勝寒若時非寒冷則藥當有變矣故春溫之月則當變以辛涼之藥夏暑之月則當變以甘苦寒之藥故云冬傷寒不即病至春變溫至夏變熱而其治法必因時而有異也又有一樣冬溫之病謂失其時而有其氣蓋冬寒時也而反病瘟焉此天時不正陽氣反泄用藥不可溫熱又有一樣時行寒疫卻在溫暖之時時本溫暖而寒反為病此亦天時不正陰氣反逆用藥不可寒涼又有一樣天行瘟疫熱病多發於春夏之間沿門合境相同者此天地之厲氣當隨時令參氣運而施治宜用劉河間辛涼甘苦之藥以清熱解毒以上諸症皆外感天地之邪者也若飲食勞倦內傷元氣此則真氣下陷內生虛熱故東垣發補中益氣之論用參耆等甘溫之藥大補其氣而提其下陷此用氣藥以補氣之不足也又若勞心好色內傷真陰陰血既傷則陽氣偏勝而變為火矣是為陰虛火旺勞瘵之證故丹溪發陽有餘陰不足之論用四物湯加黃柏知母補其陰而火自降此用血藥以補血之不足者也益氣補陰皆內傷證也一則因陽氣之下陷而補其氣以升提之一則因陽火之上升而滋其陰以降下之一升一降迥然不同矣又有夏月傷暑之病雖屬外感卻類內傷與傷寒大異蓋傷寒傷形寒邪客表有餘之證故宜汗之暑傷氣元氣為熱所傷而耗散不足之證故宜補之故東垣所謂清暑益氣湯也又有因時暑熱而食冷物以傷其內或過取涼風以傷其外此則非暑傷人乃因暑而自致之病治宜辛熱解表或辛溫理中之藥卻以傷寒治法相類者也凡此數證外形相似而實有不同治法多端而不可惑謬故必審其果為傷寒傷風及寒疫則用仲景法果為溫病為熱病及溫疫也則用河間法果為氣虛也則用東垣法果為陰虛也則用丹溪法如是則庶無差誤以害人性命矣今人但見發熱之證皆認作傷寒外感卒用汗藥以發表汗後不解又用表藥以涼其肌設是虛證豈不死哉間有頗知發熱屬虛而用補藥則又不知氣血之分或氣虛而補血或虛病而補氣誤人多矣故外感之與內傷寒病之與熱病氣虛之與血虛如冰炭相反治之若瘥則輕病必重重病必死可不畏哉治一傷寒發熱是寒邪入衛與陽氣交爭而為外熱陽氣主外為寒所搏而失其職故為熱其脈緊而有力是外之寒邪傷衛也治主外一傷暑發熱是火邪傷心元氣耗散而熱邪客於中故為發熱汗大泄無氣以動其脈虛遲而無力是外之熱邪傷榮也治主內一內傷發熱是陽氣自傷不能升達降下陰分而為內熱乃陽虛也故其脈大而無力屬肺脾一陰虛發熱是陰血自傷不能制火陽氣升騰乃陽旺也故其脈數而無力屬心腎一大病後血氣兩虛遂成勞怯潮熱往來盜汗自汗或無汗燥熱世俗便以地骨皮柴胡往往不效其病增劇故男血虛有汗潮熱者人參養榮湯氣虛有汗潮熱者補中益氣湯血虛無汗潮熱者茯苓補心湯氣血兩虛無汗潮熱者逍遙散其咳嗽咯血以人參五味子散骨蒸湯清骨散以上皆勞熱之聖藥也方升陽散火湯治男婦四肢發熱筋骨間熱如火烙捫之烙手此病多因血虛而得之或胃虛過食冷物郁遏陽氣於脾胃之中火鬱則發之生甘草二錢防風二錢五分炙甘草三錢升麻葛根獨活羌活白芍藥人參各五錢柴胡八錢上銼生薑三片水煎服忌生冷寒涼之物月餘四物二連湯治血虛虛勞發熱五心煩熱晝則明瞭夜則發此熱在血分也當歸川芎白芍藥生地黃黃連胡黃連上銼作劑水煎服清心蓮子飲治發熱口乾小便赤澀夜則安靜晝則發熱此熱在氣分也加減逍遙散治子午潮熱胡黃連麥門冬黃芩地骨皮秦艽木通車前子上銼一劑清水每以浸濕燈心煎服加減小柴胡湯治虛損手心腳心發熱加本方香附米黃連前胡柴苓湯治邪傳半表半裡發熱及內傷發熱雜證發熱小柴胡湯合五苓散鱉甲飲治病後食力未復邪熱未除房勞虛損一切骨蒸盜汗鱉甲秦艽柴胡地骨皮枳殼知母當歸烏梅上銼生薑三片桃柳頭各七個空心午前臨臥各一服渣再煎忌酒色貪婪酒醋魚腥燒炙煎煉芋頭山藥胡椒濕面性熱等物男女同法
