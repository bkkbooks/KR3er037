body:
  text: 卷之十二妊娠論巢氏病源曰妊娠一月名胎胚足厥陰脈養之二月名始膏足少陽脈養之三月名始胎手心主脈養之當此之時血不流行形象始化未有定儀因感而變欲子端正莊嚴常口談正言身行正事欲生男宜佩弦欲生女宜佩韋施環珮欲子美好宜佩白玉欲子賢能宜看詩書是為外象而內感者也四月始受水精以成其血脈手少陽脈養之五月始受火精以成其氣足太陰脈養之六月始受金精以成其筋足陽明脈養之七月始受木精以成其骨手太陰脈養之八月始受土精以成膚革手陽明脈養之九月始受石精以成毛髮足少陰脈養之十月五臟六腑關節人神皆備此其大略也且四時之令必始於春木故十二經之養始於肝所以養胎在一月二月手心主心包絡脈也手少陽三焦脈也屬火而夏旺所以養胎在五月六月手太陰肺脈也手陽明大腸脈也屬金而旺秋所以養胎在七月八月足少陰腎脈也屬水而旺冬所以養胎在九月又況母之腎臟繫於胞是母之真氣子之所賴也至十月兒於母腹之中受足諸臟氣脈所養然後待時而生此論奧微而有至理世更有明之者亦未過於巢氏之論矣馬益卿曰胎教産圖之書不可謂之迂而不加信然亦不可狎犯之方今俚俗之家與不正之屬將息避忌略不如儀或藥毒不消或産於風露無産厄而子母均安者亦幸有之若保胎之法須多方預養庶無後患如鄰家有所興修亦或犯其胎氣令兒破形損命如刀犯者形必傷泥犯者竅必塞打擊者色青黯擊縛者相拘攣如此等驗有如指掌不可不慎也胎化之法有所謂轉女為男者亦皆理之自然食牡雞取陽精之全於天産者帶雄黃取陽精之全於地産者千金方轉女為男丹參丸用東門上雄雞頭又方取雄黃一兩縫囊盛帶之本草丹雄雞補虛溫中通神殺毒其肝補腎其冠血益陽雄黃人佩之鬼神不能近毒物不能傷操弓矢借斧斤取剛物之見於人事者氣類潛通造化密移必於三月兆形之先蓋方儀則未具陽可以勝陰變女為男理固然也若婦人懷娠未滿三月男女未定形象未成故藥餌方術可以轉令生男者理或有之其法以斧置妊娠床下擊刃向下勿令人知恐不信試定雞抱卵時依此置窠下一窠盡出雄者又自初覺有娠取弓弩弦縛婦人腰下滿百日去之此紫宮玉女祕方也人具天地之性集萬物之靈陰陽平均氣質完備咸其自爾然而奇偶異數有愆有耗剛柔異用或強或羸血榮氣衛不能逃於消息盈虛之理則稟質之初詎可一概論耶是以附贅垂疣駢拇枝指休儒跛蹩形氣所賦有如此者瘡瘍癰腫聾盲喑啞瘦瘠疲瘵氣形之病有如此者然則胚胎造化之始精移氣變之後保衛輔翼固有道矣天有五氣各有所湊地有五味各有所入所湊有節適所入有度量凡所畏忌悉知戒慎資物為養者理固然也故寢興以時出處以節可以高明可以周密使霧露風邪不得投間而入因時為養者理宜然也故必調喜怒寡嗜欲作勞不妄而氣血以之皆所以保攝妊娠使諸邪不得干焉苟為不然方授受之時一失調養則內不足以為中之守外不足以為身之強氣形弗克而疾疚因之若食兔缺唇食犬無聲食雜魚而生瘡癬之屬皆以食物不戒之過也心氣大驚而癲疾腎氣不足而解顱脾胃不和而羸瘦心氣虛乏而神不足皆由氣血不調之故也誠能推而達之使邪氣無所乘茲乃生育相待而成者故曰天不人不因以上四條俱載婦人良方脈經云陰搏陽別謂之有子搏者近也陰脈逼近於下陽脈別出於上陰中見陽乃知陽施陰化法當有子又少陰脈動甚者妊子也手少陰屬心足少陰屬腎心主血腎主精精血交會投識於其間則有娠王氏曰太衝盛而氣虛者乳子法也尺中之脈按之不絶者法妊娠也難經曰腎有兩枚左為腎右為命門命門者男子以藏精女子以系胞若三部脈浮沉正等按之無絶者為有妊初持寸脈微小呼吸五至三月而尺數也脈滑疾以手按之散者胞已三月也脈重手按之不散但疾不滑者五月也婦人妊娠四月欲知男女法左疾為男右疾為女俱疾為生二子又法得太陰脈為男太陽脈為女太陰脈沉太陽脈浮又法左手沉實為男右手浮大為女左右手俱沉實猥生二男左右手俱浮大猥生二女又法尺脈左邊大為男右邊大為女左右俱大産二子大者如實狀又法左右俱浮大産二男不爾則女作男生左右俱沉産二女不爾則男作女生又法遣妊婦面南行復呼之左回首者是男右回首者是女看上圊時夫從後呼之左回首是男右回首是女又婦人妊娠其左乳房有核是男右乳房有核是女婦懷離經其脈浮大而腹痛引腰脊即為欲生也但離經即腹痛也又法欲生者其脈離經夜半覺日中則生也方驗胎散經脈不行已經三月者更看尺脈不止則是胎也川芎為末每服一錢空心艾葉煎湯調下覺腹內微動則有胎也如服後一日不動非胎必是經滯艾醋湯如過月難明有無如月數未足難明好醋炆艾服半盞後腹中番大痛是有孕不為痛定無妊娠惡阻病産寶謂之子病巢氏病源謂之惡阻謂婦人有孕噁心阻其飲食也由胃氣怯弱中脘停痰脈息和順但肢體沉重頭眩擇食惟嗜醋咸甚者寒熱嘔吐胸膈煩滿肥人多痰瘦人多火須用二陳湯為主保生湯治婦人經候不行身無病似病脈滑大而六脈俱勻乃是孕脈也精神如故惡聞食氣或但食一物或大吐清水此名惡阻切勿作寒病治之人參二錢半白朮陳皮香附烏藥各五錢甘草二錢半覺噁心嘔吐加丁香上銼作二劑生薑三片煎服復元湯治妊婦嘔吐不止或頭痛全不思食左脈弱諸藥不效用以理血歸原當歸川芎白芍人參各五錢白朮茯苓陳皮各一兩半半夏薑湯泡一兩桔梗枳殼各二錢半丁香三錢甘草五錢炙上銼作十劑薑棗煎服妊娠三兩個月內嘔吐噁心不納米食用四物湯加陳皮半夏藿香砂仁白朮神麯麥芽陳蒼米生薑煎服妊娠子煩謂煩躁而悶亂心神也蓋四月受少陰君火以養精六月受少陽相火以養氣若母心驚膽寒多有是證産寶云是心肺虛熱或痰積於胸若三月而煩者但熱而已若痰飲而煩者吐涎惡食大凡停痰積飲寒熱相搏吐甚則胎動不安竹葉湯防風去蘆黃芩麥門冬泡去心各一錢白茯苓二錢竹葉十斤水煎食後溫服妊娠子癇謂痰涎潮搐目吊口噤也用羚羊角散治妊娠中風頭項強直經脈拘急語言謇澀痰涎不利或時發搐不省人事名曰子癇風當歸川芎防風獨活茯神五加皮杏仁薏苡仁酸棗仁炒木香羚羊角甘草上銼生薑五片水煎不拘時服子懸謂妊娠心胃脹滿也紫蘇和氣飲治婦人胎氣不和湊上心腹脹滿疼痛或臨産驚恐氣結連日不下及胎前一切諸疾當歸川芎白芍人參紫蘇梗陳皮大腹皮甘草上銼生薑三片蔥白七根水煎服腹痛加香附木香咳嗽加枳殼桑白皮熱加黃芩嘔吐加砂仁泄瀉加白朮茯苓難産加枳殼香附車前子子腫者謂妊娠面部虛浮肢體滿也茯苓湯治妊娠七八個月前後面目四肢浮腫當歸川芎白芍藥炒熟地黃白朮土炒茯苓澤瀉子實黃芩梔子酒炒甘草炙厚朴薑汁炒麥門冬去心上銼一劑水煎服子氣者謂妊娠兩足浮腫也因脾衰不能制水血化成水所致天仙藤散治妊娠三月成胎之後兩足自腳面直腫至膝行步艱難喘悶妨食狀似水腫生於腳趾間黃水出者名曰子氣天仙藤即青木香藤洗炒紫蘇陳皮香附烏藥木香甘草上銼生薑煎服子淋謂妊娠小便澀少也乃腎與膀胱虛熱不能制水然妊婦胞系於腎腎間虛熱而成斯證甚者心煩悶亂用子淋散治妊娠小便澀痛頻數麥門冬去心赤茯苓大腹皮洗去沙土薑汁拌炒木通甘草淡竹葉上銼水煎服車前散治小便淋瀝或不通下焦有熱者當歸陳皮赤芍藥檳榔滑石木通車前子赤茯苓石葦炙去毛上銼水煎服轉胞謂妊娠卒不得小便也因胞長逼近於胞胞為所逼令人數溲胞即膀胱也然子淋與轉胞相類但小便頻數點滴而痛為子淋頻數出少不痛為轉胞間有微痛終是與淋不同並以五苓散加阿膠冬葵子散治孕婦轉胞小便不通木通梔子炒冬葵子滑石各五錢上銼一劑水一鍾半煎至一鍾空心溫服此藥滑胎臨月可用若六七個月以前不可用又方冬葵子滑石梔子為末田螺肉搗膏或生蔥汁調膏貼臍中立通妊娠經水時下此由衝任氣虛不能約制蓋心小腸二經相為表裡上為乳汁下為月水故妊娠經水壅之以養胎蓄之以為乳若經水時下名曰胞漏血盡則斃矣屬氣血虛有熱膠艾四物湯當歸川芎白芍酒炒熟地黃薑汁炒條芩酒炒白朮土炒艾葉少許真阿膠蛤粉炒珠砂仁炒香附童便炒黑上銼一劑用粳米同煎服芎歸湯劉敏庵傳治胎漏下血不止或心腹脹滿一服立效當歸尾南川芎各五錢上銼一劑黃酒煎臨臥服入童便一盞即止妊娠胎動或飲食起居或衝任風寒或跌僕擊觸或怒傷肝火或脾氣虛弱當推其因而治之若因母病而胎動但治其母若因胎動而母病惟當安其胎輕者轉動不安重者必致傷墜若面赤舌青是兒死也面青舌赤吐沫是母死也唇口俱青兩邊沫出是子母俱死也察而治之佛手散治妊娠六七個月因事築磕著胎或子死腹中惡露下痛不已口噤欲絶用此探之若不損則痛止子母俱安若胎損即便逐下當歸二錢川芎四錢加益母草五錢更效上銼一劑水一盞入酒一盞再煎一沸溫服如人行五里再進一服安胎散治妊婦偶有所傷腹痛不安或從高墜下重傷所壓觸動胎元痛不可忍及下血又治胃虛氣逆嘔吐心腹諸痛大抵妊娠不可缺此縮砂不拘多少為末每服三錢熱酒調服艾鹽湯皆可此藥非八九個月內不宜多用安胎飲治孕成之後覺氣不安或腹微痛或腰間作疼或飲食不美或胎動下血及五六個月常服數帖甚效當歸一錢川芎八分白芍一錢熟地黃一錢酒洗條芩一錢半白朮二錢砂仁炒一錢陳皮一錢炒紫蘇八分甘草四分上銼一劑水煎服下血不止加炒蒲黃一錢阿膠一錢腹痛加香附醋炒一錢枳殼一錢麩炒千金保胎丸京師傳凡女人受胎經三月而墜者雖氣血不足乃中衝脈有傷中衝即陽明胃脈供應胎孕至此時必須謹節飲食絶嗜欲戒惱怒庶免小産之患也服此可保全歸身酒洗二兩南芎一兩熟地姜炒二兩阿膠蛤粉炒二兩香附酒醋童便鹽水各浸三日二兩艾葉醋煮一兩砂仁炒五錢陳皮二兩條芩炒二錢白朮土炒四兩川續斷酒洗二兩杜仲姜炒四兩益母草二兩紅棗煮去皮核上為末棗肉為丸梧桐子大每服百丸空心米湯送下妊娠心痛乍安乍甚者可服白朮散定痛安胎川芎一錢歸身八分白朮土炒五分白芍酒炒八分竹茹五分紫蘇一錢前胡八分木香五分烏藥八分香附便制一錢陳皮八分甘草四分上銼水煎食遠服如兼腹痛加砂仁澤瀉妊娠中惡忽然心腹刺痛悶絶欲死可服加減當歸散川芎當歸陳皮吳茱萸木香香附烏藥甘草前胡蔥白砂仁紫蘇上銼一劑生薑五片煎服妊娠腰腹皆痛者可服加減通氣散當歸身蔥白阿膠茴香破故紙杜仲甘草陳皮川續斷山藥川芎萆薢獨活香附橘核白芍上銼水煎空心服如小腹痛加艾木香烏藥紫蘇去橘核山藥茴香續斷萆薢獨活破故紙妊娠心腹脹滿者可服加減蒼公下氣湯白芍陳皮茯苓大腹皮川芎當歸香附紫蘇梗前胡厚朴烏藥木香上銼一劑空心服妊娠數墮胎者是氣血不足腰痛甚者喜墮胎宜加減安胎飲黃耆甘草人參白朮艾葉當歸川芎熟地續斷茯苓白芍香附陳皮杜仲上銼水煎空心服妊娠羸瘦或挾病氣血枯竭既不能養胎必不能安者可下之加減牛膝湯桂心栝蔞牛膝瞿麥川芎歸梢枳殼甘草童便麥蘖甘草上銼水煎空心服妊娠日月未足而痛如欲産者因勞役怒氣調養不節或房室所傷或負重閃肭或因宿有冷氣故有此證可用加減安胎飲知母杜仲木香續斷香附陳皮烏藥紫蘇白芍川芎當歸白朮酒芩見血加地榆牡蠣艾葉妊娠咳嗽因感風寒傷於肺而成謂之子嗽可服加減紫菀湯止嗽安胎貝母前胡紫菀白朮桑白皮甘草黃芩紫蘇陳皮五味子知母杏仁赤苓當歸麻黃喘加兜苓腹皮款冬花妊娠傷寒頭疼壯熱腰痛體重甚至墮胎可服加減柴胡湯柴胡黃芩川芎乾葛當歸紫蘇蔥白陳皮妊娠時疫日久傷胎可急服加減秦艽散秦艽前胡黃芩枳殼桔梗山梔柴胡葛根紫蘇蔥白陳皮妊娠熱病必至損胎可服加減梔子五物湯安胎清熱葛根柴胡香薷石膏梔子前胡黃芩蔥白麥冬陳皮知母甘草妊娠熱病六七日後臟腑極熱熏蒸其胎致胎死腹中則胎冷不能自出但服黑神散暖其胎須臾即出何以知其胎死看産母舌青黑及胎冷者是也加減黑神散生地赤芍桂心歸梢蒲黃鹿角屑紅花白芷朴硝黑豆附米益母草又方用巴豆三粒萆麻子麝香貼臍中妊娠瘧疾熱極則損胎可服驅邪散香薷青皮柴胡黃芩川芎前胡砂仁藿香白朮烏梅紅棗人參妊娠霍亂乃陰陽清濁相干甚則傷胎可服加減白朮散香薷陳皮厚朴蒼朮烏藥砂仁藿香乾葛竹茹木瓜人參白朮茯苓甘草豬苓澤瀉如心胸煩悶加炒黃連升麻妊娠泄瀉冷熱不同乃飲食不節暑熱相乘可服人參白朮散四君平胃澤瀉豬苓歸身砂仁肉果木香香薷夏月可用妊娠下痢赤白可服加減阿膠散當歸川芎白芍阿膠黃芩黃連香薷陳皮枳殼甘草白茯澤瀉如血痢加地榆白痢加艾葉木香久痢虛人加參朮黃耆妊娠十月形體成就八月合進瘦胎易産之藥今醫多用枳殼散若胞氣肥實可服之況枳殼大腹皮瘦胎胎氣本怯豈宜又瘦之若進無憂散達生散安胎益氣令子緊小無病保生無憂散治滑胎當歸川芎白芍人參白朮甘草陳皮神麯麥芽紫蘇訶子枳殼達生散孕至八九個月服數帖甚好易産腹少痛當歸白芍白朮各一錢人參陳皮紫蘇各五分甘草炙三大腹皮一錢洗上銼一服蔥五根煎服如胎肥氣喘加枳殼八分黃楊腦七個二味瘦胎要藥夏加黃芩春加川芎冬加砂仁氣虛加參術氣實倍香附陳皮血虛倍當歸加熟地性急多怒加柴胡有熱加黃芩食少加砂仁神麯渴加麥門冬食易飢多加黃楊腦有痰加半夏黃芩腹痛加木香妊娠鬼胎狀如懷孕腹內如包一甕如下血或腸水物可服斬鬼丹吳茱萸川烏秦艽柴胡白殭蠶上為末煉蜜為丸如梧桐子大酒送下打出惡物即愈産育脈欲産之婦脈離經離經者離乎經常之謂也非難經一呼三至之比脈雖離經而腰不痛者未産也若腹連腰痛甚者即欲産也診其尺脈轉急如切繩轉珠者即産出之脈也證臨産之初宜脫平常所穿之衣以籠罩頭及罩口則易産切不可喧鬧宜選一善熟穩婆及得力家人無使揮霍張皇致令産婦驚恐惟當餐軟飯稀粥之類若腹中痛且令扶行或痛或止名曰弄痛不可使試水手探亦不可屈腰眠臥如連腰引痛眼中如見火光此是兒轉又須扶策徐徐行起若艱難即憑物立須臾直至腰腹相引頻頻陳痛難以行立然後坐草切勿太早恐兒在腹中難以轉側及胞漿先破子道乾澀皆至難産若心中熱悶可用生雞子一枚打破吞服抱腰之人不得傾斜則兒順自然産若臨事倉惶用力失宜遂有難産之恙是故有逆産者則先露足有橫生者則先露手坐産者則先露臂此皆用力太早之過夫當臍腹疼痛之初兒身才轉而未順用力一逼遂至橫逆若手足先露者用細針刺兒手足心一二分深三四刺之以鹽塗其上輕輕送入兒得其痛驚轉一縮即順生矣或兒腳先下者謂之踏蓮花生急以鹽塗兒腳底又可急搔之並以鹽擦母腹上則正生矣若産訖先飲童便一盞或入酒少許同服勿便睡且令閉目而坐頃之方可扶上床仰臥立膝勿令伸足熟睡宜頻喚醒亦不可以得男為喜喜則傷心恐生紅汗之證亦不可以得女為憂恐致敗血傷心之患宜常淬醋煙以防暈悶逡巡少進白粥母令過飽其有破水之後經日而不産者即當隨證細辨身重體熱作寒面黑舌青及舌上冷子母俱死面赤舌青母活子死面青舌赤口沫出者母死子活唇口俱青吐沫母子俱死倉卒之間不可不詳細審視預與病家言之若胞衣不下者停待少久非惟使産母疲倦是血流入胞中為血所脹上衝心胸喘急疼痛必致危殆宜急斷臍帶以物墜住尤宜用意拴縛然後截斷不爾則胞上掩心而死須臾其血不潮入胞中則胞衣自當痿縮而下縱淹延數日亦不致害人惟欲産母心懷舒暢則自下矣不可妄用手法因此致殂五七日不可強力下床或憂慮用性一月之內或傷於房事以致變生證候類此難治最宜謹慎外此有外感內傷及諸雜證與男子等但當加理血藥為助臨治之際宜以意消息之而參用焉方黃金散祕方批按此方催生聖藥如産月未足又能安之治生産一二日難分娩者服之如神因屢驗不敢自私廣以濟人人得之者亦弗自私庶施者愈廣矣真金箔大者五片小者七片以小瓷鍾將水少許去紙入金在內用指研勻後再添水至半鍾一面先令扶産婦虛坐又令一婦人用兩手將大指按定産母兩肩上肩井穴前藥溫服其胎即下如産月未足又能安之濟生湯治難産須一二日不産者宜服自然轉動降生當歸三錢川芎二錢香附一錢半炒枳殼三錢麩炒蘇葉八分大腹皮薑汁洗一錢半甘草七分加白芷一錢上銼一劑水煎腰痛甚服之即産自生飲雲林制批按此方活血順氣平和之劑治臨産生育艱難當歸三錢川芎二錢枳殼炒二錢益母草一錢白芷六分火麻炒去殼一錢上銼一劑水煎空心溫服催生立應散王柏泉傳治難産及橫生逆産車前子一兩當歸一兩冬葵子三錢牛膝二錢白芷三錢大腹皮二錢枳殼二錢川芎二錢白芍一錢上銼水煎熟入酒少許服之立産奪命丸治婦人小産下血至多子死腹中其人憎寒手指唇口爪甲青黑或胎上搶心則悶絶欲死冷汗自出喘滿不食或食毒物或誤服草藥動胎氣下血不止胎尚未損服之可安已損服之可下桃仁麩炒去皮尖赤芍官桂白茯苓牡丹皮各等分上為末蜜丸彈子大每一丸細嚼淡醋湯下速進兩丸至胎腐爛腹中危甚立可取出批按此法治難産屬熱者治難産瀝漿胞干胎不得下用香油蜂蜜各一碗和勻入銅鍋內慢火煎一二沸掠去沫調白滑石末一兩重攪勻頓服外以油蜜於母腹臍上下摩之降生散治臨産生育艱難痛陳尚疏三兩日不生或産母氣乏羡頓産道乾澀致令難産才覺腹痛但破水後便可服此藥即生矣如死胎亦下未經破水不宜服之蒼朮制二錢枳殼桔梗陳皮楊芍白芷川芎當歸各一錢肉桂乾薑厚朴半夏茯苓木香杏仁麻黃甘草各五分上為末每服二錢順流水溫暖送下若覺熱悶蜜湯調或銼散薑棗順流水煎服其楊芍肉桂能開通子宮飲藥助氣關竅自通麻黃內通陽氣甚則血行即産矣冬月用之甚為的當隆暑之時恐難輕服但以五苓散用葵子燈心煎湯調下香桂散治坐産澀滯心腹大痛死胎不能下者急用之香白芷三錢肉桂三錢麝香三分上為末童便酒調下即産催生丹批按此方治難産屬寒者治生理不順或橫或逆母丁香一錢另研香乳一錢另研麝香一字另研臘月兔腦去皮膜研如泥上為末以兔腦和為丸如雞頭實大辰砂一錢為衣陰乾油紙密封每服一丸溫水送下即産男左女右手握出其丸神效藥用瓷罐盛黃蠟封口催生符式生九天大力魔軍速降威靈攝天生急急如律令敕上用硃砂細研用新汲水濃調勻將新筆蘸硃砂於清晨未食時至誠念九天大力魔軍速降威靈攝天生急急如律令敕至生字急寫生字卻於生字下面一畫下左繞匝心想胎元被筆推轉令急急如律令敕氣一筆推下須是隨筆一句念令筆咒俱盡候乾剪下折作一丸用黃蠟丸之硃砂為衣濃煎木香湯送下待痛頻時服乳香湯亦可如神丹治難産兼胞衣不大及死胎巴三萆七脫衣裳細研如泥入麝香捏作餅兒臍下貼須臾母子便分張灸法治難産及胞衣不下於左腳小指尖頭上即至陰穴灸之炷如小麥大三五壯立産催生遇仙丹硃砂一錢半雄黃一錢半蛇蛻一尺煅萆麻子十四粒上為末粥糊為丸如彈子大臨産先用椒水洗淨臍穴納藥一丸於臍中仍用油紙數重覆藥上封固軟帛拴系立效脫衣散治胞衣不下牛膝三錢歸尾二錢木通三錢滑石四錢冬葵子二錢半加枳殼三錢上銼水煎溫服有胞衣不下因産母元氣虛薄者用芎歸倍桂以溫之自下一方下死胎平胃散一劑水酒各一碗煎一二沸入朴硝五錢再煎傾出候溫服其胎化為水而下一方治坐草三四日不下者即刻下蜜香油好酒各一鍾三味合入煎産婦面東服一方治橫逆不順子死腹中伏龍肝為細末溫酒調服二三錢其兒帶土而下一方催生下胎魚膠七寸麻油燈燒過為末酒調服産後脈産後扶虛消瘀血脈卻宜虛叔和云新産之脈緩滑吉實大弦急死來侵寸口焱疾不調死沉細附骨不絶生證夫婦人産後發熱有去血過多者有惡露不盡者有傷飲食者有感風寒者有感冒夾食兼氣者有三日蒸乳者俱能發熱憎寒並身疼腹痛不可相類而藥也治産後去血過多發熱者脈必虛大無力內無痛者此非有餘之熱也乃陰虛不足生熱用四物湯去芍藥加參朮茯苓淡滲其熱若大熱不退加炒黑乾薑神效乾薑辛熱能引血藥入血分生新血引氣藥入氣分補氣或只用芎歸調血飲尤妙凡有傷力發熱早起勞動發熱者皆同此治法也一産後惡露不盡亦有發熱惡寒必脅肋脹滿連大小腹有塊作痛名兒枕痛産後腹痛血瘀宜四物湯加五靈脂牡丹皮桃仁紅花玄胡索香附青皮乾薑官桂酒水各一錢黑豆一撮後磨木香入童便薑汁服取下惡物為效或用黑神散尤妙後以八物湯加乾薑陳皮少佐童便炒香附調理一産後脾胃虛弱飲食少難克化以致停滯發熱必有噫氣作酸惡聞食臭而口出無味胸膈飽悶氣口脈必緊盛發熱惡寒頭痛必用治中湯加神麯山楂砂仁炒黃連川芎當歸佐之或用理脾散更效一産後榮衛俱虛腠理不密若冒風發熱者其脈浮而微或自汗以芎芷香蘇散加羌活防風主之如感寒者脈弦而緊或惡露缺通以五積散主之如風寒兩感者脈浮而緊以五積交加散主之有汗去麻黃邪勝去人參一産後內傷飲食而外感風寒或兼氣惱而發熱者人迎氣口脈俱緊盛以行氣香蘇散主之一産後蒸乳發熱惡寒者必乳間脹硬疼痛令産母揉乳汁通其熱自除不藥而愈一産後血暈者其由有三有用心使力過多而暈者有下血多而暈者有下血少而暈者其暈雖同其治特異若下血多而暈者當補血以芎歸湯為主或惡露不止者倍炒黑乾薑止之若去血少而暈者奪命散主之但凡血暈不省人事用大火炭置産婦旁以醋沃之使醋氣熏入病人口鼻輕者立蘇重者亦省人事矣一凡新産之後宜以五積散祛除敗血補生新血調和營衛滋養臟腑使陰陽不相勝負邪氣不能相干則無寒熱之患又治新産氣虛或外感寒邪頭疼身痛發熱惡寒或但發熱者並用米醋少許同煎本方去麻黃熱甚加黃芩一産後中風口噤乃血虛而風入於頰口筋得風則急故口噤也若角弓反張乃體虛而風入於諸陽之經故獨腰背攣急如角弓反張之狀也四物湯加秦艽羌活又宜荊芥略炒為末每服二錢黑豆淋酒調下童便亦可又方用當歸荊芥各等分水一盞酒少許煎七分灌之如口噤用匙斡開微微灌下但下咽即效一産後發熱惡寒或口眼喎斜等證皆是血虛之甚急宜大補氣血為主若左手脈不足補血藥多於補氣藥右手脈不足補氣藥多於補血藥一産後失聲言不出者心肺二竅被血所侵又感風邪客於會厭故也茯苓補心湯去陳皮枳殼川芎加升麻防風薄荷赤芍當歸生地紅花黃連膽星生薑煎服一産後不語因敗血迷心竅所致宜四物湯加辰砂石菖蒲紅花人參一産後血塊築痛蓋因坐草近地為冷濕乘之風邪干之使敗血瘀凝為血塊沖築硬痛不換金正氣散加辣桂川芎白芷莪朮乾薑同煎乘熱入醋連進兩服冷濕風邪一散其塊自消其瘀從大便而出一産後困子死經斷不行半載矣一日小腹忽痛陰戶內如有石硬塞之而痛不禁此乃石瘕也四物湯加桃仁大黃檳榔三稜玄胡索澤瀉血竭水煎服一産後血虛發熱咳嗽吐痰喘滿心慌口乾宜用茯苓補心湯加麥門冬五味子煎服一産後子宮不閉補中益氣湯加白芍醋炒香附半夏酒炒黃芩熱不退加酒柏一方用石灰煎湯熏一方用荊芥藿香臭椿皮煎湯熏洗方芎歸調血飲西園公方治産後一切諸病氣血虛損脾胃怯弱或惡露不行或去血過多或飲食失節或怒氣相沖以致發熱惡寒自汗口乾心煩喘急心腹疼痛脅肋脹滿頭暈眼花耳鳴口噤不語昏憒等證當歸川芎白朮白茯苓熟地陳皮香附童便炒烏藥乾薑炒黑益母草甘草牡丹皮上銼薑棗煎服如惡露不行倍益母草丹皮加童便黃酒同服如去血過多倍芎歸乾薑如飲食停滯胸膈飽悶加枳實厚朴山楂砂仁如因氣惱倍香附烏藥如口噤昏憒不語加荊介如兩脅痛加青皮肉桂如小腹陳痛加玄胡索桃仁紅花蘇木甚者加三稜莪朮如有汗加黃耆如口乾苦加麥門冬凡産後即以童便和熱酒隨意飲之百病不生益母湯魏憲副傳治産後惡露不盡攻衝心腹或作眩暈或寒熱交攻益母草銼一大劑去渣入黃酒童便各一盞凡産後即用此加芎歸各二錢以免腹痛血暈之患大有補益去舊生新黑神散劉太府傳治産後敗血致諸疾者當歸熟地白芍酒炒肉桂去皮各一兩甘草炙黃一兩沉香棕灰燒存性蒲黃炒黑色沒藥各一錢乳香三錢赤芍一錢血竭五分上為細末每服二錢空心無灰好酒調下此方可代奪命散一將産血多兒食不盡余血裹胎難産服此棄子救母一臨産用力太早兒不及轉橫生倒出亦當急救母命服此方一子死腹中母必肢體冷痛口角出沫指甲青黑服此即出一産後胎衣不下一血暈眼花起坐不得一血迷心竅不能言語一敗血乘虛散流四肢浮腫一敗血為害口渴舌燥乍寒乍熱似瘧一月中飲冷敗血凝聚腹痛難忍或致瀉痢一敗血入心煩躁發狂言語錯亂或見鬼神如癲一敗血停留肢節間遍身疼痛一敗血流入小腸小便出血一敗血結聚小便閉澀大便艱難一惡露未盡失而不治又過酸鹹收斂之物因而得崩漏一肺敗鼻中氣黑一敗血衝心喉中氣急發喘一敗血滯脾胃中心腹脹滿嘔吐似翻胃更生散雲林制治産後去血過多或不止或眩暈眼暗口噤發熱憎寒人參一兩當歸一兩川芎五錢荊芥穗三錢乾薑炒黑三錢熟地薑汁炒一兩上銼水煎空心服如血大下不止用龍骨火煅赤石脂火煅各等分為末每二錢用前藥調服外以五倍子末津調納臍中即止抽薪散劉太府傳批按此方治産後去血過多者治産後血虛發熱熟地四錢當歸四錢乾薑炒黑一錢上銼一劑水煎服兒枕散賈蘭峰傳治産後心腹痛惡血不行或兒枕作痛甚危當歸三錢白芍酒炒三錢川芎二錢白芷官桂蒲黃牡丹皮玄胡索五靈脂沒藥各一錢上銼一劑水煎入童便空心服通瘀飲胡云閣傳批按此方治産後惡露不行者治産後惡露不通心慌昏沉寒熱交攻歸尾三錢大黃三錢白朮一錢木通一錢紅花五分上水一碗黃酒一小盞煎三滾用桃仁三十個搗爛再煎二滾去渣溫服和痛湯批按此方治産後心腹痛者治小産心腹痛當歸川芎白芍酒炒熟地各一錢玄胡索七分香附五分青皮炒五分桃仁去皮三分紅花三分澤瀉五分上銼一劑水一鍾童便黃酒各半鍾煎至一鍾溫服奪命丹祕方治産後胞衣不下者因血流入衣中為血所脹是以不下上衝心胸但去衣血自下附子五錢炮去皮尖丹皮去骨一兩大黃一兩乾漆炒令煙盡三兩上為末米醋一升熬成膏和丸如梧桐子大每服五六十丸溫湯下清魂散崑山鄭氏方治産後血暈者由敗血流入肺經頭旋目眩昏悶不省血暈有三有用力過多血暈者有下血過多血暈者有小産去血太過血暈者俱可服之澤蘭葉荊芥各一錢川芎八分人參五分甘草三分陳皮七分香附醋炒七分白芷五分益母草一錢當歸八分生地八分丹皮五分紅花三分蒲黃炒黑七分上銼一劑水一鍾半煎至七分濾去渣入童便半鍾溫服加減磁石散崑山鄭氏祕方治産後子宮不收者名瘣疾皆用力過度有痛不可忍服之磁石歸尾白芷蛇床子赤芍藥丹皮發灰荊芥穗川芎生地陳皮甘草七日後去白芷赤芍歸梢加熟地當歸白芍人參黃耆上水煎空心服外用熏洗方椿皮荊芥五倍子蛇床子蔥白頭朴硝藿香上各等分同煎洗過將鐵鏽釘磨水塗上即收理脾湯治産後停食胸膈飽悶身發寒熱不思飲食蒼朮米泔浸炒陳皮各一錢厚朴姜炒錢半砂仁七分炒神麯炒一錢山楂去核一錢麥芽炒一錢乾薑炒黑八分甘草炙三分上銼一劑生薑三片煎服泄瀉加白朮茯苓大便閉加桃仁紅花小便閉澀加大腹皮加味理中丸批按此方治産後食傷脾胃者治脾胃虛憊飲食不進嘔吐泄瀉心腹疼痛體虛有汗胎前産後俱宜服之人參白朮土炒乾薑湯泡炒黑神麯炒各一兩麥芽炒砂仁炒各八錢陳皮去白一兩香附醋炒一兩甘草炙六錢上為末神麯打糊為丸如梧桐子大每服八十丸空心米湯送下推氣養血丸雲林制治産後右脅膨脹有塊如豎弦一條著冷便疼當歸酒洗川芎白芍酒炒白朮土炒陳皮炒枳實麩炒厚朴薑汁炒青皮香油炒去穰烏藥神麯炒乾薑炒黑白芥子炒各一兩香附四兩便炒麥芽炒肉桂各六錢三稜醋炒八錢莪朮醋炒八錢木香二錢上為細末酒糊為丸如梧桐子大每服百丸空心米湯送下養血佐肝丸雲林制批按此方治産後積塊者治産後左脅脹滿一塊臥不敢著床當歸酒洗南芎白芍酒炒陳皮去白半夏香油炒白朮去蘆炒神麯炒青皮香油炒去穰萊蔔子炒牡丹皮酒洗紅花各一兩香附二兩醋浸炒桃仁去皮尖柴胡各八錢白茯苓一兩龍膽草酒洗六錢三稜莪朮各醋炒五錢上為細末酒糊為丸如梧桐子大每服百丸白湯送下增損柴胡湯治産後虛弱寒熱如瘧食少腹脹柴胡人參甘草半夏炒陳皮川芎白芍炒各等分上每服五錢水薑棗同煎日二服加減養臟湯治産後下痢赤白裡急後重木香黃連厚朴甘草歸尾赤芍川芎艾葉蒲黃七日後去蒲黃歸梢加茯苓歸身枳殼如久痢脫肛加肉豆蔻地榆人參阿膠白朮噤口不食加山藥石蓮肉陳包米胃寒嘔噦腹痛甚者去黃連加乾薑灸法治婦人雞爪風因月家得此不時舉發手足攣束如雞爪狀疼痛難伸於左右膝骨兩旁各有一小窩共四穴俗謂之鬼眼各灸三壯即愈乳病證婦人乳汁不通有二種有血氣壅盛乳脈澀而不行者有血氣虛弱乳脈絶少者夫虛者補之以鍾乳粉豬蹄鯽魚之類盛者行之用通草漏蘆之類乳硬者多因乳母不知調養所致蓋乳房陽明之經乳頭厥陰所屬忿怒所逆鬱悶所遏厚味所釀以成厥陰之氣不行故竅閉而汁不通陽明之血沸騰故熱甚而化為膿或因所乳之子膈有滯痰含乳而睡口氣炊熱所致而成結核初便忍疼揉令核軟吮令汁透則散否則結成矣治治以青皮疏厥陰之滯石膏清陽明之熱生甘草行汙濁之血栝蔞子消導腫毒或加沒藥青橘葉皂角刺金銀花當歸尾或散或湯須以少酒佐之若加艾火三壯於痛處灸之尤妙華元化灸三里穴三壯甚妙乳岩始有核腫如棋子之大不痛不癢五七年方成瘡初便宜多服疏氣行血須情思如意則可愈如成瘡之後則如巖穴之凹或如人口之唇赤汁濃水浸淫胸脅氣攻疼痛用五灰膏去其蠹肉生新血漸漸收斂此疾多生於憂鬱積忿中年婦人未破者尚可治成瘡者終不治宜服十六味流氣飲方通乳湯豬蹄下節四雙通草二兩川芎一兩穿山甲十四片炒甘草一錢上用水五升煮汁飲之忌生冷避風寒夜臥不宜失蓋更以蔥湯頻洗乳房玉露飲治産後乳脈不行身體壯熱疼痛頭目昏痛此涼膈壓熱下乳之劑也當歸一錢五分川芎五錢白芍一錢五分人參二錢五分白芷五錢白茯二錢五分桔梗炒五錢甘草二錢五分上銼水煎服如煩熱甚大便結加大黃一錢二分金銀花三錢乳脈不行結成痛腫疼痛加黃耆當歸金銀花甘草各二錢半入酒半鍾食後溫服胡桃散治婦人少乳乳汁不行用胡桃仁去皮十個搗爛入穿山甲炒末一錢黃酒調服通草湯治乳汁不通通草七分瞿麥柴胡天花粉各一錢桔梗二錢木通青皮香白芷赤芍連翹甘草各五分上銼一劑水煎細飲更摩乳房連翹飲子薛立齊傳治乳內結核連翅川芎栝蔞仁研皂角刺炒橘葉青皮去白甘草節桃仁各一錢半上水煎食遠服最效散劉柏亭傳治婦人吹乳神效螃蟹去足用蓋燒存性為末每服二錢黃酒下尉法膏祕方治吹乳乳癰頓時立消蔥連根搗爛鋪乳患處上用瓦罐盛灰火蓋蔥上一時蒸熱出汗即愈一方劉前溪傳治吹乳腫痛不可忍用生山藥搗爛敷上即消消即去之遲則肉腐消毒散批按此方治吹乳乳癰之劑治吹乳乳癰憎寒壯熱頭痛者先服人參敗毒一二劑方可服此藥如無前證即服本方二三劑或腫不消宜服托裡藥當歸白芷青皮炒天花粉貝母柴胡殭蠶炒金銀花各三錢上銼一劑水煎服神效栝蔞散薛五齊方治乳癰初起腫痛及一切癰疽或膿出後餘毒亦宜用之黃栝蔞一個用子多者當歸半兩生甘草半兩沒藥一錢另研上酒水各一鍾煎至八分食後服十六味流氣散治乳岩及痘後餘毒作癰腫當歸川芎白芍黃耆人參官桂厚朴桔梗枳殼烏藥木香檳榔白芷防風紫蘇甘草上銼各等分水煎服如乳癰加青皮尤妙
