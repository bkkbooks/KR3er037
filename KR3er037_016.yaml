body:
  text: 卷之十六杖瘡治一杖畢即飲童便和酒免血攻心用熱豆腐鋪在杖紫色處其氣如蒸其腐即紫復易之須得紫色散盡轉淡紅為度或只用蔥切爛炒焦搭患處冷則再易以血散為度又法用鳳仙花科連根帶葉搗爛塗患處如干又塗一夜血散即愈如冬月無鮮者秋間收陰乾為末水和塗之一名金鳳花又法並打傷皮不破內損者用蘿蔔搗爛罨之又法用大黃末童便調敷之又法用豬膽汁塗之又法用真綠豆粉微炒雞子清刷之方化瘀散治杖打重血上攻心蘇木三錢紅花二錢歸尾三錢大黃二錢上共為末童便一鍾黃酒一鍾煎至一鍾熱服退血止痛散治杖後腫痛瘀血不散氣血攻心或憎寒壯熱歸尾赤芍藥生地白芷防風荊芥羌活連翹黃芩黃連黃柏大黃梔子薄荷枳殼桔梗知母石膏車前子甘草各等分上銼一劑水煎服八仙過海黃賓江傳治杖打極重血沁襠不治即死半夏薑汁炒巴豆霜當歸乳香沒藥硼砂血蠍土鱉倍用上各等分為細末每服八釐好酒送下金箔散劉文庵傳治杖打極重痛不可忍昏悶欲死者白蠟一兩生研乳香三錢沒藥三錢金箔二十帖銀箔二十帖上為末每服二錢溫酒調服補氣生血湯治杖後潰爛久不愈者人參白朮炒倍茯苓當歸芍藥熟地黃陳皮香附貝母桔梗甘草往來寒熱加柴胡地骨皮口乾加五味子麥門冬膿清加黃耆膿多加川芎肌肉遲生加白蘞肉桂杖瘡膏丁望海傳密陀僧四兩香油八兩上為末同入鍋內文武火熬用柳條數根一順勤攪不要住手待熬成黑色滴水成珠油紙攤貼患處當時疼止拘流膿水自然生肉如有疔甲貼藥即止又治頑瘡大泡臁瘡神效不二膏吳應峰傳大黃一兩黃柏一兩黃連一兩乳香一錢沒藥一錢輕粉一錢血蠍二錢孩兒茶二錢片腦二分水銀三錢用官粉三分吐涎以銀磨上為末合和以豬脂四兩煉去渣入黃蠟一兩再煎濾過入藥柳條攪勻隨瘡大小攤紙貼之白龍膏陳儀賓傳治杖瘡及遠年近日一切頑瘡黃蠟二兩黃香二兩為末去黑渣不用香油三兩頓溫乳香末五分沒藥末五分上先將蠟入瓷碗內慢火化開用箸敲碗邊續續入黃香乳沒取碗離火入溫香油於內攪勻待冷入水缸內去火毒三日取出油單紙攤藥貼患處立效鬼代丹乳香沒藥自然銅火煅醋淬木鱉子去殼無名異地龍去土各等分上為末煉蜜丸如彈子大每服一丸溫酒下打著不痛寄杖散王少泉傳用白蠟一兩細細切爛滾酒淬入碗內服之打著不痛折傷脈打撲傷損去血過多脈當虛細若得急疾大數者風熱乘之必死如從高墜下內有瘀血腹脹滿其脈堅強者生小弱者死病折傷者謂其有所損傷於身體也或為刀斧所傷或墜墮險地或撲身體損傷筋骨皮肉皆能使出血不止或瘀血停積於臟腑結而不散去之不早則有入腹攻心之患治治療之法當視其所損輕重若血不止者外宜敷貼之藥內宜和散之劑血蓄於內者宜下去之然後調理必以順氣活血止痛和經使無留滯氣血之患此其要也大凡打撲傷損墜墮或刀斧所傷皮未破而內損者必有瘀血停積先宜逐去瘀血然後和血止痛若肌肉破而亡血過多者宜調氣養血帶補脾胃為主如腹痛者乃瘀血也宜桃仁承氣湯加當歸紅花蘇木入童便和酒煎服方通導散治跌撲傷損極重大小便不通乃瘀血不散肚腹膨脹上攻心腹悶亂至死者先服此藥打下瘀血然後方可服補損藥大黃芒硝枳殼各四兩厚朴當歸陳皮木通紅花蘇木甘草各二兩上銼一兩水煎服雞鳴散治從高墜下及木石所壓凡是傷損血瘀凝積痛不可忍此藥推陳致新大黃酒蒸一兩歸尾五錢桃仁去皮尖七粒上銼酒煎雞鳴時服取下瘀血即愈活血止痛散治打撲損傷膜落馬墜車一切疼痛乳香沒藥赤芍白芷川芎各一兩當歸生地黃牡丹皮各二兩甘草五錢上為末每服三錢溫酒入童便調下防風通聖散方見中風批按此方治打撲傷損先逐去瘀血之劑治打撲傷損肢節疼痛腹中惡血不下依本方倍大黃當歸煎熟調入乳香沒藥末各二錢續骨丹楊接骨傳乳香沒藥孩兒茶繭殼燒灰各等分上為末每服二錢接骨黃酒送下欲下血燒酒送下接骨散吳兩洲傳接骨續筋活血止痛當歸五錢官粉煅五分硼砂二錢上為末每服二錢蘇木湯調服頻服蘇木湯損在腰以上先吃淡粥半碗然後服藥在腰以下即先服而後食別作糯米粥入藥末拌和攤紙上或絹上封裹傷處如骨碎用竹木夾定或衣物包之接骨神方張白峰傳土鱉一合炒乾半夏巴豆霜各等分上為細末每服一二分黃酒服下仙人散黃賓江傳接骨止痛土鱉十個焙乾一錢土狗八個焙乾一錢仙人骨即人骨三分巴豆去油三分上共為末每服先一錢次服五分二服後去巴豆又服二次五分又加巴豆一服俱用燒酒下接骨紫金丹劉兩河傳治跌打損傷骨折破傷瘀血攻心發熱昏暈不省人事硼砂乳香沒藥血蠍大黃歸尾骨碎補自然銅醋淬土鱉焙乾去足各一錢上為末瓷器收之每服八釐好熱酒調服其骨自接上如有瘀血自下吐血等病經事不調俱用酒下補損接骨仙丹劉前岡傳治打撲傷損骨折筋斷皮破肉爛疼痛不可忍當歸川芎白芍生地黃破故紙木香五靈脂地骨皮防風各五錢乳香沒藥血蠍各一錢上銼一處用夜合花樹根皮五錢同入大酒壺內入燒酒於內重湯煮一炷香為度取出服之接骨神丹半夏一個對土鰲一個二味一處搗爛鍋內炒黃色稱一兩自然銅二錢古銅錢三錢二味銅俱用火燒紅入醋淬七次乳香五錢沒藥五錢骨碎補七錢去毛上為極細末每服三分用導滯散二錢攪勻熱酒調服藥行患處疼即止次日再進一服藥末三分導滯散五分重者三服輕者一二服即愈導滯散治跌打傷重腹內有血大黃三錢當歸一錢上為末酒一碗煎服大便出血即愈許昌寧接骨丹當歸川芎白芍人參減半官桂青皮陳皮麻黃蒼朮丁香青木香乳香沒藥沉香減半血蠍減半兒茶甘草各一錢為細末每服三錢好酒調服忌蔥蒜綠豆神仙換骨丹批按此方續筋接骨之劑千金不易仙方乃異人所授不可輕視菟絲子酒製五錢破故紙酒炒二錢半金鈴子酒蒸去核五錢川續斷五錢葫蘆巴酒炒五錢遠志甘草水泡去心五錢五味子二錢半鹿茸酥炙二錢半龜板酥炙五錢甘松五錢杜仲酒和薑汁炒五錢三柰二錢半益智仁炒五錢柏子仁炒五錢防風去蘆五錢杏仁去皮尖五錢木通五錢滑石酥炙五錢三稜煨二錢半莪朮煨五錢韭子一錢半地骨皮五錢五加皮五錢何首烏二錢半牡丹皮五錢青藤五錢石楠藤五錢紫金皮一錢半木賊五錢海桐皮五錢紅豆五錢白蒺藜炒五錢半乳香二錢半沒藥五錢龍骨煅三錢虎脛骨酥炙五錢血蠍二錢半硃砂一錢半麝香一錢三分自然銅煅三錢黃耆蜜炙五錢人參五錢白朮二錢半粟殼去穰秸炒五錢川芎五錢赤芍五錢白芍五錢紅內消二錢半熟地黃酒蒸茯苓各二錢半茯神二錢半蒼朮米泔浸五錢陳皮五錢烏藥二錢半香附五錢當歸酒洗二錢半枳殼五錢枳實五錢白芷五錢厚朴薑汁炒二半錢麻黃二錢半吳茱萸五錢大茴二錢半小茴酒炒二錢半荊芥五錢羌活五錢獨活五錢牛膝酒洗五錢木瓜五錢半夏薑製五錢南星薑製五錢殭蠶炒五錢全蠍酒洗二錢半天麻二錢半細辛二錢半藿香五錢乾薑五錢良薑五錢川烏姜炒二錢半巴戟去心五錢青鹽二錢半肉桂五錢附子姜炒二錢半連翹五錢桔梗五錢青皮五錢天雄姜炒二錢半草果二錢半丁香三錢半砂仁五錢肉蓯蓉酒洗五錢肉豆蔻去油二錢半白豆蔻二錢半木香二錢半甘草蜜炙二錢半上為末每用二錢好酒研入生薑調服用雞子壓之用被蓋出汗如傷損腫痛用生薑蔥白生地黃各五錢紅糟一碗研搗取汁入香油一碗和勻將木梳烘熱蘸藥末放傷處即服前藥凡一切虛損疼痛百發百中蔥搭法治打撲傷損腫痛蔥頭切爛炒焦搭患處冷則再易止痛消腫散瘀將軍膏朱同知傳治傷損腫痛不消瘀血流注紫黑或傷臉上青黑大黃為末生薑汁調敷患處守田膏治打撲有傷瘀血流注半夏為末調敷傷處一宿不見痕跡二生膏盧誠齊傳治跌損手足生地黃鮮者一斤生薑四兩上搗爛入糟一斤同炒勻乘熱以布裹罨傷處冷即易之先能止痛後整骨大有神效金瘡治一人騎馬跌僕被所佩鎖匙傷破陰囊二丸脫落得筋膜懸系未斷痛苦無任諸醫措手或以線縫其囊外加敷貼生肌止痛不三五日線爛而復脫矣予思常治刀傷出血但敷壁錢而效敏蓋此亦傷破之類也是以令人慢慢托上多取壁錢敷貼其傷破之處日漸安其囊如故方金槍散張壽山傳治一切刀割破打破跌破出血不止破開口不合用此止血生肌住痛立效銀末血蠍發灰人指甲燒存性珍珠燒存性各等分上為細末研勻摻患處軍中一捻金端午日製並治狗咬礦石灰不拘多少炒研生韭菜連根同搗作餅陰乾為末摻之止血生肌甚效金槍丹周梅江傳生肌住痛止血嫩老鼠未生毛者不拘多少韭菜根與老鼠一般多石臼搗爛入嫩石灰末於內摻干為餅為度陰乾用時以刀刮藥末敷傷處布包裹立已一捻金丹治金槍所傷並臁瘡及馬斷梁等瘡臘月黑牛膽一個裝入石灰四兩白礬一兩陰乾取出入黃丹炒一兩研末用之刀箭藥牛膽一個石灰不拘乳香少許血蠍少許白芨五錢為末上藥入牛膽窨干為末每用少許干貼制此不得犯婦人手破傷風脈表脈浮而無力太陽也脈長有力陽明也脈浮而弦小者少陽也河間曰太陽宜汗陽明宜下少陽宜和解病內經曰風者百病之始也清淨則腠理閉拒雖有大風苛毒而弗能為害也若夫破傷風證因事擊破皮肉往往視為尋常殊不知風邪乘虛而客襲之漸而變為惡候又諸瘡久不合口風邪亦能內襲或用湯淋洗或著艾焚灸其湯火之毒氣亦與破傷風邪無異其為證也皆能傳播經絡燒爍真氣是以寒熱間作甚則口噤目斜身體強直如角弓反張之狀死在旦夕誠可哀憫治法當同傷寒處治因其有在表在裡半表半裡三者之不同故不離乎汗下和三法也是故在表者汗之在裡者下之在半表半裡之間者宜和解之又不可過其法也方如聖散川烏草烏各三錢蒼朮細辛川芎白芷防風各一錢上為末每服五七分酒調服忌油膩暈腥面如癲狗咬加兩頭尖紅娘子各一錢中風身體麻木或走痛酒調下風旋頭暈酒調下頭風茶調下偏頭風口噙水搐鼻傷風熱茶調下出汗風牙蟲痛頻擦患處流涎金瘡血不止乾摻之惡瘡久不愈口噙水洗綿拭乾摻之犬咬蛇傷蠍螫口噙鹽水洗之仍敷上癰疽瘤魚睛紅絲發背腦疽等瘡發時新汲水調塗紙封再用酒調服湯火傷皮新汲水調雞翎刷上杖瘡有血干敷之瘰癧口噙水洗摻之乾溼疥瘡香油調搽定風散治破傷風及金刃傷打撲傷損並癲狗咬傷能定痛生肌天南星為防風所制服之不麻防風各等分上為細末破傷風以藥敷瘡口然後以溫酒調一錢服如牙關緊急角弓發張用藥二錢童便調下打傷欲死但心頭微溫以童便灌下二錢並進二服癲狗咬破先噙將水洗淨用絹試干貼藥更不再發無膿大有功效一字散治破傷風搐搦角弓反張蜈蚣去毒炒一條全蠍一對炒去毒並頭足上為細末如發時用一字擦牙縫內或吹鼻中脫凡散治破傷風五七日未愈已至角弓反張牙關緊急蟬蛻去頭足土淨五錢上為末用好酒一碗煎滾服之立蘇退風散治破傷風不省人事角弓反張防風一錢荊芥五分薄荷七分殭蠶炒五分天麻酒洗一錢白芷一錢麻黃一錢茯苓一錢當歸身一錢甘草炙五分上銼一劑生薑七片煎服羌活防風湯治破傷風初傳在表當歸川芎白芍防風羌活藁本細辛地榆甘草炙各一錢上銼一劑水煎熱服若大便閉加大黃熱加黃芩水調膏治初破傷風熱紅腫風斜欲將傳播經絡而未入深者用此杏仁去皮細研白麵各等分上和勻用新汲水調如膏敷患處腫消熱退灸法治破傷風及犬傷神效用核桃殼半個填稠人糞滿仍用槐白皮襯扣傷處用艾灸之若遍身汗出其人大困則愈遠年者將傷處前灸之亦己湯火傷治凡遇湯火所傷先以鹽末和米醋調和敷瘡上次以醋泥塗之仍用醋塗不絕暫救痛苦一面急搗爛生地黃醋調敷瘡上直候疼止須厚至數寸不妨事若一用冷水冷物冷泥熱氣得冷氣則卻深入搏爛人筋骨慎之慎之方保生救苦散治火燒湯蕩或熱油烙及脫肌肉者寒水石大黃黃柏各三錢上為末香油調塗患處或濕爛乾摻黑白散劉知府傳治湯蕩火燒傷百草霜輕粉減半上為末狗油調搽患處立愈一白散治湯蕩火燒破痛不可忍生白礬不拘多少香油調搽清煙膏李電川傳雞子清磨京墨塗患處上用三層濕紙蓋則不起泡冷如冰效一黃散劉嵩洛傳大黃末蜜水調搽治湯火咒云龍樹王如來授吾行持北方壬癸水禁火大法龍樹王如來吾是北方壬癸水收斬天下火星辰千里火星辰必降急急如律令咒畢即握真武印吹之即用少許水洗雖火燒手足成瘡亦可療蟲獸傷病凡春夏初交犬多發狂但見其尾直下不卷口中流涎舌黑者即是癲狗若被所傷不可視為泛常乃九死一生之患急用針刺去血以小便洗刮令淨用核桃殼半邊以人糞填滿掩其瘡孔著艾於殼上灸之殼焦糞干則易之灸灸之百壯次日又灸百壯灸之三五百壯為佳灸後用生南星防風等分為末再以口噙漿水洗淨傷處用綿試乾摻之更不作膿其內須服後藥以散其毒可也治孫真人曰春末夏初狗多發狂被其所傷者無出於艾灸其法只就咬處牙跡上灸之一日灸三壯直灸至一百二十日乃止常宜食炙韭菜永不再舉發亦良法也方溯源散治癲狗咬斑蝥七個去頭翅足為末溫酒調服於小便桶內見衣沫似狗形為效如無再須七次無狗形亦不再發後用益元散一兩水煎服解之忌飲酒食豬肉雞魚油膩百日終身忌食犬肉凡遇此患依前針洗艾灸再服此藥無不愈者扶危散周景陽傳治癲狗咬斑蝥七日內用七個七日外每日加一個百日百個去頭翅足令淨糯米同炒赤雄黃一錢滑石一兩麝香一分小兒不用亦可上為末能飲酒者時酒調服不飲酒者米飲下或從大小便出或吐出毒即愈以傷處去三寸灸之三壯永不再發神效治癲狗咬傷成破傷風者如聖散方見破傷風加兩頭尖紅娘子各一錢治狗咬方甘草杏仁嚼爛搭傷處用銀杏搗塗患處又宜蓖麻子五十粒去殼以井花水研成膏先以鹽水洗之敷上效雄靈散治毒蛇所傷昏悶欲死者雄黃五錢五靈脂一兩上為末每服二錢好酒調服乃敷患處良久再進一服即愈又宜雄黃青黛等分為末每二錢新汲水調服又宜白礬溶化滴傷處又宜蜈蚣一條去頭足炒川椒一錢去目略炒為末酒調服出汗即愈同生酒周梅江傳治毒蛇所傷至死扛板歸不拘多少其草四五月生九月見霜即收葉青如犁頭尖藤上有小茨子圓黑味酸用藤葉上取研爛用汁與生酒調服隨量飲之用渣貼患處立已渣若火燒仍痛海上方治蛇咬絲瓜根洗淨搗研生酒吃一醉立已又方用半邊蓮研酒服妙化丹劉彬齊傳治蠍螫蛇傷點眼即效端午制忌婦人雞犬見之沒藥乳香輕粉海螵蛸雄黃各五分硫黃二釐上為末左邊被傷點左眼大眥右邊點右神妙丸劉前溪傳治蠍螫端午日製忌婦人雞犬雄黃蟾酥膽礬半夏各等分麝香少許上為末用貓兒草搗汁和為丸用口嗒痛處令淨用丸藥揩擦六神散周東泉傳治蠍螫川烏草烏南星半夏白芷石菖蒲一寸九節者各等分上端午日取藥為末每用少許先以津液抹患處以藥擦之杖蠍螫法每年除夜左手拽起前裾右手執三尺長棍向門楣上敲三下唸咒云蠍蠍蜇蜇不向梁上走卻來這裡蜇一敲敲八節咒畢吸氣一口吹於杖頭復吸其氣吹於執杖手心如此三吹即已遇有蠍蜇以手摩之即不痛可用一年次年除夜又如法為之否則不驗中毒脈人遇事急智盡術窮或為人所陷始自服毒或誤中其毒其脈洪大者生微細者死又曰洪大而遲者生微細而數者死治大法甘草綠豆能解百毒又法不問一切諸毒急多灌香油無慮方解毒丹治中信毒若於飲食中得者易治酒中得者難治若在胸腹作楚可吐急用膽礬研水灌之即吐若在腹中可下後服此黃丹水粉青黛焰硝綠豆粉上為末以小藍挼水調下腹痛倍黃丹綠豆粉井花水調下秘方用苗竹成竿而未有葉者截筒留兩頭節去竹青置廁中經月不取遇有中信者旋取一個淨洗取筒內紅汁服之即解秘方青黛五兩綠豆一升去殼為粗末用苗竹筒一個兩頭留節去竹皮就節上取一孔入藥內仍以竹釘塞孔於端午日置廁中浸至次年端午日取出洗令淨懸屋脊上風吹日曬須盡一月餘內中自干劈破取出再曬研末以小藍自然汁調作丸彈子大每遇信毒以井花水磨一丸作一服灌之立解仍以烏梅枚研水二合以井水解飲良久瀉下即愈又法卒急無藥只用真香油灌之立解又法取稻稈燒灰新汲水淋汁濾過冷服一碗毒隨利下又方治信毒用臘月豬膽收起遇人中毒割開一個入水化開服之立解諸骨鯁方打諸骨鯁神符咒水此碗化為東洋大海咽喉化為萬丈龍潭九龍歸洞吾奉太上老君急急如律令敕吸東方生氣三口吹入碗中每行此法正面朝東用淨水大半碗放桌上左手執拳在胸前右手執劍訣於碗上書前符號假如魚骨鯁就書上電龍字除電鳳電虎二符勿書再書下八符余皆仿此咒水治諸鯁法李中原傳以淨器盛新汲水一盞捧之面東默唸云謹請太上東流順水急急如南方火帝律令敕一氣念七遍即吹一口氣入水中如此七次以水與患人飲立下或用咒水可以食針並竹刺神仙釣骨丹徐通府傳其骨自隨藥帶下或出如神硃砂一錢丁香一錢血蠍五錢磁石五錢龍骨五錢上共為末黃蠟三錢為丸硃砂為衣每服一丸香油煎好醋吞下如要吐用矮荷煎好醋吃後用濃茶任服如無矮荷用桐油代之矮荷即紅內銷其葉似荷樹葉其條細其樹矮短一方治諸骨鯁用人指甲燒存性吹入喉中立效一方用硼砂一塊噙之骨自下一方用金鳳花子嚼爛噙下無子用根亦可一方用韭白三根搗爛拈為丸如骨子大用綿纏裹線茶嚥下更哽處手牽線吐出原骨效一方用橄欖食下即化如無橄欖肉用核燒灰水調亦化一方治誤吞銅鐵或金銀等物不能化者砂仁濃煎湯服之其物自下誤吞田螺鯁喉不下死在須臾歸石塘傳用鴨一雙以水灌入口中少頃將鴨倒懸令吐出涎水與患人服之其螺即化救荒方養元闢殼丹京傳安五臟消百病和脾胃補虛損固元氣實精髓助脾健胃瘦者令肥老者健常服極妙黃犍牛肉十五斤去筋膜切作棋子大片用河水洗數遍令血水淨再用河水浸一宿次日再洗二三遍清水為度用無灰好酒煮一夜桑柴文武火用砂罐煮取出焙乾黃色者佳黑焦不用每牛肉末一斤加入後藥二斤山藥八兩用蔥鹽炒山藥黃色去蔥鹽不用蓮肉八兩去心皮白茯苓去皮筋膜為末水飛過八兩莢實肉取粉八兩白朮八兩油者不用炒薏苡仁八兩炒白扁豆八兩去殼薑汁炒人參去蘆四兩小茴香炒四兩乾薑炒二兩砂仁炒二兩青鹽四兩川椒去目炒二兩甘草炙四兩烏梅肉二兩熬濃汁半碗粳米洗淨炒黃六斤上為細末與米粉牛肉末和勻用小紅棗五斤醇酒五斤煮棗極爛去皮核搗膏加煉蜜二斤半共和為丸如彈子大每次二丸不拘冷熱茶湯嚼下一日服二三次永不飢按是方實王道之妙用平時預合荒亂之時可以避難濟飢雖一兩月不食不損胃道不傷元氣久服成陸池之仙寶之寶之如渴或用冷水長生不老丹京傳白茯苓去皮定粉黃丹白松脂白沙蜜黃蠟各二兩硃砂三錢金箔二十片水銀三錢先將蜜蠟松脂於瓷碗內溶為汁傾藥在內以木匙摽勻候溫就火丸如指頭大用水銀為衣有死水銀法先洗手淨用水銀三兩默在手心內以指頭研如泥見手心青色將藥三五丸搓揉後以金箔約量攤碗內以藥丸在內搖動使金箔都在藥上密器收貯服時用乳香末五分水三盞煎湯溫送下不嚼破服後第三日覺飢以面和白茯苓末烙成煎餅食半以後藥在丹田永不飢渴久則交過五臟陰滓俱蓋長生不老諸人得服並無所忌使添氣力悅容顏身體輕健百病皆除拯貧救苦實濟世之良方長生之妙法其間若欲飲食俱不妨事但七日之內吃食藥必隨下至半月藥在丹田永不出矣服時面東持藥唸咒一遍吹在藥上如此七遍畢以乳香湯送下天清地寧至神至靈三皇助我六甲護形去除百病使我長生清清淨淨心為甲庚左招南鬥右招七星吾今立化與天齊生吾奉太上老君急急如律令膏藥方金不換神仙膏杜進士傳專治男婦小兒不分遠年近日五勞七傷咳嗽痰喘氣急左癱右瘓手足麻木遍身筋骨疼痛腰腳軟弱偏正頭風心氣疼痛小腸疝氣偏墜跌打傷損寒濕腳氣虛痢腳氣痞塊男子遺精白濁婦人赤白帶下月經不調血崩兼治無名腫毒瘰癧臁瘡楊梅頑瘡誤服輕粉致傷筋骨疼痛變為惡毒腫爛成瘡大如盤或流黃水或流膿血遍身臭爛不能動履者貼此膏藥除根永不再發川芎白芷生芐熟芐當歸白朮蒼朮陳皮香附枳殼烏藥半夏青皮白芷細辛知母貝母杏仁桑白皮黃連黃芩黃柏梔子大黃柴胡薄荷赤芍木通桃仁玄參豬苓澤瀉桔梗前胡升麻麻黃牛膝杜仲山藥遠志續斷良薑何首烏甘草連翹藁本茵陳地榆防風荊芥羌活獨活金銀花白蒺藜苦參殭蠶天麻南星川烏草烏威靈仙白蘚皮五加皮青楓藤益母草兩頭尖五倍子大楓子巴豆穿山甲芫花蜈蚣二十條蒼耳頭七個桃柳榆槐桑楝楮枝各三十上藥共七十二味每味用五錢各要切為粗片用真芝麻油十二斤浸藥在內夏浸三日冬浸半月方可煎藥黑枯色為度用麻布一片濾去渣將油再稱如有十數斤加飛過黃丹五斤如油有八斤加黃丹四斤依數下丹決無差矣將油再下鍋熬黃丹徐徐的投下手中用槐柳棍不住的攪火先文後武熬成滴在水中成珠不散春夏硬秋冬軟此是口訣瓷器內貯之臨用時加細藥乳香沒藥血蠍輕粉朝腦即樟腦片腦麝香龍骨海螵蛸赤石脂上細藥十味研為細末瓷器內收貯臨攤膏藥摻上些須生肌止痛調血氣去風濕甚妙五勞七傷遍身筋骨疼痛腰腳軟弱貼兩膏肓穴兩腎俞穴兩三里穴痰喘氣急咳嗽貼肺俞穴花蓋穴膻中穴左癱右瘓手足麻木貼兩肩井穴兩曲池穴男子遺精白濁婦人赤白帶下月經不調血山崩漏貼兩陰交穴關元穴赤白痢疾貼丹田穴小腸氣疝氣貼膀胱穴瘧疾男子貼左臂女子貼右臂即止偏正頭風貼風門穴腰痛貼命門穴心氣疼痛貼中脘穴走氣貼兩章門穴寒濕腳氣貼兩三里穴一切無名腫毒癧瘡臁瘡楊梅頑瘡跌打傷損痞塊不必尋穴皆本病患處即愈追風透骨膏秘傳川烏草烏淮烏各一兩巴豆三兩去殼木鱉子三兩去殼歸尾一兩白蒺藜一兩松香三兩白芨二兩血餘一團槐柳枝各一握上各銼以桐油二斤浸藥一二日熬至眾藥黑色取出濾去渣再煎用密陀僧半斤研末漸漸入內柳條攪不住手滴水成珠不散為度傾入水中出火毒用綿紙攤貼患處神妙五枝膏壬中嵩傳川烏草烏防風白芷當歸熟地黃木鱉子去殼穿山甲大黃甘草各六錢槐桃柳椿楮各用枝一寸血餘一握上藥俱銼用香油一斤入藥於文武火煎至焦枯濾去渣將油再煎隨入黃丹炒見火星為度半