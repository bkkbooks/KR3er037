body:
  text: 卷之四中濕脈經云脈浮而緩濕在表也脈沉而緩濕在裡也或弦而緩或緩而浮皆風濕相搏也又曰或澀或細或緩或濡皆可得而斷證夫濕之為病所感不同有從外感而得之者有從內傷而得之者若居處卑濕之地與夫道途沖斥風雨或動作辛苦之人汗出沾衣皆濕從外感者也或恣飲酒漿醺酩多食柑橘瓜果之類皆濕從內傷也濕之中人入皮膚為頑麻入氣血為倦怠入肺為喘滿入脾為濕痰腫脹入肝為脅滿而肢節不利入腎則腰疼胯痛身如板夾腳如砂墜入腑則麻木不仁入臟則舒伸不得而肢體強硬又云濕本土氣火熱能生濕土故夏月則萬物濕潤秋涼則萬物乾燥濕病本不自生因熱而怫鬱不能宣行水道故脾滯而生濕也治因濕生痰故用二陳湯加羌活防風酒炒黃芩去風行濕蓋風能勝濕故也大抵宜發汗及利小便使上下分消其濕是其治也方獨活寄生湯批按此方補虛除濕之劑治腎氣虛弱坐臥濕地腰背拘急筋攣骨痛或當風取涼過度風邪流入腳膝為偏枯冷痹緩弱疼痛或腰痛牽引行步艱辛及白虎歷節風獨活一兩五錢桑寄生三兩如無以續斷代之當歸一兩五錢川芎一兩五錢白芍一兩五錢熟地黃一兩人參一兩去蘆茯苓一兩牛膝酒浸一兩杜仲酒炒一兩秦艽去蘆一兩細辛一兩防風去蘆一兩桂心一兩甘草炙三錢上銼每服一兩五錢加生薑三片水煎服婦人帶下作腰腿痛合平胃散加附子小茴香羌活勝濕湯治風濕相搏一身盡痛羌活七分獨活七分防風五分升麻五分柴胡五分藁本一錢蒼朮一錢川芎八分蔓荊子八分甘草五分上銼一劑水煎溫服升陽除濕湯治濕鬱在下此湯升以散之升麻一錢柴胡一錢防風一錢茯苓八分豬苓一錢澤瀉一錢蒼朮一錢陳皮八分上銼一劑加生薑一大片水煎服經驗白朮酒祕方治中濕遍身疼痛難以轉側白朮去蘆一兩上銼一劑無灰老酒一鍾半煎一鍾去渣溫服燥證脈燥脈澀而緊或浮而弦或芤而虛證經云諸澀枯涸幹徑皴揭皆屬於燥故燥氣在裡耗其津液則大便祕結消渴生焉血脈枯而氣亦滯也或過食辛辣厚味之物而助火邪伏於血中耗散真陰津液虧少燥結有時或風燥於表鍾於皮膚皮毛燥澀乾疥爪枯徑強緊急口噤善伸數欠或時惡寒筋惕而搐涎溢胸膈燥爍瘛瘲昏冒僵仆皆由陰血衰少不能制火火熾剋金金受邪則不能平木以致肝氣獨盛風邪內生而成此疾矣治治之之法以辛潤之以苦泄之因虛者滋陰養血因火者瀉火軟堅因風者消風散結此三者乃治燥證之大法也方四物湯治燥氣在裡津液枯涸便閉消渴等症當歸一錢五分白芍藥一錢川芎八分生地黃二錢加桃仁二錢大黃煨二錢上銼一劑水煎溫服通幽湯治燥熱內甚血液俱耗以致大便閉結當歸一錢五分熟地黃二錢升麻八分紅花一錢甘草一錢桃仁泥二錢上銼一劑水煎調檳榔末一錢下火證脈浮而洪數為虛火沉而實大為實火洪數見於左寸為心火見於右寸為肺火見於左關為肝火見於右關為脾火兩尺為腎與命門之火男子兩尺洪大者必主遺精陰火盛也病熱有火者可治洪大是也無火者難治沉細是也證君火者心火也可以濕伏可以水滅可以直折惟黃連之屬可以制之相火者龍火也不可以水濕折之當從其性而伏之惟黃柏之屬可以降之瀉火之法豈止此哉虛實多端不可不察以臟氣目之如黃連瀉心火黃芩瀉肺火芍藥瀉脾火石膏瀉胃火柴胡瀉肝火知母瀉腎火此皆苦寒之味能瀉有餘之火若飲食勞倦內傷元氣火不兩立為陽虛之病以甘溫之劑除之如黃耆人參甘草之屬若陰微陽強相火熾盛以乘陰位為血虛之病以甘寒之劑降之如當歸地黃之屬若心火亢極鬱熱內實為陽強之病以鹹冷之劑折之如大黃朴硝之屬若腎水受傷真陰失守為無根之火為陰虛之病以壯水之劑制之如生地黃玄參之屬若右腎命門火衰為陽脫之病以溫熱之劑濟之如附子乾薑之屬若胃虛過食冷物抑遇陽氣於脾土為火鬱之病以升散之劑發之如升麻乾葛柴胡防風之屬不明諸此類而求火之為病施治何所據依故於諸經集略其説以備方之用庶免實實虛虛之禍也治火熱之病黃連為主五臟皆有火平則治病則亂方書有君火相火龍火邪火之論其實一氣而已故丹溪云凡氣有餘便是火分為一類凡治本病略炒以從邪實火以朴硝湯假火酒虛火醋痰火薑汁俱浸透炒氣滯火以茱萸食積泄以黃土血疾癥瘕痛以乾漆俱以水拌同炒去茱萸黃土乾漆下焦伏火以鹽水浸透焙目疾以人乳浸蒸方涼膈散治諸般鬱熱退六經實火連翹一錢黃芩一錢山梔子一錢薄荷八分大黃一錢五分甘草八分芒硝一錢加桔梗八分上銼水煎入蜜一盞同服咽喉痛倍桔梗加荊芥酒毒加黃連乾葛名清心湯用白蜜竹葉同煎咳而嘔加半夏生薑衄血嘔血加當歸赤芍藥生地黃小便淋瀝加木通滑石茯苓風眩加防風川芎石膏斑疹加乾葛荊芥川芎赤芍藥防風桔梗咳嗽加桑白皮杏仁桔梗蘇子陽毒發斑加青黛當歸結胸心下滿加桔梗枳殼譫語發狂逾牆赴井皆陽熱極盛加黃連黃柏赤芍藥眼生翳赤澀流淚加菊花木賊生地黃黃連解毒湯治心火暴盛以此湯直折之黃連黃芩黃柏山梔仁俱不炒上銼一劑水煎服以此四味為丸名梔子金花丸實者可用硝黃冰水正治或君火轉甚者須用薑汁或酒製炒用則火自伏此寒因熱用之法也清火湯雲林制治五臟六腑及上中下三焦火熱連翹一錢梔子一錢炒玄明粉一錢如無以硝代之黃芩一錢酒炒黃連一錢酒炒桔梗一錢二分玄參一錢二分薄荷八分羌活酒洗八分防風六分貝母一錢獨活酒洗八分前胡八分柴胡八分天花粉一錢茯苓一錢川芎八分枳殼一錢甘草三分大黃酒蒸二錢酒毒加白粉葛一錢既濟解毒丸治諸經客熱及心腎二火熾焰黃連去毛黃芩去梗黃柏去皮山梔去殼知母去毛連翹去殼玄參去老根柴胡去毛各等分上為末煉蜜丸如桐子大每服燈心湯下百丸黑金丹云菜弟傳批按上方皆治實熱之劑其餘火證各求之本門治上焦邪熱咽喉腫痛及牙齒疼痛傷寒誤補大潮大熱聲啞不出胸膈作痛鼻衄吐紅痰壅火盛癲狂譫語一切實熱之症黃連黃芩黃柏山梔子連翹石膏澤瀉赤芍藥大黃枳殼薄荷牡丹皮玄參桔梗防風赤茯苓荊芥各等分上大合一劑水八碗煎七碗去渣入芒硝一斤於內化開澄去泥水將藥入鍋內煎至干須慢火剷起入新罐內上用新燈盞一個蓋住入水於盞內火煅候乾水三盞為度取出放地上去火毒研為細末入甘草末五分攪勻每服二錢茶清送下內傷脈古人以脈辨內外傷於人迎氣口人迎脈大於氣口為內傷氣口脈大於人迎為外傷此辨固是但其説有所未盡耳外感風寒皆有餘之症是從前客邪來也其病必見於左手左手主表乃行陽二十五度內傷飲食及飲食不節勞役所傷皆不足之症也必見於右手右手主裡乃行陰二十五度故外感寒邪則獨左寸人迎脈浮緊按之洪大緊者後甚於弦是足太陽寒水之脈按之洪大而有力中見於手少陰心火之脈丁與壬合內顯洪大乃傷寒脈也若外感風邪則人迎脈緩而大於氣口一倍病在少陽或二倍病在太陽三倍病在陽明內傷飲食則右寸氣口脈大於人迎一倍病在厥陰或兩倍病在少陰三倍病在太陰若飲食不節勞役過甚則心脈變見於氣口是心火刑肺其肝木挾心火之勢亦來薄肺經曰侮所不勝寡於畏者是也故氣口脈急大而數時一代而澀也澀者肺之本脈大者元氣不相接也脾胃不及之脈洪大而數者心肺刑肺脈也急者肝木挾心火而反克肺金也若不甚勞役惟右關脈大而數數中顯緩時一代也如飲食不節寒溫失所則先後關脈損弱甚則隱而不見惟內顯脾脈之大數微緩時一代也宿食不消則獨右關脈沉而滑經云脈滑者有宿食也證東垣曰甚哉陰陽之證不可不詳也偏觀內經中所説變化百病其源皆由喜怒過度飲食失節寒溫不適勞役所傷而然夫元氣穀氣榮氣衛氣生髮諸陽上升之氣此四者皆飲食入胃穀氣上行胃氣之異名其實一也既脾胃有傷則中氣不足中氣不足則六腑陽氣皆絶於外故經言五臟之氣已緩於外者是六腑之元氣病也氣傷臟乃病臟病形乃應是五臟六腑真氣皆不足也惟陰火獨旺上乘陽分故榮衛失守諸病生焉其中變化皆由中氣不足當補之證認作外感風寒有餘客邪之病重瀉其表使榮衛之氣外絶其死只在旬日之間所謂差之毫釐謬以千里可不詳辨乎且如外感則寒熱齊作而無間內傷則寒熱間作而不齊外感惡寒雖近烈火不除內傷惡寒得就溫暖即解外感惡風乃不禁一切風寒內傷惡風惟惡夫些少賊風外感症顯在鼻故鼻氣不利而擁盛有力內傷者不然內傷症顯在口故口不知味而腹中不和外感者無此外感則邪氣有餘發言壯厲且先輕而後重內傷則元氣不足出言懶怯且先重而後輕外感手背熱而手心不熱內傷則手心熱而手背不熱外感頭痛常常有之直須傳裡方罷內傷頭痛有時而作有時而止內外辨法大要如斯然有內傷而無外感有外感而無內傷者苟或內傷外感兼病而相挾者則從乎輕重以治之若顯內症多者則是內傷重而外感輕宜先補益而後散邪以補中益氣湯為主加散邪藥當以六經脈症參究各加本經藥治之若顯外症多者則是外感重而內傷輕宜先發散而後補益以辛涼等劑解散為君而以參朮茯苓芎歸等為臣使以此辨之則判然明矣治王安常曰夫飲食勞倦傷而內熱者乃陰火乘其坤土之位故內熱以及於胸中也內經有云勞者溫之損者溫之惟以溫藥以補元氣而瀉火邪蓋溫能除大熱耳故東垣立補中益氣湯加減以治之其惠也不其大哉然飲食所傷又當分別夫勞倦傷飲食傷雖與外感風寒暑濕有餘之症不同然飲食傷又與勞倦傷不同勞倦傷誠不足也飲食傷尤當於不足之中分其有餘不足也何也蓋飢餓不飲食與食太過雖皆是失節然必明其有兩者之分方盡其理節也者何無不及無太過之中道也夫飢餓不飲食者胃氣空虛此為不足以停滯言則有餘矣惟其不足故補益惟其有餘故消導亦有物滯氣傷必補益消導兼行者亦有物暫滯而氣不甚傷宜消導獨行不須補益者亦有既停滯不復自化不須消導但當補氣或亦不須補益者潔古枳朮丸東垣橘皮枳朮丸之類雖曰消導固有補益之意存乎其間耳其他如木香分氣丸枳實導氣丸大枳實丸之類雖無補益然施之於物暫滯氣不甚傷者豈不可哉但不宜視為通行之藥耳且所滯之物非枳實之力所能去者亦安可泥於消導而不知變乎故備急丸煮黃丸感應丸瓜蒂散等之推逐者潔古東垣亦未嘗委之而費用也故善將兵者攻亦當守亦當不善者則宜攻而守宜守而攻其敗也非兵之罪用兵者之罪耳觀乎此則知消導補益推逐之理矣若夫勞倦傷則純乎補益固不待議雖東垣丁寧告誡然世人猶往往以苦寒之劑望除勞倦傷之熱及其不愈而反甚自甚而至危但曰病勢已極藥不能勝耳醫者病者主病者一委之天命皆懵然不悟其為妄治之失也嗚呼仁人君子能不痛心也哉方補中益氣湯批按此方補元氣養脾胃升提下陷之氣治內傷之要藥也治中氣不足肢體倦怠口乾發熱飲食無味或飲食失節勞倦身熱脈大而虛或頭痛惡寒自汗或氣高而喘身熱而煩或脈微細軟弱自汗體倦少食或中氣虛弱而不能攝血或飲食勞倦而患瘧痢或瘧痢因脾胃虛而不能愈或元氣虛弱感冒風寒不勝發表宜用此代之或入房而後感冒或感冒而後入房亦用此湯急加附子或瀉利腹痛急用附子理中湯嫩黃耆蜜水煎炒一錢半脾胃虛肺氣先絶用之以益皮毛而閉腠理止自汗人參去蘆一錢上喘氣短元氣大虛用以補之甘草炙一錢甘溫以瀉火熱而補脾胃中元氣若脾胃急痛腹中急縮者多用之以上三味除渴熱煩熱之聖藥也白朮土炒一錢苦甘溫除胃中熱利腰臍間血柴胡五分能使胃中之清氣左旋而上達升麻五分能使胃中之滿氣從右而上遷橘紅一錢理胸中之氣又能助陽氣上升以散滯氣肋諸脾胃為用當歸身酒洗一錢用之以和血脈上銼一劑生薑三片水煎溫服或少加黃柏以救腎水而瀉陰中之伏火也紅花三分入心養血內傷挾外感者以本方為主從六經所見之證加減用之如見太陽證頭項痛腰脊強加羌活藁本桂枝如陽明則身熱目痛鼻乾不得眠倍升麻加乾葛如少陽則胸脅痛而耳聾加黃芩半夏川芎倍柴胡如太陰則腹滿而嗌乾加枳實厚朴如少陰則口燥舌乾而渴加生甘草桔梗如厥陰則煩滿多加川芎如變證發斑加葛根玄參倍升麻如挾痰加半夏竹瀝薑汁若頭痛加蔓荊子或加川芎頂痛腦痛加藁本細辛諸頭痛此四味足矣若耳鳴目黃頰頜腫頸肩臑肘臂後廉痛面赤脈洪者加羌活一錢防風七分甘草藁本各五分通其經血加黃芩黃連各三分消腫嗌痛頷腫面赤脈洪大加桔梗七分黃芩甘草三分口乾嗌乾或渴者加葛根五分升胃氣上行潤之心下痞悶加芍藥黃連一錢腹中痞悶加枳實三分厚朴七分木香砂仁各三分如天寒加乾薑腹中痛者加炒白芍藥炙甘草各三分如惡寒覺冷痛加桂五分夏月腹中痛不惡寒反惡熱者加黃芩五分芍藥一錢甘草五分以治時熱臍下痛者加熟地一錢如胸中滯氣加青皮五分壅滯可用短促少氣去之如身體重疼乃風濕相搏加羌活防風各五分升麻一錢柴胡五分藁本蒼朮各一錢中病即止大便閉澀加歸梢一錢病久痰嗽者去人參初病勿去之冬月春寒或秋涼各宜加不去節麻黃若春溫熱加沸耳草三分款冬花一分長夏濕土客邪大旺加蒼朮白朮澤瀉上下分消其濕熱之氣濕熱之氣大勝主食不消故食減不知穀味加神麯以消之加五味子麥門冬助人參瀉火益肺金助秋損也在三伏中為聖藥脅下急或痛俱加柴胡甘草人參多唾或唾白沫胃口上停寒也加益智仁若胃脘當心痛加草豆蔻仁三分若食不下乃胸中有寒或氣澀滯加青皮陳皮木香寒月加益智仁草豆蔻夏月加黃芩黃連秋加檳榔砂仁若腳軟乏力或痛加酒炒黃柏不已加漢防己心煩躁加生地黃若氣浮心亂以硃砂安神丸鎮固之則愈白朮散批按此方治胃虛之劑治胃虛不能食而大渴不止不可用淡滲藥恐胃中元氣虛少故也並治傷寒雜病一切吐瀉煩渴霍亂虛損氣弱及治酒積嘔噦人參一錢白朮一錢土炒茯苓一錢藿香八分木香五分葛根一錢甘草七分上銼一劑水煎溫服如飲水者多煎與之時時服如能食而渴者人參白虎湯補氣湯批按此方治氣虛之劑凡遇勞倦辛苦用力過多即服此三四劑免致內傷發熱之病宜預防之黃耆一錢半人參一錢白朮一錢麥門冬一錢陳皮一錢五味子十粒甘草炙七分上銼一劑薑三片棗二枚水煎食前服勞倦甚加熟附子五分補血湯批按此方治血虛之劑凡遇勞心思慮損傷精神頭眩目昏心虛氣短驚悸煩熱等症並宜服之生地黃一錢人參一錢當歸一錢白芍藥炒一錢茯神一錢陳皮五分梔子炒黑五分酸棗仁炒一錢麥門冬一錢五味子十粒甘草炙七分上銼一劑加圓眼十枚水煎空心服參苓白朮散治脾胃虛弱飲食不進或致嘔吐泄瀉及大病後調脾助胃此方最宜白朮土炒一錢人參八分甘草八分乾山藥一錢白茯苓八分白扁豆一錢蓮子肉十個薏苡仁八分砂仁炒五分桔梗八分陳皮一錢上為末每服二錢黑棗泡湯空心調下參苓白朮丸雲林制治病後元氣虛弱此藥進美飲食壯健身體充實四肢清火化痰解鬱固本人參一兩白朮二兩土炒白茯苓一兩乾山藥炒一兩蓮肉去皮二兩陳皮一兩半夏制一兩白扁豆炒一兩薏苡仁炒二兩桔梗二兩黃連薑炒一兩神麯炒一兩香附一兩砂仁五錢甘草一兩當歸一兩遠志一兩石菖蒲五錢上為末薑棗煎湯打神麯糊為丸如梧桐子大每服百丸空心白湯送下忌食生冷油膩之物白朮八寶丹胡云閣傳治一切虛損之症白朮半斤二兩朝陽土炒六兩熬膏人參五錢如有嗽去之白茯神去皮木一兩半遠志去骨兩半陳皮去白兩半白芍藥酒炒兩半神麯炒一兩麥芽五錢上為末用白朮膏丸如梧桐子大每服一錢或加至一錢五分白沸湯空心送下白朮膏治脾胃大虛自汗乏力四肢怠倦飲食不思或食而不化嘔吐瀉痢瀉下完穀白沫白朮一斤去蘆火上炙一塊銼一塊成片上用水十碗熬汁二碗去渣再入水再熬又濾出將渣搗爛入水再熬如是五次共得藥汁十碗合一處入白蜜半斤再熬至稠黏滴水成珠為度日服二三次白沸湯調下白雲膏單孟齊傳批按此方養元氣健脾胃王道之劑調脾健胃固本還元大米一升糯米一升山藥四兩芡實四兩蓮肉去皮心四兩上為細末入白砂糖一斤半攪和令勻入籠蒸糕任意食之傷食脈氣口脈緊盛為傷食食不消化浮滑而疾經曰上部有脈下部無脈其人當吐不吐者死又曰氣口脈大於人迎三倍食傷太陰蓋飲食填塞胸中太陽之分野肝木之氣鬱而不伸故必吐以達之然傷有輕重必甚而至於兩手尺脈絶無者乃用瓜蒂散吐之不則或以指或以鵝翎蘸桐油膽礬探吐之免致夭枉之患也證病源曰宿食不消由臟腑虛弱寒氣在於脾胃之間故使穀不化也宿谷未消新谷又入脾氣既弱故不能磨之則經宿而不消也令人腹脹氣急胸膈痞塞咽酸噫氣如敗卵臭時復憎寒壯熱或頭痛如瘧狀皆其症也凡傷食必惡食胸中有物宜用消導之劑若傷食挾外感者不可專攻其食用行氣香蘇散兼而治之治飲者無形之氣傷之則宜發汗利小便使上下分消其濕也五苓散葛花解酲湯生薑半夏枳實白朮之類是也食者有形之物傷之則宜損其谷其次莫如消導重者宜吐宜下枳朮丸保和丸備急丹之類量輕重擇用方行氣香蘇散三山陳氏方批按此方治內傷外感七情四氣和解表裡之劑治內傷生冷厚味堅硬之物胸腹脹滿疼痛及外感風寒濕氣發熱惡寒遍身痠痛七情氣逆嘔吐泄瀉飲食不下等症紫蘇一錢柴胡八分陳皮八分香附醋炒一錢烏藥八分川芎八分羌活八分枳殼八分蒼朮八分麻黃一錢甘草三分上銼生薑三片水煎溫服外感風寒加蔥白三根內傷飲食加神麯山楂各一錢消滯丸消酒消食消痰消氣消痞消脹消腫消痛消積聚消癥瘕此藥消而不見響而不動藥本尋常功效甚妙黑牽牛頭末二兩香附炒一兩五靈脂一兩上共末醋糊丸如豆大每服二十丸生薑湯下寬中丸治一切飲食不消腹脹發熱之症山楂蒸過去核曝乾上為末每服五錢米湯調下利氣丸方見氣門批按此方消導積熱之劑備急丸治胃中停滯寒冷之物及諸心腹卒痛大黃乾薑巴豆去油各等分上為末煉蜜丸如緑豆大每服三丸溫水送下量虛實加減丸數若中惡客忤心腹脹滿痛如刀刺氣急口噤尸厥卒死者以熱酒灌下或口噤以木棒撑起牙關令下咽須臾瘥未瘥更與三丸以腹中鳴轉即吐下便愈若口噤須折齒灌之令人為妙忌豬肉冷水肥膩之物化滯丸批按此方通利冷積之劑理一切氣化一切積奪造化有通塞之功調陰陽有補瀉之妙久堅沉涸磨之自消暴積乍留導之自去木香二錢丁香二錢青皮二錢陳皮二錢黃連二錢半夏為末薑汁和餅陰乾二錢三稜五錢火煨蓬朮五錢火煨以上八味俱為末巴豆六錢去心膜以瓦器盛醋浸一宿熬至醋乾研烏梅五錢取肉焙乾為末用水醋熬膏調前藥為丸烏梅膏和丸黍大每服五丸或七丸至十丸量虛實用欲通則用熱湯欲止則用冷水常服磨積不欲通泄津液咽下或空心陳皮湯下停食飽悶枳殼湯下但有所積之物取本汁飲下因食吐不止津液下小腸氣痛茴香酒下食瀉不休及霍亂吐瀉新汲水下赤痢冷甘草湯下白痢冷乾薑湯下心痛菖蒲湯下諸氣痛生薑陳皮湯下若欲宣通滾薑湯下仍加丸子未利再服利多飲冷水一口即止婦人血氣痛當歸酒下有孕不宜服小兒量歲數加減用疳積常服不拘時候米飲下三五丸保和丸消痰利氣扶脾胃進飲食一切飲食所傷胸膈滿悶不安或腹中有食不化或積聚痞塊多服日漸消散大有效驗白朮五兩陳皮洗三兩半夏泡三兩茯苓三兩神麯三兩炒山楂肉三兩連翹二兩香附醋炒二兩厚朴薑炒二兩蘿蔔子二兩枳實炒一兩麥芽炒一兩黃連薑炒一兩黃芩酒炒二兩上為末薑汁糊丸桐子大每服五十丸加至七八十丸食後茶清送下理氣健脾丸高大尹傳白朮土炒六兩歸身酒洗六兩陳皮洗三兩白茯苓三兩黃連薑炒二兩香附醋炒二兩枳實麩炒二兩桔梗一兩五錢山楂去核二兩半夏薑炒二兩神麯炒二兩木香五錢上末荷葉煮飯為丸梧子大每用百丸白湯下三補枳朮丸批按此方半消半補平和之劑化痰清熱健胃補脾消食順氣白朮土炒二兩陳皮去白一兩枳實麩炒一兩黃連薑炒五錢黃芩酒炒五錢黃柏鹽炒一兩貝母去心八錢白茯苓五錢神麯炒五錢山楂去核五錢麥芽炒三錢香附醋炒五錢砂仁一錢桔梗二錢連翹二錢甘草炙三錢上末荷葉煮飯為丸如桐子大每百丸薑湯下傷酒夫酒者大熱有毒氣味俱陽乃無形之物也若傷之止當發散汗出則愈矣此最妙法也其次莫如利小便二者乃上下分消其濕何酒病之有今之酒氣者往往服酒蒸丸大熱之藥下之又有用牽牛大黃下之者是無形元氣受病反下有形陰血乖誤甚矣酒性大熱已傷元氣而復重瀉之況亦損腎水真陰及有形陰血俱為不足如此則陰血愈虛真水愈弱陽毒之熱大旺乃助其陰火是謂元氣消亡七神何依折人長命不然則虛損之病成矣金匱要略云酒疸下之久久為黑疸慎不可犯此戒不若令上下分消其濕葛花解酲湯主之方葛花解酲湯治飲酒太過嘔吐痰逆心神煩亂胸膈痞塞手足戰搖飲食減少小便不利葛花五錢白豆蔻五錢砂仁五錢青皮三錢白朮二錢神麯二錢澤瀉二錢乾薑二錢陳皮一錢五分人參一錢五分豬苓一錢五分白茯苓一錢五分木香五分上為細末每服三錢白湯調下但得微汗酒病去矣按此方蓋不得已而用之豈可恃賴日日痛飲此藥性味辛溫偶因酒病服之則不損元氣何者故酒病故也若頻服之損人天年治傷酒食法心中酒食停積一切腹下脹滿不消用鹽花擦牙溫水漱下不過三次如湯潑雪葛黃丸治飲酒過度酒積蘊於胸中以致吐血衄血及時令酷暑上焦積熱忽然吐血垂死者葛花即上好白粉葛一兩黃連四兩上末用大黃熬膏作丸桐子大每百丸溫水下解酒化毒丹雲林制治飲酒過多遍身發熱口乾煩渴小便亦少白滑石水飛一斤白粉葛三兩大粉草三兩上為末不拘時冷水調下三錢日進兩三次又方治酒後傷風身熱頭痛以防風通聖散加黃連須二錢蔥白十莖水煎溫服郁證脈脈多沉伏或澀或芤證內經曰木鬱達之謂吐之令其條達也火鬱發之謂汗之令其疏散也土鬱奪之謂下之令無壅滯也金鬱泄之謂滲泄解表利小便也水鬱折之謂抑之制其沖逆也此治五郁之大要蓋郁者結聚而不得發越也當升者不得升當降者不得降當變化者不得變化也此為傳化失常六郁者氣濕熱痰血食是也丹溪曰氣血沖和百病不生一有怫鬱諸病生焉治氣鬱胸脅痛脈沉澀用香附童便浸炒蒼朮撫芎濕鬱周身走痛或關節病遇陰寒則發脈沉緩用蒼朮川芎白芷茯苓羌活防風柴胡熱鬱目瞀小便赤脈沉數用梔子青黛香附蒼朮撫芎黃芩天花粉痰鬱動則喘寸口脈沉滑用海石南星香附栝蔞仁貝母竹瀝薑汁血鬱四肢無力能食便紅或黑脈沉而澀用桃仁泥紅花牡丹皮延胡索川芎香附食鬱噯酸飽悶畏聞食氣人迎脈平和氣口脈緊盛用蒼朮香附山楂神麯枳實方六郁湯開諸郁之總司也香附童便浸炒蒼朮米泔浸炒神麯炒山梔仁炒黑連翹陳皮撫芎貝母去心枳殼炒白茯苓蘇梗各一錢甘草五分上銼一劑水煎服有痰加南星半夏有熱加柴胡黃芩血鬱加桃仁泥紅花濕鬱加白朮羌活氣鬱加木香檳榔食鬱加山楂砂仁加味越鞠丸解諸鬱火痰氣開胸膈進飲食蒼朮米泔浸薑汁炒四兩撫芎四兩香附童便浸炒四兩神麯炒四兩梔子炒黑四兩橘紅一兩五錢白朮炒一兩半黃芩炒一兩半山楂去核蒸熟一兩半上為末稀糊丸如桐子大每服百丸白湯下越鞠保和丸批按此方治諸郁之妙劑也扶脾開鬱行氣消食清熱化痰蒼朮米泔浸三宿炒一兩撫芎酒洗一兩神麯炒一兩香附童便浸炒一兩梔子炒五錢陳皮一兩半夏炮一兩白茯苓一兩連翹五錢萊蔔子炒五錢枳實麩炒一兩白朮三兩黃連酒炒一兩山楂去核二兩木香五錢當歸酒洗一兩上為末薑汁泡蒸餅為丸如桐子大每服五十丸淡薑湯下或酒下亦可痰飲脈沉弦細滑大小不勻皆痰氣為病偏弦為飲雙弦為寒飲左右手關前脈浮弦大而實者膈上有稠痰也宜吐而愈病人百藥不效關上脈伏而大者痰也眼胞及眼下如灰煙燻黑者痰也丹溪曰久得澀脈痰飲膠固脈道阻滯也卒難侍開必費調理證夫痰屬濕乃津液所化因風寒濕熱之感或七情飲食所傷以致氣逆液濁變為痰飲或吐咯上出或凝滯胸膈或留聚腸胃或流注經絡四肢隨氣升降遍身無處不到其為病也為喘為咳為噁心嘔吐為痞隔壅塞關格異病為泄利為眩暈為嘈雜為怔忡驚悸為癲狂為寒熱為痛為胸膈轆轆有聲或背脊一點常如冰冷或四肢麻痹不仁皆痰所致百病中多有兼痰者世無不知也痰有新久輕重之殊新而輕者形色清白稀薄氣味亦淡久而重者黃濁稠黏凝結咳咯難出漸成惡味酸辣腥臊咸苦甚至帶血而出治痰生於脾胃宜實脾燥濕又隨氣而升宜順氣為先分導次之又氣升屬火順氣在於降火熱痰則清之濕痰則燥之風痰則散之郁痰則開之頑痰則軟之食積痰則消之在上者吐之在中者下之又中氣虛者宜固中氣以運痰若攻之太重則胃氣虛而痰愈盛矣方二陳湯一身之痰都管乃治痰之要藥也欲下行加引下藥黃柏木通防己之類欲上行加引上藥升麻柴胡防風之類又曰二陳加升提之藥能使大便潤而小便長陳皮去白一錢半夏湯泡二錢茯苓去皮一錢甘草五分上銼一劑生薑三片水煎溫服濕痰多軟如身體倦怠之類加蒼朮白朮寒痰痞塞胸中倍半夏甚者加麻黃細辛之類痰厥頭痛倍半夏風痰加天竺黃天南星枳殼白附子天麻殭蠶牙皂之類氣虛者更加竹瀝氣實者加荊瀝俱用薑汁熱痰加黃連黃芩因火盛逆上降火為先加白朮黃芩軟石膏之類眩暈嘈雜者火動其痰也加山梔子黃連黃芩血虛有痰者加天門冬知母栝蔞仁香附竹瀝薑汁滯血者更加黃芩白芍藥桑白皮血滯不行中焦有飲者加竹瀝薑汁韭汁三五盞必胸中煩躁不寧後愈氣虛有痰者加人參白朮脾虛者宜補中益氣降痰加白朮白芍藥神麯麥芽兼用升麻提起食積痰加麥芽山楂神麯炒黃連枳實老痰用海石半夏栝蔞仁香附連翹之類五倍子佐他藥為丸大治頑痰喉中有物咯不出咽不下此結痰也宜栝蔞仁杏仁海石桔梗連翹香附少佐朴硝薑汁煉蜜和丸噙化此咸能軟堅也久得澀脈卒時難開必費調理氣實痰熱結者吐不出咽不下氣滯者難治痰在膈上必用吐法吐之瀉之不去膠固稠濁者宜吐之脈浮吐之痰在經絡間非吐不可吐中就有發散之義凡用吐藥宜升提其氣便吐如防風川芎桔梗芽茶生薑之類或瓜蒂散凡吐用布緊勒腹於不通風處行之痰在腸胃間可下而愈枳實甘遂巴豆大黃芒硝之類凡痰用利藥過多脾氣虛則痰易生而轉盛痰在脅下非白芥子不能達痰在皮裡膜外非薑汁竹瀝不開在經絡中亦用竹瀝必佐以薑汁韭汁膈間有痰或癲狂或健忘或風痰俱用竹瀝荊瀝氣虛少食加竹瀝氣實能食加荊瀝凡人上中下有塊痰也問其平日好食何物吐下後方用藥凡人頭面頸頰腋下結核不痛不紅作膿者皆痰注也宜隨用藥消之清熱導痰湯批按此方治痰迷之劑治憎寒壯熱頭目昏沉迷悶上氣喘急口出涎沫證類傷寒此因內傷七情以致痰迷心竅神不守舍神出則舍空舍空則痰聚黃連炒一錢半枳實炒一錢半栝蔞仁一錢南星制一錢半半夏制一錢半陳皮一錢白茯苓一錢桔梗一錢黃芩炒一錢白朮炒一錢人參八分甘草六分上銼一劑薑棗水煎入竹瀝薑汁各三匙同服滾痰丸批按此方治諸痰之聖藥洞虛子曰痰證古今未詳方書雖有懸飲流飲支飲痰飲溢飲之異而莫知其為病之原或頭風目昏眩暈耳鳴或口眼蠕動眉稜耳輪瘙癢或四肢遊風腫硬似痛非痛或齒頰浮腫痛癢不一或噯氣吞酸嘈雜嘔噦或咽嗌不利咯之不出咽之不下色如煤炱形如破絮或如桃膠蜆肉之狀或心下如停冰雪冷痛時作或夢寐奇怪鬼魅之類或足腕痿軟腰背卒痛或四肢骨節疼痛並無常處乃至手麻臂痛狀若挫閃或脊中每有一掌如冰凍之寒痛者或渾身習習如蟲行者或眼沿澀癢口糜舌爛甚為咽腫喉閉或繞項結核似癧非癧腫塊初起色白不紅者皆痰也或胸脅間如有二氣交紐噎塞煩悶或如煙氣上衝頭面烘熱或為失志癲狂或為中風癱瘓或為勞瘵荏苒之疾或為風痹腳氣或心下怔忡驚悸如畏人將捕或喘嗽嘔吐冷涎緑水黑汁甚為肺癰腸毒便膿攣跛其為內外奇怪疾病非止百端皆痰之所致也蓋津液既凝為痰為飲而洶湧上焦故口燥咽乾流滯於下則大小便閉塞面如枯骨毛髮焦乾婦人則經閉不通小兒則驚癇搐搦治法以此先逐去敗痰然後調理括曰甑里翻身甲挂金子今頭戴草堂深相逢二八求斤正硝煆青礞倍若沉十七兩中零半兩水丸梧子意常斟千般怪症如神效水瀉雙身卻不任大黃酒拌蒸半斤黃芩去梗半斤沉香石五錢青礞石一兩捶碎焰硝一兩同入砂罐內瓦片蓋之鐵錢縛定鹽泥固濟曬乾煅紅候冷取出上為細末淨水為丸如梧桐子大每服三五十丸量虛實加減各隨引下一切喪心失志或癲癇狂妄等症每服百丸人壯氣實能飲食狂甚者一百二十丸以上至二三百丸以效為度一切中風癱瘓痰涎壅塞大便或通或閉者每服八十丸人壯氣實者百丸常服三二十丸無大便不利之患自然上清下潤之妙一切陽症風毒腳氣遍身遊走疼痛每服八九十丸未效再加丸數一切走刺氣痛每服七八十丸未效隨症再加一切無病之人遍身筋骨平白疼痛不能明狀者每服七八十丸以效為度一切頭痛非頭風證牙疼或浮或癢非風蛀牙者每服八十丸一切因風因寒鼻塞身重身體不疼非傷寒症者每服八九十丸一切噯氣吞酸及噎膈反胃痞塊攻心嘔吐痰沫者每服八九十丸進退加減存乎病者元氣之虛實一切心下怔忡恍惚如畏人將捕之狀怵惕不安陰陽關格變生乖症每服七八十丸一切傷飢失飽憂思過慮至於心下嘈雜飢不能食每服七八十丸一切新久痰氣喘嗽或嘔吐涎沫或痰結實熱或頭目眩暈每服八九十丸虛羸者五六十丸未效再加十丸一切急慢喉閉赤眼每服八九十丸一切頸項腮頰腫硬環繞結核成瘰癧者正服此藥若年深歲久宜多服之一切口糜舌爛咽喉生瘡者每服六七十丸同蜜少許一處嚼破噙睡徐徐咽下些小口瘡如此噙二三夜即瘥一切遍身無故遊走疼痛或腫或攣或無常痛無定所腫不在一處痠軟沉滯者每服七八十丸量虛實加減一切心氣冷痛如停冰塊或通身散入腹中絞痛上攻頭面腫硬遍身四肢痿軟或痛或癢或潰或不潰或穿而復閉或此消而彼長漸成篤疾皆系痰毒內攻或使爛痰臭或作腸癰內疽服之以下惡物立效日淺膿近者刻日全安一切胃脘作痛下連小腹面黃羸瘦痛陳日發必嘔吐緑水黑汁冷涎乃至氣絶心下溫暖者每服八九十丸立見生意然後續續服之以瘥為度一切痢疾不拘赤白相雜或帶血塊惡物者每服八九十丸次日熱退再進二三十丸即服止痢藥萬無一失若兼寒熱痰涎者並用倉廩散一切荏苒之疾男子女人日久之患非傷寒內外之證或酒色過度或月水愆期心煩志亂或腹脹脅痛目瞀耳聵鼻窒骨節疼痛嘔吐噁心百藥無效病者莫能喻其狀方書未嘗載其疾醫人不能辨其症並依前法加減服之無有不效之理也凡服此藥者必須臨睡臥床用熟水一口送只送過咽即便仰臥令藥在咽膈之間徐徐而下半日不可飲食湯水及不可起身行坐言語直候藥丸徐逐上焦痰滯惡物過膈入腹然後動作方能中病每次須連進兩夜先夜所服次日痰物既下三五次者次夜減十丸下一二次者仍服前數下五七次或只二三次而病勢頓減者次夜減二十丸頭夜所服並不下惡物者次夜加十丸壯人病實者多至百丸惟狂疾徑實及暴卒惡候多服無妨其或服罷仰臥咽喉沉滯稠黏壅塞不利者乃痰氣從上藥病相攻之故也少頃藥力既勝自然寧帖又或百中有一稍稍腸痛腰背拘急者蓋有一種頑痰惡物滯殢閉氣滑腸裡急後重狀如痢疾片晌即已若其痰涎易下者快利不可勝言頓然滿口生津百竅爽快間有片時倦怠者蓋連日病苦不安一時為藥所勝氣體暫和如醉得醒如浴初出如睡方起即非虛倦也此藥並不洞泄刮腸大瀉但能取痰積惡物自腸胃次第穿鑿而下腹中糟粕並不相傷惟下部䐈腸之糞乃藥力不到之處是故先去其餘余不備述耳導痰小胃丹批按此方治濕痰峻攻之劑治中風眩暈喉痹頭風哮吼等症上可取胸膈之頑痰下可利胃腸之堅結天南星半夏二味用白礬皂莢薑汁水煮透熟各二兩半陳皮枳實二味用白礬皂莢水泡半日去白礬曬乾炒各一兩白朮炒一兩蒼朮米泔白礬皂莢水浸一宿去黑皮曬乾炒一兩桃仁杏仁二味同白礬皂莢水泡去皮尖各一兩紅花酒蒸一兩大戟長流水煮一時曬乾一兩白芥子炒一兩芫花醋拌一宿炒黑一兩甘遂麵裹煨一兩黃柏炒褐色一兩大黃酒蒸紙裹煨焙乾再以酒炒一兩半上為細末薑汁竹瀝煮蒸餅糊為丸如緑豆大每服二三十丸極甚者五七十丸量虛實加減再不可太多恐損胃氣也一切痰飲臥時白湯下一日服一次一中風不語癱瘓初起用濃薑湯下三十五丸少時即能言語一切風頭痛多是濕痰上攻臨臥薑湯下二十一丸一眩暈多屬痰火食後薑湯下二十五丸然後二陳湯四物湯加柴胡黃芩蒼朮白芷倍川芎熱多加知母石膏一痰痞積塊臨臥白湯送下三十丸一日一次雖數年久患亦不過五七服見效一哮吼乃痰火在膈上臨睡薑湯下二十五丸每夜一次久久自然取效一喉痹腫痛食後白湯送下竹瀝達痰丸批按此方治虛痰平和之劑此藥能運痰如神不損元氣其痰從大便中出丹溪云痰在四肢非竹瀝不開半夏二兩湯泡七次生薑汁浸透曬乾切片瓦上微炒熟用之橘紅二兩人參一兩五錢茯苓二兩大黃二兩酒蒸曬乾黃芩二兩酒炒沉香五錢甘草炙一兩半礞石一兩煅法見前上為細末竹瀝二大碗生薑自然汁三鍾為丸如桐子大每服五七十丸食後白湯送下清氣化痰丸劉少保傳治一切痰飲咳嗽頭旋目眩胸膈痞悶氣滯食積酒積嘔吐噁心天南星半夏白礬牙皂不銼生薑各二兩上先將南星半夏牙皂生薑用水浸一宿將星半薑銼作粗片入白礬同煮至南星無白點去皂不用余者曬乾入後藥青皮麩炒五錢陳皮去白一兩枳實麩炒一兩白朮一兩乾葛五錢白茯苓一兩蘇子炒一兩萊蔔子炒一兩栝蔞仁一兩黃連五錢黃芩八錢海粉七錢香附一兩神麯炒二兩麥芽炒二兩山楂肉一兩氣滯加白豆蔻一兩一方去海粉黃連加人參乾薑各五錢杏仁桔梗前胡甘草各一兩上為細末竹瀝薑汁調蒸餅作丸如梧桐子大每服五七十丸食後薑湯送下清火豁痰丸高冢宰傳治上焦鬱火痰涎壅盛胸膈不利咽喉煩躁噎塞吐不出咽不下如鯁狀大黃酒蒸三兩礞石煅五錢沉香二錢黃芩酒炒二兩黃連酒炒二兩梔子炒二兩連翹一兩天南星制二兩半夏制二兩白朮炒二兩枳實炒二兩貝母去心一兩五錢天花粉一兩陳皮一兩白茯苓一兩神麯炒一兩青黛五錢玄明粉七錢甘草五錢白芥子炒二兩上末薑汁竹瀝丸梧子大每服薑湯下四十丸咳嗽脈咳嗽所因浮風寒緊數熱細濕房勞澀難右關濡者飲食傷脾左關弦短疲極肝衰浮短肺傷法當咳嗽五臟之嗽各視其部沉緊虛寒沉數實熱洪滑多痰弦澀少血形盛脈細不足以息沉小伏匿皆是死脈惟有浮大而嗽者生證傷風咳者脈浮憎寒壯熱自汗惡風口乾煩躁鼻流清涕欲語未竟而咳也傷寒咳者脈緊憎寒發熱無汗惡寒煩躁不渴遇寒而咳傷暑咳者脈數煩熱引飲口燥或吐涎沫聲嘶咯血傷濕咳者脈細骨節煩疼四肢重著或自汗小便澀治咳者無痰而有聲肺氣傷而不清也治以防風桔梗升麻杏仁五味子生薑甘草桑白皮蘇子枳殼嗽者無聲而有痰脾濕動而為痰也治以半夏白朮五味子枳殼防風甘草枳實山楂蒼朮橘皮咳嗽者有痰有聲因傷肺氣而動脾濕也治以半夏白朮五味子桔梗枳殼桑白皮麥門冬甘草之類風寒嗽者鼻塞聲重惡風惡寒或自汗或無汗者是也治當以發散行痰用二陳湯加麻黃桔梗杏仁風寒鬱熱於肺夜嗽者治以三拗湯加知母脈大而浮有熱加黃芩生薑痰嗽者嗽動便有痰聲痰出嗽止者是也主豁痰用二陳湯或以半夏栝蔞仁各五兩桔梗貝母各一兩枳殼一兩半知母一兩薑汁蒸餅為丸服火鬱者有聲痰少面赤者是也主降火清金化痰乾咳嗽者系火鬱之甚難治乃痰鬱火邪在肺中用桔梗開之再用補陰降火之藥不已則成勞須行倒倉法此症多是不得志者有之有痰因火逆上者必先治其火然亦看痰火孰急若痰急則先治痰而後治火在乎醫者之隨機變可也勞嗽者痰多盜汗是也或作寒熱宜補陰清金四物湯加竹瀝薑汁陰虛火動而嗽者四物二陳順而下之加黃柏知母尤妙陰虛喘嗽或吐血者四物湯加黃柏知母五味子麥門冬桑白皮地骨皮牡丹皮山梔子咳嗽聲嘶者乃血虛受熱也用青黛蛤粉蜜調服一方用芩連四物湯好色之人元氣虛咳嗽不已者瓊玉膏肺脹而嗽者動則喘滿氣急息重者是也宜收斂肺氣用訶子杏仁青黛海粉半夏香附栝蔞仁之類肺脹郁遏不得眠者難治凡治咳嗽最要分肺虛肺實若肺虛久嗽宜五味子款冬花紫菀馬兜鈴之類斂而補之若肺實有邪宜黃芩天花粉桑白皮杏仁之類散而瀉之凡治嗽有用五味子者以收肺氣乃火熱必用之劑若有外邪而驟用之恐閉住邪氣必先發散然後可用訶子味酸苦有收斂降火之功杏仁散肺中風寒然形實有熱因於寒者為宜桑白皮瀉肺氣然性不純良用之者當戒馬兜鈴去肺熱而補肺也生薑辛能發散也罌粟殼不可驟用乃後收功藥也人參以其氣虛或新咳挾虛者可用若風寒邪盛或久嗽肺有鬱火者不可用也栝蔞仁甘能補肺潤能降氣胸中有痰者自降凡咳嗽口燥咽乾有痰者不可用南星半夏宜用栝蔞仁貝母若飲水者又不宜栝蔞恐泥膈不鬆快耳方參蘇飲治四時感冒發熱頭疼咳嗽聲重涕唾稠黏中脘痞滿嘔吐痰水寬中快膈不致傷脾此藥大解肌熱潮熱將欲成勞瘵之證神效紫蘇一錢前胡一錢桔梗一錢枳殼一錢乾葛一錢陳皮一錢半夏一錢白茯苓一錢甘草七分人參七分實熱者去之木香五分氣盛去之上銼作一劑生薑三片黑棗二枚水煎食後溫服若天寒感冒惡寒無汗咳嗽喘促或傷風自汗鼻塞聲重咳嗽並加麻黃二錢去皮杏仁一錢金沸草一錢以汗散之若初感冒肺實有熱加杏仁桑白皮黃芩各一錢烏梅七個胸滿痰多加栝蔞仁一錢氣促喘嗽加知母貝母各一錢肺寒咳嗽加五味子乾薑各七分心下痞滿或胸中煩熱或停酒不散或嘈雜噁心加黃連枳實各一錢乾葛陳皮倍用之鼻衄加烏梅五個麥門冬茅根各一錢心盛發熱加柴胡黃芩各一錢頭痛加川芎一錢細辛八分咳嗽吐血加升麻牡丹皮各一錢生地黃一錢五分勞熱咳嗽久不愈加知母貝母麥門冬各一錢吐血加阿膠牡丹皮赤芍藥各一錢生地黃一錢五分烏梅七個咳嗽痰中見血以本方加四物湯名茯苓補心湯妊娠傷寒去半夏加香附清金降火湯瀉肺胃中之火火降則痰消嗽止陳皮一錢五分半夏泡一錢茯苓一錢桔梗一錢枳殼麩炒一錢貝母去心一錢前胡一錢杏仁去皮尖一錢半黃芩炒一錢石膏一錢栝蔞仁一錢甘草炙三分上銼一劑生薑三片水煎食遠臨臥服二母寧嗽湯批按此方治四時一切痰嗽無問新久肺氣有餘者宜之治因傷酒食胃火上炎沖逼肺金以致咳嗽吐痰經旬不愈一服即瘥知母去毛錢半貝母去心錢半黃芩一錢二分山梔仁一錢二分石膏二錢桑白皮一錢茯苓一錢栝蔞仁一錢陳皮一錢枳實七分五味子十粒生甘草三分上銼一劑生薑三片水煎臨臥時細細逐口服潤肺豁痰寧嗽湯雲林制批按此方治痰嗽兼陰虛者宜之陳皮五分半夏薑製五分白茯苓四分甘草炙三分黃柏酒炒五分黃芩酒洗三分知母酒炒五分貝母去心五分天冬去心三分麥冬去心三分紫菀酒洗三分款冬花酒洗三分桔梗三分熟地黃五分當歸三分上銼一劑生薑三片水煎溫服吸藥如神散陳太醫傳批按此方治久年痰嗽專攻之劑治風入肺中久嗽不愈雄黃佛耳草鵝管石款冬花甘草寒水石青礞石煅過白附子枯礬孩兒茶各等分上為細末紙燃燒煙令病人吸之灸法治久患咳嗽百藥無效可用此法將病者乳下大約離一指頭看其低陷之處與乳直對不偏者此名直骨穴其婦人即按其乳頭所到之處即是直骨穴也艾灸三壯其艾圓如小豆大男左女右不可差其咳即愈如不愈其病再不可治矣哮吼證夫哮吼專主於痰宜用吐法亦有虛而不可吐者此疾寒包熱也治治法必用薄滋味不可純用寒涼須常帶表散方定喘湯訣云諸病原來有藥方惟愁齁喘最難當麻黃桑杏尋蘇子白果冬花更又良甘草黃芩同半夏水煎百沸不須薑病人遇此靈丹藥一服從教四體康麻黃去節八分桑白皮一錢杏仁十四粒泡蘇子炒一錢研白果七個款冬花一錢甘草八分黃芩微炒一錢半夏薑製一錢上銼一劑水煎食後熱服五虎二陳湯雲林制批按此方發表之劑治哮吼喘急痰盛麻黃去節一錢杏仁十四粒泡石膏煅過一錢橘皮一錢半夏薑製一錢茯苓去皮八分甘草八分人參八分木香七分沉香七分細茶一錢上銼一劑生薑三片蔥白三莖蜜三匙水煎服導痰小胃丹方見痰門治哮吼不問新久喘急脈右手寸口氣口以前陰脈應手有力必上氣喘逆咽塞欲嘔自汗皆肺實之疾也若氣口以前陰脈應手無力必咽乾無津少氣此肺虛之證也脈滑而手足溫者生脈沉澀而手足寒者死數者亦死為其形損故也證夫喘者上氣急促不能以息之謂也有肺虛挾寒而喘者有肺實挾熱而喘者有水氣乘肺而喘者有驚憂氣鬱肺脹而喘者有陰虛者有氣虛者有痰者有氣急者有胃虛者有火炎上者原其受病之不同是以治療而有異治治喘之法當究其原肺虛肺寒必有氣乏表怯冷痰如冰之症者法當溫補如官桂阿膠之類是也肺實肺熱必有壅盛胸滿外哄上炎之狀法當清利如桑白皮葶藶之類是也水氣者漉漉有聲怔忡浮腫與之逐水利小便如半夏茯苓五苓散輩驚憂者惕惕悶悶引息鼻脹與之寬中下氣如四七湯枳殼湯輩陰虛者氣從臍下起直衝清道而上以降氣滋陰氣虛者氣息不能接續以參耆補之有痰者喘動便有痰聲降痰為主有氣急者呼吸急促而無痰聲降氣為主有胃虛者抬肩擷肚喘而不休以溫胃消痰有火炎者乍進乍退得食則減食已則喘以降火清金至若傷寒發喘表汗里下腳氣充滿疏導取效此皆但療本病其喘自安雖然喘有利下而愈者亦有因瀉而殂者喘有數年沉痼而復瘳者亦有忽因他疾大喘而不救者汗而發潤為肺絶身汗如油喘者為命絶直視譫語喘滿者皆不治然則喘之危惡又安可以尋常目之喘有三熱喘發於夏不發於冬冷喘則遇寒而發水喘停飲胸膈滿悶腳先腫也方五虎湯批按此方治感寒作喘之劑治傷寒喘急麻黃五錢去節杏仁二錢去皮石膏五錢煨甘草一錢細茶一撮加桑皮一錢上銼生薑三片蔥白三莖水煎熱服四磨湯治七情鬱結上氣喘急枳殼一個檳榔一個沉香一塊烏藥一個上用酒磨濃入白湯服蘇子降氣湯批按此方治因氣作喘之劑治虛陽上升氣不升降上實下虛痰涎壅盛喘促短氣咳嗽氣逆不安等症方見氣門千緡導痰湯批按此方治因痰作喘之劑治痰喘不能臥一服而安天南星制一錢半夏七個火炮破皮每一個切作四片陳皮一錢枳殼去穰一錢赤茯苓一錢皂莢一寸炙去皮弦甘草炙一錢上銼一劑生薑三片水煎服參桃湯治肺虛發喘少氣難以布息人參二錢胡桃肉二枚去殼不去皮上銼生薑五片大棗二枚食後臨臥時水煎服定喘湯訣云批按此方治肺虛作喘之劑和劑須投定喘湯阿膠半夏及麻黃人參半兩同甘草半兩桑皮五片薑罌粟二錢同蜜炙再加五味子為強多年氣喘從今愈始信良醫有妙方阿膠五錢蛤粉炒成沫半夏薑製五錢麻黃去節五錢人參五錢甘草三錢桑白皮五錢罌粟殼二錢蜜炙五味子三錢上銼每服一兩一錢生薑五片水煎臨臥細服
