body:
  text: 卷之五瘧疾脈瘧脈自弦弦數者多熱宜汗之弦遲者多寒宜溫之弦緊宜下浮大宜吐弦短者傷食弦滑者多痰虛微無力為久病洪數無力為虛代散則死證夫瘧有風瘧暑瘧濕瘧食瘧痰瘧瘧母諸瘧之不同不過風寒暑濕之外感七情五味之內傷之所致也然內外失守真邪不分陰陽偏勝寒熱交攻乃成瘧也有一日一發有二日一發有三日一發有間一日連二日發氣血俱受病有夜與日各發有發於午前有發於午後其始發之時缺伸畏寒戰栗頭痛或渴或先寒後熱或先熱後寒或單寒不熱或單熱不寒或寒少熱多或寒多熱少治治療之法當先發散外邪有有汗有無汗無汗者要有汗散邪為主有汗者要無汗扶正為主然散邪扶正病不退者又須分利陰陽以柴苓湯最效甚者或以截藥而除之不二飲勝金丸之類截之不愈乃氣血大虛要扶胃氣為本露姜養胃湯養胃丹之類又有綿延不休彌𥜥越歲汗吐下過榮衛虧損邪氣伏藏脅間結為症癖謂之瘧母痎瘧飲黃甲丸之類蓋瘧有新久淺深治有緩急次序宜以脈症參驗量其虛實而療之機要謂太陽經為寒瘧治多汗之陽明經為熱瘧治多下之少陽經為風瘧治多和之此三陽受病謂之暴瘧在夏至後處暑前乃傷之淺者在三陽經則總之為寒瘧在處暑後冬至前乃傷之重者其三陰經瘧作於子午卯酉日者少陰瘧作於寅申巳亥日者厥陰瘧作於辰戌丑未日者太陰瘧也一凡瘧方來正發不可服藥服藥在於未發兩時之先不則藥病交爭轉為深害當戒之一平素虛弱兼以勞役內傷挾感外邪以致瘧疾寒熱交作肢體倦怠乏力少氣以補中益氣湯加黃芩芍藥半夏有汗及寒重加桂枝倍黃耆熱甚加柴胡黃耆渴加麥門冬天花粉一久瘧乃屬元氣虛弱蓋氣虛則寒血虛則熱胃虛則惡寒脾虛則發熱陰火下流則寒熱交作或吐涎不食泄瀉腹痛手足逆冷寒栗鼓頷若誤投以清脾截瘧二飲多致不起一瘧後飲食少進四肢無力面色萎黃身體虛弱以四君子湯合二陳湯加姜炒黃連麩炒枳實煎服一凡瘧後大汗出者乃榮血不足之候以人參養榮湯主之方散邪湯三山陳氏傳批按此方治瘧無汗當發汗散邪為主治三陽經瘧頭痛無汗發熱惡寒當發汗散邪川芎一錢白芷一錢麻黃去節一錢防風一錢紫蘇一錢羌活一錢甘草五分白芍藥酒炒一錢上銼一劑生薑三片蔥白三莖水煎露一宿次日溫服有痰加陳皮半夏宿食不消吞酸惡食加麩炒枳實薑汁炒厚朴山楂萊蔔子濕加蒼朮挾氣加青皮蘇梗香附正氣湯三山陳氏傳批按此方治瘧有汗當止汗正氣為主治虛弱人瘧頭疼自汗寒熱往來當扶正散邪柴胡一錢前胡一錢川芎一錢白芷一錢半夏薑製一錢麥冬去心八分檳榔一錢草果一錢青皮炒一錢茯苓八分桂枝一錢甘草炙八分白芍炒一錢陳皮八分上銼一劑生薑三片大棗二枚水煎預先熱服柴苓湯批按此方治瘧分利陰陽和解表裡之劑此藥分利陰陽和解表裡之劑柴胡八分黃芩炒一錢人參去蘆一錢半夏薑製一錢甘草六分豬苓一錢澤瀉一錢白朮炒一錢茯苓八分肉桂七分上銼一劑生薑三片大棗二枚水煎溫服無汗加麻黃有汗加桂枝寒多倍肉桂熱多加黃芩胸膈滿悶加枳殼桔梗不二飲祕方治一切寒熱瘧疾一服即止如神常山二錢檳榔雌一錢雄一錢尖鋭者為雄平禿者為雌知母一錢五分貝母一錢五分上銼一劑酒一鍾煎至八分不可過熟熟則不效露一宿臨發日五更溫服勿令女人煎藥勝金丸治一切寒熱瘧疾胸膈停痰一服立效常山四兩好酒浸一宿曬乾檳榔二兩蒼朮二兩米泔浸一宿曬乾草果二兩上為細末將前所浸常山余酒煮糊為丸如梧桐子大每服五十丸未發前一日臨臥時冷酒送下即臥不可言語直至雞鳴時再進七十丸忌食生冷熱物及雞魚麩面之類不則不效矣瘧靈丹祕方治一切瘧服藥不愈以此截之雄雞豆揀圓者為雄四十九粒先一日以水泡去皮研爛人言末一錢雄黃一錢為衣上於五月五日午時同搗為丸如芡實大陰乾收貯臨發日早晨面東無根水下一丸忌熱酒熱物逾時禁生冷魚腥三日此方百發百中龍虎湯批按此方治熱瘧清火之劑治熱瘧火盛舌卷焦黑鼻如煙煤六脈洪數弦緊此乃陽毒入深所致先以青布摺疊數重新汲水漬之搭於心胸之上須臾再易如此三次熱勢稍退即服此藥無有不效柴胡一錢五分黃芩一錢五分半夏薑製七分石膏二錢五分黃連一錢五分黃柏一錢二分知母一錢去毛山梔仁一錢粳米一撮上銼一劑生薑一片大棗二枚水煎溫服露姜養胃湯治久瘧不愈三五日一發蒼朮米泔浸一宿曬乾一錢厚朴姜炒一錢陳皮一錢草果一錢半夏薑製一錢人參一錢五分茯苓一錢藿香一錢甘草炙七分上銼一劑烏梅一個黑棗一個水煎先以生薑四兩搗汁露一宿次日合入煎藥通口服養胃丹批按此方治久瘧補虛之劑治久瘧經年纍月虛弱之症宜此補之人參一兩去蘆蒼朮二兩炒白茯苓一兩半夏泡二兩五錢陳皮一兩五錢藿香一兩草果一兩厚朴姜炒一兩五錢常山酒蒸二兩甘草炙五錢烏梅四十九個去核上為末淡薑湯打糊為丸如梧桐子大每服七十丸仍用淡薑湯送下痎瘧飲治瘧久不能愈名曰痎瘧又曰老瘧蒼朮泔浸五錢草果五錢桔梗五錢青皮五錢陳皮五錢良薑五錢白芷二錢白茯苓二錢半夏湯泡二錢枳殼麩炒二錢甘草二錢桂心二錢乾薑泡二錢蘇葉二錢川芎二錢上銼每劑五錢水煎入鹽少許空心溫服黃甲丸批按此方治瘧母消塊之劑治瘧母成塊久不能愈硃砂一兩阿魏一兩檳榔一兩山甲一兩酥炙炒雄黃五錢木香五錢上為細末泡黑豆去皮搗成泥為丸如梧桐子大每服五十丸淡薑湯送下忌生冷魚腥三日痢疾脈下利之脈宜微小不宜浮洪宜滑大不宜弦急宜身涼不宜身熱經所謂身涼脈細者生身熱脈大者死是亦大概言之耳不可一途而論也叔和云下痢微小卻為主脈大浮洪無瘥日證夫痢乃濕熱食積三者下青黃赤白黑五色也濕熱傷血分則赤傷氣分則白氣血俱傷則赤白相兼黃者食積黑者濕勝也其症臍腹㽲痛或下鮮血或下瘀血或下紫黑血或下白膿或赤白相雜或下如豆汁或如魚腦髓或如屋漏水裡急後重頻欲登廁晝夜無度治治法行氣和血開鬱散結瀉脾胃之濕熱消臟腑之積滯經云熱積氣滯而為痢其初只宜立效散一服即愈或木香導氣湯以推其邪以徹其毒皆良法也痢稍久者不可下胃虛故也調中理氣湯加味香連丸之類擇便用之痢多屬熱亦有虛與寒者虛者補之寒者溫之以神效參香散主之蓋痢之初邪毒正盛宜推蕩之不可用粟殼訶子收澀之藥則淹纏不已痢之稍久真氣下陷宜收澀之不可用巴豆牽牛通利之劑用之則必致殺人又有下痢噤口而不食者亦有二也有脾虛有脾熱脾虛者參苓白朮散脾熱參連湯或倉連煎之類大凡下痢純紅者如塵腐色者如屋漏水者大孔開如竹筒者唇如硃紅者俱死症也如魚腦髓者身熱脈大者俱半死半生方木香導氣湯治痢疾初起腹痛紅白相雜裡急後重發熱噤口不拘老幼先與一服甚效大黃一錢五分檳榔一錢二分厚朴一錢二分白芍藥一錢二分黃連一錢二分歸尾八分茯苓八分朴硝一錢二分木香五分小便赤加滑石一錢五分木通一錢上銼一劑水二鍾煎至八分濾去渣空心熱服閘板丹張小庵傳批按此方治痢以推其邪而徹其毒也治痢初起以此丹推蕩其邪毒黃丹一兩水飛黃蠟一兩乳香一錢沒藥一錢杏仁八個去皮尖巴豆八個去油上將五味為末將黃蠟熔化後將藥末同蠟拌勻攪冷成塊每服一丸如黃豆大空心服紅痢冷甘草湯下白痢冷乾薑湯下水瀉冷米湯下立效散雲林制批按此方治熱積氣滯而為痢者以黃連清熱枳殼破氣清平之劑治痢腹中癘痛赤白相兼即止黃連四兩酒洗吳茱萸二兩同炒去茱萸用枳殼二兩麩炒上為末每服三錢空心酒送下泄瀉米湯下噤口痢陳倉米湯下調中理氣湯丹溪云調氣則後重自除此也蒼朮米泔浸炒片術炒各一錢陳皮八分厚朴姜炒七分枳殼一錢白芍炒一錢檳榔一錢木香八分上銼一劑水二盞煎一盞濾去渣空心溫服如赤痢厚朴芍藥俱不必炒再加黃連條芩各一錢五分白痢只依本方加味香連丸批按此方治痢調理之劑此方治痢之總司黃連二兩炒吳茱萸滾水泡炒二兩木香一錢白豆蔻帶殼麵裹火煨一錢五分祕方加乳香沒藥各一錢上為細末用烏梅二兩滾水泡去核搗和為丸如梧桐子大每服三十丸白痢乾薑湯下血痢甘草湯下赤白相兼二味泡湯下白瀉米湯下倉廩散治赤白痢疾發熱不退凡下痢有積有暑如用藥不效即是腸胃有風邪熱也此方甚效即人參敗毒散加黃連陳倉米薑棗煎服噤口痢加石蓮肉七枚痢後手足痛加檳榔木瓜不早治則成鶴膝風六一順氣散批按此方治內外兩感發熱痢疾及時行疫痢之劑治痢不問赤白相雜肚痛裡急後重渾身發熱口乾煩渴用此通利即止方見傷寒門納臍膏何晴嶽傳治噤口痢危急之證用之立愈黃瓜藤不拘多少連莖葉經霜者曬乾燒灰存性出火毒上用香油調納臍中即效點眼膏黃賓治一切赤白痢及噤口危急之證初胎糞炙乾一錢雄黃五分黃連四分片腦少許上為極細末水調點兩眥神效倉連煎劉太府傳治噤口痢不拘赤白陳倉米赤痢用三錢白痢用七錢赤白相兼用五錢黃連赤痢用七錢白痢用三錢赤白相兼用五錢上銼水一鍾煎至七分露一宵空心溫服凡下痢噤口不食者雖曰脾虛蓋因熱毒閉塞心胸胃口所致用參苓白朮散加石菖蒲一錢木香少許共為末陳米飲調下再服倉連煎尤妙噤口痢諸藥不效者糞缸中蛆不拘多少洗淨瓦上焙乾為末每服一二匙米飲調服即能思食噤口痢多是胃口熱甚用黃連一兩人參五錢煎湯終日呷之如吐再強飲但得一呷下咽便好一方加石蓮肉三錢水煎服立效外以田螺搗爛入麝香少許合臍上引熱下行故也又方用稱錘燒紅用好醋澆之令病人吸其煙神效按前諸方皆治噤口不食之劑凡醫者用藥不必拘其赤白飲食即吐諸物不納皆是毒氣熏蒸胃口熱甚切不可認胃寒噤口而用辛熱之藥宜以前方選用或木香導氣湯去大黃煎熟入韭汁陳倉米飲各一盞於內同服即愈加減益氣湯治痢日久不愈不能起床虛弱症黃耆五分人參五分白朮一錢陳皮一錢當歸七分白芍藥一錢升麻三分甘草炙三分澤瀉五分砂仁五分木香三分白豆蔻三分地榆五分御米殼醋炒三分上銼一劑水二盞煎至八分濾去渣空心溫服神效參香散批按此方治痢久不愈元氣虛弱滑脫下陷止澀之劑治臟氣怯弱冷熱不調積而成痢或下鮮血或如豆汁或如魚腦或下瘀血或下紫黑血或赤白相雜裡急後重日夜頻數無度罌粟殼去帶穰醋炙一兩陳皮一兩白茯苓去皮四錢肉豆蔻麵裹煨四錢人參二錢白扁豆二錢木香二錢上共七味為末赤痢每九分加制黃連末一分白痢每九分加制茱萸末一分赤白相雜每服八分加黃連茱萸末各一分青色黃色無加減每用一錢俱用米湯調下忌生冷油膩炙爆制黃連茱萸法二味等分不銼碎以老酒浸一宿同一處炒燥分出各為極細末另包聽前用薑茶湯治痢疾腹痛不問赤白冷熱蓋姜能助陽茶能助陰二者皆能清散又且調平陰陽況於暑毒酒食毒皆能解之也老生薑細切二錢細茶葉三錢上用新汲水煎服一方加連根韭菜一握三味同搗汁酒調服三白湯杜守玄傳治痢不拘赤白白砂糖一兩雞子清一個燒酒一鍾半煎八分溫服仙梅丸桑雙岡傳治痢疾發熱發渴細茶烏梅水洗剝去核曬乾各一兩上為末生薑搗作丸彈子大每一丸冷水送下椿雞丸桑環川傳治久痢不止雪裡炭一隻吊死去腸毛入黃連一兩椿根白皮一兩於肚內好酒輝熟去藥食雞神效舒鳧飲劉桐川傳治白痢如魚凍色久不愈者白鴨一隻殺取血以滾酒和飲之立止將軍飲治痢膿血稠黏裡急後重晝夜無度不問新久及愈而又發止而復作名曰休息痢綿紋大黃銼一兩上以好酒二鍾浸半日煎至七分去渣分作二次服以利為度按前諸方治痢簡易故附方末以備選用泄瀉脈脈多沉傷於風則浮而弦傷於寒則沉而細傷於暑則沉而微傷於濕則沉而緩泄而腹脹脈弦者死又云脈緩時微小者生浮大數者死證夫泄瀉者注下之症也蓋大腸為傳送之官脾胃為水穀之海或為飲食生冷之所傷或為暑濕風寒之所感脾胃停滯以致闌門清濁不分發注於下而為泄瀉也內經又謂濕勝則濡泄又曰春傷於風夏生飧泄又曰暴注下迫皆屬於熱又曰諸病水液澄徹清冷皆屬於寒叔和曰濕多成五泄腸走若雷奔故分脾泄胃泄大腸小腸大瘕為五泄也又有飧泄腎泄洞瀉濡泄騖溏之類名各不同原其致病不過前云所感所傷而已矣丹溪又云泄屬濕屬氣虛有火有痰有食積凡瀉水腹不痛者濕也飲食入胃不消完穀不化者氣虛也腹痛瀉水如熱湯痛一陳瀉一陳者火也或瀉或不瀉或多或少者痰也腹痛甚而泄瀉瀉後痛減者食積也瀉下如抱壞雞子臭者或咽氣作酸者傷於食也治治療之法須看時令分寒熱新久補脾消食燥濕利小便亦有升提下陷之氣用風藥以勝濕若久瀉腸胃虛滑不禁者宜收澀之治法之要孰有過於此哉方胃苓湯批按此方治四時泄瀉之總司也治中暑傷濕停飲夾食脾胃不和腹痛泄瀉作渴小便不利水穀不化陰陽不分蒼朮米泔浸一錢厚朴薑汁炒一錢陳皮一錢豬苓一錢澤瀉一錢白朮炒一錢白茯苓一錢肉桂三分白芍炒一錢甘草炙三分上銼一劑生薑棗水煎溫服一方加防風升麻以勝濕食積加神麯麥芽山楂水瀉加滑石有痰加半夏烏梅氣虛加人參白朮惱怒加木香有熱加黃連久瀉加肉豆蔻暴痢赤白相雜腹痛裡急後重去桂加木香黃連檳榔水煎服薷苓湯治暑月泄瀉或欲成痢黃連香薷飲合五苓散銼一劑生薑煎服方見中暑藿香正氣散批按此方治暑瀉之劑治感濕泄瀉或兼暑者方見霍亂依本方加黃連香薷食加神麯山楂柴苓湯批按此方治熱瀉之劑治泄瀉發熱口渴裡虛之症小柴胡湯方見傷寒合五苓散方見中暑銼一劑薑棗煎服理中湯方見中寒批按此方治寒瀉之劑治脾胃虛冷中寒泄瀉四肢厥逆四君子湯方見補益治氣虛脾泄不止者依本方加烏藥醋炒七分薑棗煎服參苓白朮散方見補益治脾胃虛弱久瀉少食瑞運丸何春元傳治元氣大虛脾胃怯弱泄瀉不止不思飲食山藥炒二兩蓮肉二兩白朮土炒二兩芡實二兩人參去蘆一兩橘紅一兩白茯苓一兩白芍藥酒炒一兩甘草炙五錢上為末用雄豬肚一個洗淨煮爛搗和藥末為丸如梧桐子大每服百丸空心米湯送下養元散批按此方治虛瀉之劑治泄瀉飲食少進糯米一升水浸一宿濾干燥慢火炒令極熱乾山藥少許胡椒少許上各為細末和勻每日清晨用半盞再入砂糖少許滾湯調服其味極佳且不厭人大有滋補其女人子宮虛冷不能成孕久服之亦能懷孕平胃散治濡泄腸鳴多水蒼朮厚朴陳皮甘草各一錢五分上銼一劑水煎服五苓散治症同前白朮茯苓各一錢桂六分豬苓澤瀉各一錢二分上銼一劑水煎服胃苓湯治水瀉腹痛陳皮厚朴蒼朮甘草白朮茯苓肉桂豬苓澤瀉各一錢加芍藥黃連各八分上銼一劑姜一片水煎服黃芩湯治腸垢熱泄所下黏垢小便赤澀脈數煩渴黃芩炒五錢芍藥炒三錢甘草一錢上銼一劑水煎服衛生湯治脾胃虛弱不能泌別水穀陳皮茯苓甘草人參白朮山藥澤瀉薏苡仁上銼一劑加砂仁末一錢水二鍾煎至八分服一方加蓮肉芡實乾山藥各二兩亦效一方用糯米磨粉不拘多少入百草霜十分之二水和為餅烙熟食之一方單用糯米半生半炒煮粥食之亦效安胃和脾散治脾胃不和中脘痞塞腹痛脹滿不思飲食嗜臥無時嘔吐痰涎逆氣吐酸面黃肌瘦泄瀉不止四肢乏力沉困自汗盜汗等症蒼朮二兩姜炒厚朴五錢姜炒藿香五錢砂仁五錢人參去蘆五錢白朮土炒五錢白茯苓五錢木香火煨五錢檳榔五錢蓬朮火煨五錢澤瀉五錢甘草炙五錢紅棗二十四個去皮核焙乾上共為細末每服二錢空心淡薑湯送下家蓮散陳堂傳治經年久瀉冷泄及休息痢蓮肉泡去皮心微火焙乾四兩厚朴姜炒一兩乾薑炒黑一兩上三味共為細末每服二三匙米飲下日三次理氣健脾丸方見脾胃治脾胃虛弱久瀉久痢依本方去桔梗加酒炒白芍藥其效如神實腸丸黃賓江傳治久瀉久痢虛滑不禁及脫肛臭椿樹根皮不拘多少切碎酒拌炒為細末用真阿膠水化開和為丸如桐子大每服三五十丸空心米湯下升氣實臟丸雲林制批按此方治滑泄止澀之劑治久瀉元氣下陷脾胃衰憊大腸滑脫肛門墜下日夜無度飲食不思米穀不化湯水直過煩渴引飲津液枯竭肌瘦如柴寒熱互作黃耆蜜炙一兩人參去蘆一兩白朮土炒二兩白茯苓去皮五錢山藥炒一兩蓮肉去心一兩芡實一兩升麻酒炒五錢柴胡酒炒五錢乾薑炒黑五錢肉豆蔻麵裹煨捶去油淨五錢粉草炙五錢椿樹根皮酒炒二次四兩上為細末阿膠水化開為丸如黍米大每服二錢用糯米半生半炒煎湯送下灸法治吐瀉日久胃氣大虛死在旦夕天樞二穴在臍旁各開二寸氣海在臍下一寸半百會在頂心中用艾灸五七壯即愈霍亂脈代者霍亂代而絶者亦霍亂又關脈滑為霍亂吐瀉氣口脈弦滑膈間有宿食留飲宜順其性以鹽湯探之脈結促大皆不可斷以死脈洪大則易治脈微細氣少不語舌卷囊縮者皆不治也滑而不勻必是吐瀉霍亂之候脈大勿訝證夫霍亂者揮霍變亂也蓋因內有所積外有所傷陽不升陰不降乖膈而成故心腹卒痛嘔吐下痢發熱惡寒頭痛眩暈或瀉而不吐或吐而不瀉先心痛則先吐先腹痛則先利心腹齊痛吐利並作甚則轉筋入腹四肢厥冷而斃治急用蓼湯泡洗艾灸臍中蓋陰陽反戾清濁相干治之惟宜藿香正氣散加生薑為上不惟可以溫散風寒抑亦可以調理脾胃如身熱口渴者則以薷苓湯加減治之霍亂之後不可早與飲食恐胃中邪物吐瀉未盡其新谷入胃不能傳化必致不救吐候吐瀉過一二時飢甚方與稀粥少食以漸而將息可也其有不吐不瀉者名乾霍亂急以鹽湯多灌引其大吐令宿食殆盡隨證用藥調之既愈之後若煩熱多渴者以麥門冬湯主之一霍亂轉筋用大蓼一把煎湯蕩洗北人以麥糠代之使腠理開泄陽氣散則愈也河間云熱氣燥爍於筋則攣瘈而痛也一霍亂已死而腹中尚有暖氣者以鹽納臍中以艾灸莫計其數一霍亂心腹卒痛炒鹽二碗絹包頓於胸上並腹肚再以尉斗火尉氣透則蘇續以炒鹽絹包乘熱烙其背則萬無一失也方藿香正氣散治四時不正之氣寒溫時疫山嵐瘴氣雨濕熏蒸或中寒腹痛吐利中暑冒風中濕身重泄瀉或不服水土脾胃不和或飲食停滯復感外邪頭痛發熱戰栗惡寒或嘔吐噁心膈膈滿悶一切氣逆不安之症並能調治藿香二錢紫蘇一錢五分陳皮一錢厚朴薑製一錢半夏薑製一錢白朮一錢炒茯苓一錢大腹皮一錢桔梗一錢白芷一錢甘草炙一錢上銼一劑生薑三片棗二枚水煎熱服霍亂轉筋加木瓜腹痛加炒白芍藥寒痛加桂冷甚加乾薑飲食不化加香附砂仁米穀不消加神麯麥芽心下痞滿加桔梗枳殼枳實肉食不化加山楂濕面停積加蘿蔔子中暑冒風加香藿白扁豆時氣憎寒發熱加柴胡乾葛口乾加麥門冬小便不利合五苓散濕相搏霍亂轉筋煩渴悶亂合黃連香薷飲心腹絞痛加木香若頻欲登圊不通利者加檳榔枳殼按霍亂之疾未有不由內傷生冷外感風寒而致也余用藿香正氣散治之百發百中一歲之內常治百人未有不效者但有熱者須加姜炒黃連寒甚加乾薑萬無一失又腹痛者加桂痛甚者去藿香加吳茱萸小便不利加茯苓如干霍亂加枳殼茯苓肉桂最佳加減薷苓湯批按此方治霍亂屬熱者宜之治霍亂身熱口渴此熱暑中也豬苓七分澤瀉七分白朮五分赤茯苓一錢黃連五分香薷一錢乾葛七分天花粉一錢甘草五分扁豆十四粒上銼一劑生薑煎服如熱極加石膏知母泄瀉加升麻黃芩滑石腹痛加炒白芍藥桂理中丸批按此方治霍亂屬虛寒者宜之治轉筋霍亂上吐下利心腹疼痛及乾霍亂俗名絞腸沙並真陰證手足厥冷嘉靖甲子年間梁宋之地人多患此自腳心麻至膝死者不計其數時大方趙公出示此方患者咸蒙其惠因述以廣其傳人參一錢乾薑炒一錢茯苓一錢甘草炙一錢上為末煉蜜為丸每丸重一錢取一丸細嚼淡薑湯送下忌食米湯此即理中湯改為丸取土能塞水之義若仍煎湯則不效矣陰陽湯治霍亂吐利腹痛服藥即吐無法可施用百沸活河水及冷井泉水各半碗合而服之百沸湯治霍亂吐瀉因飲冷或冒寒或失飢或大怒或乘舟車傷動冒氣令人吐利交作目眩頭旋手足轉筋四肢厥冷用藥遲緩須臾不救吳茱萸木瓜食鹽各五錢上三味同炒焦用百沸湯煎隨病人服之乾霍亂者俗名絞腸沙其症因宿食不消心腹絞痛欲吐不吐欲瀉不瀉揮霍撩亂所傷之物不得出泄故也死在頃刻急宜多灌鹽湯探吐之令物出盡卻服理中湯更刺十井出血並委中出血鹽薑湯治乾霍亂欲吐不吐欲瀉不瀉垂斃者鹽一兩生薑切五錢上二味同炒色變以童子溺二盞煎一盞溫服麥門冬湯治霍亂愈後煩熱多渴小便不利人參一錢白朮炒一錢茯苓八分陳皮八分半夏制八分小麥一百粒麥冬去心二錢甘草七分上烏梅三個生薑三片水二鍾煎八分食遠服嘔吐脈嘔而脈弱小便復利身有微熱厥者難治證夫嘔吐者飲食入胃而覆逆出也有物無聲謂之吐有聲無物謂之噦嘔吐謂之有聲有物蓋人以胃氣為主受納五穀榮養百骸者也若胃虛之人不能攝養或為寒氣所中或為暑氣所幹或為飲食所傷或氣結而痰聚皆能令人嘔吐又有惡血停積胃口嘔吐之間雜以痰血亦有胃熱火邪衝上而作嘔吐者有痰隔中焦食不得下者有氣逆者又內經云諸嘔吐逆衝上皆屬心火河間亦曰胃膈熱甚則為嘔火氣炎上之象也所感不同治治法當以脈辨之中寒則脈沉緊四肢厥冷飲食不下當以溫暖之藥調之挾暑則脈弦數而虛煩熱燥渴法當清涼之停食痰積者則當順氣和胃而消導之積血者化其血火逆者瀉其火此其治法之大要也一嘔家聖藥是生薑千金之說信矣然氣逆作嘔生薑散之痰與水作嘔半夏逐之嘔有熱有寒生薑於寒證最佳若遇熱嘔不可無烏梅也一胃中有熱膈上有痰令人時常嘔吐清水詐噯氣吞酸等症用二陳湯加薑炒黃連炒梔子蒼朮川芎香附砂仁神麯山楂少加木香以行滯氣一時常吐清水或口乾不喜食冷涎自下而湧上者此脾熱所致二陳湯加白朮芍藥升麻土炒黃連黃芩梔子神麯麥芽乾薑或煎或丸隨時制宜一時常噁心嘔吐清水胃口作痛得食暫止飢則痛甚此胃中有蛔也二陳湯加苦楝根皮使君子煎服即愈或用黑錫炒成灰檳榔等分米飲調服方煨姜散西園制治嘔吐噁心生薑一大塊直切薄片勿令折斷層層滲鹽於內以水濕苧麻密縛外又用紙包水蘸濕火煨令熟去紙搗爛和稀米飲服之椒茶餅陳橘軒傳批按此方專治嘔吐之劑止嘔吐治翻胃川椒去目隔紙焙三兩芽茶一兩五錢桑白皮末一兩半飛羅面一兩五錢炒上為細末煉蜜作餅每重一錢許細嚼米湯下保中湯雲林制批按此方治胃中痰火嘔吐之劑治嘔吐不止飲食不下陳皮八分半夏薑製八分茯苓八分甘草三分白朮土炒二錢藿香一錢黃連土炒二錢黃芩土炒一錢山梔子薑汁炒二錢砂仁三分上銼一劑生薑三片長流水和嬌泥澄清水二鍾煎至一鍾稍冷頻服吐逆甚加伏龍肝一塊同煎因氣加香附枳實心煩加竹茹比和飲批按此方治胃虛嘔吐之劑治水穀不納聞食氣即嘔人參一錢白朮一錢茯苓一錢藿香八錢陳皮五分砂仁五分神麯一錢炒甘草五分上銼作一劑用十年以上陳倉米一合順流水二鍾煎沸泡伏龍肝研細攪混澄清取一鍾生薑三片棗二枚同煎七分稍冷服別以陳倉米飲時啜之日進三服即止枇杷散治胃虛嘔噦不止枇杷葉去毛橘紅各一兩半夏湯泡赤茯苓去皮人參各五錢麥門冬去心青竹茹各一兩二錢甘草四錢上銼生薑三片水二盞煎一盞空心服噁心證噁心者無聲無物但心中欲吐不吐欲嘔不嘔雖曰噁心非心經之病其病皆在胃口上有虛有熱有寒有食有痰治治法虛者補之熱者清之寒者溫之食與痰者消之化之皆用生薑及薑汁隨症佐藥其效最速方二陳湯見痰門加薑汁炒芩連梔子治胃熱噁心大半夏湯即二陳湯去甘草加生薑治胃寒噁心小半夏茯苓湯即大半夏湯去陳皮倍加生薑治心中兀兀欲吐導痰湯即二陳湯加南星枳殼加竹茹砂仁姜炒黃連治痰熱嘔吐噁心氣盛者翻胃脈浮緩者生沉澀者死脈澀而小血不足脈大而弱氣不足證夫翻胃者朝食而暮吐暮食而朝吐或食已即吐者是也膈噎者謂五膈五噎也五膈憂恚寒熱氣也五噎憂思勞食氣也膈者在心脾之間上下不通若拒格之狀也或結於咽喉時覺有所礙吐之不出咽之不下由氣鬱痰搏而然久則漸妨飲食而為膈也噎者飲食之際氣卒阻滯飲食不下而為噎也翻胃也膈也噎也三者名雖不同而其所受之病則一而已內經謂三陽結謂之膈三陽者大腸膀胱也結熱結也小腸熱結則血脈燥大腸熱結則不能圊膀胱熱結則津液涸三陽既結則前後閉結下既不通則反上行所以噎食不下縱下而復出也此陽火不下降而上行也故經曰少陽所至為嘔湧溢食不下此理明矣丹溪曰氣之初病其端甚微或因些小飲食不謹或外冒風雨內傷七情或食味過厚偏助陽氣積成膈熱或資稟充實表密無汗或性急易怒相火上炎以致津液不行清濁相干氣之為病或痞或痛或不思食或噫腐吞酸或嘈雜嘔噦醫者不求其本便認為寒遽以辛香燥熱之劑投之時暫得快以為神方厚味仍前不節七情反復相侵舊病被劫暫開濁液易子攢聚或半月或一月前症復作如此延蔓自氣成積自積成痰此為痰為飲為吞酸之由也良工未遇燥劑又投痰挾瘀血遂成窠囊此為痞為痛為嘔吐噎膈翻胃之症次第而作也猶謂虛而積寒非尋常草木可療竟以烏附佐助丹藥專意服餌積而血液俱耗胃脘乾稿其稿在上近咽之下水液可行食物難進間或可入食亦不多名之曰噎其稿在下與胃相近食雖可下難盡入胃良久復出名之曰膈亦曰翻胃治治當養血生津清痰降火潤燥補脾抑肝開鬱庶使病邪易伏胃氣開通雖然亦在病者之調攝耳吾觀張雞峰曰噎是神思間病惟內觀以自養此言深中病情一鉤玄云翻胃大約有四血證氣虛有痰有熱血虛者脈必數而無力以四物湯養血為主氣虛者脈必緩而無力以四君子湯補氣為主有痰者脈必滑數以二陳湯為主有熱者脈必數而有力以解毒湯主之一凡噎膈翻胃悉用二陳湯加薑汁竹瀝童便韭汁之類為主治一若胸中覺有熱悶加土炒黃芩黃連栝蔞仁桔梗之類一若血虛瘦弱之人合四物湯少加杏仁泥紅花童便韭汁之類仍不可缺一若朝食暮吐暮食朝吐或食下須臾即吐者此胃可容受而脾不能傳送也或大小腸閉結不通食返而上奔也加酒蒸大黃以潤之脾不磨者加神麯麥芽之類以助其衰火也一若氣虛肥白人膈噎者合四君湯亦加竹瀝薑汁為要藥也一若七情鬱結成氣噎者加香附撫芎木香檳榔栝蔞仁砂仁之類一若飲酒之人加砂糖驢尿入內服一若膈噎大便燥結用大黃乃急則治其標之劑也仍用四物湯加童便薑汁多飲牛羊乳為上策也但不可以人乳代之蓋人乳內有飲食烹飪之火也一若氣血兩虛則口中多出沫但見沫大出者必死糞如羊屎不治大腸無血故也年過五十者不治一中年婦人翻胃以四物湯加帶白陳皮留尖杏仁生甘草酒紅花濃煎入驢尿以防生蟲數帖而愈一治翻胃噎膈用螃蟹洗淨入水中高四指以香油一小酒盞入水中以二指捻白麵撒水上涎即出次日去蟹留水曬乾涎為末每服五分淡燒酒下方主方治一切翻胃噎膈為總司要藥也韭汁二兩牛乳一盞生薑半兩取汁竹瀝半盞童便一盞上五味和勻頓暖服或加入煎劑內尤為至效順氣和中湯雲林制治嘔吐翻胃嘈雜吞酸半夏制六分白茯苓七分白朮土炒八分廣皮鹽水浸炒一錢枳實麩炒五分甘草炙二分香附醋炒一錢山梔薑汁炒黑一錢神麯炒六分砂仁炒三分黃連薑汁浸曬乾以豬膽汁拌炒六分上銼一劑生薑三片長流水入嬌泥攪澄清水一鍾煎至七分入竹瀝童便薑汁不拘時細細溫服心胃痛加薑汁三匙如氣虛加人參黃耆各八分如血虛加當歸七分川芎五分如惱怒或氣不伸舒加烏藥五分木香三分如胸膈飽悶加蘿蔔子炒六分如心下嘈雜吞酸加吳茱萸四分倍黃連白朮如嘔吐不止加藿香七分如大便閉結加蘇子麻仁桃仁杏仁俱研如泥一錢再用白蜜時時服之安中調氣丸雲林制治一切翻胃痰膈之證廣皮二兩半夏薑製一兩白茯神一兩白朮土炒二兩枳實麩炒一兩蘇子炒六錢川芎五錢當歸酒洗五錢白芍藥鹽酒洗炒八錢木香一錢甘草炙三錢香附三兩長流水浸三日洗淨炒黃色神麯炒一兩黃連薑汁浸曬乾豬膽汁拌炒一兩白豆蔻五錢蘿蔔子炒五錢上為細末竹瀝薑汁打神麯糊為丸如緑豆大每服八十丸不拘時白湯送下清米湯亦可四七調氣湯西園公方治七情四氣以致膈噎翻胃紫蘇一錢五分厚朴薑汁炒一錢五分茯苓一錢五分半夏一錢五分枳實炒一錢半砂仁一錢五分蘇子炒一錢五分陳皮一錢五分甘草五分上銼生薑三片水煎服後以加味保和丸加人參一兩砂仁二兩木香二兩服之收功四子調中湯批按此方治翻胃專因氣者治翻胃或大小便閉及痰氣壅盛青皮麩炒五分陳皮五分枳實麩炒一錢香附炒一錢黃連薑汁炒七分半夏制二錢栝蔞仁炒一錢蘇子炒一錢沉香五分茯苓五分桃仁去皮尖一錢半白芥子炒一錢木通五分芒硝五分上銼一劑生薑五片水煎稍熱服神奇散方外人傳批按此方治翻胃血虛有火者治噎食翻胃三陽枯竭當歸一錢川芎七分白芍藥酒炒一錢生地黃二錢陳皮八分砂仁七分半夏薑製八分白茯苓一錢白朮土炒香附醋炒一錢枳實炒一錢烏梅三個藿香一錢赤茯苓一錢檳榔一錢木通一錢豬苓一錢黃芩炒一錢黃柏酒炒一錢知母人乳拌炒一錢赤芍藥一錢天門冬去心一錢麥門冬去心一錢甘草八分上銼一劑水二鍾煎一鍾入童便一盞服呂純陽降筆傳治翻胃方藿香一錢陳皮一錢半夏八分赤茯苓一錢人參一錢白豆蔻一錢蘇子炒一錢厚朴制八分檳榔八分枇杷葉蜜炙一錢白芥子炒八分沉香一錢良薑三分官桂二分丁皮二分杵頭糠一撮上銼一劑生薑三片棗一枚水二盞煎八分服加味六君子湯治脾胃大虛以致膈噎不食六君子湯加炮乾薑白豆蔻黃連制吳茱萸回生養胃丹批按此方治翻胃氣虛有寒者治真元虛損心胃不交精神耗散脾臟受濕飲食不納五味不成津液反成痰涎聚於中脘不能傳道以致大腸燥澀小便反多而赤或時嘔吐酸水久成翻胃結腸之證蒼朮米泔水浸三日洗淨曬乾再換浸三日四兩蓮肉酒浸一宿四兩雄豬肚一個壁土揉擦洗淨入蒼朮蓮肉在內以線縫緊用好酒煮爛取入石口內搗如泥捻作小餅烘乾加後藥南星四兩細切薑汁浸一宿以伏龍肝同炒去伏龍肝用或用黃土亦可半夏四兩泡曬乾細切好醋浸七日蒸熟橘紅四兩以灶心土炒去土用粟米四兩薑汁浸蒸焙人參一兩白朮一兩白茯苓一兩厚朴薑汁炒一兩蓬朮一兩醋炒蓽澄茄一兩砂仁一兩三稜一兩醋炒白豆蔻一兩穀芽炒一兩麥芽炒一兩甘草一兩丁香五錢木香五錢沉香五錢上為末稀麵糊為丸如梧大子每服一百丸空心時陳米湯送下加味保和丸批按此方治翻胃有熱者治實熱翻胃保和丸三錢方見傷食加薑汁浸炒黃連三錢山楂肉三錢共為末米糊為丸如麻子大每服六十丸煎人參竹瀝湯送下九仙奪命丹祕方治翻胃痰涎壅盛南星薑製三錢半夏薑製五錢枯明礬五錢枳殼麩炒一兩厚朴薑製五錢人參三錢木香四錢豆豉洗一兩甘草三錢加阿魏三錢糖球子五錢上為末老米打糊為餅如錢大瓦上焙乾晴夜露過每服一餅細嚼以姜煎平胃散送下沉香降氣丹長葛李大尹傳方批按此方治翻胃腹中積塊者治翻胃腹中有積塊黑牽牛取頭末三兩大黃一兩酒蒸檳榔一兩當歸一兩酒浸良薑三錢蒼朮一兩青皮炒一兩陳皮五錢烏藥一兩砂仁五錢枳殼麩炒一兩枳實麩炒五錢香附一兩炒沉香三錢三稜三錢火煨半夏制五錢木香三錢莪朮三錢火煨黃連一兩薑汁炒黃芩一兩酒炒上為末酒糊為丸桐子大每服六七十丸淡薑湯送下木香順氣丸俞九河傳方批按此方治翻胃大便閉結者治翻胃大便閉結者沉香五錢木香三錢當歸一兩酒浸白茯苓一兩山藥一兩郁李仁二兩檳榔二兩菟絲子一兩酒製牛膝二兩酒浸枳殼一兩麵炒獨活一兩防風一兩火麻仁二兩大黃酒蒸五錢上為末煉蜜為丸如梧子大每服二十五丸白滾湯下定生丹祕方批按此方治定翻胃之生死者治噎膈翻胃雄黃三錢硃砂三錢阿魏五分箬焙硇砂五分乳香三錢半夏三錢木香三錢沉香一錢肉豆蔻三錢緑豆四十粒烏梅四十個百草霜三錢為衣上為末將烏梅以熱湯泡令軟剝去核研極爛入藥搗為丸如彈子大百草霜為衣陰乾每用一粒噙化咽下以薑湯嗽口復以陳麥餅火燒熟細嚼壓之噙藥即燃官香一炷如香盡藥未化者難治藥先化香未盡者可愈按此方用之以定吉凶生死者養血助胃丸雲林制批按此方治翻胃收功保後之劑治嘔吐翻胃愈後用此養元氣健脾胃生血脈調榮衛清鬱氣收功保後當歸酒洗一兩川芎一兩白芍鹽酒炒一兩二錢熟地黃薑汁浸炒八錢人參五錢白朮土炒一兩三錢白茯苓六錢甘草炙三錢山藥炒一兩蓮肉去皮心一兩扁豆薑汁炒六錢上為末姜打神麯糊為丸如梧桐子大每服六七十丸空心白滾水下咳逆脈浮而緩者易治弦結而按之不鼓者難治或結或促或微皆可治代者危右關脈弦者木乘土位難治肺脈散者是心火刑肺金不治病夫咳逆者氣逆上衝而作聲也俗謂之厄逆是也其發也或三五聲而止或七八聲而止或連續不絶收氣不回者然所得之由不同有因久病胃虛而得者有因傷寒失下而得者有因痰熱內鬱火氣衝上而得者有因過服寒劑胃寒而得者有因水氣停痰心下痞悸而得者大抵咳逆者不順之義治治法當以降氣化痰和胃為主隨其所感而用藥其或病久脾胃衰敗而發咳逆額上出汗連聲不絶者最為惡候不治之證也方鮮陳湯治厄逆欲死半夏五錢生薑二錢半上銼一劑水煎服溫中散治吐瀉及病後胃中虛寒咳逆至三四聲或數聲相連收氣不回者難治丁香一錢柿蒂一錢人參一錢茯苓一錢橘皮一錢良薑一錢半夏一錢生薑一錢半甘草三分上銼一劑水煎服羌活附子湯治吐利後胃寒發厄羌活附子泡去皮小茴炒各一錢乾薑泡木香各一錢丁香一錢上銼棗一枚水煎入鹽少許不拘時溫服橘參飲治吐利後胃虛膈熱而咳逆者橘皮五錢人參二錢竹茹二錢甘草炙一錢上銼作一劑生薑五片棗三枚水煎服黃荊散治傷寒發熱而咳逆者黃荊子不拘多少炒水煎服嗅法治咳逆服藥無效者好硫黃乳香各等分以酒煎急令患之嗅之雄黃酒明雄黃一錢酒一盞煎七分急令患人嗅其熱氣即止吞酸脈脈弦而滑兩寸或浮而弦或浮而滑或沉而遲或緊而洪或洪而數或沉而遲胸中寒飲洪數者熱痰在膈間時吐酸水欲成翻胃之疾也病丹溪曰吞酸與吐酸不同吐酸素問明以為熱東垣又言為寒何也吐酸是吐出酸水如醋平時津液隨上升之氣鬱積而成鬱積而久溫中生熱故從火化遂作酸水吐出非熱而何其有積之以久不能自湧而出伏於肺胃之間咯不得上咽不得下肌表得風寒則內熱愈郁而酸味刺心肌表得溫暖則腠理開發或得香熱湯丸津液得行亦得暫解非寒而何素問言熱者主其本東垣言寒者言其標也戴氏曰濕熱在胃口上飲食入胃被濕熱鬱遏其食不得傳化故作酸也如穀肉在器濕熱則易為酸也原病式曰吐酸者肝木之謂也由火盛制金不能平木則肝木自盛故為酸也如飲食熱則易於酸矣必用糲米蔬菜以自養宜節厚味方清郁二陳湯治吞酸刺心及吞酸嘈雜陳皮一錢半夏一錢茯苓一錢蒼朮八分川芎八分香附一錢神麯炒五分枳實炒八分黃連炒一錢梔子炒一錢白芍七分甘草三分上銼一劑生薑三片水煎服或為丸服尤效茱蓮丸治鬱積吞酸吳茱萸去梗湯泡浸半日炒陳皮去白黃芩陳壁土炒各五錢黃連陳壁土炒一兩蒼朮米泔浸炒七錢半上為末神麯糊為丸每服六七十丸津液咽下蒼連丸治鬱積吐酸蒼朮米泔浸炒一兩陳皮一兩半夏一兩薑汁炒黃連一兩半夏月倍用白茯苓一兩吳茱萸炒一兩冬月倍用上為末蒸餅為丸如緑豆大每服三十丸食後服曲術丸治中脘宿食留飲酸螫心痛口吐清水神麯炒三兩蒼朮米泔浸一兩半陳皮一兩加砂仁一兩上為細末生薑汁煮神麯糊為丸如梧桐子大每服七十丸薑湯送下平肝順氣保中丸雲林制批按此方治吞酸吐酸嘈雜噯氣兼治之劑治鬱火傷脾中氣不運胃中伏火鬱積生痰致令嘔吐吞酸嘈雜心腹脹悶常服順氣和中健脾開胃進美飲食化痰消滯清火抑肝香附米三兩童便浸三日炒川芎二兩陳皮去白三兩白朮四兩土炒厚朴一兩枳實二兩炒黃連薑汁炒一兩神麯炒二兩麥芽炒七錢木香三錢梔子薑汁炒二兩萊蔔子炒一兩半夏薑汁炒一兩半白茯苓一兩砂仁炒四錢乾生薑一兩山楂取肉二兩青皮六錢香油炒甘草炙四錢上為末竹瀝打神麯糊為丸緑豆大每服百丸食後白滾湯送下日服二次附噯氣病胃中有火有痰一云噫氣吞酸此係食鬱有熱火氣衝上用黃芩為君南星半夏陳皮為佐熱多加青黛方星半湯治胃中有鬱火膈上有稠痰故作噯氣南星半夏石膏香附梔子上銼生薑煎或作丸亦可軟石膏丸治食積痰火並瀉胃火軟石膏不拘多少研細上用醋糊丸如緑豆大每服二十丸滾湯送下嘈雜脈右寸關緊而滑兩手弦滑胸中有留飲寸脈橫者膈上有橫積也右關弦急甚者木乘土位欲作胃反難治病夫嘈雜者是痰因火動其證似飢不飢似痛非痛如有懊憹不自寧之狀者是也其證或兼噯氣或兼噁心漸至胃脘作痛痰火之為患也治治法以南星半夏橘紅之類以消其痰芩連梔子知母之類以降其火蒼朮白朮芍藥之類以健脾行濕壯其本元又當節欲無有不安者也一肥人嘈雜二陳湯加撫芎蒼朮白朮炒梔子一濕痰氣滯不喜食用三補丸加蒼朮倍香附方化痰清火湯批按此方治痰火嘈雜之劑治嘈雜南星半夏陳皮蒼朮白朮白芍黃連黃芩梔子知母石膏甘草上銼生薑三片煎服養血四物湯治血虛嘈雜當歸川芎白芍熟地黃人參茯苓半夏黃連梔子甘草上銼生薑三片煎服去人參加香附貝母甚效茯苓補心湯批按此方治血虛嘈雜之劑治婦人心胸嘈雜氣盛血衰者即參蘇飲合四物湯
