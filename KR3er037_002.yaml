body:
  text: 卷之二藥性藥性賦業醫之道藥性為元品味雖多主治當審人參補元氣瀉虛熱而止渴色蒼肺實休憑黃耆補三焦斂盜汗而抵瘡肥白衛虛宜準白朮健脾強胃主濕痞虛痰蒼朮發汗寬中導窠囊積飲茯苓安驚利竅益氣生津和中用白而導水用赤禁與陰虛甘草補氣助脾調和百藥溫中用炙而瀉火用生滿家須謹川芎血中氣藥通肝部而療頭疼當歸血中主藥身養新而梢逐損白芍藥瀉脾伐肝療血虛腹痛下痢用炒而後重用生赤芍藥性味酸斂治瘡瘍熱壅調經最宜而産後最禁熟地黃補血而療虛疼生地黃生血而涼心腎酒炒則俱溫薑製無膈悶半夏薑製和中止嘔大醫痰厥頭疼貝母去心治嗽消痰煩熱結胸合論南星主風痰破傷身強膽制尤佳枳實治虛痞消食行痰麩炒最捷枳殼寬中削積氣滯所宜青皮下食安脾泄肝大穩陳皮留白和中補胃去白泄氣消痰厚朴用苦治脹寬膨用溫益氣除濕大腹皮開胃通腸泄脹滿煎用薑鹽檳榔降氣殺蟲祛後重性如鐵石草果仁寬中截瘧更除酸水寒痰肉豆蔻止痢調中又且解酲消食草豆蔻制熟客寒胃痛方宜白豆蔻炒香目翳胸膨可覓香附理胸膈不和氣血凝滯婦室如仙烏藥主心腹暴痛小便滑數女科最急三稜利血消癥癖折傷産後多疼蓬朮通理內傷榮心脾瘀結諸積山楂子導氣消食健脾更攻兒枕使君子療瀉祛蟲止痛大治兒疳大黃奪土將軍逐滯通瘀下胃腸結熱巴豆斬關猛將削堅通閉蕩臟腑沉寒玄胡祛宿垢消癥瘕豁痰化積芒硝開結熱通臟腑泄實軟堅葶藶瀉肺喘利小便炒須隔紙牽牛逐膨腫利水道更損胎元木通瀉小腸開熱閉而行澀溺車前主滲利清目赤而實大便豬苓治水氣浸淫服多損腎澤瀉治淋癃脫垢濕腫神丹薏苡下水寬膨療肺癰痿咳燈心通淋利濁吹喉痹危難滑石蕩積聚通津利水防己療風濕腳氣痠疼木瓜理下焦濕腫芫花治水病留痰大戟虛浮可瘥甘遂腫脹皆安榆皮性滑善行消浮急劑石葦去毛微炒淋閉均堪萆薢導膀胱宿水關節痠疼腰足冷痛商陸利胸腹腫滿水家峻藥性味酸辛萹蓄捐疸痔利熱淋蛔疼自已香薷清肺家分暑濕霍亂隨痊黃芩枯則瀉肺退熱痰實則涼大腸而化源獲救黃連生則瀉心清熱毒酒炒厚腸胃而薑製除嘔黃柏瀉伏火而扶痿厥大治陰虛知母滋腎水而除煩渴骨蒸是守石膏解肌表而消煩渴降胃火而理頭疼山梔止衄吐而炒如墨涼肺胃而泡用酒麥門冬引生地黃至所補之處而生津止渴天門冬引熟地至所補之鄉而保肺治痰嗽柴胡少陽要藥在肌主氣在臟調經前胡通治風寒寧嗽消痰安胎不謬葛根解肌清酒渴而醒補胃脾竹葉止渴療虛煩而喉風退走竹茹止嘔噦咳逆尤安熱病血家竹瀝治風痓虛痰又主金瘡産後連翹退諸經客熱癰腫須尋鼠黏療風熱癮疹瘡瘍並奏青黛除熱毒蟲積疳痢收五臟鬱火而瀉肝玄參主虛熱明目祛風治無根之火而補腎栝蔞子下氣喘結胸痰嗽斯專天花粉治熱痰止渴消煩獨任草龍膽主下焦火濕明目涼肝山豆根解咽喉疼痛退黃消腫地骨皮治骨蒸有汗涼血解肌牡丹皮治無汗骨蒸破血止衄常山捐痰瘧醋炒方嘉紫草利水消膨痘瘡總屬茵陳主黃疸而利小便艾葉保胎痛而療崩漏胡黃連骨蒸勞熱小兒疳痢當求川升麻發表除風舉胃升陽最速桔梗療肺癰咽痛利膈寬胸桂枝解衛弱寒邪橫行肢節麻黃髮表寒止汗用其根防風捐腦痛泄肝除風毒細辛發少陰汗除頭痛痰咳諸風白芷行陽明經退頭痛皮膚癢粟羌活排巨陽癰腫風濕四肢獨活治頭頸項難舒痿痹雙足藁本除疼於巔頂薄荷清陽於首面藿香止霍亂而開胃溫中紫蘇利胸膈而子醫喘嗽荊芥散血中風熱瘡瘍頭痛俱良苦參治細疹大風除濕補陰不淺澤蘭療胎産打撲行氣消癰天麻主眩暈風癇語言澀謇桑寄生續筋骨益血脈利腰背掣痛甘菊花治頭風消目疾退紅睛淚眼蔓荊子祛風明目除頭痛濕痹能安威靈仙祛風止痛治腰膝骨吞自軟木賊去目翳崩漏汗風尤妙葳蕤療目爛腰疼風濕最善何首烏消瘡腫黑髮延年萆麻子引刺骨催生最便石菖蒲開心明耳目去痹除風白附子祛風治面斑崩中悉斷郁李仁潤血燥除浮利水破故紙主勞損腎冷陽衰高良薑治霍亂轉筋而調氣消食吳茱萸療厥陰疝痛而胃冷能除川烏陽中少陽溫臟腑寒邪諸積冷痛附子陽中純陽補三焦厥逆六腑寒拘茴香主霍亂腹疼調中暖胃牛膝利月經阻澀膝痛精虛蓯蓉能峻補精血過用反致便澀杜仲主腎虛骨痿入藥酥炙去絲鎖陽味甘補陰如虛而大便不燥結者不用鹿茸甘溫益氣治女子崩帶而男子溺血遺精枸杞益精氣而明目祛風山藥能補腎而生消腫核山茱萸澀精補腎而核反滑精巨勝子補髓填精而延年駐色益智仁鹽煎捶碎自然暖腎固精菟絲子補髓填精大治虛寒遺瀝遠志去心草制壯神益志夢遺驚悸何愁巴戟去心酒浸療腫除風虛病鬼交須覓茯神去木益心脾開心助志而除健忘酸棗取仁寧魂魄多眠用生而不眠炒五味消煩止嗽渴生脈補元杏仁溫潤大腸冷嗽尤妙桑白皮甘寒治咳嗽痰中見血肺實方宜金沸草甘寒逐痰水唾如膠漆秋行最好阿膠麵炒益肺安胎止嗽血崩下痢皆宜紫菀酒洗熱寒氣結胸中咳血唾痰立效百合斂肺止嗽休無百部勞嗽骨蒸莫少款冬花甘辛潤肺消痰止嗽肺癰肺痿全憑馬兜鈴苦寒清肺下氣定喘血痔痿瘡須要訶子斂嗽化痰止痢除崩烏梅止渴生津和中斷下地榆療崩漏下行諸血胃弱須防粟殼止滑泄虛痢頻仍積瘀莫下茅根茅花吐紅鼻衄自消槐角槐花血痔腸風自罷小薊療宿血嘔衄崩漏折傷大薊前功之外癰疽腫痛還醫紅花主敗血經枯血虛血暈蘇木前證之餘死血瘡瘍更藉桃仁破滯生新潤閉燥逐瘀惡活血有功柏葉善守益脾安蔑衄止血崩補陰無價靈脂去心腹死血作疼炒除漏下蒲黃主胎産惡露凝滯炒黑醫崩凌霄花血痛所宜治熱毒而補陰甚捷白頭翁治血痢神效止鼻衄而頭癩多功鬱金苦寒善散治女子赤淋血氣心痛延胡辛溫活血主小腸疼刺胎産皆同薑黃辛熱主經閉癥瘕血塊癰腫秦皮苦寒治驚癇崩帶痹濕寒風秦艽主黃疸四肢風濕漏蘆能下乳療眼醫癰海藻海帶療疝氣癭瘤軟堅利水白芨白蘞癰疽瘡癬長肉箍膿藜蘆吐痰殺疥椿皮止瀉澀精蘆根止消渴噎膈氣滯麝干已積痰結痰喉痛海桐皮漱牙洗目除風性味苦平無毒五加皮女人腰痛陰癢男子溺濁淋癃梧桐淚治風熱牙疼牛馬急黃研飲木鱉子主乳癰腫痛肛門痔腫堪平松胎療疽瘡白禿死肌節已腳痹虛風子補虛羸不足皂角治痰涎中風口噤子導五臟風熱刺達癰潰之經天竺黃療驚風中風失音痰壅密蒙花治熱疳入眼膚翳青盲五倍主齒慝血痔脫肛頓愈硇砂破癥瘕積聚生服爛心乾漆削積破堅還醫血暈蘆薈殺疳敷癬清熱平驚沒藥破血捐疼大利折傷産後阿魏消瘕破癖最能削塊除癥丁香止嘔因寒消風療瘧木香行肝氣阻澀胸脅俱疼沉香療風水腫又止轉筋霍亂檀香似此之外更除惡氣相侵乳香止痛催生療諸瘡如桴應鼓麝香辟邪殺鬼攻風疰如影隨形龍腦主風濕積聚不宜入眼蘇合殺蟲毒惡氣溫瘧如神烏犀角解熱毒而化血清心以入陽明故升麻可代羚羊角治驚狂而祛風目性寒味苦故肺肝能清殭蠶去皮膚風行癢痹全蠍止小兒驚搐風癇牡蠣主女人帶下崩中澀精斂汗蛤粉攻疝痛反胃能軟頑痰牛黃主狂躁驚癇定魄退熱龍骨主遺精崩痢斂瘡收汗縮便虎骨理寒濕風毒去惡瘡而安驚治産龜板主補陰續骨逐瘀血而酥炙宜丸鱉甲除崩止漏消痃癖骨蒸勞熱龜甲破症醫漏攻瘧痔勞復傷寒羊乳性溫潤心肺止消渴利大便安嘔噦口瘡熱腫宜含飲牛乳微寒補虛羸療渴疾潤胃干滋血燥並宜冷飲畏羹酸象牙性寒出雜物入肉又消骨鯁龍齒神物療癲邪寧志更主安驚蝸牛專治五痔而更醫溫毒田螺殼安反胃而肉敷熱睛虻蟲善行積血黍米炮去頭足水蛭能吮下疽煅則破血通經白丁香潰癰點目自然銅接骨續筋銅緑明目釣涎止金瘡出血金箔安魂定魄鎮狂叫邪驚水銀唾研殺疥癩而下死胎若過服令人痿躄輕粉性冷殺瘡蟲而治瘰癧以傷胃故動齒齦硫黃逐冷壯陽利風痹而殺疥砒霜除齁截瘧有大毒而不仁雄黃理息肉治喉風溫邪蛇毒辰砂通血脈殺鬼魅養氣安神白礬消痰療瀉痢惡瘡喉痹琥珀消血主安心利水通淋赤石脂止瀉除崩法當醋炒花蕊石金瘡崩産煅用泥封東壁土主脫肛泄痢霍亂伏龍肝治遺精崩漏吐血大棗養胃和脾遇中滿而勿與胡桃入夏禁食雖肥肌而動風藕實補中益氣柿蒂止噦神功蔥白解表除風善治陽明頭痛瓜蒂吐痰宣食消浮退疸皆通乾薑生髮表炒和中定疼止痛生薑除頭痛平嘔噦痰嗽還同大蒜雖化食而耗氣傷脾終成目疾韭汁利胸膈而下痰清火子乃澀精胡荽酒煎噴痘自然紅潤蘿蔔子炒研入藥下氣寬脹胡椒燥食寬胸肺胃真氣自耗川椒溫中去冷目中雲氣能空縮砂定胎痛主食傷泄瀉神麯溫胃脘導食積攻衝麥蘖性溫行上焦滯血宿食腸鳴宜用麩皮性涼消大腸停積壅留陳莝堪投紅曲健脾活血消食諸痢得效浮麥養心煎同大棗盜汗能收麻仁血閉腸枯入湯或粥扁豆轉筋霍亂單服能廖緑豆主霍亂反胃解一切丹毒赤豆塗癰疽焮熱消水腫虛浮粳米和胃溫中陳倉為上粟米補血除熱腎病須求豆豉治傷寒胸中懊憹石蜜安五臟益氣蠲疼飴糖斂汗補虛消痰止嗽米醋清咽退腫功效如神鹽消痰癖溻瘡瘍食多損肺酒通血脈厚腸胃痛飲傷生乳汁已目赤睛昏卻老還童功不淺童便益虛勞寒熱損傷産後並宜行血餘灰乃亂頭髮淋閉鼻紅有準人中白即溺桶垢肺癰唾衄須憑此特摘集偏長之功用譬諸高遠將自卑而升運氣五運主病諸風掉眩皆屬肝木諸痛癢瘡瘍皆屬心火諸濕腫滿皆屬脾土諸氣膹鬱病痿皆屬肺金諸寒收引皆屬腎水六氣主病風諸暴強直支痛緛戾里緊筋縮皆屬於風厥陰風木乃肝膽之氣也熱諸病喘嘔吐酸暴注下迫轉筋小便渾濁腹脹大鼓之如鼓癰疽瘍疹瘤氣結核吐下霍亂瞀郁腫脹鼻鼽衄血溢血泄淋閉身熱惡寒戰栗驚惑悲笑譫妄衄蔑血汙皆屬於熱少陰君火之熱乃真心小腸之氣也濕諸痙強直積飲痞膈中滿霍亂吐下體重胕腫肉如泥按之不起皆屬於濕太陰濕土乃脾胃之氣也火諸熱瞀瘈暴喑冒昧躁擾狂越罵詈驚駭胕腫痠疼氣逆上衝禁栗如喪神守嚏嘔瘡瘍喉啞耳鳴及聾嘔湧溢食不下目昧不明暴注瞤瘈暴病暴死皆屬於火少陽相火之熱乃心胞絡三焦之氣也燥諸澀枯涸幹徑皴揭皆屬於燥陽明燥金乃肺與大腸之氣也寒諸病上下所出水液澄徹清冷癥瘕㿗疝堅痞腹滿緊痛下利清白食已不飢吐利腥穢屈伸不便厥逆禁固皆屬於寒太陽寒水乃腎與膀胱之氣也中風脈風邪中人六脈多沉伏亦有脈隨氣奔指下洪盛者挾寒則脈帶浮遲挾暑則脈虛挾濕則脈浮澀脈經曰脈微而數中風使然寸口沉大而滑沉則為實滑則為氣氣實相搏入於腑則愈此為卒厥不知人唇青身冷為入臟死身溫和汗自出為入腑而復自愈脈陽浮而滑陰濡而弱者宜吐或浮而滑或沉而滑或微而虛者皆虛與痰也大法宜浮遲不宜強大數若脾脈緩而無力者最為難治蓋風喜歸肝肝木克脾土則大便洞泄故不治也證夫風中於人也曰卒中曰暴僕曰暴喑曰矇昧曰喎僻曰癱瘓曰不省人事曰語言謇澀曰痰涎壅盛或死或不死皆以為中風之候也內經曰風者百病之長也至為變化乃為他病無常方又曰風者善行而數變又曰風之傷人也或為寒熱或為熱中或為寒中或為厲風或為偏枯千金云岐伯所謂中風大法有四一曰偏枯謂半身不遂也二曰風痱謂身無疼痛四肢不收也三曰風懿謂奄忽不知人也四曰風痹謂諸痹類風狀也金匱要略曰寸口脈浮而緊緊則為寒寒虛相搏邪在皮膚浮者血虛絡脈空虛賊邪不瀉或左或右邪氣反緩正氣即急正氣引邪喎僻不遂邪在於絡肌膚不仁邪在於經即克不勝邪入於腑即不識人邪入於臟舌即難言口吐痰沫是以古之明醫皆以外中風邪立方處治及近代劉河間李東垣朱丹溪三子者出始與古人異矣河間曰中風癱瘓者非謂肝木之風實甚而卒中之亦非外中於風良由將息失宜心火暴甚腎水虛衰不能制之則陰虛陽實而熱氣怫鬱心神昏冒不用而卒倒無所知也多因喜怒思悲恐五志有所過極而卒中者夫五志過極皆為熱甚故也俗云風者言末而忘其本也東垣云中風非外來風邪乃本氣自病也凡人年逾四旬氣衰之際或因憂喜忿怒傷其氣者多有此證壯歲之時無有也若肥者則間而有之亦是形盛氣衰故如此耳丹溪曰有氣虛有血虛有痰盛又曰西北氣寒為風所中誠有之矣東南氣溫而地多濕有風者非風也皆是濕生痰痰生熱熱生風也三子之論河間主乎火東垣主乎氣丹溪主乎濕反以風為虛象若以三子為是古人為非則三子未出之前固有從古人而治愈者若以古人為是三子為非則三子已出之後亦有從三子而治愈者大抵古人與三子之論皆不可偏廢蓋古人之論言其證也三子之論言其因也因則為本證則為標其所謂外中風邪者未必不由元精虛弱榮衛失調而後感之也其所謂因火因氣因濕者亦未必絶無外邪侵侮而作也治治風之法全在活變若重於外感者先驅外邪而後補中氣重於內傷者先補中氣而後驅外邪或以散風藥為君而以補損藥為臣使或以滋補藥為君而以散邪藥為臣使量重輕而處之也內經曰有取本而得者有取標而得者有本而標之者有標而本之者又曰急則治其標緩則治其本若夫初病暴僕昏悶不省人事或痰涎壅盛舌強不語兩寸口脈浮大而實者急宜瓜蒂藜蘆等藥吐之以遏其勢或人迎脈緊盛或六脈俱浮弦者急用小續命湯表之蓋風氣太盛心火暴甚而痰涎壅遏於經絡之中於斯時也豈尋常藥餌而能通達於上下哉或本方加附子以其稟雄壯之資而有斬關奪將之勢能引人參輩並行於十二經以追復其失散之元陽又能引麻黃杏仁輩發表開腠理以祛散其在表之風寒引芎歸芍藥輩入血分行血養血以滋養其虧損之真陰或加石膏知母以降胃火或加黃芩以清肺金看所挾見證與夫時月寒溫加減施治病勢稍退精神稍復輒當改用丹溪之法而以補氣補血消痰之劑以調其本氣而安此急則治其標與夫標而本之治也凡人手足漸覺不隨或臂膊及髀股指節麻痹不仁或口眼喎斜語言謇澀或胃膈迷悶吐痰相續或六脈浮滑而虛軟無力雖未至於倒僕其為中風暈厥之候可指日而定矣早當從丹溪之法調治其左手脈不足及左半身不遂者以四物湯補血之劑為主治右手脈不足及右半身不遂者以四君子湯補氣之劑為主治痰盛者二陳導痰等湯兼用氣血兩虛而挾痰者八物湯加南星半夏枳實竹瀝薑汁之類若夫真元漸復痰飲漸消或覺有風邪未退者仍以羌活愈風湯防風通聖散之類出入加減調治而安此緩則治其本與夫本而標之之治也抑考先哲有云其證有中臟中腑之分證各不同中腑者多著四肢故面加五色脈浮而惡風寒四肢拘急不仁或中身之前或中身之側皆曰中腑也其治多易中臟者多滯九竅唇緩失音鼻塞耳聾目瞀大小便閉結皆曰中臟其治多難大法中腑者小續命以發其表中臟者三化等湯以通其里臟腑兼見者又不可拘泥或一氣之微汗或一旬之通利又曰治須少汗亦須少下多汗則虛其衛多下則損其榮斯又不可不謹或外無六經之形證內無便溺之阻隔但手足不隨語言謇澀者此邪中於經又當從乎中治而不可以標本論也是以養血通氣大秦艽湯羌活愈風之類治之外有痿痹氣厥脾虛傷食及乎土太過令人四肢不舉之候皆似中風又當體察明白各從其類以治之不治證凡中風但見髮直搖頭吐沫上竄面赤如妝汗綴如珠或頭面青黑痰聲如拽鋸者皆不治若目閉手散鼻鼾口張遺尿不知此五者為五臟絶死候但見其一猶當施治若心腎絶尤難治也若動止筋痛是無血養筋故痛白筋枯不治一切初中風中氣昏倒不知人事牙關緊急涎潮壅塞口眼喎斜半身不遂精神恍惚倉卒之際急以手大指掐刻人中即醒或急令人將病者兩手兩足從上而下頻頻趕出四肢痰氣即散免致攻心即醒或急以三稜針刺手中指甲角十井穴將去惡血就以氣針刺合谷二穴人中一穴皆是良法如或未效用通關散通鼻即提起頭頂法候有嚏可治無嚏不可治如口噤不開破棺散擦之口即開即多灌香油或少加麝香一二分或用薑汁亦可或太白散化風丹攝生飲之類當隨證選而用之如風痰頑結諸藥不效者奪命散一服即愈一痰涎壅盛者口眼喎斜者不能言語者皆當用吐法宜獨聖散吐之或口噤用藜蘆末少加麝香灌入鼻內吐之一吐不已再吐之亦有氣血虛而不可用吐法者肥人多有中風以其形盛於外而氣歉於內也肺為氣出入之道人胖者氣必急氣急則肺邪盛肺金剋木膽為肝之腑故痰涎壅盛所以治之必先理氣為急中後氣未盡順痰未盡除調理之劑惟當以藿香正氣散加南星木香防風當歸此藥非特治中風之證而中惡中氣尤宜一氣虛卒倒參耆補之挾痰則濃煎人參湯加竹瀝薑汁血虛四物湯補之挾痰者四物湯以薑汁炒過更加竹瀝薑汁一左癱右癱者因氣血虛而痰火流注也血虛則痰火流注於左而為左癱宜四物湯加白芥子竹瀝薑汁兼有死血加桃仁紅花氣虛則痰火流注於右而為右癱宜四君子湯合二陳湯加白芥子竹瀝薑汁能食者去竹瀝加荊瀝尤妙肥人多濕少加附子行經癱瘓初起急治則可久則痰火鬱結而難治也一中風飲食坐臥如常但失音不語俗呼為啞風小續命去附子加石菖蒲一錢或訶子清音湯亦可然不語豈止一端有舌強不語有神昏不語有口噤不語有舌縱語澀有舌麻語澀其間治痰治風安神養氣血各從活法又難拘續命訶子而已一中氣亦似中風但風中口中多痰涎氣中則無又風中身溫氣中身冷風中脈浮洪氣中脈沉伏此七情內傷氣逆為病治當順氣用烏藥順氣散八味順氣散主之或藿香正氣散亦可經云無故而喑脈不至不治自已謂氣暴逆也氣復則已審如是雖不服藥亦自可一中風中氣口眼喎斜語言謇澀或口噤牙關緊急筋脈攣縮骨節痠疼行步艱辛一應風氣疼痛太乙紫金丹用酒磨服方見通治一中風不語癱瘓初起宜導痰小胃丹用薑湯送三五十丸少時即能言語如故方見痰飲一中風頭痛如破語言謇澀小續命湯加羌活一中風口眼喎斜頭疼發熱惡風初作者羌活沖和湯加獨活藁本方見傷寒一中風一身俱麻烏藥順氣散加人參白朮川芎當歸麥門冬一中風面目十指俱麻乃氣虛也補中益氣湯加木香附子羌活防風烏藥方見內傷一中風滿身刺痛四物湯加荊芥防風蔓荊子蟬蛻麥門冬方見補益一中風半身不遂羌活愈風湯加天麻荊芥殭蠶方通關散祕方批按此方治不省人事者吹鼻通竅之劑治中風不語不省人事水湯不入天南星半夏豬牙皂莢各五分上為末每用少許吹鼻有嚏可治無嚏不可治破棺散批按此方治口噤者擦牙開關之劑治中風牙關緊急難以下藥天南星五分片腦少許上五月五日午時合每用五分於病人牙間頻頻擦之令熱牙關自開奪命散治卒暴中風涎潮氣閉牙關緊急眼目上視破損傷風搐搦潮作及小兒急驚風並治天南星甜葶藶香白芷半夏湯泡去皮巴豆去殼不去油各等分生用上為細末每服五分生薑汁二三匙調下牙關緊急湯劑灌不下者此藥輒能治之小兒以利痰或吐為愈按此方風痰必頑結者宜用之獨聖散批按此方治痰壅盛者吐痰之劑治中風痰迷心竅癲狂煩亂人事昏沉痰涎壅塞及五癇心風等證甜瓜蒂上為末每服五分重者一錢熟水調下即吐如不吐須再進一服倘不止以白湯止之或蔥湯亦妙或麝香少許研水飲之即解如吐風痰加全蠍五分微炒如有蟲者加雄黃五分豬脂油五分甚者加芫花五分其蟲立吐如濕腫滿如赤小豆末一錢凡吐令人目睛上竄吐時令閉雙目太白散祕方治中風痰氣厥絶心腹微溫喉間微響此藥下痰如神陳石灰千年古者石刮去土為細末水飛過每服三錢水一碗煎至七分溫服太玄湯祕方治中風失音昏迷欲死染布活靛缸水一盞溫而灌之即能言語化風丹治一切中風痰厥風癇牙關緊急不省人事及小兒驚風搐搦角弓反張發熱痰嗽喘促天南星牛膽制過二錢天麻煨防風去蘆荊芥穗羌活獨活去蘆人參去蘆細辛川芎各一錢木香五分上為細末煉蜜為丸如芡實大硃砂為衣薄荷泡湯研化服因氣忿用紫蘇湯化下如牙關口噤用少許擦牙即開攝生飲治一切卒中不論中風中寒中暑中濕及痰厥氣厥之類不省人事者初作即用此方神效蒼朮生一錢南木香天南星濕紙煨半夏湯泡各一錢五分遼細辛石菖蒲甘草生各一錢上㕮咀生薑七片水煎溫服痰盛加全蠍二枚炙三生飲批按此方治一切風痰氣厥不省人事初作者通治之劑治中風昏不知人口眼喎斜半身不遂聲如拽鋸痰涎上壅無問外感風寒內傷喜怒或六脈沉伏或指下浮盛並宜服之兼治痰厥氣厥及氣虛眩暈若直氣虛而風邪所乘加人參一兩天南星一兩川烏去皮尖黑附子去皮尖各五錢木香二錢五分上㕮咀生薑十片水煎溫服如氣盛人只用南星五錢木香一錢生薑十四片水煎服烏藥順氣散治男子女人一切風邪攻注遍身麻痹骨節痠疼手足癱瘓語言謇澀筋脈拘攣步履艱辛腿膝軟弱婦人血氣不調胸膈脹滿心腹刺痛吐瀉腸鳴凡治風先理氣氣順則痰自消風自散麻黃去節陳皮去白烏藥各二錢川芎白芷殭蠶炒枳殼麩炒桔梗去蘆各一錢乾薑炮五分甘草炙三分上㕮咀生薑三片黑棗二枚水二鍾煎八分溫服如憎寒壯熱肢體倦怠加蔥白遍身瘙癢加薄荷手足拘攣加木香石斛濕氣加蒼朮白朮檳榔足浮腫加牛膝五加皮獨活遍身疼痛加當歸官桂乳香沒藥自汗加黃耆麻黃根去麻黃乾薑胸膈脹滿加枳實莪朮頭眩加細辛細茶腳不能舉動加羌活防風麝香心腹刺痛加小茴香手足不能動頭不能起加川續斷威靈仙陰囊浮腫合五積散四肢冷痹加川烏附子交桂秦艽久患左癱右瘓去麻黃乾薑加天麻防風羌活半夏南星木香當歸麻痹作痛加天雄細辛防風婦人血風加防風荊芥薄荷臂痛加羌活防風薄桂蒼朮紫蘇氣滯腰痛加桃仁入酒同服背心痛合行氣香蘇散加蒼朮半夏茯苓口眼喎斜加薑炒黃連羌活防風荊芥竹瀝薑汁麻痹疼痛極者合和三五七散午後痛甚合和神祕左經湯經年不能舉動者合和獨活寄生湯八味順氣散批按此方治中風中氣者先宜此順氣之劑凡中風先服此藥順氣然後治風人參去蘆片白朮炒白茯苓白芷青皮陳皮去白烏藥各二錢甘草一錢上㕮咀分作二劑每一劑用水二鍾煎至八分濾去渣食遠服或加南星木香以醒痰氣或痰盛加半夏二錢生薑三片小續命湯批按此方治風中腑者發表之劑治卒暴中風不省人事半身不遂口眼歪邪手足顫掉語言謇澀肢體麻痹精神眩亂頭目昏花痰涎壅盛筋脈拘攣及腳氣緩弱不能動履屈伸治外有六經之形證則此方加減以發其表防風二錢麻黃去節杏仁泡去皮尖白芍藥肉桂川芎防己黃芩人參去蘆甘草炙各一錢四分附子泡去皮臍七分上㕮咀生薑五片水二鍾煎至一鍾溫服凡中風不審六經之加減用藥雖治之不能去其邪也內經曰開則淅然寒閉則熱而悶知暴中風邪宜先以續命湯隨證加減治之太陽中風無汗惡寒麻黃續命主之依本方麻黃防風杏仁各加一倍太陽中風有汗惡風桂枝續命主之依本方桂枝芍藥杏仁各加一倍陽陰中風有汗身熱不惡寒白虎續命主之依本方甘草加一倍外加石膏知母各一錢陽明中風有汗身熱不惡風葛根續命主之依本方桂枝黃芩各加一倍外加葛根一錢太陰中風無汗身涼附子續命主之依本方附子加一倍中風六證混淆系之於少陽厥陰或肢節攣痛或麻痹不仁宜羌活連翹續命主之小續命八錢外加羌活二錢連翹三錢大法春夏加石膏知母黃芩秋冬加肉桂附子芍藥有熱去黑附子加白附子筋脈拘攣語遲脈弦加薏苡仁若筋急加人參去黃芩芍藥以避中寒服藥後稍輕再加當歸煩躁不大便去附子肉桂倍芍藥加竹瀝大便燥結三五日不出胸中不快加枳實大黃語言謇澀手足戰掉加石菖蒲竹瀝發渴加麥門冬天花粉乾葛熱而渴加秦艽身痛加羌活搐者亦加之煩躁多驚加犀角羚羊角多怒加羚羊角恍惚錯語加茯神遠志不能言加竹瀝失音不語加石菖蒲頭痛如破加羌活骨節痛此有寒濕倍附子肉桂嘔逆腹脹加人參半夏腳膝屈弱加牛膝石斛腰疼加桃仁去皮尖杜仲薑汁炒不眠加酸棗仁痰多加天南星肥人多濕加烏頭附子行經用童便浸煮以殺其毒以助下行之力入鹽尤妙臟寒下痢去防己黃芩倍附子加白朮或歌笑哭泣妄言譫語加白朮倍麻黃人參桂枝自汗去麻黃杏仁加白朮三化湯批按此方治風中臟者通利之劑治中風外有六經之形證先以加減續命湯隨證治之內有便溺之阻隔復以此藥導之厚朴薑汁炒羌活大黃枳實各等分上㕮咀薑三片水二鍾煎一鍾溫服以利為度不利再投如內邪已除外邪已盡當從愈風湯以行中道加減治之久則清濁自分榮衛自和而大病悉去矣大秦艽湯治中風外無六經之形證內無便溺之阻隔知血弱不能養於筋故手足不能運動舌強不能言語宜養血而筋自榮秦艽甘草當歸川芎白芍藥石膏獨活白茯苓各一錢羌活防風黃芩白芷白朮熟地黃生地黃各五分細辛三分心下痞滿加枳實一錢上㕮咀加竹瀝薑汁薑三片水二鍾不拘時服羌活愈風湯批按此方治風中經者調血養血之劑治肝腎虛筋骨弱語言謇澀精神昏憒風濕襲虛入人經絡或瘦而一肢偏枯或肥而半身不遂大抵心勞則百病生心靜則萬邪息此藥能安心養神調理陰陽使無偏勝治中風內外無邪服此藥以行中道羌活甘草蔓荊子防風去蘆川芎細辛去苗枳殼麩炒熟地黃人參去蘆麻黃去節薄荷甘菊花當歸去蘆知母去毛黃耆地骨皮去骨獨活白芷杜仲酒炒去絲枸杞子秦艽柴胡去蘆半夏薑製梓厚朴薑汁炒前胡防己各三分黃芩白茯苓白芍藥各四分石膏蒼朮生地黃各六分桂枝一分上㕮咀水二盞煎一盞溫服遇陰雨加薑三片防風通聖散治中風一切風熱大便燥結小便赤澀頭面生瘡眼目赤痛或熱極生風舌強口噤或鼻生紫赤風刺癮疹而為肺風或成風厲而俗呼為大風或腸風而為痔漏或腸鬱而為諸熱譫妄驚狂悉能調治防風川芎當歸白芍藥大黃芒硝連翹麻黃不去節薄荷各四分石膏桔梗黃芩各八分白朮山梔仁荊芥各二分滑石二錢四分甘草炙一錢上㕮咀生薑三片水二盞煎一盞溫服勞汗當風汗出為皶郁乃坐勞出於玄府脂液所凝去芒硝倍加芍藥當歸發散玄府之風當調其榮衛俗云風刺生癮疹或赤或白麻黃鹽豉蔥白出其汗麻黃去節並去芒硝咸走血而內凝故不發汗還依前方中加四物湯黃連解毒湯三藥合而服之日二服故內經曰以苦發之謂熱在肌表連內也小便淋澀去麻黃加滑石連翹煎藥湯調木香末二錢麻黃主表不宜里故去之腰脅走注疼痛加芒硝石膏當歸甘草各二錢調車前子末海金沙末各一錢內經曰腰者腎之府若破傷風者如在表則辛以散之在裡則苦以下之兼散之汗下後通利氣血祛逐風邪者每一兩內加荊芥穗大黃各二錢調全蠍末羌活末各一錢諸風潮搦小兒急慢驚風大便閉結邪熱暴甚腸胃乾澀上竄咬牙盜汗睡語轉筋驚悸肌肉蠕動每一兩加大黃一錢梔子二錢調茯苓末二錢肌肉蠕動者調羌活末一錢經曰肌肉蠕動命曰微風風傷於肺咳嗽喘急每一兩加半夏茯苓各二錢打撲損傷肢節疼痛腹中惡血不下每一兩加當歸大黃各三錢五分調乳香沒藥各二錢解利四時傷寒內外所傷每一兩內加益元散一兩蔥白十莖豆豉一合生薑五錢水一大碗煎八分先溫服一半以箸探之即吐吐後再熱服一半汗出立解飲酒中風身熱頭痛加黃連須二錢筋白十莖慎勿用桂枝麻黃湯解之頭旋鼻塞濁涕時下每一兩加薄荷黃連各二錢半內經曰膽移熱於腦則辛額鼻淵濁涕下不已也王冰曰膽液下澄則為濁涕下不已如水泉故曰鼻淵也此謂足太陽脈與陽明脈俱盛也氣逆者調木香末一錢服之癰疽腫毒一切惡瘡本方一兩倍連翹當歸加黃連茯苓木香人參白芷金銀花牡蠣黃耆各五分名勝黃飲子如瘡在上加當歸用酒浸發斑熱本方加黃連五錢祛風至寶丹批按此方治諸風燥熱者發表攻裡之劑治諸風熱等證防風芍藥各一兩半獨活羌活天麻石膏黃芩人參桔梗熟地黃白朮各一兩荊芥穗全蠍連翹山梔仁薄荷麻黃大黃芒硝細辛各五錢當歸川芎各二兩半甘草硃砂各二兩為衣黃連黃柏各六錢滑石三兩上為極細末煉蜜為丸如彈子大每一丸細嚼