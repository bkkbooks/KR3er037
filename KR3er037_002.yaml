仙延壽藥酒丹治久近風邪左癱右瘓語言謇澀手足拘攣紫白癜風風寒暑濕四氣交攻身體虛羸腰疼膝痛耳聾眼瞶下部諸虛及女子經血不調臍腹絞痛胸膨脅脹嘔吐噁心子宮虛冷赤白帶下一切諸疾皆有神驗此酒互相等制其性和緩其味甘香能追萬病善補諸虛和胃養丹田益精壯筋骨安和五臟定魄寧魂返老還童延年綿算病可盡驅效難罄筆人參去蘆白朮土炒甘草炙白茯苓各三兩當歸川芎白芍藥炒生地黃薑汁炒熟地黃枸杞子肉蓯蓉酒洗何首烏米泔浸牛膝去蘆天門冬去心麥門冬去心砂仁炒各二兩五錢川椒去梗目川烏去皮臍草烏圓者泡烏藥各一兩五加皮虎脛骨酥炙枳殼炒乾薑泡厚朴薑汁炒陳皮去白沉香茴香鹽酒炒香附童便浸炒羌活獨活防風去蘆白芷麻黃不去節細辛酒洗半夏制蒼朮米泔浸炒五味子破故紙炒桂各二兩紅棗去核酥油蜂蜜各半兩胡桃肉湯泡去皮上銼一處絹袋盛之用燒酒一罈罈浸三晝夜置鍋中重湯煮三時許取出埋土內泄火毒每日飲一二杯隨病之上下以定空心食後飲酒將盡復以藥渣曬乾為末酒丸如桐子大每日空心時酒下三十丸鹿角霜丸批按此方治諸風癱瘓屬虛寒者溫補之劑治半身痿弱或二三年動履者黃耆蜜炙二兩人參二兩白朮二兩白茯苓二兩當歸酒洗二兩川芎一兩肉桂一兩熟地黃二兩茴香炒一兩牛膝去蘆兩半木瓜兩半白芍藥酒炒二兩川烏兩半羌活一兩獨活一兩肉蓯蓉酒洗兩半檳榔一兩防風兩半烏藥炒兩半破故紙酒炒二兩木香二錢續斷一兩五錢甘草五錢蒼朮米泔水浸二兩附子二兩童便和麵包煨杜仲二兩薑汁炒去絲虎骨脛酥炙一兩五錢鹿角霜一斤上為極細末酒丸梧子大空心米湯送下百丸健步虎潛丸祕方批按此方治諸風癱瘓口喎舌強屬虛熱者滋補之劑治中風左癱右瘓語言謇澀黃耆鹽水炒一兩半人參去蘆一兩白朮炒二兩白茯神去皮木一兩當歸酒洗一兩生地黃酒洗二兩熟地黃二兩木瓜一兩羌活酒洗一兩獨活酒洗一兩防風酒洗一兩白芍藥鹽酒炒二兩枸杞子酒洗二兩五味子五錢虎脛骨酥炙二兩龜板酥炙一兩五錢牛膝酒洗二兩杜仲酒炒二兩破故紙鹽酒炒一兩黃柏人乳拌鹽酒炒二兩知母人乳拌鹽酒炒一兩麥門冬去心二兩遠志甘草水泡去骨二兩石菖蒲一兩酸棗仁炒一兩薏苡仁炒一兩沉香五錢附子五錢童便浸去皮臍麵裹煨上為極細末以神麯六兩生薑汁一盞竹瀝一碗豬脊髓五條同煉蜜打為丸如梧子大每服百丸空心淡鹽湯送下竹瀝枳朮丸化痰清火理胃調脾肥白氣虛之人宜服此藥預防倒僕之患至神至妙枳實麩炒一兩白朮土炒一兩蒼朮米泔浸鹽水炒一兩天南星制半夏制黃芩酒炒一兩白茯苓一兩當歸酒洗五錢橘紅一兩山楂肉一兩黃連薑汁炒五錢白芥子炒一兩上為極細末以神麯六兩生薑汁一盞竹瀝一碗煮糊為丸如桐子大每日空心薑湯下百丸搜風順氣丸治諸風痿痹半身不遂口眼歪斜語言難辨肌肉頑麻眩暈耳鳴口苦無味憎寒毛疏癥癖瘕塊男子陽衰腎冷女子絶産陰虛俱能奏效錦紋大黃五兩酒浸九蒸九曬麻仁微炒去殼二兩郁李仁去皮殼泡二兩枳殼麩炒二兩乾山藥酒蒸二兩獨活一兩山茱萸酒蒸去核二兩檳榔二兩菟絲子一兩車前子炒二兩半牛膝酒浸曬乾二兩上為極細末煉蜜為丸如桐子大每服八十丸白湯送下早晚各一服久患腸風臟毒服之除根癱瘓語澀服之平復酒後能進一服宿酒盡消中年以後之人過用厚味酒肉多有痰火且不能遠房事往往致陰虛火動火助則生風所謂一水不能勝五火也故以此方疏風降火為主不問年高氣弱並宜服之惟孕婦忌服天麻丸治風因熱而生熱勝則風動宜以靜勝其躁此藥能滋陰抑火行榮衛壯筋骨天麻一兩五錢牛膝酒洗兩半萆薢一兩五錢玄參一兩五錢當歸二兩五錢羌活一兩五錢獨活一兩生地黃四兩杜仲酒炒斷絲一兩五錢附子制五錢知母鹽酒炒一兩上為極細末煉蜜丸如梧子大每日空心溫酒送下八十丸按上方皆預防中風之劑凡人初覺大指次指麻木不仁或手足少力或肌肉微掣此中風之先兆也宜豫服愈風湯天麻丸各一料此聖人不治已病治未病也或先服竹瀝枳朮丸及搜風順氣丸何中風之有附諸風方消風散治諸風上攻頭目昏弦背項強急耳作蟬鳴及皮膚瘙癢頑麻癮疹婦人血風頭痛防風荊芥川芎茯苓人參藿香甘草各一兩羌活一兩五錢蟬蛻殭蠶陳皮厚朴各五錢上為細末每服三錢清茶送下蟬蛻散治飲酒後搔出紫血黃水痛癢不一蟬蛻去頭足薄荷各等分上為末每服二錢酒調下一方用消風散一兩蟬蛻一兩胡麻散治脾肺風毒攻衝遍身皮膚搔癢或生瘡疥癮疹浸淫糜爛久而不瘥面如蟲行胡麻苦參何首烏荊芥各二兩威靈仙甘草各一兩上為細末每服二錢薄荷湯調下苦參丸治心肺積熱臟腑蘊毒攻於皮膚發為疥癲及成厲風手足爛壞眉毛脫落並能調治苦參四兩荊芥穗一兩上為細末煉蜜丸如桐子大每服五六十丸清茶送下
