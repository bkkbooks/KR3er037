body:
  text: 卷之三傷寒脈傷寒以浮大動數滑為陽沉澀弱弦微為陰其弦緊浮滑沉澀六者為殘賊脈能為諸經作病春弦夏洪秋毛冬石土緩為四季之正脈浮沉遲數為客脈左為人迎右為氣口呼出心肺為陽吸入肝腎為陰一呼一吸為一息寸口為陽尺澤為陰中為關界陽主氣陰主血血為榮氣為衛寒傷榮風傷衛所謂傷寒之病從淺入深先以皮膚肌肉次入腸胃筋骨其陰陽表裡寒熱虛實俱在浮中沉三脈有力無力中分有力者為實為陽為熱無力者為虛為陰為寒若浮中沉之不見則委曲而求之若隱若見則陰陽伏匿之脈也三部皆然雜病以弦為陽傷寒以弦為陰雜病以緩為弱傷寒以緩為和傷寒以大為病進以緩為邪退緩為胃脈有胃氣曰生無胃氣曰死傷寒病中脈貴有神脈中有力即為有神神者氣血之先也兩手無脈曰雙伏一手無脈曰單伏寸口陽脈中或見沉細者但無力者為陽中伏陰尺部陰脈中或見沉數者為陰中伏陽寸口數大有力為重陽尺部沉細無力為重陰寸口細微如絲為脫陽尺部微而無力為脫陰寸脈浮而有力主寒邪表實宜汗浮而無力主風邪表虛宜實尺脈沉而有力主陽邪在裡為實宜下無力主陰邪在裡為虛宜溫寸脈弱而無力切忌汗下初按來疾去徐名曰內虛外實去疾來徐名曰內實外虛尺寸俱同名曰緩緩者和而生也汗下後脈靜者生躁亂身熱者死乃邪氣勝也如寒邪直中陰經溫之而脈來斷續為歇止正氣脫而不復生也純弦之脈名曰負負者死按之如解索者名曰陰陽離離者死陰病見陽脈者生陽病見陰脈者死今將浮中沉三脈下注證治之法使因脈以知證緣證以明治以此達彼由粗入精亦可以為後學之窺鑑矣浮脈初排指於皮膚之上輕手按之便得曰浮此為寒邪初入足太陽經病在表之標可發而去之雖然其治法則有二焉寒傷榮則無汗惡寒風傷衛則自汗惡風一通一塞不可同也浮緊有力則無汗惡寒頭項痛腰脊強發熱此為傷寒之表宜發汗冬時用麻黃湯餘三時用羌活沖和湯有渴加石膏知母浮緩無力則有汗惡風頭項痛腰脊強發熱此為傷風在表宜和衛冬時用桂枝湯餘三時用加減沖和湯腹痛小建中湯痛甚桂枝加大黃湯中脈按至皮膚之下肌肉之間略重按之乃得謂之半表半裡然亦有二焉蓋陽明少陽二經不從標本從乎中也長而有力即微洪脈也此為陽明在經其證微有頭痛眼眶痛鼻乾不得眠發熱無汗用葛根解肌湯若渴而有汗不解或經汗過渴不解者白虎加人參湯無渴不可服此藥為大忌弦而數此為少陽經脈其證胸脅痛而耳聾寒熱嘔而口苦用小柴胡湯或兩經合病則脈弦而長此湯加葛根芍藥緣膽無出入有三禁止宜和解表裡耳沉脈重手按之至肌肉之下筋骨之間乃得此為沉脈然亦有二陰陽寒熱俱在沉脈中分若沉而有力為陽為熱沉而無力為陰為寒沉數有力則為陽明之本表證罷而熱入於裡惡寒頭痛悉除及覺怕熱欲揭衣被揚手擲足譫語狂妄躁渴或潮熱自汗五六日不大便輕則大柴胡湯下之重則六一順氣湯選用沉遲無力為寒初病起外證無頭痛無身熱便就怕寒四肢厥冷或腹痛吐瀉或口吐白沫或流冷涎或戰栗面如刀刮引衣蜷臥不渴或手足指甲青此為陰經自中其寒非從陽經傳來急溫之輕則理中湯重則薑附湯四逆湯之類故經云發熱惡寒發於陽無熱惡寒發於陰也證夫傷寒者冬時天氣嚴寒水冰地凍而成殺厲之氣體虛之人觸犯之者中而即病名曰正傷寒不即病者乃寒邪藏於肌膚之間伏於榮衛之內至春因溫暖之氣而發者名曰溫病至夏因暑熱之氣而作者名曰熱病熱重於溫病也雖曰傷寒實為熱病熱病乃汗病也非時行之氣春應溫而反寒夏應熱而反涼秋應涼而反熱冬應寒而反溫此非其時而有其氣故一歲之中長幼病皆相似也是時行不正之氣非暴厲之氣暴病者疫病也疫病者乃春分至秋分前天有暴寒皆為時行之寒疫也又有四時之正氣者春氣溫和夏氣暑熱秋氣清涼冬氣凜冽然正氣亦能為病春傷於風夏必飧泄夏傷於暑秋必瘧痢秋傷於濕冬必咳嗽冬傷於寒春必溫病總曰傷寒病自外入或入於陽或入於陰皆無定體非但始太陽終厥陰論也或有自太陽始日傳一經六日傳至厥陰邪氣衰而不傳自愈者亦有不能再傳者或有間經而傳者或有傳之二三經而止者或有始終只在一經者或有越經而傳者或有初入太陽不作鬱熱便入少陰而成真陰證者或有直中陰經而成寒證者有變證者有脈變者有取證不取脈者有取脈不取證者又有二陽三陽同受而為合病者或太陽陽明先後受而為並病者有日傳二經而為兩感者蓋病有標本治有逆從若夫常病用常法理固易知設有感冒非時暴寒而誤作正傷寒者有勞力感寒而誤作真傷寒者有直中陰經真寒證而誤作傳經之熱證者有溫熱病而誤作正傷寒治者有暑證而誤作寒證者有如狂而誤作發狂者有血證發黃而誤作濕熱發黃者有蚊迹而誤作發斑者有動陰血而認作鼻衄者有譫語而認作狂言者有獨語而認作鄭聲者有女勞復而認作陰陽易者有短氣而認作發喘者有痞滿而誤作結胸者有心下硬痛下利純清水而俗名為漏底而治之以燥熱藥者有噦而誤作乾嘔者有並病而誤作合病者有正陽明腑病而誤作陽明經病者有太陽無脈而便認作死證者有里惡寒而誤作表惡寒者有表熱而誤作裡熱者有陰極發躁而誤作陽證者有少陰病發熱而誤作太陽證者有標本全不曉者此幾件終世不相認者比比皆然胸中若不明脈識證論方得法但一概妄治則殺人不用刀耳且如麻黃桂枝二湯仲景立治冬時正傷寒之方今人通治非時暴寒溫暑之證則誤之甚矣又將傳經之陰證作直中陰經之陰證誤人多矣若夫寒邪自三陽傳次三陰之陰證外雖厥逆內有熱邪耳若不發熱四肢厥冷而惡寒者此則直中陰經之寒證也蓋先起三陽氣分傳次三陰血分則熱入深矣熱入既深表雖厥冷而內真熱邪也經云亢則害承乃制熱極反兼寒化也若先熱後厥逆者傳經之陰證也經云熱深厥亦深熱微厥亦微是也故宜四逆散大承氣湯看微甚而治之如其初病便厥但寒無熱此則直中陰經之寒證也輕則理中湯重則四逆湯輩以溫之經云發熱惡寒者發於陽也無熱惡寒者發於陰也尚何疑哉有病一經已用熱藥而又用寒藥如少陰證用白虎湯四逆散寒藥者少陰證用四逆湯真武湯熱藥者是知寒藥治少陰乃傳經熱證也是知熱藥治少陰乃直中陰經之寒證也辨名定體驗證用藥則治傷寒之法判然明矣傷寒汗下溫之法最不可輕據脈以驗證問證而對脈太陽者陽證之表也陽明者陽證之裡也少陽者二陽三陰之間太陰少陰厥陰又居於里總而謂之陰證也發於陽則太陽為之首發於陰則少陰為之先太陽惡寒而少陰亦惡寒太陽之脈多浮少陰之脈沉細與其他證狀亦自異也發熱惡寒身體疼痛或自汗或無汗是為表證可汗不惡寒反惡熱手掌心腋下濈濈而汗口燥咽乾壯熱腹滿小便如常不白不少而大便閉硬是為里證可下厥冷蜷默自利煩躁而無身熱頭痛是為陰證可溫單浮與浮洪浮數浮緊者此表病之脈滑實弦緊中間數盛者此里病之脈在表者邪傳於榮衛之間在裡者邪入於胃腑入內胃腑而下少陽居焉若傳次三陰則為邪氣之臟矣榮與衛居為表也亦均可汗也然自汗者為傷風風傷衛氣衛行脈外其脈浮緩而病尚淺則以桂枝湯助陽而汗之輕無汗者為傷寒寒傷榮血榮行脈中其脈浮緊而病稍深則以麻黃湯助陽而汗之重榮衛固為表也胃腑亦可以為表也然以腑臟而分表裡則在腑者謂之表在臟者謂之裡胃取諸腑可以表言若合榮衛臟腑而分之則表者榮衛之所行里者胃腑之所主而臟則又深於里者矣審脈問證辨名定經真知其為表邪則汗之真知其為里邪則下之真知其為陰病則溫之表有邪則為陽虛陰盛而發表之藥溫里有邪則為陰虛陽盛而攻裡之藥寒陰經受邪則為臟病而溫之藥熱是三者貴平得中不則寧可不及不可太過得中者上也不及者次也夫苟太過則斯為下矣蓋得中者如此而汗如彼而下又如彼而溫桂枝承氣投之不瘥薑附理中發而必中重者用藥緊輕者用藥微不背陰陽深合法度故曰得中者上也寧可不及者證與脈大同而小異名與證似異而實同當五分取汗而三分之劑散之當五分轉下而三分之劑導之當純剛溫里而略溫之劑扶持之未可汗下者與之和解未可遽溫者且安其中若猶未也則增減於其間細細而加消詳徐徐而就條理雖無遽安亦無傳變故曰寧可不及者次也太過者粗工不知深淺輕舉妄動者為之或問證而不知脈或執脈而不對證或名實之不辨或日數之為拘是有汗下太早之失甚者諉曰不問陰陽當汗而反下則為痞為結胸為懊憹當下而反汗則為譫語為亡陽動經為下厥上竭至於陽厥似陰之類但以剛劑投之是以火濟火以致舌卷囊縮煩亂可畏性命至貴可輕試哉故曰夫苟太過則斯為下矣大抵治傷寒有法與他病不同條例審的藥進病除七劑少瘥生死立判矣古人處方立論曰可汗曰可下曰可溫曰和解曰少與曰急下曰隨證滲泄與夫先溫其里乃發其表先解其表乃攻其里惟知者若網在綱有條不紊此固中者之事也若班固所謂有病不服藥當得中醫許仁則以為守過七日最為得計此非寧可不及之意乎王叔和善脈而且以承氣為戒初虞世善方而論傷寒一節且謂麻黃桂枝非深於其道則莫之敢為又非所以為太過者之戒乎論而至此則知古人之立論甚嚴如傷寒汗下溫之法固自有定論矣經云傷寒六七日目中不了了無表證脈雖浮亦有可下者少陰病二三日無表里證亦有可汗者陰證四逆法當用溫而四逆有柴胡枳殼此豈屬誣哉曰醫在九流之中非圓機之士不足與語也何者脈雖浮而可下者無表裡證謂六七日大便難也藉使大便不難其可輕下之乎少陰病亦有可汗者謂陰證初病便屬少陰而反發熱少陰本無熱今反發熱者是表猶未解故用溫藥微取其汗也藉使身不發熱其可輕汗之乎四逆湯用薑附四逆散用柴枳一熱一寒並主厥逆固不侔矣然傳經之邪與陰經受邪初病便厥者不同故四逆散用藥寒主先陽而後陰也四逆湯用藥熱主陽不足而陰有餘也其敢例視陰逆一切溫之乎不特此耳傷寒有始得病其脈沉數外證腹痛口燥咽乾即為陽盛入內之證醫當以下劑攻之不可概以一二日太陽而發表也前所謂陰證傷寒初病以來便見脈沉厥冷惡寒更無頭痛即是少陰受病之證醫當以乾薑附子輩溫之又不可概以三陰傳次先太陰而後少陰也張仲景論曰日數雖多但有表證而脈浮者猶可發汗日數雖少若有里證而脈沉實者即須下之是日數之不可拘也如此孫思邈曰服承氣得利謹勿中補熱氣得補覆成此所以言實熱也王叔和有曰虛熱不可攻熱去則寒起此所以言虛熱也二人之言殊途同歸是虛實之不可辨也如此又況寒溫熱同實而不同名暑濕風異種而有兼病異氣之相承他邪之並作表證中之有不可汗里證中之有不可下三陰可溫而攻積證者不同表裡俱見與半表半裡無表裡有異傷寒傷風脈證互見中暑熱病疑似難明陽明本多汗而有反無汗之形少陰本無汗而有反自汗之證或陰極發躁陽極發厥陰證似陽陽證似陰差之毫釐謬以千里又有痰證食積虛煩腳氣證似傷寒不可以傷寒之法拘之自非心領意會達變知機體認之精發用之當則縱橫泛應幾何而不昧哉孔子曰可與適道未可與立未可與權是説也亦在夫人權之而已矣六經證治足太陽膀胱經頭為諸陽之首故多傳變受病為先也其脈起於目內眥從頭下後項連風府行身之背終於足之至陰也其證頭疼項強腰痛骨節痛也經曰太陽頭痛脈浮項背強而惡寒若發熱汗出惡風脈浮緩者為傷風若脈陰陽俱緊頭痛惡寒嘔逆身疼或已發熱或未發熱者名曰傷寒宜發汗不可輒下之表邪乘虛內陷傳變不可勝數又不可利小便利之則引熱入里其害不淺若本病煩熱小便不利者乃利之則不為禁也如小便自利如常則不可利也凡有汗不得再發汗汗多不得利小便有汗不可服麻黃無汗不可服桂枝也足陽明胃經乃兩陽合明於前也一曰府者居中土也萬物所歸也其脈起於鼻頞上頭額絡於目循於面行身之前終於足之厲兌也經曰傷寒三日陽明脈大又曰尺寸俱長者陽明受病也其證頭額痛目痛鼻乾身熱不得臥乃標病也若本病則身熱汗出而惡熱也本實則潮熱大便不行也在標者當解肌在本者宜清熱本實者可下夫陽明有三一曰太陽陽明大便難者小承氣湯主之二曰正陽陽明胃家實也大承氣湯下之三曰少陽陽明胃中燥熱不大便者大柴胡湯主之足少陽膽經其脈起於目鋭眥上頭角絡耳中循胸脅行身之側終於足之竅陰也前有陽明後有太陽居二陽之中所以半表半裡經曰尺寸俱弦少陽受病也其證頭痛目眩口苦耳聾胸脅滿痛也或心煩喜嘔或胸中煩悶而不嘔或心下病硬或寒熱往來或發熱寅申時尤盛或身微熱者皆少陽也凡治有三禁不可汗下利小便也只宜和之惟小柴胡湯出入加減用之神效凡頭角痛耳中痛耳中烘烘而鳴耳之上下前後腫痛皆少陽所主部分其火為之也若口苦者少陽之膽熱脅下硬者少陽之結也足太陰脾經為中宮之坤土也其脈始於足大指之隱白上行至腹絡於嗌連舌本行身之前也若寒邪卒中直入本經者一時便發腹痛或吐或利宜溫之如四日而發腹滿嗌乾者此傳經之邪也宜和之若太陽病下之早因爾腹痛者此誤下之而傳也凡治太陰證自利不渴脈沉細手足冷急溫之若脈浮者可發汗宜桂枝湯主之若發熱脈數者少陽之邪未解須以小柴胡湯主之如自利不渴者臟有寒也宜理中湯寒甚加附子腹痛嘔吐不下食者宜治中湯手足冷脈沉細者宜四逆湯若傳經邪熱內陷腹痛宜桂枝芍藥湯足少陰腎經為人身之根蒂也其脈始於足湧泉上行貫脊循喉絡舌本散舌下注心中行身之前也若因欲事腎虛者寒邪直中之也其證一二日便發故發熱脈沉足冷或惡寒倦怠宜溫經而散寒也若五六日而發口燥舌乾者此傳經之邪熱宜急下之恐腎水乾也如其脈沉細足冷者又不可下急溫之脈沉疾有力者乃可下之凡少陰飲水小便色白者下虛有寒引水自救非熱也宜溫之蓋夾陰傷寒多因勞傷腎經所致有緊有慢其害甚速不可以寒涼之藥妄投之也但脈沉足冷雖發熱者急宜溫腎以扶元氣足厥陰肝經厥者盡也為六經之尾也其脈始於足大指之大敦上環陰器抵小腹循脅肋上唇口與督脈會於巔頂行身前之側也若寒邪直中本經一日便發吐利少腹痛寒甚者唇青厥冷囊縮急宜溫之並著艾灸丹田氣海以溫之若六七日發煩滿囊拳者此傳經熱邪厥深熱亦深也若脈沉疾有力者宜急下之若脈微細者不可下也凡傷寒傳至厥陰經則病熱極矣此生死在於反掌其可不謹察之也大抵熱深厥亦深則舌卷囊縮陰寒冷極亦見舌卷囊縮在乎仔細消詳其冷熱之治法亦微矣一調治傷寒之法先須識證察得陰陽表裡虛實寒熱親切復審汗吐下溫和解之法治之庶無差誤先觀兩目或赤或黃次看口舌有無胎狀後以手按其心胸至小腹有無痛滿再問其所苦所欲飲食起居大小便通利若何並服過何藥曾經汗下不務使一一明白脈證相對然後用藥無瘥若有一毫疑惑不可強治故君子不強其所不能或見利妄動視人命如螻蟻非君子之用心也慎之一看傷寒先觀兩目或赤或黃赤為陽毒六脈洪大有力燥渴者輕則三黃石膏湯重則大承氣湯一看口舌黃白色者邪未入腑屬半表半裡宜小柴胡湯和解舌上黃苔者胃腑有邪熱宜調胃承氣湯下之大便燥實脈沉有力而大渴者方可下舌上黑苔生芒刺者是腎水克心火也不治急用大承氣下之此邪熱已極也劫法用井水浸青布片子舌上洗淨後以生薑片子浸水時時刮之其苔自退一次以手按其心胸至小腹有無痛處若按心下硬痛手不可近燥渴譫語大便實脈沉實有力為結胸證急宜大陷胸湯加枳桔下之量元氣虛實緩而治之反加煩躁者死若按之心胸雖滿悶而不痛未經下者非結胸也乃邪氣填塞胸中尚為在表只以小柴胡湯加枳桔以治其悶如未效本方對小陷胸仍加枳桔若病人自覺心胸滿悶而不痛者為痞滿也宜瀉心湯加枳殼桔梗若按之小腹硬痛當問其小便通利不如小水自利大便黑兼或身黃譫語燥渴脈沉實則知蓄血在下焦宜桃仁承氣湯下盡黑物則愈若按之小腹脹滿不痛小便不利則知津液留結即溺澀也宜五苓散加木通山梔子利之亦不可大利恐耗竭津液也若按之小腹繞臍硬痛渴而小水短少大便實者有燥糞也大承氣湯下之劫法治心胸肋下有邪氣結實滿悶硬痛用生薑一斤搗渣去汁炒微燥帶潤用絹包於患處款款尉之稍可又將渣和勻前汁炒乾再尉許久豁然寬快一方用韭菜如前法尉之一治傷寒若煩渴欲飲水者因內水消渴欲得外水自救大渴欲飲一升止可與一碗寧令不足不可太過若恣飲過量使水停心下則為水結胸若水射於肺為喘為咳留於胃為噎為噦溢於皮膚為腫蓄於下焦為癃滲於腸間則為利下皆飲水之過也又不可不與又不可強與經云若還不與非其治強飲須教別病生此之謂也一治傷寒若有吐蛔者雖有大熱忌下涼藥犯之必死蓋胃中有寒則蛔上膈大凶之兆急用炮乾薑理中湯一服加烏梅二個川椒十粒愈服待蛔定卻以小柴胡湯退熱蓋蛔聞酸則靜得苦則安矣一治傷寒若經十餘日以上尚有表證宜汗者以羌活沖和湯微汗之十餘日若有里證宜下者可以大柴胡湯下之蓋傷寒過經正氣多虛恐麻黃承氣太峻誤用麻黃令人亡陽誤用承氣令人不禁若表證尚未除而里證又急不得不下者只可用大柴胡湯通表裡而緩治之又老弱及氣血兩虛之人有下證者亦用大柴胡湯下之不傷元氣如其年壯力盛者不在此例從病制宜一治傷寒若先起頭痛發熱惡寒以後傳裡頭痛惡寒悉除反覺怕熱發渴譫語或潮熱自汗大便不通或揭去衣被揚手擲足或發黃狂亂或身如塗彩脈沉有力此為陽經自表傳入陰經之熱證俱當攻裡之藥下之設或當下失下而變出手足乍冷乍溫者因陽極發熱即陽證似陰名曰陽厥外雖厥冷內有熱邪三一承氣湯下之又有失於汗下或本陽證誤投熱藥使熱毒入深陽氣獨盛陰氣暴絶登高而歌棄衣而走罵詈叫喊燥渴欲死面赤眼紅身發斑黃或下利純青水或下利黃赤六脈洪大名陽毒證輕則消斑青黛飲重則三黃石膏湯去麻黃豆豉加大黃芒硝下之令陰氣復而大汗解矣一初病起無頭疼無身熱便就惡寒四肢厥冷腹痛吐瀉引衣蜷臥不渴或戰栗面如刀刮口吐涎沫脈沉細無力此為寒邪直中陰經即真陰證不從陽經傳來當用熱藥溫之如寒極手足厥冷過肘膝者因寒極發厥謂之陰厥宜四逆湯溫之凡腹滿腹痛皆是陰證只有微甚不同難以一概施治腹痛不大便桂枝芍藥湯腹痛甚者桂枝大黃湯若自利腹滿小便清白當溫之理中四逆看微甚用輕者五積散重者四逆湯又有初病起外感寒邪內傷生冷內既伏陰內外皆寒或本真陰誤投涼藥使陰氣獨盛陽氣暴絶以致病起手足厥冷腰背強重頭疼目痛嘔吐煩悶身如被杖六脈沉細湯飲不下以後毒氣漸深入腹攻心咽喉不利腹痛轉深心下脹滿結硬如石燥渴欲死冷汗不止或時鄭聲指甲面色青黑此名陰毒速灸關元氣海二三十壯或蔥尉臍中內服回陽救急湯令陽氣復而大汗解矣一看傷寒有口沃白沫或睡多流冷涎俱是有寒吳茱萸湯理中真武湯之類看輕重用切忌涼藥或用甘溫補元氣四君子湯加附子血虛用仲景八味丸此條雜病亦然一傷寒頭痛發熱惡寒微渴濈濈然汗出身作痛腳腿痠疼無力沉倦脈空浮無力名曰勞力感寒不可誤作正傷寒大發其汗故經云勞者溫之溫能除大熱此之謂也補中益氣湯主之有下證者大柴胡湯主之一傷寒頭痛發熱口乾口鼻血出腹脹午後昏沉聲啞耳聾脅痛俗云血汗病也犀角地黃湯合小柴胡湯血盛加茅根韭汁汗出如雨隨瘥一傷寒吐血不止用韭汁磨京墨其血見黑必止如無韭之時用雞子清亦可正謂赤屬火而黑屬水也一傷寒發黃用生薑渣時時周身擦之其黃自退一傷寒熱邪傳裡服轉藥後用鹽炒麩皮一升將絹包於病人腹上款款尉之使藥氣得熱則行大便易通矣一傷寒發狂奔走人難制伏宜於病人臥室生火一盆將好醋一大碗澆於火上令病人聞之即安一傷寒鼻衄不止用水紙搭於頂門再將山梔炒黑為細末吹入鼻內其紅即止其成流久不止者方可用此法如點滴不成流者其邪在經未除不必用此法一傷寒痰症擁結胸中用皂莢末半夏末生礬末入麝少許用薑水汁調服其痰立吐輕者用貝母皂莢麝香薑汁吐之雜病吐之亦可一傷寒腹皮外痛用炒麩皮布包款款烙之痛止其自汗不止亦用此法如再不止方可用溫粉撲法方十神湯治時令不正溫疫妄行感冒發熱惡寒頭痛身疼咳嗽喘急陰陽兩感傷寒並能調治川芎甘草麻黃紫蘇白芷升麻陳皮赤芍藥乾葛上銼每服一兩生薑煎熱服欲汗以被覆之如發熱頭痛加蔥白潮熱加黃芩麥門冬咳喘加桔梗桑白皮半夏心胸脹滿加枳實半夏枳殼飲食不進加炒仁白豆蔻嘔逆加丁香草果鼻衄不止加烏梅乾葛冷氣痛加玄胡索良薑大便閉加大黃芒硝痢加枳殼當歸泄瀉加木通滑石肉豆蔻人參敗毒散批按此方治四時感冒辛平發散之劑治傷寒頭痛壯熱惡風及風痰咳嗽鼻塞聲重四時溫疫熱毒頭面腫痛痢疾發熱諸般瘡毒柴胡甘草桔梗人參羌活獨活川芎茯苓枳殼前胡上銼每服一兩生薑薄荷煎服咳嗽加半夏熱毒加黃連黃芩黃柏山梔風熱加荊芥防風名荊防敗毒散消風散和合名消風敗毒散酒毒加乾葛黃連瘡毒加金銀花連翹去人參名連翹敗毒散雙解散批按此方治內外兩感發表攻裡之劑治風寒暑濕飢飽勞役內外諸邪所傷以致氣血怫鬱變成積熱發為汗病雜病非此不除但覺不快便可用此通解小兒瘡疹用此解去尤快其大黃芒硝麻黃三味對證旋入自利去大黃芒硝自汗去麻黃即防風通聖散益元散和合羌活沖和湯批按此方治太陽膀胱經辛涼發散之劑治春夏秋非時感冒暴寒惡寒頭痛發熱無汗腰脊項強脈浮而緊此足太陽膀胱經受邪是表證宜發散不與冬時正傷寒同治法此法非獨治三時暴寒春可治溫夏可治熱秋可治濕治雜證亦有神也可代麻黃桂枝湯青龍各半等湯乃太陽經神藥也又名神解散羌活三錢治太陽肢節痛大無不通小無不入乃撥亂反正之主也防風一錢五分治一身盡痛聽君將命令而行隨所使引而至蒼朮一錢米泔制雄壯上行之氣能除濕氣下安太陰使邪氣不傳脾經川芎一錢五分治厥陰頭痛在腦白芷一錢五分治陽明頭痛在額黃芩一錢治太陽肺熱在胸生地黃一錢治少陰心熱在內細辛三分治少陰腎經苦頭痛甘草三分緩裡急和諸藥上銼作一劑生薑蔥白水煎發汗熱服止汗溫服胸中飽悶加枳殼桔梗去地黃夏月加石膏知母名神術湯作渴亦加之如再不汗加紫蘇喘加杏仁桔梗汗後不解宜汗下兼行加大黃為釜底抽薪法如欲止汗去蒼朮加白朮再不止加黃耆桂枝芍藥立止麻黃湯批按此方治太陽膀胱經無汗辛溫發表之劑治冬月正傷寒頭痛發熱惡寒腰脊項強遍身骨節痠疼脈浮緊而無汗是足太陽膀胱經受邪為表實證當發表散邪若頭如斧劈身如火熾者宜用此方麻黃去節二錢桂枝一錢三分杏仁十四個甘草六分上銼作一劑生薑三片蔥白三根豆豉一撮水煎熱服被覆取汗如再不汗加麝香半分汗如雨注若服二三劑汗不出者死桂枝湯批按此方治太陽膀胱經有汗辛溫實表之劑治冬月正傷風發熱頭痛惡風腰脊項強渾身肢節疼痛脈浮緩而自汗是足太陽膀胱經受邪為表虛證當實表散邪此湯無汗不可服桂枝二錢五分芍藥二錢五分甘草一錢上銼一劑生薑三片大棗二枚水煎溫服如汗不止加黃耆葛根解肌湯批按此方治陽明胃經解肌之劑治足陽明胃經受證目痛鼻乾不眠微頭痛脈來微洪宜解肌屬陽明經病其正陽明府病別有治法乾葛柴胡黃芩芍藥羌活白芷桔梗甘草上銼每服一兩生薑三片棗一枚石膏末一撮水煎熱服無汗惡寒去黃芩加麻黃小柴胡湯批按此方治少陽膽經和解之劑治足少陽膽經受證耳聾脅痛寒熱嘔而口苦脈來弦數屬半表半裡宜和解此膽經無出入有三禁不可汗下利小便也柴胡黃芩半夏人參甘草上銼每服一兩生薑三片大棗二枚水煎服小便不利加茯苓嘔加陳皮竹茹薑汁脅痛加青皮左脅痛加枳殼赤芍藥牡蠣桑白皮右脅痛加枳實薑黃痰多加栝蔞仁貝母寒熱似瘧加桂枝渴加知母天花粉齒燥無津液加石膏嗽加五味子金沸草飽悶加枳殼桔梗虛煩類傷寒證加竹葉炒粳米本經與陽明經合病加葛根芍藥熱入血室男子加生地黃女人加當歸紅花壞證加鱉甲若腹痛惡寒者加芍藥桂去黃芩心下痞滿加黃連枳實若內熱甚錯語心煩不得眠合黃連解毒湯若脈弦數無外證內熱甚惡熱煩渴飲水者合白虎湯若發熱煩渴脈浮弦而數小便不利大便泄瀉加四苓散內熱多者此名協熱加炒黃連白芍藥若脈弦虛發熱口渴不飲水者去人參加麥門冬一錢半五味子十粒若脈弦虛發熱口渴不飲水者去人參加麥門冬一錢半五味子十粒若脈弦虛發熱或兩尺脈浮而無力此必先因房事或曾遺精或病中精不固者加黃柏知母酒炒各二錢牡蠣二錢名滋陰清熱飲若脈弦虛發熱口乾或大便不實胃弱不食加白朮茯苓白芍藥各一錢半血虛發熱至夜尤甚加四物湯各一錢口燥舌乾津液不足去半夏加天花粉麥門冬各一錢半五味子十五粒桂枝大黃湯批按此方治太陽脾經腹痛之劑治足太陽脾經受症腹滿而痛手足溫脈要沉而有力此因邪熱以陽經傳入陰經也桂枝芍藥甘草大黃柴胡枳實上銼生薑三片棗二枚臨服入檳榔磨水三匙大柴胡湯批按此方解表攻裡之劑治傷寒表證未除里證又急內實大便難身熱不惡寒反惡熱宜此藥通表裡而治之柴胡三錢黃芩二錢五分半夏二錢大黃二錢芍藥一錢五分枳實一錢五分上銼作一劑生薑三片大棗二枚水煎溫服以大便通利為度如未利再投黃連解毒湯批按此方大解表裡清涼之劑治傷寒大熱不止煩躁口渴乾嘔喘滿陽厥極深蓄熱內甚及汗吐下後其熱尚未退者黃連黃芩黃柏山梔各二錢加柴胡連翹各一錢半上銼一劑水煎服六一順氣湯治傷寒熱邪傳裡大便結實口燥咽乾怕熱譫語揭衣狂妄揚手擲足斑黃陽厥潮熱自汗胸腹滿硬繞臍疼痛並皆治之可代大小承氣謂胃承氣三一承氣大柴胡大陷胸等湯之神藥也柴胡黃芩芍藥枳實厚朴大黃芒硝甘草上銼一劑先將水二碗滾三沸後入藥煎至八分臨服入鐵鏽水二三匙如潮熱自汗譫語發渴揚手擲足揭衣狂妄斑黃便實但屬正陽明府症依本方口燥咽乾大便實者屬少陰依本方如下利純清水心下硬痛屬少陰依本方如怕熱發渴譫妄手足乍冷乍溫大便實者屬厥陰依本方舌卷囊縮者難治須急下之若譫語發渴大便實繞臍硬痛有燥糞也依本方熱病目不明此神水已竭不能照物病已篤矣急下之依本方如結胸證心下硬痛手不可近燥渴譫妄大便實者依本方去甘草加桔梗甘遂傷寒過經及老弱並血氣兩虛之人或産後有下證或有下後不解或有表證尚未除而里證又急不得不下者去芒硝蜜煎導法治自汗大便閉結不通及老弱之人日久燥硬又難服峻利之劑者煉蜜如飴乘熱拈如指大長二寸許兩頭如鋭納入穀道中良久下結糞加皂莢末少許更效如無蜜以香油代之效豬膽汁導法批按此方治表裡實熱通利之劑治陽明自汗小便利大便結不可攻者豬膽一枚和醋少許以竹管灌入穀道中一時許通桃仁承氣湯批按此方治發狂便血之劑治熱邪傳裡熱蓄膀胱其人如狂小水自利大便黑小腹滿痛身目黃膽語燥渴為蓄血證脈沉有力宜此下盡黑物則愈未服前如血自下者為欲愈不必服桃仁十個去皮桂枝一錢半大黃三錢芒硝一錢半甘草一錢上銼一劑生薑三片水煎去渣入芒硝再煎一二沸溫服血盡為度白虎湯批按此方治發渴之劑治身熱而渴有汗不解或經汗過渴不解者知母石膏甘草粳米上銼一劑水煎待米熟去渣溫服如口燥煩渴或發赤斑依本方加人參名化斑湯如秋感熱之疫癘或陽明下後大便不固熱不退者或濕溫證熱不退而大便溏者依本方加蒼朮人參一服如神無汗脈浮表不解而陰氣盛雖渴不可用白虎湯汗後脈洪而渴里有熱乃可用三黃石膏湯治陽毒發斑發黃身如塗朱眼珠如火狂叫欲走六脈洪大燥渴欲死鼻乾而赤齒燥過經不解已成壞症表裡皆熱欲發其汗熱病不退又復下之大便遂頻小便不利亦有錯治溫症而成此症者又有發汗後三焦大熱脈洪譫語不休晝夜喘息鼻時加衄狂叫欲走黃連黃芩黃柏山梔麻黃石膏豆豉上銼一服生薑三片細茶一撮水煎溫服三白飲治傷寒時氣熱極狂亂者及發熱不退雞子一個用清白蜜一大匙芒硝三錢上合作一處用涼水和下如心不寧者北人謂之心慌也加珍珠末五分地龍水批按此方治發狂之劑治陽毒傷寒藥下雖通結胸硬痛或發狂亂大白頸地龍四條洗淨研爛入生薑汁一匙白蜜一匙薄荷汁一匙再入片腦半分研勻徐徐灌令盡良久漸快穩睡少頃即與揉心下片時再令睡當有汗則愈若不應再投一服柴胡連翹湯批按此方治傷寒譫語之劑治傷寒大熱譫語呻吟睡臥不得柴胡黃芩枳殼赤芍藥桔梗連翹山梔栝蔞仁黃連黃柏甘草上銼生薑三片水煎溫服瀉心導赤飲批按此方治不語之劑治傷寒心下不疼腹中不滿大便如常身無寒熱漸變神昏不語或睡中獨語目赤唇焦將水與之則咽不與則不思形如醉人俗醫不識呼為死證遂以針灸誤人多矣殊不知邪熱傳入少陰心經也因心火上炎而逼肺所以神昏名越經證山梔子黃芩麥門冬滑石人參犀角知母茯神黃連薑汁炒甘草上銼一服生薑一片棗二枚燈心二十莖煎臨服人生地黃汁三匙消斑清黛飲批按此方治發斑之劑治熱邪傳裡表實表虛血熱不散熱氣乘虛出於皮膚而為斑也輕如疹子重則如錦紋重甚則斑爛皮膚或本屬陽誤投熱藥或當汗不汗當下不下或汗下未解皆能致此不可發汗重令開泄更加斑爛也其或大便自利怫鬱短氣燥糞不通斑如墨皆不治汗下不解足冷耳聾煩悶咳嘔關前陽脈洪大便是發斑之候柴胡玄參黃連知母石膏生地黃山梔子犀角青黛人參甘草上銼一服生薑一片棗二枚水煎入醋一匙服大便實去人參加大黃治赤斑用獨腳烏桕根研酒服神效茵陳湯治陽明裡熱極甚煩渴熱鬱留飲不散以致濕熱相搏而身發黃疸但頭汗出身無汗小便不利渴飲水漿身必發黃宜茵陳湯調下五苓散通利大小便立效茵陳去梗五錢大黃二錢五分山梔子五個上銼一劑水煎服以利為度治傷寒發黃目不識人黃賓江傳生蔥火煨熟去粗皮扭出汗蘸香油點目兩眥三川劉尚書方治濕熱發黃死在旦夕用烏骨白雄雞一隻干撏去毛破開刳去腸雜刀切爛鋪心胸間黃退病愈神效神效小陷胸湯治小結胸心下痞滿而軟按之則痛黃連二錢炒半夏五錢栝蔞仁三錢上銼一劑生薑三片水煎不拘時服開胸散治結胸柴胡黃芩半夏枳實枯梗黃連栝蔞仁山梔子甘草上銼一劑生薑三片水煎溫服玄參升麻湯批按此方治咽痛之劑治傷寒失下熱毒在胃發斑咽痛甚則譫語玄參升麻甘草炙三錢加石膏知母上銼一劑水煎溫服梔豉湯批按此方治懊憹之劑治汗吐下後心煩滿悶或痛頭微汗虛煩不得眠又復顛倒心中懊憹乃燥熱怫鬱於內也山梔子淡豆豉上銼一劑水煎服煩躁者不得眠也懊憹者鬱悶不舒之貌也煩者火入肺也躁者火入腎也故用梔子以治肺煩豆豉以治腎躁嘔噦加生薑陳皮有宿食而煩躁者加大黃下後腹滿而煩躁加枳實厚朴下後身熱而煩加乾薑甘草瘥後勞復加枳實竹葉石膏湯治傷寒已經汗下表裡俱虛津液枯竭心煩發熱氣逆欲吐及諸煩熱並宜治之石膏二錢半夏一錢五分麥門冬去心一錢人參一錢甘草一錢上銼一劑青竹葉生薑各五片粳米百餘粒煎服熱極發狂倍石膏知母嘔加生薑汁溫膽湯批按此方治不眠之劑治虛煩不得眠陳皮去白半夏制茯苓枳實炒各二錢竹茹一錢甘草五分加酸棗仁炒二錢上銼一劑生薑三片水煎溫服如心膽虛怯觸事易驚加麥門冬柴胡人參桔梗柴胡升麻湯批按此方治聲嘶之劑治傷寒咳嗽聲嘶或咽喉痛柴胡黃芩半夏升麻乾葛枳實桔梗知母貝母玄參桑皮甘草上銼一劑生薑三片水煎溫服柴胡竹茹湯治傷寒潮熱作渴嘔逆不止柴胡黃芩半夏竹茹知母甘草上銼生薑一片水煎服柴胡枳桔湯批按此方治喘咳之劑治傷寒胸脅痛潮熱作渴痰氣喘麻黃杏仁桔梗枳殼柴胡黃芩半夏知母石膏乾葛甘草上銼一劑生薑三片水煎溫服解熱下痰湯雲林制批按此方治痰嗽之劑治結胸痰熱氣滯咳嗽失聲紫蘇子白芥子枳實黃連黃芩黃柏栝蔞仁石膏杏仁烏梅桔梗上銼一劑生薑三片水煎溫服瓜蒂散批按此方治痰喘上吐之劑治傷寒痰壅腦膈昏不知人以此吐之甜瓜蒂炒一錢赤小豆一錢上為末每服一錢豆豉煎湯調服以吐為度定心湯祕方批按此方治心慌之劑治傷寒瘥後心下怔忡生地汁童便各半盞二味和合重湯煮數沸服治傷寒瘥後交接復發欲死眼不能開口不能語梔子三十枚水三升煎至一升服中寒脈大抵中寒脈虛而微細證中寒者寒邪直中三陰也寒為天地殺厲之氣多由氣體虛弱之人或調護失節沖斥道途一時為寒氣所中則昏不知人口噤失音四肢強直拘急疼痛者先用熱酒薑汁各半盞灌服稍醒後用理中湯治如寒中太陰則中脘疼痛宜理中湯或加藿香正氣散同服寒甚脈沉細手足冷者附子理中湯一寒中少陰則臍腹疼痛宜五積散加吳茱萸寒甚脈沉細手足冷者四逆湯加吳茱萸一寒中厥陰則少腹疼痛宜當歸四逆湯加吳茱萸甚者倍附子此中寒比傷寒尤甚若不急治死在旦夕一冷極唇青厥逆無脈陰囊縮者急用蔥尉法或吳茱萸尉法並艾灸臍中與氣海關元二三十壯佳一中寒雖燥熱煩渴可煎理中湯水中頓冷服之此寒因寒用之法也若以寒涼治之立死方五積散治寒邪卒中直入陰經等證白芷七分陳皮一錢厚朴八分桔梗八分枳殼八分川芎七分白芍藥八分甘草八分白茯苓八分蒼朮二錢當歸八分半夏七分肉桂七分乾薑八分麻黃一錢上銼一劑生薑三片蔥白頭三莖水煎熱服冒寒用煨薑挾寒加吳茱萸婦人調經用醋艾足浮腫加五加皮大腹皮風痹加羌活獨活防風腰痛加牛膝杜仲小茴香手足攣急加檳榔木瓜牛膝咳嗽加杏仁桑白皮馬兜鈴遍身疼痛加乳香沒藥細辛難産加麝香交桂老人手足痛合和順氣散手足風緩加烏藥平氣散濕痹加烏藥順氣散有濕加檳蘇散按是方氣味辛溫開鬱行氣發表溫里大有回生起死之功溫寒燥濕之聖藥也夫寒濕屬陰燥熱屬陽人之有病不過二者而已善用藥者以苦寒而泄其陽以辛溫而散其陰病之不愈者未之有也余常用防風通聖散治熱燥之藥生料五積散治寒濕之藥理中湯治五臟中寒唇青身冷口噤失音人參白朮乾薑炮甘草炙各二錢上銼一劑薑棗煎服寒濕所中者加附子一錢名附子理中湯霍亂吐瀉加青皮陳皮各一錢名治中湯乾霍亂心腹作痛先以鹽湯探吐後進此藥嘔吐於治中湯加丁香半夏各一錢生薑七片泄瀉加陳皮茯苓各一錢名補中湯溏泄不已於補中湯加附子一錢不喜歡飲食米穀不化加砂仁一錢霍亂吐下心腹作痛手足厥冷於本方中去白朮加熟附子名四順湯傷寒結胸先於枳桔等藥服過不愈加枳實茯苓各一錢名枳實理中湯亂轉筋加石膏一錢臍上築者腎氣動也去白朮加桂一錢悸加茯苓一錢苦寒加附子一錢腹痛去白朮加附子一錢飲酒過多及啖炙爆熱物發為鼻衄加川芎一錢回陽救急湯批按此方治虛寒溫補之劑治傷寒初起無頭疼無身熱便就惡寒四肢厥冷或過於肘膝或腹痛吐瀉或口吐白沫冷涎或戰栗面如刀亂引衣蜷臥不渴脈來沉遲無力即是直中陰經真寒證不從陽經傳來者人參白朮茯苓陳皮半夏乾薑肉桂附子五味子甘草上銼一劑生薑三片水煎服嘔吐涎沫或小腹痛加鹽炒吳茱萸無脈者加豬膽汁一匙泄瀉不止加黃耆升麻嘔吐不止加生薑汁倉卒無藥可用蔥尉法或灸關元氣海二三十壯使熱氣通其內逼邪出於外以復陽氣稍得蘇醒灌入生薑汁然後煎服回陽救急湯四逆湯治寒邪直入三陰自利不渴等症附子一枚去皮臍切作八片生用甘草炙六錢乾薑五錢上銼作二劑水煎溫服取微汗為度薑附湯批按此方治中寒溫熱之劑治體虛中寒昏不知人身體強直口噤不語手足厥冷臍腹疼痛霍亂轉筋並宜調治乾薑五錢附子一枚去皮臍生用上銼一劑水煎服肢節痛加桂挾氣攻刺痛加木香挾風不仁加防風挾濕重著加白朮筋脈拘急加木瓜尉法治寒邪直入三陰無頭疼身熱惡寒腹痛下利清白唇青面黑吐沫口噤或身痛如被杖四肢厥冷上過乎肘下過乎膝引衣蜷臥不渴脈來沉遲無力及一切虛寒並能治之蔥切細三升麥麩三升鹽一斤上用水和勻分作二處炒令極熱重絹包之乘熱尉臍冷更易一包其蔥包既冷再用水拌炒熱依前用之如大小便不通亦用此法溫疫脈陽濡弱陰弦緊更遇溫氣變為溫疫左手脈大於右手浮緩而盛按之無力證衆人病一般者乃天行時疫也悉由氣運郁發遷正退位之所致也治冬應寒而反溫春發溫疫敗毒散主之春應溫而反涼夏發燥疫大柴胡湯主之夏應熱而反寒秋髮寒疫五積散主之秋應涼而反淫雨冬發濕疫五苓散主之凡溫疫切不可作傷寒症治而大汗大下也但當從乎中治而用少陽陽明二經藥少陽小柴胡湯陽明升麻葛根湯看所中陰陽而以二方加減和治之殊為切當人參敗毒散治四時溫疫通用羌活沖和湯治溫疫初感一二日間服之取汗其效甚速方凡入溫疫之家以麻油塗鼻孔中則不傳染出以紙捻探鼻深入令嚏之為佳一方以雄黃蒼朮為細末香油調敷鼻內或用雄黃末水調鼻內雖與病人同臥亦不相染宣聖闢瘟丹臘月二十四日井花水在平旦第一汲者是也盛淨器中量人口多少浸乳香至歲朝五更時暖令溫自幼至長每人以乳香一小塊飲水一二呷咽下則一年不患時疫神聖闢瘟丹訣云聖神闢瘟丹留傳在世間正元焚一灶疫癘自祛蠲批按上方皆預防瘟疫之劑蒼朮為君倍用羌活獨活白芷香附大黃甘松三奈赤箭雄黃各等分上為末麵糊為丸如彈子大黃丹為衣曬乾正月初一平旦時焚一炷闢除一歲瘟疫邪氣人參敗毒散治四時不正之氣冬應寒而反熱夏應熱而反寒春應溫而反涼秋應涼而反溫非其時而有其氣故病者大小無異大抵使人痰涎壅盛壯熱如火頭疼身痛項強睛疼聲啞腮腫俗呼浪子瘟或稱蝦蟆瘟城市鄉村家戶相類悉依本方加乾葛若寒熱往來必用小柴胡湯二方俱見傷寒條下加味柴胡湯治挾嵐瘴溪源蒸毒之氣其狀血乘上焦病欲來時令人迷困甚則發躁狂妄亦有啞而不能言者皆由瘀血攻心毒涎聚胃柴胡黃芩半夏人參枳殼大黃甘草上銼一劑薑棗煎空心服啞瘴食後服大力子湯治大頭天行病腮頰頸項腫脹頭疼發熱證似傷寒兼治啞瘴黃芩酒洗二錢黃連酒炒二錢桔梗一錢五分甘草一錢連翹一錢鼠黏子炒研玄參各一錢大黃酒蒸一錢五分荊芥三分防風三分羌活三分石膏一錢五分上銼一劑生薑煎服治四時瘟疫頭痛發熱衆人一般病者孫鈍庵傳黑砂糖一盞入薑汁二盞化開令病人服之當時憎寒壯熱汗出立愈二聖救苦丸萬左川傳治傷寒瘟疫大黃四兩酒蒸牙皂二兩上末麵糊丸如緑豆大每服四十丸緑豆湯送下大汗為效中暑脈暑傷於氣所以脈虛弦細芤遲體狀無餘證夫暑者相火行令也夏月人感之自口齒而入傷心胞絡之經其脈虛或浮大而散或弦細芤遲蓋熱傷氣則氣消而脈虛弱其外證頭疼身熱口乾煩渴面垢自汗倦怠少氣背寒冷熱甚者迷悶不省而為霍亂吐利痰涎嘔逆發黃生斑皆是其症又甚者火盛制金不能平木肝邪獨旺以致搐搦不省人事其脈虛浮浮者風也虛者暑也俗曰暑風治宜黃連香薷飲加羌活或只雙解散加香薷治大抵治暑之法宜清心利小便為主若自汗甚者不可利之以白虎湯清解之次分表裡治之如在表頭痛惡寒雙解散加香薷及二香散十味香薷飲之類在半表半裡泄瀉須渴飲水吐逆五苓散主之熱甚煩渴益元散清之若表解裡熱甚宜解毒湯下神芎丸酒蒸黃連等丸或人平素虛弱及老人冒暑脈微下利渴而喜溫或厥逆不省人事宜竹葉石膏湯加附子半個冷服凡夏月暑證不可服諸熱燥劑若誤用之乃致斑毒發黃小便不通悶亂而死矣一傷暑與傷寒俱有發熱當明辨之蓋寒傷形暑傷氣傷暑則惡寒而脈緊傷暑則惡熱而脈虛微以此為異經云脈盛身寒得之傷寒脈虛身熱得之傷暑治宜小柴胡湯加石膏知母或人參白虎湯主之天時淫雨濕令並行蒼朮白虎湯主之若元氣素弱而傷重者用清暑益氣湯一行人或農夫於日中勞役得之者名曰中熱其病必苦頭痛發燥熱惡熱捫之肌膚大熱大渴引飲汗大泄無氣以動乃為天熱外傷肺氣也宜人參白虎湯主之一人避暑熱於深堂大廈而得之者名曰中熱其病必頭痛惡寒身形拘急肢節痛而煩心肌膚大熱無汗為房室之陰寒所遏使周身陽氣不得伸越宜用辛溫之劑以解表散寒五積散主之一外不受寒止是內傷瓜果冰水冷物腹痛泄瀉或霍亂吐逆宜縮脾飲主之或理中湯加神麯麥芽蒼朮砂仁此專治內溫中消食也一吐瀉脈沉微不可用涼藥宜附子大順散主之或附子理中湯加炒白芍藥一夏月多食冷物及過飲茶湯水濕致傷脾胃吐瀉霍亂故治暑藥多用溫脾消食滲濕利小便之藥醫者要識此意一發熱惡寒身體疼痛小便澀灑然毛聳手足逆冷小有勞身即熱口開前板齒燥脈弦細虛遲表裡中暍也用補中益氣湯加香薷白扁豆熱加黃芩方治暑風卒倒法凡人中暑先觸心經一時昏迷切不可飲冷水並臥濕地其法先以熱湯灌或童便灌及用青布蘸熱湯尉臍中氣海續續令暖氣透徹臍腹候其蘇醒然後進藥若旅途中卒然暈倒急扶在陰涼處掬路中熱土作窩於臍上令人溺其內即蘇卻灌以人尿或攪地漿飲半碗或車輪土五錢冷水調澄清服皆可香薷飲治臟腑冷熱不調飲食不節或食腥膾生冷過度起居不時或露臥濕地或當風取涼而風冷之氣歸於三焦傳於脾胃脾胃得冷不能克化水穀致令真邪相干心腹疼痛霍亂氣逆先心痛則先吐先腹痛則先利心腹齊痛吐利並作或憎寒壯熱或頭痛眩暈或轉筋拘急或四肢厥逆煩悶昏塞燥亂欲死並能治之香薷四錢厚朴二錢薑炒白扁豆二錢上銼一劑水煎冷服挾風搐搦不省人事加黃連羌活小便澀濁加茵陳車前霍亂吐利加木瓜薷香薑汁臟腑積熱便血加枳殼黃連赤芍藥烏梅小便血加瞿麥車前子壯熱大渴五心煩熱加麥門冬淡竹葉茅根燈心腳氣作痛行步艱辛加羌活獨活蒼朮木瓜枳殼陳皮半夏挾痰加南星半夏二香散批按此方祛暑和中之劑治四時感冒寒暑嘔吐泄瀉腹痛瘴氣飲冷當風頭疼身熱傷食不化及南方風土暑月傷風傷寒悉以此藥解表發散香薷二錢厚朴一錢薑炒扁豆一錢紫蘇一錢香附二錢陳皮一錢蒼朮一錢甘草五分上銼一劑蔥薑煎服加木瓜一錢更妙五苓散治中暑傷寒濕熱表裡未解頭疼發熱口燥咽乾煩渴及飲水不止小便赤澀霍亂吐瀉心神恍惚腹中氣塊黃疸發渴等症豬苓二錢五分澤瀉二錢五分白朮二錢五分茯苓一錢五分肉桂三分上銼一劑水煎溫服或用滑石同為末每服二錢白沸湯調下尤妙本方去桂名四苓散加茵陳名茵陳五苓散加辰砂名辰砂五苓散一方加大黃治初利亦治積聚食黃酒疸量人虛實用之陽毒加升麻芍藥去桂狂言妄語加辰砂酸棗仁頭痛目眩加川芎羌活咳嗽加桔梗杏仁心氣不定加人參麥門冬痰多加陳皮半夏喘急加馬兜鈴桑白皮氣塊加三稜蓬朮心熱加黃連石蓮肉身疼拘急加麻黃口乾噯水加烏梅乾葛眼黃酒疸及五疸加茵陳木通滑石梔子鼻衄加梔子烏梅伏暑鼻衄加茅根煎調百草霜末五心熱如勞加柴胡桔梗有痰有熱加桑白皮人參前胡水腫加甜葶藶木通滑石木香疝氣加吳茱萸枳殼小茴香川楝子肉桂霍亂轉筋加藿香木瓜女子血加桃仁丹皮嘔吐去桂加半夏薑汁益元散一名六一散批按此方祛暑利水之劑治中暑身熱嘔吐煩躁不寧小水赤黃大便泄瀉善解暑毒凡盛暑之時雖不病亦宜散白滑石六兩水飛大粉草一兩微炒上為細末每服三錢加蜜少許熱湯冷水任下清暑益氣湯治長夏濕熱蒸人人感之四肢困倦精神短少懶於動作胸滿氣促肢節疼痛或氣高而喘身熱而煩心下痞悶小便黃而數大便溏而頻飲食不思身汗體重或汗少者血先病而氣未病也其脈中得洪緩若濕熱相搏必加之以遲遲病雖互換少瘥其因不出於暑濕二氣也宜以清燥之藥治之此湯為的黃耆炒一錢蒼朮炒一錢半升麻一錢人參五分白朮五分陳皮五分神麯五分澤瀉五分甘草炙三分黃柏酒炒三分當歸三分青皮三分麥門冬三分乾葛三分五味子十粒上銼一劑水煎溫服清暑和中散介石伯傳治中暑諸證黃連酒炒一兩香薷浮穗二兩厚朴一兩白扁豆炒四錢豬苓一兩五錢澤瀉一兩五錢白朮七錢赤茯苓去皮七錢木通去皮一兩滑石一兩五錢枳殼炒一兩車前子炒一兩陳皮去白七錢砂仁炒一兩木香三錢草果仁一兩五錢甘草炙三錢小茴香炒五錢上為細末每服一二匙隨病用引伏暑冷水調下腹痛酒調下嘔吐泄瀉霍亂轉筋百沸湯調熱服出汗嘔吐甚而不止者百沸湯和薑汁調下傷寒作瘧者蔥白湯調下取汗清暑六和湯批按此方清暑養元氣除溫熱之劑治心脾不調氣不升降霍亂轉筋嘔吐泄瀉寒熱交作痰喘咳嗽胸膈痞滿頭目昏痛肢體浮腫嗜臥倦怠小便赤澀並陰陽不分冒暑伏熱煩悶或成痢下中酒煩渴畏食婦人妊娠産後皆可服砂仁五分半夏湯泡五分杏仁泡五分人參去蘆五分赤茯苓五分藿香一錢白扁豆薑炒一錢木瓜一錢香薷二錢厚朴薑炒二錢黃連麩炒一錢上銼一劑生薑三片棗二枚水煎服生脈散夏月服之能生津液通血脈止煩渴養元氣健脾胃益精神人參去蘆五味子去梗麥門冬去心上煎湯代茶此一盞可當茶三盞千里水葫蘆祕方治路上行人暑熱作渴茶水不便用此藥備之俟渴時即用一丸噙化止渴生津化痰寧嗽硼砂柿霜烏梅肉薄荷葉白砂糖上等分搗爛為丸每用一丸噙化水葫蘆丸批按此方養氣清熱生津止渴之劑治冒暑毒解煩渴生津液川百藥煎三兩麥門冬去心烏梅肉白梅肉乾葛甘草各五錢人參去蘆二錢上為細末麵糊為丸如芡實大每用一丸噙化夏月出行一丸可度一日
