body:
  text: 卷之十四口病方牛黃散治小兒口中百病鵝口口瘡重齶不能吮乳及咽喉腫塞一切熱毒牛黃一分片腦一分硼砂一分雄黃二分青黛二分朴硝一分半黃連八分末黃柏八分末辰砂二分上為細末每少許敷口內瀉心湯治小兒口疳黃連為末每一字蜜水調服小兒口苦生瘡乃心脾受熱口瘡赤心臟熱口瘡白脾冷口瘡黃脾臟熱吳茱萸末醋調敷腳心移熱即愈藥性雖熱能引熱下行其功至良牙疳方玉蟾散治小兒走馬牙疳牙齦臭爛侵蝕唇鼻先用甘草水洗淨令血出塗之亦理身上肥瘡但是疳瘡用之立效蚵皮即蝦蟆不鳴不跳者是用黃泥裹火煨焦二錢半黃連二錢半麝香少許青黛一錢上為末濕則乾摻干則香油調抹之一方治小兒走馬牙疳一時腐爛即死婦人便桶中白垢火煅一錢許入銅緑三分麝香一分半敷之立已立效散治走馬牙疳黃丹水飛枯礬京棗連核燒存性共為細末敷之神效眼病方拔毒膏治嬰兒患眼腫痛熟地黃一兩以新汲水浸透搗爛貼兩腳心布裹住效一方治小兒赤眼用黃連末水調貼腳心干則水濕之一方治小兒熱眼南星四分大黃六分上為末陳醋調勻左眼敷右腳底右眼敷左腳底裹腳纏縛俟口內聞藥氣即愈頭瘡方治小兒頭瘡胎毒等瘡白芷一兩花椒五錢黃丹五錢枯礬二錢五倍子一兩上為末干則香油調搽濕則乾摻之治肥瘡黃水瘡祕方紅棗燒灰一錢枯礬一錢黃丹一錢松香一錢宮粉五分銀珠三分上為末濕則乾摻之干則香油調搽發斑方治小兒常發風癍及腳常紅腫此脾經風熱也防風通聖散去硝黃加鼠黏子酒炒黃連為末服之外用防風白芷薄荷黃芩黃連黃耆黃柏煎湯浴洗避風小兒諸方方保嬰百中膏京師傳治小兒疳癖瀉痢咳嗽不肯服藥及治跌撲傷損手足肩背並寒濕腳氣疼痛不可忍者瀝青二斤半威靈仙一兩萆麻子去殼一百二十枚研黃蠟二兩乳香一兩另研沒藥一兩另研真麻油夏二兩春秋三兩冬四兩木鱉子去殼二十八個切碎研上先將瀝青同威靈仙下鍋熬化以槐柳枝攪勻須慢慢滴入水中不黏手拔如金絲狀方可如硬再旋加油少許如軟加瀝青試得如法卻下乳香沒藥末起鍋在灰上再用柳條攪數百次又以粗布濾膏在水盆內拔扯如金絲頻換水浸二日卻用小銚盛頓如落馬墜車於破傷疼痛處火上炙熱貼透骨肉為驗連換熱水數次浴之則熱血聚處即消小兒疳癖貼患處瀉痢貼肚上咳嗽貼背心上混元丹鮑思齋傳養元氣和脾胃清火退熱化痰理嗽定喘安神鎮驚卻風止瀉消積化痞止汗消脹利小便小兒百病黃耆一錢蜜炙人參去蘆一錢縮砂去皮二錢白茯神去心皮二錢半益智去殼六錢莪朮火煨三錢山藥薑汁炒二錢半遠志甘草水泡去心一錢半桔梗一錢香附一兩蜜水煮過甘松八錢半牛黃一分麝香三釐金箔十片滑石六兩用牡丹皮五兩煎去水丹煮水乾為度滑石用青色者佳如無用白者辰砂一兩甘草一兩水煮半日去甘草不用粉草一兩半生半煨木香一錢白茯苓去皮二錢半上為細末煉蜜為丸如小雀卵大金箔為衣每服一丸米湯研化服驚風薄荷湯研化服萬億丸方見通治治小兒百病如神痘疹夫痘疹之原乃胎毒所致嬰兒在胎之時必資胎養以長其形焉緣母失於節慎縱欲恣食感其穢毒之氣藏於肺腑之中近自孩提遠走童年若值寒暄不常之候痘疹由是而發因其所受淺深而為稀稠焉大抵初娩之時孩兒口內亦有餘穢之毒急用棉裹指頭拭去口中汙汁免咽入腹事倘不及宜以拭穢等法並預解胎毒諸方擇便用之亦能免痘疹諸症真良法然痘疹雖是素稟胎毒未必不由諸病相傳而成其始發之時有因傷寒傷風而得者有因時氣傳染而得者有因傷食發熱有因跌撲驚恐蓄血而得者或為目擸口噤驚搐如風之證或口舌咽喉腹肚疼痛或煩躁狂悶昏睡譫語或自汗或下利或發熱或不發熱證候多端卒未易辨必須以耳冷骫冷足冷驗之蓋瘡疹屬陽腎臟無證耳與骫足俱屬於腎故腎之部獨冷然疑似之間或中或否不若視其耳後有紅脈赤縷為真於此可以稽驗矣治療之法痘疹未出之先預解胎毒發熱未出之際急須微汗已出未收之時當用溫和之劑又曰始出之前宜開和解之門既出之後當塞走泄之路痂落以後清涼漸進毒已去盡補益宜疏大凡初起未見紅點證與傷寒相類發熱煩躁臉赤唇紅身熱頭痛乍寒乍熱噴嚏呵欠喘嗽痰涎等證身熱未明疑似之間急須表汗發散可服升麻葛根湯參蘇飲之類其或氣實煩躁熱熾大便閉結則與犀角地黃湯敗毒散之類或多服紫草飲亦能利之如小便赤澀者分利小便宜以四苓散導赤散之類則熱氣有所滲而出凡熱不可驟遏但輕解之若無熱則瘡又不起發也蓋發熱之初紅點未見之前非微汗則表不解乃痘瘡未出表熱壅實之時也非微下則里不解在紅點未見裡熱壅盛之際也若正出未收之時妄汗則成斑爛妄下則成陷伏痘瘡一發出於心肝脾肺四臟而腎無留邪者為吉若初發便作腰痛見點則紫黑色者多死乃毒氣留於腎間而不發越故耳嚮者瘡隨五臟有證未發則五臟之證悉具已發則歸於一臟受毒多者見之故肝臟發為水泡色青而小肺臟發為膿泡色白而大心臟發為斑色赤血泡脾臟發為疹色黃小斑瘡惟歸腎則變黑青紫干陷故瘡疹屬陽本無腎證腎在下不受穢氣陽取火也陰取水也以火為水所制豈不氣殆哉大抵痘瘡之法多歸重於脾肺二經蓋脾主肌肉而肺主皮毛故遍身為之斑爛也其為證也宜發越不宜鬱滯宜紅活凸綻不宜紫黑陷伏瘡出之後醫者當察色詳證以辨表裡虛實用藥其吐瀉不能食為裡虛灰白色陷頂多汗為表虛紅活凸綻為表實又諸痛為實諸癢為虛外快內痛為內實外虛外痛內快為內虛外實內實而補則結壅毒表實而復用實表之藥則潰爛而不結痂矣如表虛者瘡易出而難靨表實者瘡難出而易收裡實則出快而輕裡虛則發遲而重表實裡虛則發慢收遲調養之法切不可妄用硝黃巴豆大寒大熱之藥解表不致於冷調養不致於熱小兒難任非常之熱亦不堪非常之冷稍有偏焉病從此生故熱藥之助熱者以火濟火而熱勢太盛榮衛壅遏輕為咽喉目疾吐衄癰瘡重則熱極生風斑爛不出冷藥之乘寒者以水滋水使脾胃虛寒氣血凝滯輕為吐利腹脹重則陷伏倒靨又宜謹避風寒嚴戒房事禁止雜人月婦清除穢氣觸忤調節乳食勿食過飽失飢忌餐冷熱毋使傷脾損胃大法活血調氣安表和中輕清消毒溫涼之劑二者得兼而已又曰首尾宜以保元湯增損為主治焉醫斯疾者當看時令寒熱審兒之虛實辨痘之榮枯參考各門方法庶無執泥之弊故曰虛者益之實者損之冷者溫之熱者清之是為隨機應變若膠柱鼓瑟則何足以妙圓神不滯之機乎豫解胎毒免痘論痘疹乃胎毒所致人生無不患者若欲免之亦有法也故千金方以小兒初生啼聲未發急用棉裹指頭拭去口中汙汁免咽入腹免生痘疹固是良法然倉卒之際或有不及如法者古人有甘草硃砂等法用之殊佳如或又有不及如此者宜以延生第一等方擇便用之可免痘疹或出亦稀少也詳考全書幼幼云凡值天時不正鄉鄰痘疹盛發宜服後禁方則可免永不出痘疹矣豫解胎毒免痘方方延生第一方小兒初生臍帶脫落後取置新瓦上用炭火四圍燒至煙將盡放土地上用瓦盞之類蓋之存性研為末預將硃砂透明者為極細末水飛過臍帶若有五分重硃砂用二分五釐生地黃當歸身煎濃汁一二蜆殼調和前兩味抹兒上齶間乳母乳頭上一日之內用盡次日大便遺下穢汙濁垢之物終身末無瘡疹及諸疾生一子得一子十分妙法也大極丸臘月八日取採生兔一隻取血以蕎麥麵和之少加雄黃四五分候乾成餅凡初生小兒三日後如緑豆大者與二三丸乳汁送下遍身發出紅點是其徵驗有終身不出痘疹者雖出亦不稠密也嬰兒已長會飲食者就以兔血啖之尤妙或云不必八日但臘月兔亦可然終不若八日佳保嬰丹凡小兒未出痘疹者每遇交春分秋分時服一丸其痘毒能漸消化若只服一二次者亦得減少若服三年六次其毒盡能消化必保無虞此方神祕本不輕傳但慈幼之心自不能已願與四方好生君子共之纏豆藤一兩五錢其藤八月間收取青豆梗土藤細紅絲者是採取陰乾炒在此藥為主黑豆三十粒赤豆七十粒山楂肉一兩荊芥五錢防風五錢當歸五錢新升麻七錢半赤芍五錢黃連五錢桔梗五錢連翹七錢半甘草五錢生地黃一兩川獨活五錢辰砂一兩水飛另研苦絲瓜二個長五寸者隔年經霜方妙燒灰存性牛蒡子一兩紙裹炒過為度上各為極細末和勻淨糖拌丸李核大每服一丸濃煎甘草湯化下諸藥須預先精辦遇春分秋分或正月十五日七月十五日修合務要精誠忌婦人貓犬見合時向太陽咒藥曰神仙妙藥體合自然嬰兒吞服天地齊年吾奉太上老君急急如律勒令一氣七遍滌穢免痘湯五六月間取絲瓜小小蔓藤絲陰乾約二兩半重收起至正月初一子時父母只令一人知將前絲瓜藤煎湯待溫洗兒全身頭面上下以去其胎毒洗後亦不出痘也如出亦輕只三五顆而已一方用胡蘆藤蔓如上法洗亦妙扶溝王大中每用楝樹子升許如上法洗已經驗數人皆長大而不出痘尤妙鄉鄰出痘預服禁方三豆湯治天行痘疹鄉鄰有此證預服之能活血解毒則不染赤豆即紅小豆一升大黑豆一升緑豆一升北草三兩上以三豆淘令淨用水八升煮令豆熟為度日逐空心任意食豆飲汁七日永不出龍鳳膏烏雞卵一個地龍活而細小者用一條此田間蚯蚓也上以雞卵開一小竅入地龍在內夾皮紙糊其竅甑上蒸熟去地龍與兒食之每歲立春日食一枚終身不出痘疹覺鄰有此證流行時食一二枚亦好獨聖丹絲瓜老者近蒂取三寸固濟於砂瓶內桑柴火燒存性為末以如數配砂糖搗成餅時時與吃盡為佳小兒痘疹服此則少或全然只燒蒸三兩日不出者或每遇作熱時即與食之出痘必少永不出痘二五散用有雄雞蛋七枚內取一枚開一孔去青黃淨將入鮮明好硃砂四錢九分其孔以紙糊用雞抱去雞雛將硃砂採日精月華各七日夜收貯所用再用起頭結絲瓜一個候老成種乾燥燒灰存性為末每服硃砂五分絲瓜灰五分為細末蜂蜜水調服服過三次亦不出痘疹鄰家出痘就宜服之發熱三朝證治例凡發熱之初急宜表汗使臟腑胎毒及外感不正之氣盡從汗散則痘出稀少然表藥必在紅點未見之前也如發熱壯盛者痘出必重急煎加味敗毒散調三酥餅熱服表之須令遍身出臭汗則毒氣表散痘出必稀若得真犀角磨汁和入尤妙如無三酥餅煎敗毒散調辰砂末表之更研辰砂末調塗眼四圍或黃柏膏之類可免眼目之患凡發熱之初證類傷寒疑似之間或耳尻冷呵欠咳嗽面赤必是出痘之候宜服升麻葛根湯加山楂大力子其瘡必出稀少而易愈凡發熱之初憎寒壯熱鼻流清涕咳嗽痰涎此因傷風傷寒而得以參蘇飲或調紫草膏表之凡熱盛發狂譫語煩渴者急煎敗毒散調辰砂末解之凡發熱之初或作腹痛及膨脹者由毒氣與外邪相搏欲出不得出也用參蘇飲去參苓加砂仁陳皮表之凡熱盛吐衄面黃糞黑瘀血相續及一切失血之證並宜犀角地黃湯凡熱盛發驚搐為吉候用紅線散調辰砂六一散表之痰涎壅盛不省人事者薄荷湯化下抱龍丸凡發熱欲出痘作腰痛者急服神解湯出汗腰痛止為度不止再進一服免出腎經之痘凡因積冷腹痛或胃寒泄瀉嘔吐者用理中湯加砂仁陳皮香附溫而出之熱毒本盛者表藥出汗熱退為佳其有一切雜證皆由毒氣欲出不能故也但宜表散使毒氣得泄則諸症自退痘亦稀矣此治初熱預防要法發熱三朝決生死例一發熱時用紅紙條蘸麻油點照心頭皮肉裡若有一塊紅者或遍身有成塊紅者八九日後決死勿治一發熱時身無大熱腹痛腰不痛過三日後才生紅點堅硬礙手者勿藥有生所謂吉證一發熱時渾身溫暖不時發驚者痘在心經而生也乃為吉兆一發熱時一日遍身即生紅點稠密如蠶種樣摸過不礙手者決死一發熱時腹中大痛腰如被杖乃至出痘乾燥而前痛猶不止者決死一發熱時頭面上有一片色如胭脂者八九日以後決死發熱三朝方藥例加味敗毒散柴胡前胡羌活獨活防風荊芥薄荷枳殼桔梗川芎天麻地骨皮各等分上古方除參苓恐補早助火也宜加紫草蟬蛻紫蘇麻黃殭蠶蔥白帶根熱服表汗泄瀉加豬苓澤瀉去紫草水煎熱服出汗為佳如熱盛譫語煩渴用此調六一散尤妙升麻葛根湯川升麻一錢白芍藥一錢甘草一錢白粉葛一錢半上銼作一劑生薑煎熱服加山楂大力子其瘡稀疏而易愈參蘇飲治小兒傷風傷寒發熱咳嗽痰涎喘急未明痘疹疑似之間此藥最穩紫蘇三分陳皮二分桔梗二分半夏薑汁炒三分前胡三分乾葛三分甘草二分枳殼去穰二分上銼生薑煎熱服或調紫草膏熱服表汗更佳犀角地黃湯治小兒痘疹初熱太盛大便黑糞瘀血或有鼻衄大小便血真犀角如無此以升麻代之亦可一錢生地黃一錢半赤芍藥一錢牡丹皮一錢上銼水煎服熱甚加黃芩紅線散治感風寒發熱驚搐煎調六一散表之痰盛者抱龍丸亦妙全蠍麻黃紫草荊芥穗蟬蛻天麻甘草加薄荷各等分上銼水煎調藥服三酥餅初熱用以表汗解毒痘出稀少辰砂絹囊盛之用升麻麻黃紫草荔枝殼煮過一日夜研細仍將前四味煎湯飛過曬乾再研極細用蟾酥另捻作餅紫草為細末用蟾酥另捻作餅麻黃去節泡燙過曬乾為細末用蟾酥另捻作餅蟾酥端午日作蟾取之捻前三藥為餅每餅加麝香少許更妙上方辰砂解胎毒涼心火制過又能發痘紫草解毒發痘麻黃表汗發痘蟾酥最能祛臟腑毒氣俱從毛竅中作臭汗出誠解毒稀痘之神方也如遇天行惡痘須於發熱之初每三歲兒將三餅各取一分或分半隨大小加減熱酒化下厚蓋出汗不能飲酒者將敗毒散化下尤妙若痘已出滿頂紅紫屬熱毒者煎紫草紅花湯或化毒湯將餅化下解之又小兒初生用蜜調辰砂餅一分以解胎毒痘出必稀皆妙法也麻黃餅痘出後忌服稀痘散發熱未出時服之最能稀痘辰砂將升麻麻黃紫草荔枝殼四味各煮一日夜研細仍將四味煎湯飛過曬乾研極細六錢天靈蓋用小兒者佳淨將麝香塗上火炙令黃為末三錢上二味和勻再研極細於發熱未出時煎紫草升麻紫蘇蔥白湯或敗毒散調下每一歲以一分為度六一散治熱毒太盛狂言引飲痘瘡紅紫黑陷滑石白膩者研細水飛曬乾再研六兩冰片三分後和研勻粉草取頭末研極細六錢辰砂光明者水飛三錢上將滑石甘草末一半研勻然後加冰片研勻作六一散治痘瘡紅紫黑陷熱渴餘一半入辰砂六一散治驚狂讝語前方發熱之初用敗毒散調下亦能解毒稀痘若出痘後紅紫屬熱毒者春秋各用燈草煎渴候冷調服夏月新汲泉水調服三五歲服一錢十歲服二錢神解湯治小兒發熱欲出痘腰痛柴胡一錢半乾葛一錢川芎八分白茯苓八分麻黃去節八分升麻八分防風八分甘草五分上銼一劑水一鍾半先將麻黃滾去白沫後煎至八分熱飲覆被臥取汗腰痛止為度不止再進一劑免出腎經之痘此法甚奇神功散何知府傳此方初覺熱服之不出若見標者服之毒氣即散陷者服之即起川芎六兩當歸六兩升麻六兩甘草六兩上為細末一起取東流水煎三次每次用水三碗文武火煎至一碗半濾下又煎二次共藥水四碗半聽用又用好硃砂四兩以絹袋懸入瓷罐加前藥水封固水煮盡為度取出焙乾為末以紙羅過聽用再以引經散用糯米二三合以紙包緊外用黃泥固濟入火煉紅冷定打碎取米黃色者用之白色者不用每服以硃砂末一錢米末一錢煉蜜二匙好酒二匙白沸湯一小鐘共一處調勻用茶匙喂盡取效黃柏膏治痘瘡初出先用此膏塗面若用之早則痘瘡不生於面用之遲雖出亦稀少黃柏一兩紅花二兩甘草生四兩緑豆粉四兩上為末香油調成膏從耳前眼唇面上並塗之日三五度出痘三朝證治例凡三日痘漸出齊然毒氣尚在內忌用大寒大熱之劑寒藥滯毒不散難出熱藥愈熾火邪故熱毒盛者便當解毒毒解之後略與溫補否則反變虛寒之證矣虛寒甚者先當溫補補後略與解毒否則反生熱毒之證矣善治者調適中和而已夫發熱一日即出痘者太重二日即出者亦重微微發熱三日後乃出痘者為輕四五日身涼乃見痘者尤輕自出痘一日至二三日方齊大小不等紅潤圓頂光澤明淨如珠者吉不須服藥若有他證照後所論加減調治凡小兒發熱一日遍身紅點如蚊蚤咬者決非痘瘡乃熱毒為風寒所遏不能發越故也宜照發熱門內煎敗毒散熱服表之汗後身涼紅點自退再越二日出痘返稀矣凡發熱一日遍身出痘稠密如蠶種根雖紅潤然頂白平軟不得指中有清水者此由熱毒熏蒸皮膚而生痱瘡亦名疹子俗曰麻子其始發熱亦類傷寒之狀但麻證始終可表宜照發熱門內煎敗毒散表之退肌膚之熱則麻子自沒矣夫發熱門內云既見紅點切戒再表者謂痘瘡也此復云表退者謂麻疹痱瘡非正痘也宜慎辨之然痘疹初出與麻疹痱瘡略相似若根窠紅頂圓突堅實礙手者痘也若根或不紅頂虛軟略有清水摸過不礙指者麻疹痱瘡也疑似之間可以辨明而用藥得無誤乎凡發熱一日即見紅點根紅頂圓堅實礙指者正痘瘡也此由毒氣太盛故出速宜敗毒散或化毒湯加紫草紅花蟬蛻之類涼血解毒可也若一日出齊稠密紅赤成片此毒盛太過不久紫黑髮斑而死凡壯熱驚搐煩渴譫語如見鬼神者宜辰砂六一散痰盛者宜抱龍丸凡痘出不快者加味四聖散紫草飲絲瓜湯之類凡痘出灰白不紅綻或灰黑陷頂表寒而虛二便清身涼口氣冷不渴不食食不化裡寒而虛此表裡虛寒也急宜溫脾胃補血氣以助貫膿收靨保元湯加白朮川芎當歸木香之類蓋脾土一溫則胃氣隨暢而無內虛陷伏之憂氣血既成則送毒得出無癢塌之患失此不治必不能貫膿收靨過十一二日後發癢抓破而死矣若溫補之後痘肥滿紅潤能食二便如常此表裡皆平矣再勿溫補恐變熱毒若痘紅紫又當解毒以調血氣否則變成黑陷譬又傷寒變證不常非雜病可徑直而取效也凡痘色紅紫根窠成片近黑黑如烏羽色潤者為血活尚可醫若黑如炭者血死不可治凡看色仿此推之焦陷表熱而實大便閉結小便赤澀身熱口氣熱口乾引飲裡熱而實此表裡皆熱盛也急宜涼血解毒祛出化毒湯加紅花黃芩地骨皮或紫草湯調四聖散蓋涼血不致紅紫解毒則免黑陷失此不治過六日後毒盛不能盡出反攻臟腑變黑歸腎死矣悔何及哉若解毒之後痘頂不紅根窠紅潤小便清利大便如常能食不渴此表裡皆清矣再勿解毒若色轉白證變虛寒又當溫補氣血以助貫膿收靨否則反成癢塌猶傷寒過服涼藥陽證變陰又當服保元湯加乾薑白朮之類不可拘泥凡痘瘡初出之際須看胸前若稠密急煎消毒飲加山楂黃芩酒洗紫草減食加人參凡痘色淡白頂不堅實不礙指者氣虛也根窠不紅或略紅手摸過處轉白者血虛也便當大補氣血以保元湯加川芎當歸凡痘熱盛發紅斑如錦紋在皮肉者化毒湯加紅花黃芩升麻喉痛加玄參磨犀角和服此傷寒陽毒發斑用玄參升麻湯加減之法若見黑斑不終日而死矣凡出痘時或有紅丹如雲頭突起者敗毒散加紫草紅花黃芩解之凡出痘後或發麻疹稠密如蠶種者化毒湯加柴胡紅花解之若色好不可過用涼藥傷脾以致陷伏凡出痘時或泄瀉大便黃小便赤口氣熱如渴此為熱瀉宜去桂五苓散加木通車前燈草如溏泄清利口氣冷不渴此為寒瀉宜五苓散加肉豆蔻甚者保元湯加白朮乾薑凡痘正出或因吐瀉陷伏宜胃苓湯寒甚吐瀉不止宜理中湯加丁香肉豆蔻附子凡因食積生冷膨脹疼痛者平胃散加山楂麥芽香附砂仁之類凡痘瘡初起發時自汗不妨蓋濕熱熏蒸故也甚者保元湯實表以防其難靨也凡痘出紅赤掀摸過皮軟不礙指者此賊痘也過三日變成水泡此危證也急少下保元湯大加紫草蟬蛻紅花解之或煎燈草木通湯調六一散利出心經蘊熱而紅自退如已成水泡則保元湯中倍加四苓散利之此千金祕方也不然則遍身抓破赤爛而死愚見賊痘者是諸痘未漿此痘先以成熟者亦是賊痘也又名假虛泛發太陽脈門喉掩心等處三日見者六日死四日見者七日亡五六日見者十一二日必死也凡痘一出即變黑者乃腎證也此為惡候如有起興少用保元湯大下紫草紅花服下外用四聖散點之然早能涼血解毒必無此患亦多因脾胃衰弱土不能制水故也經曰紅變白白變黃者生紅變紫紫變黑者死自出痘三日內毒氣半於表裡此時妄汗則成斑爛妄下則成陷伏峻塞之藥傷胃峻熱之藥助火虛寒不補則陷伏癢塌盛熱不解則變黑歸腎然則醫者可不審證出痘三朝決生死例一出痘之時須面稀少胸前背上皆無根窠紅潤頂突礙手如水珠光澤者上吉也不須用藥而愈一出痘之時腰腹疼痛不止口氣大臭其自出紫黑色黯者決死一出痘之時白色皮薄而光根全無紅色或根帶一點紅三五粒如緑豆樣此痘決不能貫膿久後成泡清水擦破即死不可因其好者而妄與下藥一出痘之時全不起頂如湯泡及燈草火灰者十日後決主癢塌而死一出痘之時口鼻及耳煬紅血不止者決死一出痘之時起紅斑如紋者六七日後決死一出痘之時起黑斑如痣狀肌肉有成塊黑者即死一出痘雖稀根窠全白無血色三四日便起脹痘大按之虛軟此名賊痘血氣太虛至貫膿時變成水泡大若葡萄內是清水無膿皮薄白如紙擦破即死好痘相間可治凡痘初出每三五點相連者必密單見形者稀有小紅點先見名血痘不起不退者不治凡痘出後見紅點太陽脈門胸心喉掩無者可治若太陽兩頰胸心如蠶種不治乾澀如尲尬者不治舌縮者不治初出即虛泛不治燈照恍惚見黑蔭者不治見赤點如緑豆大於兩腋小腹數點者不治出痘三朝方藥例胡荽酒治痘疹已發未發噴之立出胡荽三兩細切以酒二鍾煎沸用紙密封不令氣出候冷去渣從頂至頤頷微微塗之更噴背膂胸腹及兩腿皆遍再用滿房門戶遍灑之尤妙化毒湯治痘已出以此消毒或出不快皆宜服之一云痘瘡欲出渾身壯熱不思飲食若服此一劑即內消已有一兩顆出即解其半若全出即當日頭焦只三服愈紫草茸五錢川升麻二錢半甘草炙二錢半上銼每二錢糯米五十粒同煎服消毒飲治痘瘡初出胸前稠密者急進此藥三四服決透消毒應手神效鼠黏子四錢荊芥二錢甘草一錢生用防風去蘆五分本方加山楂黃芩酒洗紫草煎服減食加人參細銼一劑水煎加生犀角尤妙加味四聖散治痘瘡出不快及變黑陷者紫草茸木通黃耆川芎南木香各等分甘草炙減一半上銼水煎服如大便閉加枳殼大便如常加糯米百粒解毒能釀而發之楊氏曰糯米能解毒發瘡紫草飲子治痘出不快三四日隱隱將出未出紫草二兩細銼百沸湯一大碗沃之蓋定勿令氣出逐旋溫服紫草能動大便發出亦輕大便利者不可用絲瓜散治痘出不快最妙絲瓜不拘幾個連皮子燒存性為末每服一抄時時用米湯調服此物發痘最妙或以紫草甘草煎湯調服尤佳紫草膏全蠍二十個殭蠶八個炒麻黃五錢甘草五錢紫草五錢蟾酥一錢白附子五錢上為細末另將紫草一兩銼煎去渣熬成膏紫草湯化下又用蜜二兩入好酒半盞煉過同紫草膏攪勻調前末藥丸如皂角子大每三四歲兒服一丸紅紫黑陷屬熱毒者紫草湯化下淡白灰陷屬虛寒者好酒化開熱服發熱之初煎敗毒散化下表汗亦能稀痘證似風寒者參蘇飲化下發驚者薄荷燈心蔥白湯化下保元湯人參去蘆二錢甘草一錢嫩黃耆一錢上銼一劑生薑一片水煎溫服一二日初出圓暈成形乾紅少潤毒雖犯上其氣血未離可治以俟其氣血交會也然毒尚淺急以保元湯加官桂兼活血勻氣之劑如毒若盛兼解毒之藥活血加當歸五分白芍一錢勻氣加陳皮五分解毒加玄參七分牛蒡子炒七分水一盞煎七分溫服二三日根窠雖圓而頂陷者血亦難聚為氣虛弱不能領袖其血以保元湯加川芎官桂扶陽抑陰豈有不痊者哉四五日根窠雖起色不光澤生意猶存為氣弱血盛以保元湯加芍藥官桂糯米助衛制榮斯為調燮之妙也五六日氣盈血弱色昏紅紫以保元湯加木香當歸川芎助血歸附氣位以全中和之道也五六七日氣交不旺血雖歸附不能成漿為氣血少寒不能制急投保元湯加官桂糯米助其成漿而收濟惠之偉功斯為治矣七八日毒雖化漿而不滿為血氣有疑不能大振以保元湯加官桂糯米發陽助漿斯可以保全生命矣一至此專主貫膿膿已滿雖有他證亦不壞事若痘無膿灰暗雖無他證亦死八九日漿不沖滿血附線紅氣弱而危也以保元湯加糯米以助其氣而駕其血斯漿成矣於此可見施治者之妙道也十一二日氣血沖滿血盡漿足濕潤不斂者內虛也以保元湯血亦有力加白朮茯苓助其收斂而結痂也十三四日毒雖盡解漿老結痂之際或有雜證相仍以保元湯隨證加減不可峻用寒涼大熱之劑恐致內損之患故也十四五六日痂落潮熱唇紅口渴不食以使君子湯加陳皮山楂黃連如渴甚以參苓白朮散如熱不解以大連翹飲去黃芩主之證去之後多有內損或餘毒未解此則尤為難治也凡痘疹發渴者為氣弱而津液枯竭也以保元湯加麥門冬五味子即止如不止以參苓白朮術散一二劑即止凡痘瘡不起發膿漿不厚以保元湯加川芎五分丁香四分夏月二分糯米二百粒煎熟加好酒人乳各半盞同服若頭額不起脹加川芎六分為引若面部不起脹加桔梗四分為引若腰膝不起脹加牛膝四分為引若兩手不起脹加桂枝二分為引起脹三朝證治例夫出痘歷此四日當漸起脹先出者先起後出者後起至五六日毒氣盡出已定若根窠紅活肥滿光澤明淨者不須服藥若有他證照後論治凡痘不起脹灰白頂陷者氣血不足虛寒證也宜服內托散加丁香或酒調紫草膏若灰黑陷伏酒調無價散或就加酒少許煎內托散調下無價散最妙凡紫紅不起脹者火盛血熱宜服內托散去官桂加紫草紅花熱盛加黃芩若紫黑陷伏調獨聖散即穿山甲熱極黑陷有痰者先服抱龍丸降痰後煎紫草湯調無價散或少加蟬蛻末蓋異證屬腎四牙亦屬腎故能發腎毒內有貓牙解毒故熱證亦宜如無此無價散至寶丹皆治熱毒紫黑焦陷之要藥也可選而用之凡痘起脹時毒盡在表須賴乘實則無虞苟略有瀉則內氣虛脫毒乘虛反攻而瘡陷伏矣熱瀉所下黃黑赤色便時肛門熱痛如火下者臭滯殊甚氣強盛而能食或小便黃赤澀痛宜四苓散加木香車前子赤芍烏梅煎服若所下白色或淡白色氣怯弱而不能食或兼小便清滑此虛瀉也宜服固真湯若泄瀉腹脹口渴氣促痘色灰白者可服木香散送下肉豆蔻丸腹脹愈作者酒調人牙散凡血氣不足發癢者輕則保元湯加減重則內托散去桂倍白芷黃耆人參當歸木香癢塌者木香散加丁香攻裡官桂治表表裡皆實則易愈凡癢塌者皆因血上行氣分血味本咸醃螫皮肉作癢然氣愈虛而癢愈甚必氣陷而毒倒塌矣以保元湯倍黃耆而助表少加芍藥以制血其毒即止凡起脹時中有痘大而黑者名曰痘疔失治則遍身皆變而死若疔少根窠紅活者可治用根簪挑破疔口吮去紫黑惡血將四聖散點入瘡內即變紅活仍服涼血解毒藥一二帖若疔多根血不活背心前多者不治凡有熱壅盛脹滿便閉不可通利者宜蜜皂丸導之自出痘至此六日仍前紅紫滿頂者不治頭面雖腫痘不起脹者不治起脹三朝決生死例一痘三日之後當逐漸起脹若紅綻頂肥滿光澤者不必用藥皆吉證也一痘當起脹之時根窠全然不起頭面皮肉紅腫瓠瓜之狀者決死一痘當起脹之時遍身痘疔皆黑其中有眼如針孔紫黑者決死一痘當起脹之時遍身痘陷伏不起者腹中膨脹不能飲食氣促神昏者決死如六日內痘尚紅紫滿頂者即死一痘當起脹之時腰腹或痛遍身尚是紫點如蚊蟲咬全不發換者決死一痘當起脹之時黑陷悶亂神氣昏懵者決死起脹三朝方藥例方內托散治氣血虛損或風邪穢毒沖觸使瘡毒內陷伏而不出或出而不勻快此藥活血勻氣調胃補虛內托瘡毒使之盡出易收易靨人參二錢黃耆二錢當歸二錢川芎防風一錢桔梗一錢白芷一錢厚朴薑汁炒一錢甘草生一錢木香三分肉桂三分上方於紅紫黑陷屬熱毒者去桂加紫草紅花黃芩若淡白灰黑陷伏屬虛寒者加丁香救里官桂救表當貫膿而不貫膿者倍參耆當歸煎熟入人乳好酒溫服泄瀉加丁香乾薑肉豆蔻木香散性溫平能和表裡通行津液清上實下扶陰助陽之藥專治小兒痘瘡膿脹渴瀉其效如神木香丁香官桂半夏薑製陳皮前胡大腹皮赤茯苓人參甘草炙訶子肉煨去核各三分上銼每三錢生薑煎服量兒大小加減服藥後忌蜜水異功散治小兒痘瘡欲靨之際頭溫足指冷或腹脹泄瀉口渴氣促或身不熱寒戰悶亂不寧臥則哽氣煩渴咬牙急服此切不可與蜜水紅柿西瓜梨果食之人參白朮陳皮白茯苓丁香當歸木香厚朴薑製官桂大腹子泡去皮臍半夏薑炒肉豆蔻麵裹煨槌去油各三分上銼每三錢生薑三片棗一枚水煎熱服固真湯治小兒痘瘡虛瀉神效黃耆人參甘草炙陳皮白朮木香白芍炒白茯苓訶子煨去核肉豆蔻麵裹煨紙包槌去油各等分上銼粳米三十粒水煎溫服肉豆蔻丸專治痘瘡裡虛泄瀉木香二錢砂仁二錢訶子肉五錢肉豆蔻煨五錢白龍骨五錢枯白礬七錢半赤石脂七錢半上為末糕糊為丸如黍米大周歲兒五十丸三歲百丸溫米湯下瀉甚者異功散吞下瀉止住服不止多服無價散治痘黑陷而焦人牙貓牙犬牙豬牙上等分各將炭火燒留煙瓦碗蓋蔽存性為末每五六歲服三四分好熱酒調下癢塌寒戰泄瀉者煎異功散調下若無貓牙用人牙一味亦妙但不如四牙全方人牙散治痘瘡初起光壯忽然黑陷心中煩躁氣急喘滿狂言妄語如見鬼神急宜治之不然毒氣入臟必死人牙燒存性為末每一個作一服酒調下獨聖散治痘六七日陷而不發及不貫膿有瀉不宜服陷入黑色氣欲絶者神效穿山甲泡洗冷淨用炭火拌炒成珠焦黃為度上為末每服五分或六七分木香湯或紫草湯入酒更妙糯米清湯亦可祕傳復生散治痘瘡黑陷不起發珍珠一錢琥珀一錢雄黃一錢穿山甲一錢硃砂一錢兩頭尖一錢香附子一錢真蟾酥五分上先將蟾酥切片以人乳汁浸少時入衆藥搓勻一歲兒服八釐三二歲兒服一分二釐用熟蜜水調下兔血丸治痘瘡不起發十二月收下兔血白雄烏雞血好硃砂廣木香小兒退下乳牙煅黃色雄黃上六味各一錢共為細末每服五分黃酒送下汗出即起發歸茸酒凡痘瘡已成出齊而難脹或已脹齊而難靨者由內虛故耳蓋痘既出灰白色及頂平不起或陷伏者氣血大虛也嫩鹿茸酥炙當歸身酒洗每銼五錢好酒煎溫服無比散治痘焦枯黑陷極熱毒熾惡候牛黃五錢片腦五錢硃砂三錢膩粉五錢麝香一錢上為末每五六七歲者服五分新汲井泉水調下或加小豬尾血三五滴調下尤妙人中黃散治痘六七日不肥滿及陷入及不貫膿服此神效瀉亦無妨解毒排膿人中黃即糞缸內厚垢採來或成塊者炭火中煅過通紅取出火毒研細為末每服一茶匙酒調服糯米清湯亦可祕方治痘不起發雄黃三錢天靈蓋一兩火煅小兒者佳寒水石八錢火煅上為末糯米濃飲為丸如梧桐子大硃砂為衣每服一丸用熱酒化下出汗即長效萬金散治瘢瘡不出黑陷至死者人貓豬犬臘辰燒少許微將蜜水調百者救生無一死黃金萬錠也難消上將四物糞於臘日早晨日未初時貯於銀鍋內炭火煅令煙盡白色為度但是瘡發不快倒靨黑陷者及一切惡瘡每用一字蜜水調服其效如神蜜皂丸蜜皂專醫糞不通發狂譫語小便紅煉蜜微和牙皂末捻梃令安穀道中上用蜜二三兩熬如飴加皂角末二錢攪勻捻作梃子三四條將一條納穀道中如不通再易一條必通矣自出痘至收靨時理不宜下者用此導之若既靨之後有前證者又當下也四聖丹治痘瘡中有長大紫黑者為疔毒把住痘不起發急用銀簪挑破紝入此丹珍珠三五粒鐵器土爆微黃色豌豆四十九粒燒灰存性頭髮燒灰存性不拘多少上為細末用擦面油胭脂調成膏子將兒在溫燠處安存忌風寒穢氣先用簪尖平撥開疔將藥紝入疔內即變紅色全瘡皆起但挑破出黑血或用棉裹指掏去黑血即愈蓋疔破而毒氣得散也國老散治痘瘡瘢瘡疔腫癰疽諸般惡毒及中砒毒用毒傷寒發狂言並治五月初四日預選大甘草不拘多少研細末卻用大竹一段兩頭留節鑽一頭作小孔裝入甘草末於內其孔用木塞固勿令泄氣用繩縛竹候至端午日置糞缸中以磚墜竹至底四十九日取出長流水洗淨候乾取藥曬燥再研細貯瓷器內如遇小兒出痘見苗每服一錢淡砂糖湯調服及諸般惡毒並用砂糖湯調服大能解毒神效祛毒散治痘瘡作毒發癰疽豬苓澤瀉白朮赤茯苓官桂防風羌活牛蒡子炒黃連柴胡甘草各等分上銼生薑燈草薄荷水煎服貫膿三朝證治類凡痘七八九日漸貫膿膿水之盈虛視血氣之盛衰也故須調和脾胃滋補血氣令易膿易靨夫出痘歷七日當貫膿八日九日肥滿光澤蒼蠟色如果黃熟者不須服藥貫膿三日有他證照後論治七日前後見五陷者氣不足也血不足不能收血而毒不能成漿蓋氣不盛毒故也以保元湯加川芎官桂糯米溫胃助氣七日前後倒陷者氣血衰也以保元湯加白朮茯苓肉豆蔻渴以參苓白朮散主之七日前後見寒戰者表虛也咬牙者內虛也七日後見寒戰者氣虛也咬牙者血虛也氣虛以保元湯加桂以溫陽血虛加川芎當歸以益陰分凡痘瘡七八日不貫膿灰白陷頂寒戰咬牙腹脹口渴渴非因熱津液少也內托散倍加丁桂參耆腹痛加丁香乾薑瀉以木香散下豆蔻丸凡痘當貫膿之時雖若起脹而中空乾燥並無膿血者死若略有清水或根窠起脹血紅而活猶有生意者內托散倍加參耆歸又將人乳好酒各半盞和入溫服此貫膿之巧法也凡貫膿肥滿庶易結靨若痘雖脹滿光澤可觀然摸過軟而皮皺者雖有膿不甚滿足後必不能收靨或痘皆貫膿中間幾顆不貫者終變虛寒癢塌之證宜內托散倍加補血氣排膿之藥凡痘陷無膿雖因服內托藥而暫起不久又陷者貫膿不滿故也宜內托散倍參耆歸人乳好酒之類蓋貫膿既滿必無陷伏之患矣凡因虛發癢遍身抓破膿血淋漓不能坐臥者宜內托散去桂倍白芷止癢當歸和血木香調氣氣行血運其癢自止外用敗草散敷之庶免破處感風變證以致上痰咳嗽聲啞若變遍身抓破並無膿血清水皮白乾如豆殼者死凡穢氣衝觸發癢抓破者宜內托散照前加減外用祛穢散焚熏如黑陷不起煎內托散調下無價散服之此當八九日貫膿之時最不宜寒藥解毒以傷脾胃凝氣血不能貫膿尤忌食魚以助痰氣貫膿三朝決生死例一痘當起脹三日之後根窠紅潤貫膿充滿如黃蠟色二便如常飲食不減吉候也不必下藥如紅紫黑色外剝聲啞者死一痘當貫膿之時純是清水皮白如薄與水泡相似三四日遍身抓破而死一痘當貫膿之時痘中乾枯全無血水此名空瘡痘決死一痘當貫膿之時吐痢不止或二便下血乳食不化痘爛無膿者決死一痘當貫膿之時二便不通目閉聲啞腹中脹滿肌肉黑者死收靨三朝證治例凡痘十日十一二日痘漸收靨自上而下為順自下而上為逆其遍身皆靨雖數顆不靨尚能殺人猶蛇蛻皮雖一節被傷不能退者是亦死也夫出痘十一二日從口唇頭面逐漸收靨至足者不須服藥若有他證然後論治凡痘當靨不靨泄瀉寒戰咬牙抓破此虛寒者服異功散觸穢冒寒黑陷不靨煎異功散調下無價散外癢者外用去穢散熏之凡過服熱藥以致熱毒猖狂氣血彌盛痘爛不靨者內服小柴胡湯豬尾膏解之外用敗草散敷之凡痘在前發越已透貫膿已滿茲解毒已清至收靨時或因觸冒致陷伏斑爛癢塌不靨者但服異功散自愈瘡雖不起不必憂也凡痘皆收靨惟數顆臭爛深坎不收口者用硝膽膏塗之凡痘不收靨氣急上痰聲啞目閉無神者死靨後瘢紅者吉白者血色者毒氣歸內也恐生餘證凡痘收靨後氣血大虛肌肉柔嫩不耐風寒慎戒觸冒風寒乘涼不謹輕則餘毒內攻重則中風癱瘓危矣戒之戒之凡痘既收靨欲落不落而燥癢者或瘡痂雖落其色黯或凸或凹或瘡愈痂未落用白沙蜜不拘多少塗於瘡上其痂易落亦不令瘢痕紫黑又不腥穢甚妙凡痘瘡已靨未愈之間五臟未定肌肉尚虛血氣未得平復忽被風寒搏於膚腠之間則津液澀滯故成疳蝕瘡宜雄黃散綿繭等藥治之久而不愈者潰骨傷筋以害人也小兒痘自出至收靨要十二日可保平安首尾不可與水吃少與滾熟水則可若誤與之瘡靨之後其痂遲落或身上癰腫若針之則成疳蝕瘡膿水不絶甚則面黃唇白以致難愈者何也蓋脾胃屬土外主身之肌肉只緣飲水過多濕損脾胃搏於肌肉其脾胃肌肉虛則津流衰少而榮衛滯澀氣血不能周流凝結不散故瘡痂遲落而生癰腫也黃帝曰飲有陰陽何也好飲冷者冰雪不知冷好飲熱者沸湯不知熱岐伯對曰陽盛陰虛飲冷不知寒陰盛陽虛飲湯不知熱治之何如故陽盛則補陰虛木香散加丁香肉桂治之陰盛則補陽虛異功散加木香當歸每一兩藥共加一錢異功散能除風寒濕痹調和陰陽滋養血氣使痘瘡易出易靨不致癢塌木香散性溫平能和表裡通行津液清上實下扶陰助陽之藥也善治小兒腹脹瀉渴其效如神不能盡述大抵天地萬物遇春而生髮至夏而長成乃陽氣熏蒸故得生長者也今瘡疹之病臟腑調和則血氣充實自然易出易靨蓋因外常和暖內無冷氣之所由也收靨三朝決生死例一痘當靨之時色轉蒼羸成紫葡萄色者一二日決從口鼻四邊靨起腹中收至兩腿然額上和腳一齊收靨落皮而愈此乃吉證也不必驚疑下藥一痘當靨之時遍身臭爛如拼搭不可近目中無神者決死一痘當靨之時遍身發癢抓搭無膿者皮卷如豆殼乾者決死一痘當靨之時寒戰手足顫掉咬牙噤口即死一痘當靨之時目閉無神腹脹足冷過膝者決死一痘當靨之時聲啞氣急痰響小便少大便頻者決死一痘當靨之時痘瘢雪白全無血色過後亦死急用消毒散二帖後用助氣血藥以養脾胃或可得也宜預先治之收靨三朝方藥例方敗草散治痘瘡抓搔成膿血淋漓用蓋房多年爛草或蓋牆爛草亦可其草經霜露感天地陰陽之氣善解瘡毒其功不能盡述取草不拘多少曬乾或焙乾為末干貼瘡上若渾身瘡破膿水不絶黏貼衣裳難以坐臥可用二三升攤於席上令兒坐臥其效如神仍服木香散加丁香官桂同煎服硝膽膏硝膽膏醫口不收瘡瘢臭爛血膿流宜研豬膽芒硝細末患處塗之病自瘳豬膽汁芒硝二味研勻如膏塗之脫甲散治瘡甲不落不能靨者雄黃蟬蛻皮去土人頂骨燒灰各一錢上為細末每服三分米湯下雄黃散治小兒牙斷生疳蝕瘡雄黃一錢銅緑二錢二味共研極細末量兒大小乾摻上綿繭散治痘瘡身體肢節上有疳蝕瘡膿水不絶空蠶繭須是出蠶蛾了者一味不拘多少用生白礬研細入內繭內令滿以炭火燒令白礬汁幹盡取出研極細每用干貼瘡口上豬尾膏龍腦半字許研細旋滴豬心血為丸辰砂為衣紫草湯化下痘後餘毒證治例夫小兒痘瘡自首至尾脾胃溫暖表裡中和痘後亦無餘證若熱毒太盛失解或過服桂附熱藥則收靨之後餘毒猶作輕則咽喉齒目吐衄癰瘡重則熱極生風變成驚搐而死者多矣當照後調治一痘初毒盛或因服附子毒藥者靨落之後便服消毒飲一二帖或飲三豆湯解毒之良法也若餘熱不退輕則小柴胡湯虛煩不眠者竹葉石膏湯加酸棗仁渾身壯熱不退者黃連解毒湯煩渴譫語者辰砂六一散熱盛大便閉腹脹內實者小承氣湯下之一痘後餘毒或先服附子熱毒失解聚而不散以至頭頂胸背手足肢節亦腫成癰毒者宜消毒飲小柴胡湯倍加羌活獨活連翹金銀花天花粉有膿須刺破如生痘風瘡止用消毒飲敗毒散之類一餘熱發驚搐者抱龍丸主之過二三後證惡者死一熱毒上攻眼目熱脹疼腫血絲遮睛者洗肝散壯熱甚者加黃連黃芩黃柏梔子腫脹不能開者仍用雞子清調黃連末塗兩太陽足底心以引熱毒下行一咽喉腫痛甘桔湯加防風玄參射干牛蒡子熱盛加黃芩小便澀加木通一牙疳腫痛失血牙齦宣露者甘露引子牙疳腐爛者用老茶韭菜根濃煎洗淨仍敷搽牙散一觸冒風寒咳嗽者發散藥內加栝蔞桔梗杏仁韭菜根桑白皮八白草根痰盛加枳實半夏石膏若毒攻肺喘急咳臭膿血者死一脾胃虛弱飲食不化少進平胃散加山楂神麯麥芽香附吐瀉者胃苓湯寒甚嘔逆泄瀉理中湯大抵痘後證多餘熱因寒者少痘後餘毒方藥例方犀角化毒丹方見諸熱治痘後餘毒未解頭面身體多生瘡癤上焦熱壅唇口腫破生瘡牙齦出血口臭黃連解毒湯黃連黃芩黃柏梔子各等分水煎服小便赤加車前子木通洗肝散歸尾川芎羌活薄荷梔子防風大黃甘草各等分上銼水煎服熱盛便閉加芩連柏煎滾泡大黃芒硝下之睛疼昏暗加滑石石膏穀精草菊花緑豆皮上翳膜者加蟬蛻殭蠶石決明白蒺藜或穀精草生蛤粉黑豆皮煮豬膽食之亦妙若未靨之前痘瘡入眼者本方去大黃瞳腫不開以雞子清調黃連末塗兩太陽穴及足底心通明散治痘後餘毒眼生翳障當歸川芎芍藥生地黃防風乾葛菊花穀精草倍蟬蛻天花粉各等分上銼水煎服眼赤腫加黃連梔子翳厚加木賊吹雲散治痘瘡眼生翳障或紅或白腫痛黃丹水飛一錢輕粉三分片腦一釐上為末鵝毛管吹耳內如左眼患吹入右耳右眼患吹入左耳一旦三次兼服通明散須得早治遲則必難矣一方用黃丹輕粉各一錢如前吹耳內有雌雄檳榔磨水服之殊效回光散治痘疹傷眼荊芥黃連赤芍穀精草菊花木賊桔梗牛蒡子前胡獨活甘草各等分上銼生薑燈草煎服一方治痘瘡入眼或病後生翳障蟬蛻洗淨去土白菊花各等分每服二錢入蜜少許水煎服一方治痘疹眼生翳障用綿胭脂以口嚼即水入蒸過熟蜜和勻燈草蘸翳上甘桔湯治咽喉腫痛桔梗甘草防風牛蒡子玄參麻黃射干上銼水煎服熱盛加黃芩小便赤澀加木通甘露飲治牙疳去血口臭牙齦腫痛腐爛枳殼石斛黃芩生地黃茵陳天門冬甘草熟地黃麥門冬枇杷葉各等分上銼水煎服牙齦腐爛仍用搽牙散擦之搽牙散治走馬牙疳牙齦腐爛人中白取樟子尿桶中濁瓦上焙乾五錢枯礬一錢白梅燒瓦碗蓋存性上共為末先用韭菜根老茶濃煎雞毛洗刷去腐爛惡肉洗見鮮血乃用藥敷之三次爛至喉中者用小竹筒吹入雖遍牙齒爛落口唇穿破者敷藥皆愈但山根發紅點不治忌油膩雞魚發氣熱物天黃散治痘疹後多食甜物及食積疳熱口內並唇口生瘡牙床腫爛甚至牙齒脫落臭不可聞神效天南星一兩水泡令軟細切片雄黃二錢上和南星片在一處用濕紙包裹慢火煨令面焦取出候乾為末每以指蘸藥敷口內一日三四次臨臥再敷不可吐壤痘後發水泡用燈心蘿蔔煎湯服治痘後不問癰毒發於何經初起紅腫時卻用黑緑赤三豆以酸醋浸研漿時時以雞翎刷上隨手退去如神痘瘡首尾戒忌例夫小兒痘既出不可表汗蓋初發時內蓄胎毒外感邪熱故用發散表汗之藥使毛竅開通則在表之邪得以發散而在黑之毒亦易於發越矣若痘痕既有痘發於表必賴表裡庶易貫膿收靨如再汗之表氣一虛風邪易入陷伏斑爛作矣一自痘出收靨雖有大便閉證止用蜜皂丸導之不可妄下至收靨後有實證方可下也蓋未靨之前毒雖在表必賴裡實以滋養之則在表者方得貫膿收靨譬之種豆土肥根固則易秀易實也妄下則脾胃一虛氣血隨耗陷伏之證隨作豈能貫膿收靨哉既靨之後則在表毒氣已盡苟有實熱膨脹糞結之證一用下藥疏臟腑而病愈矣又何遺患之有一始終忌食熱毒之物如辛熱煎炒蔥蒜好酒發氣發毒之物無虛寒之證不可妄用熱藥以火濟火致熱毒太盛氣血麋爛為患不小一始終忌生冷之物如冷水紅柿瓜蜜之類無熱毒證不可妄用寒藥蓋溫暖和暢痘方發出寒冷傷胃滯氣為患不小一自發熱至收靨諸般血肉皆不易食蓋血肉皆助火邪遂至熱毒壅滯或為斑爛或靨後重復發瘓經月不愈況起脹貫膿之時毒氣壅盛稍食肥豬肉則即時氣急上痰若脾胃虛弱不能進食者止用鯗魚精肉煮啖少許以助滋味一當調節飲食失於飢則脾胃虛損氣血不能充滿過於飽則胃氣填塞榮衛不能調暢惟得中為無患一當謹避風寒蓋痘瘡內外熱蒸毛孔俱開況小兒肌膚嫩弱易於感襲一有觸冒諸證隨作靨落之後氣血大虛髓肉柔嫩尤當謹於防避也一首尾切忌房事月婦外人醉酒暈腥硫黃蚊藥蔥蒜韭薤燒灰溝糞殺生腋臭諸般穢氣務宜防避麻疹麻疹證治例按麻疹出自六腑先動陽分而後歸於陰經故標屬陰而本屬陽其發熱必大與血分煎熬故血多虛耗首尾當滋陰補血為主不可一毫動氣當從緩治所以人參白朮半夏燥悍之劑升陽升動陽氣上衝皆不可用也又必內多實熱故四物湯加黃連防風連翹以涼其中而退其陽也一發熱憎寒壯熱鼻流清涕身體疼痛嘔吐泄瀉證候未明是否便服蘇葛湯去砂仁陳皮腹痛亦用厚蓋表之汗自頭至足方散漸減去衣被則皮膚通暢腠理開豁而麻疹出矣縱不出亦不可再汗恐致亡陽之變只宜常以蔥白湯飲之其麻自出服此自無發搐之證一發熱之時既表之後切戒風寒冷水瓜桃生果之類如一犯之則皮毛閉塞毒氣難泄遂變紫黑而死矣如極渴飲水只宜少許蔥白湯以滋其渴耳必須使毛竅中常微汗潤澤可也又忌梅李魚酒蜂蜜香鮮之類恐惹疳蟲上行一麻疹既出之時如色紅紫乾燥暗晦乃火盛毒熾急用六一散解之或四物湯去地黃加紅花炒黃芩進之一麻疹既出已過三日不能沒者乃內有實熱宜用四物湯進之如失血之證加犀角汁解之一麻疹前後有燒熱不退等證並屬血虛血熱只宜四物湯按證照常法加減渴加麥門冬犀角汁嗽加栝蔞霜有痰加貝母去白陳皮切忌人參白朮半夏之類如倘誤用為害不小戒之戒之蓋麻疹屬陽血多虛耗今滋陰補血其熱自除所謂養陰退陽之義一麻疹退後若牙齦腐爛鼻血橫行併為失血之證急宜服四物湯加茵陳木通生犀角之類以利小便使熱下行如疳瘡色白者為胃爛此不治之證也一麻疹泄瀉須分新久寒熱新瀉熱瀉者宜服四苓散加木通服寒瀉者十中無一如有傷食寒冷不得已以理中湯一服而止久瀉者只宜豆蔻丸或五倍子粟殼燒灰調下澀之一麻退之後須避風寒戒水濕如或不謹遂致終身咳嗽患瘡無有愈日一麻疹前後大忌豬肉魚酒雞子之類恐惹終身之咳只宜用老雞精火肉煮食少助滋味可也一麻疹正出之時雖不進飲食者但得麻疹淡紅潤澤真正不為害也蓋熱毒未解內蘊實熱自不必食也退後若不食當隨用四物湯加神麯砂仁一二帖決能食矣如胃氣弱者忌少下地黃一麻疹既出一日而有沒者乃為風寒所沖麻毒內攻若不治胃爛而死可用消毒飲一帖熱服遂安如麻見三日退若有被風之證亦用消毒飲妙愚驗麻疹始出類傷風寒頭痛咳嗽熱盛目赤頰紅一二日內即出者輕必須解表忌見風寒腥暈厚味如犯之恐生痰嗽變成驚搐不可治矣初起吐瀉交作者順乾霍亂者逆欲出不出危亡立待麻疹方藥例方蘇葛湯初熱未見點發表之藥暫用分兩量兒大小服之紫蘇二錢葛根二錢甘草二錢白芍藥一錢半陳皮五分砂仁五分上銼蔥白生薑煎服加味升麻湯治小兒麻疹表藥或鄰家已有疹證預服升麻五錢玄參五錢柴胡五錢黃芩五錢乾葛四錢赤芍四錢獨活一錢甘草二錢每銼三四錢水煎服治疹後咳嗽喘急煩躁腹脹泄瀉聲啞唇口青黑黃連黃芩連翹玄參知母桔梗白芍杏仁麻黃乾葛陳皮厚朴甘草牛蒡子各等分水煎服小兒疹後赤白痢疾黃連甘草杏仁桔梗木通厚朴澤瀉各等分上銼燈草水煎服如下墜加枳殼
