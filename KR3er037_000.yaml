front:
  text: 序余備員臺省歷事三朝佐理庶政以天下之民不無病於飢寒困窮顛連而無告者思所以生養安全之廣聖天子好生之德躋之仁壽之域焉蓋嘗殫厥心矣頃以衰病乞休林下蒙詔賜歸佩恩隆渥罔所事事日惟掩扉檢閲方書以求所謂調攝之宜戒忌之法以延修齡以求至眷然篇章浩瀚論議繁冗欲文約而事詳辭簡而義當者艱弗能獲一日金溪世醫龔生持古今醫鑑謁余曰是書乃家君暨廷賢所編輯欲付諸梓幸得名言於辨首余觀之見其說祖之岐黃宗諸倉越下及劉張李歷代名家凡論辨之精詳脈方之神妙者悉採而集之先之以脈息次之以病症終之以治方立為紀綱列為十六卷且遊兩畿歷諸省循許昌而抵於扶凡縉紳家珍藏祕録靡不搜萃其精逾二十載而書始就是誠遠稽先聖之遺言以紹其正傳近取諸儒之確論以示之成法余前所謂文約而事詳辭簡而義當者舍是書其奚以也以醫鑑名信哉不誣龔生不自私而與天下後世共之則夫業醫者得而宗之將可以考古證今察脈治病如執鑑以照物以起天下之昏扎天下之民皆為太平考終之人功豈淺淺哉抑嘗聞開諸古曰上醫醫國次醫醫人又曰達則為良相不達則為良醫龔生以是道舉而措之天下咸躋於仁壽之域聖天子好生之德廣矣又何間於窮與達次與上哉遂書之以著其用心之仁龔生名廷賢字子才別號雲林江西金溪人氏其父西園諱信字瑞之父子並以醫大行於世扶溝三周劉自強撰序夫鑑以照物妍媸見焉其形可執也醫意也宜不執於形而謂之醫鑑者何以意為醫而以其精蘊形之記載俾觀者因形會意諸所疾症脈方於焉悉達亦如鑑之照物妍媸畢見焉古謂醫為鑑也鑑一也醫猶夫鑑亦一也而謂之古今醫鑑者何鑑有古今醫仿諸家要訣以為卷帙亦有古今故不徒曰醫鑑而必以古今冠也擬醫於鑑其察症照物誠均毫髮不爽也而為之序者何醫鑑既成將梓而行世是不容無序也其鑑此古今醫者何金溪雲林龔子也龔子少為儒已以單子棄去惟雅好醫病世俗末學執偏見而源本昧也乃只其父西園君意取黃帝素問靈樞讀之刻意研精輒識真要凡運氣之標本陰陽之升降變化生死之由兆既分焉晰矣復發為論著以釋群疑而醫遂褒然名吳楚間乃龔子以名吳楚為未足由是遊大梁歷許昌遂北如燕而售具術於公孫之前如大學士中玄高公大司寇三川劉公咸雅重龔子授之銜以示褒嘉而龔子之名復盛稱於燕於梁許無休已時久之並集周漢和緩淳于下至金元劉張本朝朱戴輩諸方奇驗者隱括成帙名曰古今醫鑑以古今醫術盡於此如懸鑑故也先之論說以闡其理既之門類以悉其端終之旁行以廣其見釐為八卷要訣悉備按法取用厥驗如神蓋真不刊書云凡醫家者流究論說則其理名觀門類則其端顯窺旁引則其見周文簡意博一覽無遺闢如既型之鑑粉之玄錫摩之白旃而其體明也譬玉榮石精塵垢莫蝕而鬚眉鬢毛可得而察也故謂醫為鑑可也謂古今之醫為古今之鑑亦可也而豈形跡之足拘哉嗟龔子之心之仁成是書而公於天下又有大過人者昔者長桑君以禁方傳越人而戒以無泄徒為越人傳不欲為天下公狹小之見是反鑑索照者類也而非所以語龔子也莊子曰至人之用心也著鏡不將不迎應而不藏殆龔子公是書之謂乎其父西園君負才玄覽為世儒醫嘉靖末受先少保公異知嘗欲修此書而其子云林竟成之蓋世醫云余以知西園故因知其子於其請也遂為之序鄢陵水山劉巡書
