body:
  text: 辨首余幼業儒讀張子西銘天下疲癃殘疾皆吾兄弟韓子原道為之醫藥以濟其夭死深嘆二公之言民胞物之心也然膺厥任惟宰相上佐天子調燮陰陽節宣元氣庶足起疲癃而壽國脈余誦之直欲於身親見之殊庸劣魯鈍為時所厄會家君醫學揭來燕豫響應中原醫之正傳已有所得余因省焉遂棄儒就學紹岐黃倉越之心傳闡劉張朱李之祕訣於當時雲遊高士有裨醫教者尤竭誠晉謁與之上下其議論遠宗先哲近取名公殫精竭神磨光刮垢與家君相為淵源蓋有年矣每視疾則公診以脈息次察其病原而攻治之法方藥之制又酌其脈病而投之執是以往影響不殊既而以脈病治方分門別類以古今之確論為樞要間亦竊附已意參互考訂遺者補之略者詳之纂輯成帙醫有十三科此其初備釐為八卷名以古今醫鑑夫醫意也何取於鑑鑑惟空而後無遺照醫必明而後無遺疾是書上考諸古古之明驗者取之下質諸今今之明驗者取之雖隱伏沉痼罔不洞察與鑑之照物妍媸不爽有相類者此之謂醫鑑此余命名意也藁甫成不敢自祕愛付諸梓以公諸天下後世俾醫有小補病有救援視醫國良相故小大不同而疲癃可起夭死可蘇亦菀乎張韓二公之用心余不佞言之無文聊述成書之概於篇端其訂訛正誤尚有俟於後之君子時萬曆己丑仲冬之吉金溪後學龔廷賢書於恆我齊凡例一醫家門路須要指下明而後病源悉藥性熟而後證治投是書脈訣病機藥性運氣掇拾其詞簡義當者置之前列正以啓後學之進趨云一脈訣諸儒論載詳明茲採其切要者録之凡診得某脈當得某病脈之生克病之輕重一指掌即見學者須得手應心神而明之斯為善學一病發根於臟腑至為難識必先知某經虧損而後知病在某經必調理某經而後某經病愈是書凡內外傷外感之類條分縷析論究詳明使後學知所自來則攻治投劑方能箭中鴻鵠一治病必先識虛實寒熱苟補瀉溫涼不得其宜則將如柄鑿不入茲以經年曆試治法詳附於各病之下或補或瀉或溫或涼之間自有斟酌執此以治自然病根悉拔一方有古方有今方皆歷代醫師所制豫試其百發百中者始纂之其未試者雖工不録此蓋人所共知故不以姓氏再贅今方皆太醫院傳自祕閣及諸縉紳家藏當代名醫與愚父子所製得效者於各方下每系以姓號官銜示不忘本也又有所謂祕方者乃上方異人所授不能悉紀其名惟著以祕方二字潛心經二十載就正閲千萬人罄南北之奇良括古今之祕驗方藥之制有自來矣一制方有全虛全實者有半虛半實者有中正和平者有攻擊殺伐者有全表全里者有半表半裡者各明注方下使後者知合宜之用
