血雖有名色之異大概俱是熱證但有新舊虛實之不同耳或妄言寒者誤也丹溪曰血從上竅出皆是陽盛陰虛有升無降血隨氣上越出上竅法當補陰抑陽氣氣降則血歸經吐血者吐出全血是也因血溢妄行流入胃脘令人吐血有因飲食過飽負重傷胃而吐血者有因思慮傷心及積熱而吐血者有傷心肺而吐血者有因思傷脾而吐血者有因肺生癰疽而吐血者有從高墜下傷損內臟而吐血者有傷寒不解邪熱在經隨氣上湧而吐血者吐血者或因四氣傷於外七情動於內或飲食房勞墜閃傷損致榮血流聚膈間滿則吐嗌世謂妄行或吐瘀血此名內傷治有先吐血後見痰嗽者是陰虛火動痰不下降四物湯為主加清痰降火藥有先見痰嗽後吐血者是積熱降痰火為急有暴吐紫血成塊者是熱傷血結於中吐出為好用四物湯加清熱藥調之吐血亦有因怒而得者經曰怒則氣逆甚則嘔血怒則暴甚故也吐血不止用乾薑炮為末童便調服此從治之法也一咳血者嗽出痰內有血者是也因熱壅於肺而成久嗽損肺亦能嗽血壅於肺者易治不過涼之而已損於肺者難治以其不足也熱嗽有血者宜金沸草加阿膠勞嗽有血者補肺湯加阿膠白芨嗽血損肺宜薏苡仁炒為末蘸熟豬肺食之如熱嗽咽痛痰帶血絲或痰中多血而色鮮者並宜服金沸草散如服涼劑不愈此非熱症宜杏子湯主之一唾血者鮮血隨唾而出者是也此出於腎亦有瘀血內損肺氣壅遏不得下降用天麥冬知母桔梗黃柏熟地黃遠志或加乾薑一咯血者不嗽而咯出血疙瘩者是也用薑汁童便青黛入血藥中用之或入四物湯地黃膏牛膝膏之類一衄血者鼻中出血也此出於肺以犀角升麻梔子黃芩芍藥生地黃紫參丹參之類治之一溺血者小便中出血也乃膀胱所致用炒黑山梔水煎服之或用小薊琥珀小薊治下焦結熱血淋溺血因血虛者四物加牛膝膏一下血者大便出血也乃臟腑蘊積濕熱之毒而成或因氣鬱酒色過度及多食炙爆熱毒之物或風邪所冒或七情六淫所傷使氣血逆亂榮衛失度皆能令人下血豫嘗治諸虛吐衄咯血藥中每人童便一合其效甚速凡單服重湯頓服無不效應蓋溲溺降火滋陰又能消瘀血止吐衄諸血先賢有言凡諸失血服寒涼十無一生服溲溺百無一死斯言信矣每用童便一鍾少入薑汁二三點攪勻徐徐服之日進二三次如天寒卻以重湯頓溫服服此但以進飲食相遠為佳方全生飲雲林制批按此方治諸失血之總司也止吐血衄血嗽血咯血唾血藕汁磨墨一寸梨汁茅根汁韭汁生地黃汁各一兩刺刺菜汁蘿蔔汁白蜜竹瀝生薑汁童便各半盞上合一處頻頻冷服此方乃治諸失血之總司犀角地黃湯治上焦有熱口舌生瘡發熱或血熱妄行或下血及不嗽血自來者並宜服之烏犀角鎊一錢半生地黃二錢赤芍藥一錢牡丹皮一錢加黃芩一錢黃連一錢上銼一劑水二鍾煎一鍾溫服肝經血加條芩心經血加黃連麥門冬脾經唾血加白芍藥百合肺經衄血加天門冬山梔百部腎經血加玄參黃柏知母三焦湧血加連翹地骨皮膽經血加柴胡淡竹葉胃經吐血加大黃乾葛心胞血倍牡丹皮加茅根大腸便血加炒山梔炒槐花小腸溺血加炒梔子木通牛膝茅根積熱加大黃芒硝吐血不止加大黃桃仁止血立應散王雙湖方治吐衄不止如神大黃酒浸五錢青黛一錢槐花炒一錢血餘五錢煅存性上為末每服三錢用梔子丹皮各二錢煎湯調食後服有熱湯內加地骨皮三錢清熱解毒湯批按此方涼血止血之劑治吐血衄血升麻二兩乾葛五錢赤芍藥五錢生地黃一兩牡丹皮五錢黃連五錢黃柏八錢黃芩五錢桔梗五錢梔子五錢甘草五錢連翹五錢上銼每劑一兩水二鍾煎一鍾溫服清熱滋陰湯批按此方止瘀血生新血之劑治吐血衄血便血溺血當歸酒洗三分川芎酒洗七分生地酒洗二錢黃柏酒炒三分知母酒炒五分陳皮酒洗三分白朮炒五分麥門冬一錢五分牡丹皮一錢赤芍藥七分玄參一錢山梔炒黑一錢半甘草五分上銼一劑水煎溫服身熱加地骨皮一錢柴胡五分子芩一錢吐衄血加炒乾薑七分柏葉茜根大小薊各一錢大便血加炒槐花地榆百草霜各一錢溺血加炒黑山梔子車前子小薊黃連各八分四病血俱用阿膠珠五分薑汁韭汁童便同服止鼻衄方劉尚書傳百草霜發灰二物等分清煙墨一錠童便韭汁無灰老酒各一錢上下三味合一處用墨濃磨調上二物服陳槐湯劉尚書傳治吐血衄血不止當歸頭尾二錢川芎二錢赤芍藥二錢黃芩二錢槐花二錢陳皮二錢側柏葉蜜炒二錢烏藥二錢山梔子七個藕節三分細茶三錢上用水二鍾煎一鍾不拘時熱服通關止血丸祕方治鼻衄枯白礬一錢沉香三分半夏四個糯米十四粒麝香一分上為末麵糊為丸如豌豆大每用二丸塞左右兩耳即服陳槐湯治鼻衄良方用大蚯蚓數十條搗爛井花水和稀患輕澄清飲重則並渣汁調服立愈扎指法治鼻衄不止用線緊扎中指中節如左鼻孔出血扎右手指右鼻孔出血扎左手指兩孔俱出左右俱扎之鼻衄不止用水紙搭在鼻衝上隨用祕方梔子炒黑百草霜龍骨火煅京墨血餘煅存性上為末用茅花水蘸濕蘸藥入鼻孔如無茅花將紙捻水濕蘸藥入鼻中真良法也自汗盜汗脈汗脈浮虛或澀或濡軟大洪散渴飲無餘脈大而虛浮而軟者汗在寸為自汗在尺為盜汗傷寒脈陰陽俱緊當無汗若自汗者曰亡陽不治證夫汗者心之液也心動則惕惕然而汗出也有自汗者有盜汗者自汗者不因發散而自然出也盜汗者睡而汗出及覺則不出矣自汗之症未有不由心腎俱虛而得者故陰虛陽必湊發熱而盜汗陽虛陰必乘發厥而自汗此陰陽偏勝之所致也丹溪曰自汗屬氣虛屬痰與濕盜汗屬陰虛相火熾盛其傷寒傷暑傷風傷濕痰嗽等自汗各載本門其無病而汗常自出與病後多汗皆屬表虛衛氣不固榮血泄漏宜黃耆建中湯加浮麥煎黃耆六一湯或玉屏風散或身溫而常出冷汗或身冷而汗亦冷別無他病並屬本證凡汗出發潤一不治也汗出如油二不治也汗凝如珠三不治也治治內傷及一切虛損之症自汗不休總用補中益氣湯少加附子麻黃根小麥其效捷如影響但升麻柴胡俱用蜜水拌炒以殺其升發湧汗之性又欲其引參耆等藥至肌表故不可缺也如左寸脈浮洪而自汗者心火炎也本方倍參耆加麥門冬五味子黃連各五分如左關脈浮弦而自汗者挾風邪也本方加桂枝芍藥若無陰虛只用桂枝湯亦可左尺脈浮洪無力而自汗者水虧火盛也本方加黃柏知母各五分熟地黃一錢壯水之劑以制陽光如右寸脈浮洪或伏而滑此挾痰也依本方加知母貝母天花粉各八分如右關脈浮洪無力而自汗者此脾元怯弱也只依本方倍參耆右尺脈洪數無力而自汗者或盜汗相火挾心火之勢而凌伐肺金也宜當歸六黃湯方玉屏風散治自汗腠理不密易感風寒防風一兩黃耆一兩白朮二兩一方加浮小麥茯苓牡蠣麻黃根甘草上銼一劑生薑一片水二鍾煎一鍾空心溫服黃耆湯治元氣虛弱自汗黃耆二錢二分當歸一錢二分生地一錢五分天門冬一錢五分麥門冬一錢五味子七分防風五分白茯苓一錢五分麻黃根一錢甘草八分浮小麥一撮炒上銼一劑水煎溫服黃耆建中湯治內虛挾外感自汗又補諸虛不足羸乏少力大益榮衛黃耆二錢肉桂二錢白芍藥三錢甘草炙三錢上銼一劑薑一片棗二枚水煎服鎮液丹思恆兄傳批按此方治自汗之劑防風一兩炒黃耆二兩蜜炙白朮一兩略炒中桂一兩芍藥一兩酒炒大附子二兩麵裹煨去皮臍童便浸炒上為末酒糊為丸每服五十丸空心溫酒下當歸六黃湯治盜汗之聖藥也當歸一錢黃耆一錢生地黃一錢熟地黃一錢黃柏炒七分黃連炒七分黃芩炒七分上銼一劑水煎臨臥服黃耆六一湯批按此方治盜汗之劑治虛人盜汗黃耆六兩甘草一兩各用蜜炙十數次出火毒上銼每劑一兩水煎空心服獨勝散治自汗盜汗用五倍子為末津唾調填滿臍中以絹帛縛定一宿即止或加枯礬末尤妙白龍湯批按此方治自汗盜汗兼治之劑治六脈芤動微緊男子失精女子夢交及自汗盜汗等症桂枝三錢白芍藥三錢甘草炙三錢龍骨煅三錢牡蠣三錢上銼一劑水煎溫服加棗子一個同煎尤好一人血氣大虛形體羸瘦大汗如雨不止命在須臾諸醫弗效以十全大補湯倍用參耆以童便製附子一劑即效服不數劑全安眩暈脈風寒暑濕氣鬱生涎上實下虛皆暈而眩風浮寒緊濕細暑虛涎弦而滑虛脈則無治眩暈法尤當審諦先理痰氣次隨症治又曰左手脈數熱多脈澀有死血右手脈實有痰積脈大是久病證夫眩者言其黑暈者言其轉其狀目閉眼暗身轉耳聾如立舟車之上起則欲倒皆屬於肝風邪上攻所致然體虛之人外感六淫內傷七情皆能眩暈當以脈症別之風則脈浮有汗項強不仁寒則脈緊無汗筋攣制痛暑則脈虛煩悶濕則脈沉細重吐逆及七情所感遂使臟氣不和鬱而生涎結而為飲隨氣上逆令人眩暈眉稜骨痛眼不可開寸脈多沉此為異耳若疲勞過度下虛上實金槍吐衄及婦人崩傷産後去血過多皆令人眩暈當隨其所因而治之眩暈之症人皆稱為上盛下虛所致而不明言其所以然之故蓋所謂虛者血與氣也所謂實者痰涎風火也原病之由有氣虛者乃清氣不能上升或汗多亡陽而致當升陽補氣有血虛者乃因亡血過多陽無所附而然當益陰補血此皆不足之症也有因痰涎郁遏者宜開痰道郁重則吐下有因風火所動者宜清上降火若因外感而得者前論須分四氣之異皆當散邪為主此皆有餘之症也世有所謂氣不歸元而為丹藥鎮墜沉香降氣之法蓋香竄之氣丹藥助火其不歸元之氣豈能因此而復即內經所謂治病必求其本氣之不歸求其本用藥則善矣治丹溪曰痰在上火在下火炎上而動其痰也此證屬痰者多蓋無痰不能作眩也雖有因風者亦必有痰又曰火動其痰二陳湯加黃芩蒼朮羌活挾氣虛者亦以治痰為主兼補氣降火藥人因憂思勞苦發作眩暈眼暗耳鳴面赤口乾發熱氣喘有汗不食六脈洪數用十全大補湯去桂加生地黃薑炒黃連麥門冬五味子陳皮酒炒黃柏知母方清暈化痰湯雲林制橘紅一錢五分半復制一錢半白茯苓一錢甘草三分川芎八分白芷七分羌活七分枳實麩炒一錢南星制六分防風六分細辛六分黃芩酒炒八分氣虛加人參七分白朮一錢有熱加黃連六分血虛倍川芎加當歸一錢五分上銼一劑生薑三片水煎以此作丸亦可黑將軍散祕方批按此方治痰火眩暈之劑治因痰火太盛眩暈難當用大黃酒炒為末清茶調下或用大黃酒浸九蒸九曬為末水丸如緑豆大每服百丸食後臨臥清茶送下神效仙術通神散治風熱上壅頭旋目眩起則欲倒即防風通聖散去麻黃芒硝加藿香砂仁甘菊花蒼朮如風熱上攻頭目昏眩悶痛痰喘咳嗽依本方去麻黃芒硝加甘菊花人參砂仁寒水石半夏白朮天麻湯批按此方治氣虛痰厥眩暈之劑治頭旋眼黑噁心煩悶氣促上喘心神顛倒目不敢開頭痛如裂身重如山四肢厥冷不能安睡此乃胃氣虛損停痰所致半夏制一錢半白朮炒二錢天麻一錢半上銼一劑生薑三片水二鍾煎八分食後溫服芎歸湯批按此方治血虛眩暈之劑治血虛眩暈或去血過多之後眩冒川芎二錢五分當歸二錢五分上銼一劑水二盞煎至八分空心溫服麻木脈脈浮而濡屬氣虛關前得之麻在上關後得之麻在下也脈浮而緩屬濕為麻痹脈緊而浮屬寒為痛痹脈澀而芤屬死血為木不知痛癢證丹溪曰麻是氣虛木是濕痰死血治十指麻是胃中有濕痰死血宜二陳湯加蒼朮白朮陳皮茯苓桃仁紅花少加附子行經又宜四物湯加上藥及羌活蘇木如手指麻痹因濕所致者香蘇散蒼朮麻黃桂枝白芷羌活木瓜水煎脈體虛者用五積散亦好一如感手膊或痛或木或遍身麻木用五積散主之一凡人手足麻木並指尖麻者皆痰滯經絡也宜二陳湯加竹瀝薑汁白芥子以祛痰火散風氣更灸百會肩髃曲池風市足三里絶骨此六處共十一穴以防中風癱瘓但年少者不可多灸一麻用補中益氣湯加當歸木香香附青皮川芎少加桂枝引經木用四物湯並二陳湯加桃仁紅花二方俱用竹瀝薑汁白芥子以行經至脅肋達痰之所在也竹瀝枳朮丸搜風順氣丸皆可選用麻木者因風濕熱下陷入血分陰中陽道不行亦有痰在血分者其症閣眼則渾身麻木癢者血不榮於肌腠治以參耆耆能助陽道以當歸能行陰道二朮苓甘柏以除濕熱柴升芍藥以升提之痰加二陳治當活法方加減補中益氣湯治氣虛手足麻木依本方加木香大附子麥門冬防風羌活烏藥人參益氣湯批按此方治氣虛麻木之劑治手指麻木四肢困倦怠惰嗜臥黃耆二錢人參二錢二分甘草二錢二分白芍藥七分柴胡六分甘草炙六分升麻六分五味子三十粒上銼一劑水煎稍熱服開結舒經湯批按此方治氣鬱麻木之劑治七情六郁氣滯經絡手足麻痹紫蘇八分陳皮八分香附醋炒八分臺烏八分川芎八分蒼朮米泔浸三日銼碎炒八分羌活八分南星八分制半夏八分制當歸八分桂枝四分甘草四分上銼生薑三片水煎入竹瀝薑汁各半盞服清風散批按此方治風氣麻木之劑治身體麻木遍身結核北人謂之生飯南人謂之鼓槌俗謂風疙瘩俱屬熱氣滯防風五分荊芥三分羌活五分獨活五分連翹五分當歸五分赤芍藥一錢生地黃五分蒼朮一錢陳皮一錢半夏制一錢白茯苓一錢烏藥七分檳榔五分木瓜六分牛膝七分木香三分黃連五分玄參七分鼠黏子炒五分萆薢二錢金銀花六分升麻一錢白蒺藜炒八分防己五分上銼一劑薑三片蔥白五寸水二盞煎八分服癲狂脈癲脈搏大滑者生沉小緊急則不治熱狂脈實大生沉小死癲脈虛可治實則死證夫癲者喜笑不常而顛倒錯亂之謂也狂者狂亂而無正定也故心熱盛則多喜而為癲也肝熱盛則多怒而為狂也甚則棄衣而走登高而歌逾垣上屋罵詈不避親疏是蓋得之陽氣太盛胃與大腸實熱燥火鬱結於中而為之耳此則癲狂之候也大抵狂為痰火實盛也治當大吐大下癲為心血不足多為求望高遠不遂其志者有之治治以安神養血兼降痰火心風者何蓋君火者心因怒發之相火助盛痰動於中挾氣上攻迷其心竅則為癲為狂所怒之事膠固於心輒自言談失其條序謂之心風與風何相干若痰不盛者則有感亦輕狂言譫語鄭聲辨狂者大開目與人語所未嘗見之事為狂也譫語者合目自言日用常行之事為譫語也鄭聲者聲顫無力不相接續造字出於喉中為鄭聲也陽附陰則狂陰附陽則癲脫陽者見鬼脫陰者目盲又蓄血證則重復語之方防風通聖散方見中風批按此方治癲狂初起多有實熱風邪宜之治一切癲狂風疾暴發之症寧志化痰湯陳白野方治癲狂心虛痰盛之症膽星一錢半夏制一錢陳皮一錢茯苓一錢天麻一錢人參一錢黃連薑汁炒一錢酸棗仁一錢石菖蒲一錢上銼一劑生薑五片水煎服再服清心養血湯清心養血湯批按此方補虛化痰清心寧心之劑人參一錢白朮一錢茯神一錢遠志一錢水泡去骨棗仁一錢炒當歸一錢五分川芎一錢生地黃一錢甘草五分上銼一劑加圓眼五個水二盞煎八分空心服黃白丹祕方治五癲五癇黃丹一兩白礬一兩上用磚一塊鑿一窩可容二兩許置丹在下礬在上用木炭五斤煅令炭盡取為末以不經水豬心血為丸如緑豆大每服三十丸陳皮湯下獨參丸治狂邪發作無時披頭大叫不避水火苦參不拘多少上為末煉蜜為丸如梧子每十五丸薄荷湯下河車丸治久患心風癲氣血兩虛之症紫河車不拘幾個焙極干上為末煉蜜為丸梧子大每七十丸空心酒下開迷散治婦人癲疾歌唱無時逾垣上屋乃榮血逆於心胞所致當歸一錢白朮炒一錢白芍藥一錢柴胡八分白茯苓八分甘草炙七分桃仁一錢五分蘇木一錢紅花一錢遠志泡去骨一錢五分生地黃一錢五分上銼生薑煎服或用此方煉蜜為丸辰砂為衣一女子年十五因氣惱患語言顛倒欲咬人打物偷藏東西時哭時笑心怕膽小飲食不知飢飽身體發熱以防風通聖散加生地黃牡丹皮二服即安秦承祖灸鬼法治一切驚狂譫語為邪鬼惡物所附此因氣血兩虛邪乘虛入如癲如癇之症以病者兩手大拇指用細麻繩扎縛定以大艾炷置於中兩介甲及兩指角肉四處著火一處不著即無效灸七壯神驗五癇脈脈虛弦為驚為風癇證夫癇者有五等而類五畜以應五臟發則卒然倒僕口眼相引手足搐搦背脊強直口吐涎沫聲類畜叫食頃乃蘇原其所由或因七情之氣鬱結或為六淫之邪所幹或因受大驚恐神氣不守或自幼受驚感觸而成皆是痰迷心竅如癡如愚治治之不須分五俱宜豁痰順氣清火平肝而以黃連栝蔞南星半夏之類尋火尋痰分多分少治之無有不愈有熱者以涼藥清其心有痰必用吐法吐後用東垣安神丸及平肝之藥青黛柴胡川芎之類方清心溫膽湯雲林制平肝解鬱清火化痰益心生血陳皮一錢半夏制一錢茯苓一錢枳實一錢竹茹一錢白朮炒一錢石菖蒲一錢黃連薑汁炒一錢白芍炒一錢當歸酒洗一錢香附炒一錢麥門冬去心八分川芎六分人參六分遠志六分甘草四分上銼一劑生薑煎服育魂丹杜御史方批按此治癇攻補兼施之劑治一切驚癇癲邪等症膽星六錢半夏制六錢茯神六錢黃連炒六錢遠志水泡六錢白朮炒六錢棗仁炒六錢柏子仁炒六錢乾山藥一兩竹茹五錢白附煨五錢天麻酒洗五錢陳皮三錢全蠍三錢二分川芎五錢犀角鎊三錢五分枳實炒一錢辰砂二錢二分牛黃二錢二分羚羊角三錢五分白礬生用三錢麝香一錢飛金二十四帖上為細末竹瀝打甘草膏為丸如芡實大每服空心淡薑湯送下或用薄荷湯調下加減壽星湯吳都堂傳治癇症南星四兩膽制半夏二兩防風一兩荊芥七錢天麻一兩皂莢一兩香附一兩青皮一兩豬苓一兩澤瀉一兩赤茯苓一兩白茯神一兩白朮一兩細辛七錢麥門冬一兩上銼每劑一兩薑水煎服清神丹祕方治症同前石菖蒲去毛二兩辰砂六錢研細水飛過以一半為衣上為末豬心血打麵糊為丸如桐子大每服七八十丸空心白湯送下服前育魂丹除根壯膽星朱丹太醫院傳硃砂一兩水飛膽星二兩石菖蒲二兩牛黃五錢麝香五分豬心七具用血上為細末竹瀝豬心血和丸如梧桐子大每服七八十丸空心白湯送下醜寶丸太醫院傳批按此方治癇專攻之劑祛風清火順氣豁痰益志除驚安魂定魄一切怔忡癇痓難狀之疾並皆調治牛黃五錢琥珀一錢辰砂一錢為衣雄黃一錢膽星一兩礞石五錢火煅沉香一錢五分犀角一錢五分黃芩二兩炒大黃二兩酒蒸天麻五錢薑炒石菖蒲一兩殭蠶七錢薑炒蟬蛻五錢去足豬心二具用血上為末竹瀝豬心血和丸如緑豆大每服六七十丸臨臥薄荷湯下
