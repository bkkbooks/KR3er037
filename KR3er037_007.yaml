body:
  text: 卷之七補益脈氣虛脈細或緩而無力右手弱血虛脈大或數而無力左手弱陽虛脈遲陰虛脈弦真氣虛脈緊男子久病氣口脈弱則死強則生女人久病人迎強則生弱則死證夫虛者虛損也難經所謂五損脈者亦因虛而致損也一損損於皮毛皮聚而毛落二損損於血脈血脈虛少不能榮於五臟六腑三損損於肌肉肌肉消瘦飲食不為肌膚四損損於筋筋緩不能自收持五損損於骨骨痿不能起於床反此者至脈之病也從上下者骨痿不能起於床者死從下上者皮聚而毛落者死治損之法奈何然損其肺者益其氣損其心者調其榮衛損其脾者調其飲食適其寒溫損其肝者緩其中損其腎者益其精此治損之大法也夫諸虛與勞極未始不由氣體虛弱心腎有虧水火不自升降而致也或為寒暑勞役所傷或因色欲過度俱能戕賊真氣以致肌體羸瘦腰膝無力小便頻數大便滑泄目眩耳聾遺精自汗甚則虛火上攻面赤發喘此皆諸虛之證也勞極者七情傷乎五臟也盡力謀慮勞傷乎肝應乎筋極曲運神機勞傷乎心應乎脈極意外過思勞傷乎脾應乎肉極遇事而憂勞傷乎肺應乎氣極矜持志節勞傷於腎應乎骨極此五勞應乎五極者也勞極精氣變生諸證治治療之法當隨五臟六腑寒熱調之經曰形不足者溫之以氣精不足者補之以味然滋補之藥貴乎平如不可驟用峻補丹石燥熱之劑恐腎水枯竭虛火愈熾惟當斟酌輕重而用之斯得之矣方四君子湯大補陽氣虛衰人參一錢白朮二錢炒白茯苓一錢甘草炙一錢上銼一劑薑棗煎服有痰加陳皮半夏名六君子湯按是方治氣分之聖藥也用人參補元氣白朮健脾胃甘草和中茯苓淡滲引參下行補下焦元氣氣乃無形之氣屬乎陽乃君子之象焉故名四君子湯四物湯大補陰血虛損生地黃二錢當歸二錢川芎一錢白芍藥炒一錢半上銼一劑水煎服按是方治血分之聖藥也用當歸引血歸肝經川芎引血歸肺經芍藥引血歸脾經地黃引血歸腎經惟心生血肝納血脾統血肺行血腎藏血男子化而為精女子化而為月水血乃有形之物屬乎陰故名四物湯八物湯大補氣血兩虛四君子湯合四物湯薑三片棗二枚水煎服十全大補湯治氣血兩虛兼助陽固衛八物湯加肉桂一錢黃耆一錢薑棗水煎服人參養榮湯治積勞虛損四肢倦怠肌肉消瘦面少顏色汲汲短氣飲食無味人參一錢當歸一錢陳皮一錢黃耆蜜炙一錢桂心一錢白朮一錢甘草炙一錢白芍藥二錢熟地酒浸二錢茯苓一錢五味子七分遠志去心炒五分上銼一劑薑三片棗二枚水煎服固真飲子治中年以上之人陰陽兩虛元氣不足頭每痛日晡微熱少食力倦精氣時脫腰痛䯒酸服之者每得良效人參一錢乾山藥一錢當歸身一錢熟地黃二錢五分黃柏炒一錢白朮五分澤瀉五分山茱萸肉五分補骨脂五分五味子十粒陳皮八分白茯苓八分杜仲炒斷絲七分甘草炙七分上銼一劑水煎服九仙酒太醫院傳治諸虛百損八物湯四兩加甘州枸杞子八兩用生薑二兩棗十枚煮好酒一罈不拘時隨量飲大有補益六味地黃丸治形體瘦弱無力多困腎氣久虛寢汗發熱五臟虧損遺精便血消渴淋濁等症此藥不燥不寒專補左尺腎水兼理脾胃少年水虧火旺陰虛之症最宜服之澤瀉二兩淮熟地黃八兩薑汁炒乾山藥酒蒸四兩山茱萸酒蒸去核四兩白茯苓三兩牡丹皮去骨三兩上為細末煉蜜為丸如梧桐子大每七十丸空心白湯下婦人血虛無子此方更效須加醋炒香附當歸各二兩虛勞加紫河車一具蒸爛搗為丸陰虛火動加酒炒黃柏知母各二兩心腎不交消渴引飲加麥門冬三兩五味子二兩腰膝痛加酒洗牛膝薑炒杜仲各三兩小便夜多去澤瀉加鹽酒炒益智仁三兩兼補右尺相火加製附子童便煮官桂各二兩遺精加牡蠣三兩嗽加五味子三兩神仙既濟丹少保劉公方專補諸虛百損五勞七傷滋腎水降心火補脾土添精髓益氣和血壯筋骨潤肌膚聰耳明目開心益智強陰壯陽延年益壽此藥性氣溫而不熱清而不寒久服則坎離相濟陰陽協和火不炎而神自清水不滲而精自固此平補之聖藥也山藥酒蒸三兩牛膝酒洗三兩杜仲酥炙二兩巴戟湯泡二兩五味子二兩白茯苓二兩枸杞酒洗二兩小茴鹽水炒二兩蓯蓉酒洗二兩山茱萸酒蒸去核曬乾二兩石菖蒲去毛二兩遠志甘草水泡去骨曬乾二兩黃柏酒炒四兩知母去毛酒炒二兩生地酒蒸二兩熟地酒蒸二兩麥冬去心二兩人參去蘆二兩菟絲子酒煮爛搗成餅焙乾二兩甘菊酒洗二兩山梔子炒黑二兩廣橘紅一兩天冬湯泡二兩當歸酒洗二兩龍骨火煅過二兩上為末煉蜜和棗肉為丸如梧桐子大每服七八十丸空心淡鹽湯送下天王補心丹寧心益志壯力強精安神魂定驚悸怔忡祛煩熱化痰涎稠濁熟地二兩酒洗白茯苓二兩丹參二兩柏子仁去殼二兩百部二兩石菖蒲二兩牛膝酒洗二兩杜仲酥炙去絲二兩當歸酒洗二兩棗仁炒二兩玄參二兩天門冬去心二兩五味子二兩人參二兩白茯神二兩遠志甘草水泡二兩桔梗一兩甘草一兩麥門冬一兩上為細末煉蜜為丸如彈子大金箔為衣每服一丸臨臥燈心紅棗煎湯細嚼送下接命膏治氣血虛弱痰火上升及中風不語左癱右瘓腰疼膝痛動履不便一切虛損人乳二盞肥白女人內外無熱者佳梨汁一盞上二味傾入銀錫旋中置沸湯內頓滾有黃沫起開清為度每五更後一服大能消痰補血三才大補膏劉太府傳生地黃一斤熟地黃一斤天門冬四兩麥門冬四兩人參四兩甘枸杞四兩牛膝四兩何首烏八兩上㕮咀勿犯鐵器同入大砂鍋內用水二十碗煎至七碗取汁別貯渣如前再煮九次共得汁七十碗濾渣極淨別用中等砂鍋入汁七碗慢火煎熬耗汁一碗方添一碗六十三碗皆添盡則汁已濃矣蓋抵得汁六碗卻用山白蜜去蠟可一斤半同前藥入砂鍋內重湯煮汁滴水不散則成膏矣瓷罐盛之埋土中七日取出如前再煮一晝夜再埋一宿乃分貯小罌內封固以次取用自煎至煮但用桑柴火藥本尋常妙在火候不拘時以醇酒調服味美而功多若懲慫窒欲之人又深居簡出時服此膏亦可以擅其天年矣七年之艾不可不早為之用也天真接命丹方上異人傳用無病室女月經首行者為最次二次者為中次四五次為下然亦可用取法以黑鉛打一具形如黃衣冠子樣俟月信動時即以此具令老媼置陰戶上以絹幅兜住接具取起頓瓷器中再用前具再取約二三鍾許澄沉底紅如硃砂此為母氣真元也其面如黃色浮起此為發水也即用綿紙輕輕拖滲去卻用極細白淨好茯苓為末用熟水浮去木屑取沉底者曬乾搗入紅鉛中如和麵然多寡軟硬以意消息打作薄薄餅子陰乾待用不可犯鐵器既干研成細末以麻黃一大把銼煎成極濃膏子用綿布絞濾去渣入前末中以成丸為度如緑豆大以老坑辰砂研細末為衣用銀藥罐盛之收存以黃蠟封口每服五十丸或七八十丸服後靜坐無風處所略有微汗驗藥性流行充溢四肢經絡皮毛之間如服後發熱作渴此元氣虛藥性到也須服乳汁數盞以止之服藥後三日內蔬食不可吃油膩之物此藥進二三次或越三五年又進二三次立見氣力煥發精神異常草木之藥千百服不如此藥一二服蓋人自十六歲已往精氣漸減不但男女之欲足以損敗一與事應則視聽言動皆耗散精氣之原故禪氏面壁仙家坐關此藥採自人身産從元始非若金石草木之有偏勝實可全挽回造化之功養生君子珍之重之陽煉秋石法京師傳童便一缸牙皂煎水二三碗用柳條亂攪起白泡用勺撇去隨攪隨撇令泡盡澄清許久上去其泡下去其垢膩惟取中間清水入鍋內煎熬用木柴火先文後武熬二三碗又加童便半鍋又熬至干又加又熬至缸中童便盡乃止熬至焦乾入香油一碗從鍋周圍傾入鍋底用極猛火燒過透紅無油氣連鍋掇起放地上待冷一時自然成塊而起研羅細末用淨水二碗入內攪勻如米湯樣澄一二日再攪起傾入好雪白連四紙十數層盛藥下用竹篾為梢箕水浸一宿去竹內黃水令淨將紙放竹箕內下用瓷器盛之濾下極清水於瓷器內濾令乾收入鍋內將紙渣再入水攪如上法濾之將先濾清水用廣鍋一口以缸瓦打磨令光如銀白入內用炭火熬令乾為度抓起放紙上再將鍋又打磨淨又熬第二次清水如上法只要潔淨得如雪之白陰煉秋石法京師傳用童男童女便各二桶入半舊瓦缸內入淨水一桶柳棍攪千餘下澄半日待清括去清者半桶又入水一桶如前攪澄卻括一桶如此七日一日兩次共十四次將清水盡傾去止留秋石傾放皮紙上下用杉木板或柏木板盛貯曬乾或日曬夜露取其日精月華或以人乳拌曬入丸藥內或單用棗肉為丸如梧桐子大每服五七十丸空心好酒送下大有補益善降虛火其功不可盡述取紅鉛法用室女經血或首經最佳以布帛用燒酒洗過曬乾用之以烏梅水澄之取出入乳香末少許乳汁為丸如櫻桃大每噙一丸取女人氣一口乳汁送下治諸虛百損五勞七傷神效神仙伏氣祕法劉云傳先於辰戌時行安命之功於右鼻進藥吹氣十六十四十二十八六四止次日寅時行進陽火之功於左鼻進藥吹氣三五七九十一十三十五十七止於戌時退陰符仍照行十六至四止每行之時先令病人仰面平枕口噙熱水或乳香酒一口然後令童女照前數吹之吹法先取紅鉛用未破身童女所行經脈以夏布揉洗令淨或淨花亦可搌下曬乾如用時將熱童便洗下曬乾收起臨用時以童便化開滴於槖籥小頭口邊入鼻內將大頭令童女口噙使力吹之如上法病人候吹氣即吸入童女忌蔥蒜酸辣之物久久行之能接補天年行後如覺內熱可服人乳即能解之三元丹補虛損接天年紅鉛一兩人乳一兩乳香一錢辰砂一錢秋石一錢用童便入瓦器內用掃淨新磚數塊入內浸七日取出冬天放陰地上夏月埋土內要極深日久自生白石掃下用上共為細末即以人乳調和將雞蛋一枚磕一孔傾出清黃不用紙展乾淨將藥末入內封固緊密放群蛋內抱三七日取出丸如梧桐子大金箔為衣如干再添入乳汁為丸每服三丸人乳送下五更空心服汗出至足為度不可見風痼冷證痼冷者謂痼久而冷也痼者固也冷者寒之甚也人之臟腑稟受不同亦或將理失宜遂致偏廢故方中有痼冷積熱之説痼冷中寒也其病多由真陽虛弱胃氣不實復啖生冷冰雪水酪諸寒之物或坐臥陰寒久濕之地以致臟腑久痼而冷其為病也或手足厥冷或腹中久痛溏泄無度或腰腿重痛如坐水中或陰痿不舉寒精自出或久嘔逆飲食不進或自汗戰栗或大腑洞泄或小便頻數此皆痼冷之為病也治治之之法宜溫補下元健脾養胃祛寒邪固真氣使陽氣得復陰陽平和則無偏勝之患而病愈矣凡脫陽症或因大吐大瀉之後四肢逆冷元氣不接人事不省或傷寒新瘥誤與女人交接其症小腹緊痛外腎拳縮面黑氣喘冷汗自出是名脫陽證須臾不救急用蔥燙法更灸氣海在臍下一寸五分關元在臍下二寸各五十壯內服薑附湯五積散之類然後可服黑錫丹或灸男左女右中指一壯再灸關元穴七壯凡陰證身靜而重語言無聲氣喘難以喘息目睛不了了口鼻氣冷水漿不入大小便不禁面上惡寒有如刀刮先用蔥尉法次服四逆湯方回陽返本湯雲林制治急陰證手足冷指甲青少腹疼痛外腎攣縮人參一錢白朮一錢乾薑一錢炒丁香八分甘草一錢陳皮一錢半夏制一錢大附子制一錢茯苓八分神麯炒六分白豆蔻八分沉香五分上銼一劑生薑三片棗二枚鹽少許水煎服外於臍上用熟蔥貼冷則復易外腎並陰囊以絹帛扎住用炒鹽款款烙之再用炒鹽燙胸膈脅肋上下小腹如急陰不省人事用鹽填滿臍中艾火灸之以醒為度或大便閉結以利氣丸通之斂陽丹治陰寒痼冷丁香一兩砂仁一兩白豆蔻一兩紅豆二兩人參五錢厚桂一兩大附子二兩乾薑一兩炒良薑二兩炒均薑二兩炒上為末好酒煮米糊為丸如梧桐子大每服五七十丸空心溫酒送下黑豆酒治症同前黑豆不拘多少鍋內炒熟以好酒淬之就以碗蓋勿令泄氣候溫飲酒大效回春散楊小川傳治陰冷如神歌曰一錢白礬八分丹二分胡椒細細研焰硝一分共四味釃醋調和手內攤男左女右合陰處渾身是汗濕衣衫此方用者如神效不義之人不可傳助陽散祕方治極冷急症芥菜子七錢乾薑三錢上為末水調作一餅貼臍上以絹帛縛住上置鹽以燙鬥燙之數次汗出為度又將病人小便攀陰莖往上盡頭處用艾炷灸七壯神效回陽丹祕方乾薑一兩牡蠣一兩上為細末以火酒調稠搽手上男子用雙手揉外腎即愈女子以男子手搽藥急按兩乳仍揉擦熱汗出則愈固陽膏祕方治因女色致成陰證生白礬三錢黃丹二錢乾薑五錢母丁香十個胡椒十五粒上為末用醋和得所以男左女右手握藥搭臍上被蓋少頃汗出即愈虛勞脈虛勞之脈或浮大或弦數大者勞也弦者亦勞大弦易治血氣未衰可斂而正也弦者難治血氣已耗而難補雙弦則賊邪侵脾加數則殆矣又曰骨蒸勞熱脈數而虛熱而澀少必殞其軀加汗加嗽非藥可除證夫勞之為言言劇也故以勞瘵為難治之疾古方雖分六極六損五勞七傷五尸九蟲十疰二十四蒸之症種種不同大抵皆由少年之時嗜欲無節起居不時或七情六淫之所傷或飲食勞倦之有過漸至真陰衰虛相火熾焰火旺則銷爍真陰而發蒸蒸之燥熱也蓋火衝於上焦者發熱之中則兼咳嗽喘急吐痰吐血肺痿肺癰等症其火結於下焦者發熱之中則兼淋濁結燥遺精盜汗驚悸腹痛等症也婦人則兼月水不通之類及其火熾既久氣必傷矣傷則不能運化水穀水穀停留而濕熱生蟲生積之由也蟲積日深變異莫測齧人心肺蝕人臟腑精華殆莫能救矣況其親炙之人薰陶日久受其惡氣多遭傳染是曰傳尸即前所謂九蟲十疰二十四蒸之類是也得病日淺猶當施治姑息日久或至發熱不休形體尫羸真氣將脫事不及矣治治之之法惟滋陰降火是澄其源也消痰和血取積追蟲是潔其流也及灸膏肓崔氏四花穴無有不效近世以來多以紫河車加補腎清心退熱之藥治之獲效者亦多矣醫者可不以補虛為主而兼去邪矣乎凡陰虛證每日午後惡寒發熱至晚亦得微汗而解脈必虛濡而數絶類瘧疾但瘧脈弦而虛脈大為辨耳若誤作瘧疾治之多致不救方滋陰降火湯王節齋曰男子色欲過度損傷精血必致陰虛火動之病睡中盜汗午後發熱哈哈咳嗽怠倦無力飲食少思甚則痰涎帶血咯血唾血或咳吐衄血身熱脈沉數肌肉消瘦此為勞瘵最重難治輕則用藥數十劑重者期以歲年然必須病人愛命堅心定志絶房室息妄想戒惱怒節飲食以自培其根不則雖服良藥亦無用也此病治之於早猶為不易若到肌肉消盡沉困著床六脈躁疾則更難為矣此方治色欲症先見潮熱盜汗咳嗽倦怠趁早服之愈可必矣當歸身酒洗一錢二分川芎一錢白芍藥酒炒一錢生地黃酒洗五分熟地黃薑汁炒一錢天門冬湯泡去心一錢黃柏蜜炙七分知母蜜炙一錢陳皮七分白朮一錢三分乾薑炒黑三分甘草炙五分一方去乾薑加玄參貝母麥門冬五味子甚效上銼一劑生薑煎加竹瀝童便薑汁同服若咳嗽甚加紫菀款冬花五味子杏仁喘加桑白皮若痰多加製半夏貝母栝蔞仁白茯苓若潮熱甚加柴胡知母地骨皮若盜汗多加酸棗仁牡蠣浮小麥若遺精夢滑加龍骨牡蠣山茱萸肉若赤白濁加白茯苓黃連若兼衄血咳血出於肺也加桑白皮黃芩山梔子若兼嗽血痰血出於脾也加桑白皮貝母黃連栝蔞仁若兼嘔吐血出於胃也加山梔子黃連乾薑蒲黃韭汁薑汁若兼咯唾血出於腎也加桔梗玄參側柏葉此症屬火大便多燥然當愈加撙節愛養勿令泄瀉若脾胃一壞則前項寒涼之藥難用矣倘遇如斯急服理脾固本健胃之劑理脾固本湯白朮炒一錢白茯苓一錢陳皮八分半夏制八分神麯炒一錢麥芽炒一錢甘草炙七分上銼一劑薑棗煎服候脾胃氣固然後用前本病藥清離滋坎湯雲林制批按此方治勞瘵陰虛火動者治陰血虛相火旺盜汗潮熱咳嗽吐痰一切虛勞等症並加治之生地黃二錢熟地黃二錢天門冬一錢麥門冬一錢當歸酒洗一錢白芍酒炒一錢山茱萸酒蒸去核一錢五分乾山藥一錢白茯苓八分白朮土炒一錢牡丹皮一錢二分澤瀉八分黃柏蜜炒八分知母蜜炒八分甘草炙七分上銼一劑水煎服嗽盛加紫菀款冬花痰盛加貝母栝蔞仁熱盛加地骨皮心下怔忡加遠志酸棗仁吐血加山梔子茅花鼻衄加桑白皮韭汁東實兩虛瀉南補北湯治酒色過度妄泄真陰陰虛火動火旺痰多發熱咳嗽咯血唾血等症黃連淡薑汁炒四兩瀉南方火寬心下痞滿止嘔吐之要藥也黃柏鹽水炒六兩補北方水除熱濟陰抑諸火之要藥也枯芩生用二兩清肺滋源知母去毛三兩降北方右尺相火除骨蒸勞熱要藥貝母去心四兩用栝蔞仁煮汁浸一宿清西方金消痰解煩桔梗二兩引諸藥至西方肺金之地助子扶母之虛也杏仁去皮尖三兩半收斂耗散之金乃降氣生津之藥也五味子鹽水炒三兩滋少陰不足之水收大陰耗散之金紫菀去土二兩半用沉香煎水浸曬大降氣止嗽當歸童便浸二兩補血和血之聖藥赤芍藥生用二兩半平東方有餘之木安中央不足之土生地黃酒洗三兩涼血生血清榮中之伏火天門冬湯泡去心四兩潤肺清痰中血止吐血清諸經混雜之血天花粉二兩止渴生津白朮麩炒一兩