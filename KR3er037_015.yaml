body:
  text: 卷之十五癰疽附腸癰吐癰脈凡諸脈浮數應當發熱其不發熱而反灑淅惡寒若有痛處必發癰疽脈微而遲反發熱弱而數反振寒當發癰疽脈浮而數身體無熱形默默胸中微燥不知痛之所在其人必發癰疽證內經曰諸痛癢瘡瘍皆屬心火又云膏粱之變足生大疔蓋心主血而行氣氣血凝滯而為癰疽也癰者壅也大而高起屬乎陽六腑之氣所生也其脈浮數疽者沮也平而內發屬乎陰五臟之氣所成也其脈沉數凡人初生瘡之時便覺壯熱惡寒拘急頭痛精神不寧煩躁飲冷者其患瘡疽必深也若人須患瘡疽起居平和飲食如故其瘡浮淺也凡外敷貼藥亦發表之意一方謂貼冷藥有神效夫氣得熱則散得冷則斂何謂神效經曰發表凡腫瘍用手按之熱則有膿不熱則無膿重按乃痛膿之深也輕按即痛膿之淺也按之不甚痛者未成膿也若按之即復者有膿也不復者無膿必是水也凡癰疽未破毒攻臟腑一毫熱藥不敢用若已破潰臟腑既虧飲食少進一毫冷藥不敢用也凡膿出而反痛者此為虛也宜補之亦有穢氣所觸而作痛者宜和解之風冷所逼者宜溫養之凡疽發深而不痛者胃氣大虛必死肉多而不知痛也凡腫瘍時嘔者當作毒氣上攻治之潰後當作陰虛補之若年老潰後發嘔不食宜參耆白朮膏峻補河間謂瘡瘍嘔者濕氣侵於胃宜倍白朮凡癰疽發渴乃血氣兩虛用參耆以補氣當歸地黃以養血凡癰疽有實熱者易療虛寒邪熱者難治腫起堅硬膿稠者為實腫下軟漫膿稀者為虛敗膿不去加白芷則去不可用白朮蓋白朮能生膿故也凡癰疽始發即以艾多灸之可使輕淺或以騎竹馬灸法最妙蓋火暢達拔引郁毒此從治之意惟頭為諸陽所聚艾炷宜小而少若其身必痛灸至不痛不痛灸至痛方連翹敗毒散治癰疽發背疔瘡乳癰一切無名腫毒初起憎寒壯熱甚則頭痛拘急狀似傷寒一日至四五日者二三劑以解其毒輕者則內自消散若至六七日不消宜服真人活命飲後服托裡消毒散調理柴胡羌活桔梗金銀花連翹防風荊芥薄荷葉川芎獨活前胡白茯苓甘草枳殼上銼生薑煎如瘡在上食後服在下食前服如熱甚並痛甚加黃連黃芩如大便不通加大黃芒硝下之真人活命飲治一切癰疽疔腫不問陰陽虛實善惡腫潰太痛或不痛然當服於未潰之先與初潰之時如毒已大潰更不宜服初用此劑大勢已退然後隨證調理其功甚捷誠仙方也乳香沒藥貝母甘草節白芷花粉赤芍藥當歸梢各一錢防風七分陳皮一錢半皂角刺五分金銀花三錢穿山甲三六片切碎以蛤粉炒黃色上銼一劑用醇酒一鍾半以紙密封罐口勿令泄氣煎至一鍾隨瘡上下以分飢飽溫服能飲酒者服後再飲三五杯忌酸薄酒鐵器服後倒臥覺痛定回生神功浩大不可臆度再看證加減在背俞倍皂角刺在腹募倍白芷在胸次加栝蔞仁二錢在四肢倍金銀花槐花酒治背發一切疔瘡腫毒不問已成未成俱焮痛者宜用未成者一二服即消已成者三四服即愈槐花四五兩微炒黃乘熱入酒二鍾煎十餘沸去渣熱服批按上方治癰疽初起已成或未成未潰之先宜之金銀花酒治一切癰疽發背疔瘡乳癰便毒及喉痹乳鵝不問已潰未潰者金銀花連莖葉搗爛取汁半鍾和熱酒半鍾溫服可保無虞如秋冬無鮮者水煎和酒服追風通氣散治癰疽發背流注腫毒腦疽打破傷折疝氣血瘕腳氣諸氣痞塞塊痛腰痛一切痰飲為患此藥大能順氣勻血扶植胃本不傷元氣蕩滌邪穢自然通順不生變證真仙劑也氣血逆於腠理故令壅結癰疽調和營衛實堪宜赤芍木通白芷何首烏同枳殼茴香烏藥當歸更加國老等無疑酒水同煎濟世一癰疽生痰有二一則胃寒生痰加半夏以健脾化痰一則鬱熱而成風痰加桔梗並用生薑水酒煎一發背因服寒涼之藥過傷脾胃飲食少進顏色憔悴肌肉不生去木通少用當歸倍厚朴陳皮流注加獨活腦發背發去木通打破傷折在頭上去木通加川芎陳皮經年腰痛加萆薢玄胡索酒煎腳氣加檳榔木瓜穿山甲水煎痰飲為患或喘或咳或暈頭痛睛疼遍身拘急骨節痹疼胸背頸項腋胯腰腿手足聚結腫硬或痛或不痛按之無血潮雖或微紅亦淡薄不熱堅如石破之無膿或有薄血或清水或如乳汁又有壞肉如破絮又如瘰癧在皮肉之間如雞卵可移動軟活不硬破之亦無膿血針口胬肉突出惟覺咽喉痰實結塞作寒作熱加南星半夏腫毒堅硬不穿加川芎獨活麻黃連須蔥煎熱服托裡消毒散治一切癰疽六七日未消者服此藥瘡未成即消已成即消能壯氣血固脾胃使毒氣不得內攻膿毒易潰肌肉易生切不可早用生肌之藥恐毒氣未盡反增潰爛如有瘡口便貼膏藥以御風入至瘡口閉合如不用貼此守成之方也黃耆鹽水炒花粉各二錢防風當歸酒洗川芎白芷桔梗炒厚朴薑製穿山甲炒皂角刺炒各一錢金銀花陳皮各三錢上用水酒各一鍾煎至七分瘡在上食後服在下空心服二帖後只用水煎千金內托散治癰疽瘡癤未成者速散已成者速潰敗膿自出無用手擠惡肉自去不用針刀服藥後疼痛頓減此藥活血勻氣謂胃補虛祛風邪闢穢氣王道之劑宜多服之神效黃耆蜜炙人參去蘆當歸各二錢川芎防風去蘆桔梗去蘆白芷厚朴薑炒薄桂甘草生用各一錢加金銀花亦可上為末每服三錢無灰酒調下不飲酒木香湯調下亦可或都作一劑用酒煎服尤佳癰疽腫痛用白芷不腫痛倍官桂不進飲食加砂仁香附痛加乳香沒藥水不幹加知母貝母瘡不穿加皂角刺咳加陳皮半夏燙泡七次杏仁薑五片煎大便閉加大黃枳殼小便澀加麥門冬車前子木通燈心批按上方治癰疽已潰托裡消毒敗膿之劑神仙蠟礬丸治癰疽及腸癰消毒固臟腑止疼痛擴膜止瀉化膿癰疽潰後宜服黃蠟二兩生白礬三兩為末熔蠟為丸如梧桐子大每服二三十丸酒下不飲酒者熟水下一日服三次肺癰蜜水下咳嗽薑湯下二仙散黃賓江傳治發背癰疽已成未成已潰未潰痛不可忍者白芷未潰者用一兩已潰者用五錢貝母未潰者用五錢已潰者用一兩上銼好酒煎服批按上方治諸癰疼痛及不破者宜之透膿散治諸癰疽及貼骨癰不破者不用針刀一服不移時而自透神效蛾口繭一個燒灰存性用酒調服即透切不可用三兩個服之即生三兩頭芙蓉膏張秀峰傳治發背癰疽痛如錐剜不可忍登時痛止如神芙蓉葉黃荊子為末各等分上二味入石臼內搗極爛用雞子清調搽患處留頂如煙霧起立瘥此方用在未潰之先或將潰之際三神膏張貢士傳治癰疽發背萆麻子去殼四十九枚陳醋一碗半好鹽一撮上三味置鍋中用文武火熬之槐枝攪成膏先將米泔水洗淨瘡搽上藥留頂未成膿者即散已成膿者即潰忌一切發物並酒神妙生肌散敏所兄傳治癰疽發背諸般瘡毒潰爛疼痛乳香一錢沒藥二錢二味用燈草同研孩兒茶一錢血竭一錢赤石脂一錢海螵蛸一錢輕粉三分龜板炒一錢鱉甲炒一錢硼砂二錢生肌全在此味水銀一錢黑鉛一錢初起加黃柏一錢作癢加白芷一錢上將銀鉛同煎化將前藥各為末入銀鉛於內研極細糝瘡上神效鐵桶膏澤川酉府傳治癰疽發背疔瘡瘰癧痔瘡粉瘤蕎麥稈灰淋汁二碗熬至一碗下血竭乳香沒藥各三分為末入汁內再熬去半碗取下待冷入黃丹八分雄黃八分硃砂八分好石灰八錢為極細末共一處放藥汁內攪勻成膏瓷器收貯用三稜針刺破將藥入內直深入到底不三四次痊愈玉容膏祕傳治發背癰疽潰爛用此生肌止痛外護香油二兩黃蠟一兩二味化開入黃丹末一錢寒水石火煅一兩為細末熔化為膏紙攤貼患處批按上方治癰疽外治之劑水云膏闡傳治發背乾薑炒皂角炙去皮弦五倍子炒川芎各一兩孩兒茶乳香沒藥各三錢枯礬槐花各一錢上為末苦膽汁調塗神效又方醋炒五倍子入豬腦髓同搗如膏貼之如瘡在左用左邊腦附腸癰肚癰千金內消散治腸癰便毒初起即消已腫即潰膿血從大便中出大黃三錢赤芍藥白芷木鱉子去殼乳香沒藥皂角刺白殭蠶栝蔞仁天花粉各一錢歸尾酒洗一錢半穿山甲三大片蛤粉炒黃色杵碎金銀花三錢甘草五分上銼一劑水酒煎空心服紅點加芒硝內消沃雪湯陳恕軒傳治肚內生癰及癰疽神效當歸身白芍藥黃耆甘草節金銀花天花粉連翹香白芷穿山甲皂角刺貝母乳香研木香青皮廣陳皮甚者加大黃水酒煎服立消是世所奇瘰癧證夫瘰癧者頸腋之間而生結核也或在耳後連及頤頷下至缺盆在鎖字骨陷中皆為瘰癧手少陽三焦經主之或在胸及胸之側皆為馬刀瘡足少陽膽經主之二經多氣少血其初生如豆粒或如梅李纍纍相連歷歷三五杖久久不消漸漸長大按之則動而微痛不憎寒壯熱惟午後微有熱或夜間口乾飲食少思四肢倦怠是以堅而不能潰潰而不能合有風毒者得之於風熱毒者得之於熱氣毒者得之於氣乃風熱邪氣蘊結而成皆由氣血不足往往變為勞者經云此不繫膏粱丹石之變因虛勞氣鬱所致宜補形氣調經脈則未成者自消已成者自潰若不詳經絡血氣多少脈證受病之異卒用牽牛斑蝥及流氣飲十宣散等則血氣已損而實實虛虛之禍如搐諸掌治治當以益氣養榮湯主之方益氣養榮湯批按此方治瘰癧半攻半補之劑治懷抱抑鬱瘰癧流注或四肢患腫肉色不變或日晡發熱或潰而不斂黃耆蜜炙當歸酒洗人參白朮炒各一錢半川芎白芍酒洗生地黃陳皮香附貝母各一錢地骨皮柴胡桔梗炒甘草炙各五分上銼一劑水煎食遠服如有痰加橘紅刺痛加青皮或木香午後有熱或頭微眩加酒炒黃柏膿水清倍參耆歸女人有鬱氣胸膈不利倍香附貝母月經不調加丹皮當歸紅花散腫潰堅湯治馬刀瘡結硬如石或在耳下至缺盆中或至肩上或於脅下皆手足少陽經中及瘰癧遍於頦或至頰車堅而不潰在足陽明經所出或二瘡已破乃流膿水並治及生癭瘤大如升久不潰者升麻六分葛根二錢白芍藥二錢當歸尾五分連翹三錢黃連二錢桔梗五錢黃芩梢酒洗一錢半黃柏酒炒五錢貝母酒炒五錢昆布洗五錢龍膽草酒洗四錢海藻酒炒五錢三稜酒炒三錢莪朮酒炒三錢天花粉酒浸五錢甘草炙五分白芍二錢歸尾五分上銼每一兩用水二鍾先浸半日煎至一鍾去渣熱服於臥處伸足在高處頭微低每噙一口作十次咽至服畢依常安臥取藥在胸中停蓄也另攢半料作細末煉蜜為丸如緑豆大每服百丸或一百五十丸此藥湯留一口送下內消散任中嵩傳治瘰癧宜先用益氣養榮湯數十服後服此方硃砂一錢血竭一錢斑蝥去翅足三分生用上為細末每服一分空心燒酒調服未破者三五日立消已破者內服此藥外用金頭蜈蚣一條研極細末用麻油一小鐘浸二旦夕搽患處其瘡即腫潰過一二日腫消可貼膏藥瘡勢大者二十日痊小者十餘日平復天花散京師傳批按此方治瘰癧專攻之劑治瘰癧潰爛疼痛天花粉一錢半白芷一錢乳香二分沒藥五分赤芍藥一錢七分貝母七分歸尾一錢金銀花三錢穿山甲炒黃色一錢二分上銼一劑好酒一鍾半煎服忌鮮魚雞羊等毒物烏龍膏周排山傳治瘰癧潰爛久不愈者木鱉子帶殼燒存性去殼側柏葉焙人中血即發燒灰青龍背即舊鍋上垢膩紙錢灰飛羅面各一錢上為末用好醋調成膏塗瘡上外用紙貼效代灸散治瘰癧潰爛臭不可聞久不能愈官粉一錢雄黃一錢銀硃一錢麝香二分上為細末用槐皮一片將針密密刺孔置瘡上上糝藥一撮以炭火炙熱其藥氣自然透入瘡中痛熱為止甚者換三次輕者二次痊愈紫雲膏治瘰癧及一切頑瘡潰爛久不愈並杖瘡臁瘡小兒頭瘡並效黃蠟一兩松香五錢黃丹三錢香油四兩上四味共入鐵鍋內用柳條去皮攪之文武火熬至半炷香盡為度攤油紙貼之或搽塗患處地龍膏李養齋傳治瘰癧未破者貼之立消雄黃地龍糞小麥面各等分研末醋調塗之丹青散治瘰癧已破者搽上即愈銀硃一錢銅青一錢松香五分研末有水干敷之如干燈油調搽瘰癧妙方劉前岡傳用蕎麥麵捻作圈圍住瘡上用黃酒糟壓干撒在瘡上用麝香入艾槌爛鋪糟上火燒艾過則再換以瘡內水乾為度後貼膏藥官粉一兩半乳香二錢沒藥二錢半孩兒茶二錢半蛤粉五錢龍骨二錢半蜂房二個密陀僧二錢半血竭二錢萆麻子去殼一百二十個上研為細末用香油四兩熬黑色後將各藥放在油內熬數沸用瓦盆盛水將藥鍋坐在上出火毒紙攤貼患處如神忌食雞鵝羊肉鴨蛋鮮魚辛辣炙爆等物老君丹黃賓江傳治瘰癧並痰核結硬老君須四分紫背天葵三錢乳香三錢沒藥紅曲防風紅花各三錢梔子五分當歸八分川芎四分草果仁一錢血竭五分孩兒茶五分土茯苓五分金銀花五分白芥子五分上共搗粗末先用獨蒜一個順擂爛入好酒一碗濾去渣入藥於內重湯煮一時食後臨臥服三劑全消妙不可言天葵子丸黃賓江傳治瘰癧紫背天葵一兩半海藻一兩海帶一兩昆布一兩貝母各一兩桔梗一兩海螵蛸五錢上為細末酒糊為丸如梧桐子大每七十丸此方用桔梗開提諸氣貝母以消毒化痰海藻昆布以軟堅核治瘰癧之聖藥也疔瘡證夫疔瘡者皆由臟腑積受熱毒邪氣相搏於經絡之間以致血氣凝滯注於毛孔手足頭面各隨五臟部分而發也其形如粟米或疼或癢以致遍身麻木頭眩寒熱時生嘔逆甚則四肢沉重心驚眼花蓋疔腫初發熱突起如釘蓋故謂之疔疔瘡含蓄毒氣突出寸許痛癢異常一二日間害人甚速內經以白疔發於頸鼻赤疔發於舌根黃疔發於口唇黑疔發於耳前青疔發於目下蓋取五色以應五臟各有所屬部位而已然或肩或腰或足發無定處如在手足頭面骨節間最急其餘猶可緩也近世多食災牛疫馬之肉而成此證其形有十三種皆以形而名之耳一曰麻子疔始末極癢忌麻子油犯之多不救二曰石疔三曰雄疔四曰雌疔五曰火疔五曰爛疔七曰三十六疔八曰蛇眼疔九曰鹽膚疔十曰水洗疔十一曰刃鐮疔十二曰浮鷗疔十三曰牛狗疔惟三十六疔最為可畏其狀頭黑浮起形如黑豆四畔大赤色今日生一明日生二後日生三乃至十數猶為可治若滿三十六則不可治矣又有所謂紅絲疔魚臍疔之類其名甚多其紅絲疔者或生手足間有紅絲一條急宜用針刺斷不然其絲入心必難治矣魚臍疔者狀如魚臍也治凡療疔瘡皆宜刺瘡中心至痛處又刺四邊十餘下令去惡血乃以藥敷之仍服蟾酥丸之類發汗諸疔名目雖多其治法略同如身冷自汗嘔逆燥喘狂喝妄語直視者皆毒氣攻內不可治矣方飛龍奪命丹治疔瘡發腦疽乳癰附骨疽一切無頭腫毒惡瘡服之便有頭不痛者服之便痛已成者服之立愈此乃惡證藥中至寶危者服之立安雄黃二錢硃砂一錢為衣輕粉五分血竭一錢乳香一錢沒藥一錢蟾酥二錢銅緑二錢膽礬一錢麝香五分片腦五分蜈蚣一條去頭足蝸牛二十一個寒水石一錢上為末先將蝸牛連殼研如泥和為丸如緑豆大如丸不就入酒打麵糊丸之每服二丸先用蔥白三寸令病人嚼爛吐於男左女右手心將丸藥裹在蔥白內用無灰熱酒三四杯送下於避風處以衣蓋覆之約人行五里之久再用熱酒數杯以助藥力發熱大汗為度如重者無汗再進二丸汗出即效如疔瘡走黃過心者並出冷汗者難治病人不能嚼蔥研爛裹之瘡在下食前服瘡在上食後服忌冷水黃瓜茄子油膩雞魚肉濕面一切發物不可食化生丸戴近山傳治一切發背癰疽無名腫毒諸般惡毒疔瘡及治破傷風陰證傷寒並楊梅瘡毒筋骨疼痛等證並皆一服奏效蟾酥二錢血竭二錢蝸牛二十個瓦上焙乾肉殼俱用銅緑二分半與上三味同研枯白礬一錢輕粉二錢二味同研硃砂三錢研細留一錢為衣上為細末用人乳汁為丸如緑豆大硃砂為衣令病人嚼蔥二根令爛吐出裹藥三丸在內吞下熱酒送之趙府小靈丹治一切惡毒疔瘡諸般無名腫毒及四時傷風傷寒憎寒壯熱無汗初覺者乳香沒藥輕粉血竭硃砂川烏尖草烏尖巴豆霜細辛蟾酥等分麝香減半上為末糯糊丸黃米大雄黃為衣每服十五丸小兒五七丸用蔥白三根劈開入丸在內細嚼好酒下被蓋汗出避風婦人有孕不可服金蟾丸羅穎波傳治疔瘡硃砂雄黃輕粉草烏海金沙各一錢上為末用蟾酥為丸如緑豆大每服三丸以蔥白一根劈破夾藥在內線縛住灰火煨令香取去線連須帶藥嚼下以溫水送之被蓋出汗忌生醋冷水蟾酥丸毛惟中傳治疔瘡發背無名腫毒咽喉腫痛小兒急慢驚風痘疹傷寒陰證等疾硃砂五錢雄黃五錢麝香少許上為細末以端午日將蟾酥為丸如菜子大每服三丸蔥酒送下取汗為效咽喉腫疼點患處立愈神仙解毒丸治疔瘡發背魚口諸般惡瘡腫毒初發一服立消白礬不拘多少溶化作丸如緑豆大硃砂為衣每服十丸用連須蔥七八根水煎一碗送下立愈已成者不傷生未成者即消老軍散治發背癰疽疔瘡惡毒一切無名腫痛焮熱初起未潰者大黃半生半煨甘草節等分上為細末和勻每用一匙空心溫酒調服一二服疏利為度批按上方治療瘡內消專攻之劑還魂散凡患疔瘡癰疽癤毒此藥能令內消去毒化為黑水從小便出萬無一失知母貝母白芨半夏天花粉皂角刺金銀花穿山甲乳香各一錢上銼一劑無灰酒一碗煎至半碗去渣只作一服溫服不得加減再將渣搗爛加秋過芙蓉葉一兩用蜜調井花水和敷瘡口上如干再用蜜水潤濕過一宿自然消不必別用峻利之藥以伐元氣也類聖散西園公方治一切疔瘡惡毒腫痛神效川烏草烏蒼朮細辛白芷薄荷防風甘草各五錢上為末雞子清調塗留頂點點金丹胡前溪傳治一切疔瘡發背無名腫毒三月清明將蝦豚收一罐用雄黃一兩硃砂一兩研細末入罐內曬之至端午日取出聽用如搽瘡用藥磨水點上立消陶潛膏治疔瘡腫痛危急欲死者菊花葉搗爛敷上即蘇冬月光花用菊根亦可治誤食瘟牛肉生疔毒瘡白頸蚯蚓八九條擂酒濾食其渣貼四圍患處留頂便毒附魚口瘡下疳瘡證夫便毒者生於小腹下兩腿合縫之間其毒初發寒熱相作腿間腫起疼痛是也夫腎為作強之官所藏者精與志也男女大欲不能以直遂其志故敗精搏血留聚中途而結為便毒矣況其所乃精氣所出入之道路也或觸物而動心或夢寐而不泄既不得偶合陰陽又不能忘情息念故精與血交滯而腫結也初起慎不可用寒涼之藥恐氣血愈結而不得宣散反成大患惟當發散寒氣清利熱毒使精血宣暢自然愈矣陰頭腫痛生瘡者名為下疳也乃督任沖三脈之屬督脈屬陽任脈屬陰衝脈屬厥陰陽脈主氣陰脈主血皆由氣血大熱有毒有風故生此瘡其瘡一生則便毒厲風瘡次第而發也先宜升麻葛根湯發出其發後服涼血解毒丸即愈不必用輕粉之類下疳瘡乃男子玉莖生瘡皆由所欲不遂或交接不潔以致邪毒浸潰發成瘡毒日久不愈或成便毒或損爛陽物多致危篤又魚口瘡妒精瘡皆其類也俗云疳瘡未已便毒復來生也妒精瘡者由婦人陰中先有宿精因而交接虛熱熏蒸即成此疾初發在陰頭如粟拂之即痛甚兩日出清膿作臼孔蝕之太痛婦人有生於玉門內正似疳蝕瘡不痛為異耳方通直散治便毒如神黑牽牛一錢半大黃三錢歸尾三錢甘草節二錢白殭蠶一錢半木鱉三個去殼穿山甲壁土炒各二錢上銼一劑好酒煎早晨空心服少食至已時瀉下膿血便安神異散治便毒魚口瘡金銀花天花粉木鱉子各一錢連翹黃芩各八分山梔子七分穿山甲炒珠二錢大黃二錢木香五分皂角刺三錢甘草五錢上銼一劑酒水煎空心服通解散治男子交感強固不泄以致血氣交錯大小便澀滯或肛門腫痛或作便毒癰疽黑醜炒搗末大黃炒桃仁去皮尖官桂白芍澤瀉各二錢半乾薑一錢甘草五分上銼二劑水煎空心服黃芷湯治魚口瘡大黃香白芷各五錢水煎露一宿次早空心溫服至午後肚痛未成者自消已成未穿者膿血從大便中出攻毒散治魚口瘡油核桃去肉將蠍子於內火燒存性研末黃酒下出汗如未愈加蜈蚣同燒為末燒酒調服出汗百五散王小庵傳治魚口瘡初出三五日五倍子炒黃為末入百草霜醋調貼患處一日夜即消立消散治魚口便毒大蝦蟆一個剝去皮連腸搗爛入蔥五錢再搗敷腫處卻用皮復貼其上此瘡立刻消散決無遺毒之患也瀉肝湯治肝經濕熱不利陰囊腫痛或膿潰皮脫睪丸懸挂及下疳瘡當歸梢赤芍藥生地黃龍膽草酒浸炒防風黃連炒黃柏知母酒炒車前子炒澤瀉各一錢甘草梢五分上銼一劑空心水煎服珍珠散焦確齋傳治下疳瘡黃連末黃柏末乳香沒藥孩兒茶輕粉官粉煅五倍子炒珍珠研象牙銼各等分上為末以米泔水洗淨糝患處白金散治下疳瘡黃柏分作手指大條慢火炙熱淬豬膽汁中用二枚每炙淬汁晝為度研細入輕粉錢余香油調敷患處鳳凰散李寵庵傳治下疳陰頭生瘡腫痛名蠟燭發抱過雞卵殼黃連輕粉各等分各研末均一處香油調搽洗疳湯桑柳南傳川楝黃連瓦松花椒蔥根艾葉各等分上水煎傾入盆內用青布一塊展洗瘡上立效楊梅瘡證此瘡出自廣地居民多患之不以為異因名曰廣瘡他鄉之人適感其氣亦即相染其狀紅肥凸出酷似楊梅故又名曰楊梅瘡有因橫痃下疳而成者有因宿娼感氣而生者皆屬火證故腥穢觸人切忌服水銀輕粉等藥以取速效而遺患於後也方防風通聖散方見中風治楊梅瘡初起發表三黃敗毒散治天泡楊梅等瘡防風荊芥連翹白芷梢黃芩黃連梔子地骨皮歸尾赤芍川芎上部瘡多倍用五加皮木瓜苦參黃柏薏苡仁殭蠶蟬蛻蒺藜白蘚皮甘草皂角刺木通下部瘡多倍用各二兩土茯苓白者三斤共銼作五十劑每日二服水煎滾忌生鹽牛肉燒酒瘡痛加羌活獨活體虛去梔子加人參茯苓郭主簿方號明川治楊梅瘡防風荊芥薄荷葉金銀花牙皂角刺白蘚皮五加皮當歸川芎地骨皮薏苡仁人參黃芩牛膝木通甘草各一錢土茯苓一兩白花蛇三分水煎服神仙湯祕方治天泡楊梅瘡兼治發背毒瘡白芷防風牛膝五加皮當歸連翹威靈仙白蘚皮各一兩牙皂木香皂角刺明天麻各三錢白豆蔻一劑用三個土茯苓二斤上銼二十劑水煎早晚各一服服盡除根忌茶醋緑豆豆腐雞羊肉批按上方治楊梅瘡追風敗毒療除後之患治楊梅瘡神效方劉小室傳何首烏荊芥苦參天花粉各一兩肥皂子四兩打碎炒焦為末上俱為末合一處每成一錢用土茯苓五兩豬脂油二兩水六碗煎二碗分作三次服忌牛肉燒酒茶鐵器一粒金丹桑文臺傳治楊梅惡瘡又治瘧疾效砒以蕎麥麵包灰火煨令焦取出去面稱一兩雄黃硃砂各一錢半蕎麵炒一錢上為末水煮蕎麵糊為丸如豌豆大每一粒空心涼水下一日一服七日效忌熱物三三丸孫北樓傳治楊梅等瘡孩兒茶一分砒八釐壯者用一分輕粉五分上為末麵糊為丸如緑豆大分作九服一日三服清茶下三日後無形迹雄黃敗毒丸敏所兄傳雄黃硃砂輕粉孩兒茶各一錢苦參一兩上為末飯丸如梧桐子大每服二十丸米湯下日進二服口噙緑豆湯回生保命丹楊西塘傳治一切楊梅天泡頑瘡筋骨痛下疳瘡及輕粉毒風癬漏腫毒不拘新久當歸炒二錢川芎三錢白芷梢三錢舊槐花一兩乳香五分沒藥五分輕粉四錢二分硃砂四錢雄黃三錢牛黃四分血竭一錢孩兒茶一錢小丁香一錢上為末用紅棗黏大米粉打糊為丸如黍米大每服十丸又土茯苓四兩牙皂半個同煎吞藥一日三服忌母豬牛肉醬醋茶房事批按上方治楊梅瘡峻劫之劑抵金丹許昌縉紳傳治一切天泡楊梅及遠年近日頑瘡細辛白芷麻黃金銀花桂枝當歸防風甘草各一兩牙皂十個龍骨火煅五錢乳香沒藥孩兒茶丁香各二錢為末上前粗藥十味共為末每服不拘多少以土茯苓煎水去渣入粗藥在內攪勻再煎一二沸取出候溫加後四味末於內再加蜜一箸頭溫服以棗肉為丸用土茯苓湯頓服亦可熏鼻奇方周梅江傳治楊梅瘡水銀白錫百草霜各一錢上先將錫化開入水銀和勻共研為末作紙捻九條每早午晚各一條用紙作罩勿令泄氣熏鼻孔男左女右口噙涼水溫則易之一日熏三次三日九次全好三教歸一杜東野傳治楊梅瘡先用表藥後用此不問遠近一切頑瘡並效水銀銀硃硃砂各一錢上共一處研勻用棗去核再研化丸分作兩丸每用一丸置瓦上用炭火四塊將藥居中令患人仰臥縮腳被蓋將口頻吹火燒煙燻之熏後再服毒藥數次金燈照眼俞貢士傳白錫一錢煎化入水銀水銀一錢乳香沒藥白丁香辰砂線香輕粉各三分自然銅一錢麝香三分上各為細末將皮紙卷條每條七分用香油潤濕燃燈照眼觀燈口含涼水燈用帽匣盛之先要服通聖散十劑照後亦要服十數服如瘡疼宜服乳香沒藥共五分研末調酒服身臥煙霞乳香沒藥孩兒茶雄黃硃砂各五分麝香三分水花珠一錢潮腦一錢水銀一錢黑鉛一錢艾葉三錢血竭五分線香三根上共為細末將黑鉛化開水銀入內攪勻冷之一處將藥分作三分艾葉線香亦分作三分為條三根用瓦盛藥條被蓋身體祕密仰身縮腳藥放腳下燒煙燻之避風三五日見風則生瘡未熏之先宜服三黃敗毒散十數劑白杏膏治楊梅瘡輕粉一錢杏仁去皮七個共搗爛將瘡去痂先抹豬膽汁後塗藥千金散乳香沒藥血竭雄黃杏仁各五錢輕粉孩兒茶枯礬各五分膽礬三分麝香一分上為末先用豬膽汁貼洗後摻藥珠粉散翟散官傳輕粉一錢珍珠二分天竺黃六分上為細末將瘡用槐條煎湯洗淨後搽藥即愈批按上方治楊梅瘡熏貼外施之劑楊梅頑瘡楊西塘傳乳香沒藥輕粉雄黃銅緑各等分上共為末用人乳一鍾熬至半鍾入前藥再熬令乾擂爛搽上香鰾湯治楊梅瘡筋骨痛久不愈者茜草麻黃烏藥各一撮細茶魚鰾二錢用芝麻炒成珠去麻槐子炒焦花椒各五錢乳香一錢生薑五片蔥白五根上銼一劑水煎一鍾通口服二三劑即愈不發黑金散毛東園傳治曾服輕粉致筋骨疼痛當歸川椒去目甘草細茶黑鉛各四兩上銼分作十劑水煎服或後入麝香一分換骨散毛東園傳治天泡瘡筋骨疼痛川歸荊芥麻黃梔子連翹花粉各一兩角刺一兩半乳香沒藥各一錢半土茯苓四兩上銼分十劑水三碗煎一碗二次服之批按上方治楊梅瘡毒致筋骨痛者登瀛散治遠年楊梅風漏或筋骨疼痛土茯苓二斤防風荊芥五加皮白蘚皮威靈仙木瓜各一兩半生地黃酒洗白芍藥當歸川芎白茯苓川牛膝杜仲炒白芷地骨皮青藤槐花黃連各一兩上銼十劑水一鍾半酒一鍾煎至一鍾瘡在上食後服在下食前服渣再煎每日一帖煎兩次合一處庶濃淡得宜作兩次溫服第三次勿煎逐日曬乾至三帖統煎湯候溫洗浴初服五帖之內瘡勢覺盛乃毒氣攻外勿懼輕者至十帖重者至二十帖見奇功忌房事生冷煎爆母雞鵝羊豬頭蹄蝦魚此皆動風之物蒼耳散治楊梅瘡已服輕粉愈後手髮癬或手掌上退一層又退一層生生不絶者名鵝掌風蒼耳子金銀花皂角刺防風荊芥連翹各一錢蛇床子天麻前胡各五分土茯苓牙皂甘草各三錢上銼一劑生薑一片川椒一撮水煎不拘時服右軍方治楊梅瘡後鵝掌風烏藥五錢白芷五錢雄黃二錢硃砂二錢沒藥乳香各一錢上共為末面丸如梧桐子大每三十丸燒酒送下五七日見效玉脂膏王中城傳治楊梅瘡愈後鵝掌癬瘡久而不瘥一擦如掃牛油桕油香油黃蠟各一兩溶化入銀硃一錢半官粉二錢麝香五分上為末入內攪勻抹癬上火烤再擦再烤如神治梅毒久不愈土蜂窩長腳蜂窩油松節三味燒過罩成炭上為末用香油煎滾入黃蠟再煎入藥調如膏夾油單紙貼瘡一二日即變白生肌如神茯苓湯敏所兄傳治遠年久日一切楊梅天泡瘡毒甚至腐爛肌肉流膿出汁臭不可聞痛不可忍先服此湯薏苡仁皂角刺木瓜白芷當歸尾生地黃川牛膝白芍藥黃柏防風各一兩木皂角川椒紅花各五錢甘草節羌活各七錢金銀花二兩上為細末用艾茸鋪紙入藥在中卷條放碗內入香油一碗將藥條作燈草照之令病人眼看燈口噙涼水熱則又換將燈入木桶內四圍用單被圍住勿令泄燈氣看照盡藥條為度後用丸藥黃丹一錢二分輕粉一錢皮硝四分珍珠三分花粉一分槐花五分炒丁香一分炒當歸三分炒上為末以爛飯為丸如緑豆大每服三分至五分止白水送下如瘡不收口又用貼藥黃柏黃芩黃連白芨杏仁俱銼碎黃蠟五錢入好醋取葉貼瘡上先用花椒煎水入鹽少許洗瘡後貼藥臁瘡證夫臁瘡者皆由腎臟虛寒風邪毒氣外攻三里之旁灌於陰交之側風熱毒氣流注兩腳生瘡腫爛疼痛臭穢步履艱難此瘡生於臁骨為重以其骨上肉少皮薄故難愈至有多年無已瘡口開闊皮爛肉見臭穢可畏治法當先去蟲然後敷貼仍宜內服蠟礬之類須翹足端坐勿多行履庶可全愈矣方黃白散治臁瘡濕毒及遍身熱瘡黃柏一兩輕粉三錢上為末用豬膽汁調塗濕則干糝三香膏趙古松傳治遠近臁瘡潰爛至骨疼痛乳香二錢松香三錢上為細末用真香油調用茭箬葉密密刺孔將藥攤在上用箬葉貼患處藥居中上用完箬葉蓋之帛扎住登時止痛夾紙膏張會山傳治臁瘡頑瘡松香黃丹萆麻子去殼各等分上為末用香油調隔油紙攤藥夾紙中貼患處石村劉大尹膏芝麻油四兩銅鍋內煎出入蔥白三根煮黑色取出入川椒去目一兩煮黑色濾去入青用末一兩以槐枝十根各長一尺合攪焦一節截去一節以盡為度後入白礬一兩黃蠟五錢煎良久傾碗內成膏每以油單紙夾膏一匙於中以銀針刺之密密多孔先以濃茶洗瘡口貼膏於上反復轉換時得之痛止用一二帖立效年深者不過五七帖存其膏久久益效又方劉川州傳香油一兩鐵杓煎入黃蠟五錢化開用銅緑三錢研極細末將銅錢操末徐徐入鐵杓內作五十餘次入將前銅鐵另放碗里將藥傾入碗內冷定將瘡洗淨用氈一塊如瘡大攤與藥上勤放患處一日一換時要洗淨疥瘡方諸瘡一掃光四九兄傳治風癬疥癩坐版血風瘙癢疼痛神效蛇床子五錢炒為末大楓子去殼五錢為末水銀二錢白錫一錢加枯礬一錢亦可上先將錫化開次入水銀攪勻後入上二味研勻用桕油調搽一上散王少泉傳治疥瘡枯白礬一兩硫黃七錢人言三分五倍子五錢炒花椒五錢上為末香油煎雞子令熟去雞子以油調搽香疥樂鄭中山傳大楓子去殼三十個木鱉子去殼三十個蛇床子五錢白蒺藜五錢杏仁三十個川椒四錢枯礬三錢朝腦三錢輕粉一錢半人言一錢半上各另為末合勻入桕油三兩搽瘡鐵掃帚徐鯉川傳治疥癬血風諸瘡瘙癢難當硫黃不拘多少人言少許二味為末入白蘿蔔內火燒存性取出研細末聽用另用香油四兩入雞子三個煎熟去雞子不用再入花椒四兩油內煎至焦黑去椒不用用香油調藥搽患處玉鏽球周後峰傳治疥瘡水銀一錢枯礬五分樟腦一錢大楓子二十個花椒五分桕油五錢上共研不見水銀星火炙擦之熏疥藥艾葉核桃殼雄黃人言少許上為末卷作筒燒煙燻之洗疥藥防風荊芥白礬馬鞭草苦參花椒野菊花水煎頻洗又方吳北源傳蒼朮皮硝等分水煎洗愈後永不發仙子散治遍身瘡疥經年舉發者苦參威靈仙蔓荊子何首烏荊芥上各等分為細末每服二錢食前酒煎服日二三服忌發風物疥靈丹白芷一兩枳殼麩炒七錢連翹七錢白蒺藜炒一兩羌活七錢梔子炒七錢當歸七錢荊芥穗七錢苦參糯米泔浸一日曬乾二兩上為末煉蜜丸如梧桐子大每五十丸滾水下癬瘡方必效散黃賓江傳治風濕癬瘡並年久頑癬川槿皮四兩斑蝥一錢半夏五錢木鱉子去殼五錢檳榔五錢雄黃三錢白砒一錢上俱切成片另將雄砒細研共合一處用井水一碗河水一碗浸曬三日露三夜將藥水用鵝翎掃疥上百發百中立應膏劉水山公傳治風癬瘡象皮燒灰紅棗燒灰針末黃柏末熟皮煙黃丹研輕粉研大楓子去殼上各等分為細末煉香油調膏塗癬上一女子兩股間濕癬長四五寸發時極癢癢定極痛乃以利針當癢時於癬上刺百餘下其血出盡鹽湯洗之如此三四次方除蓋濕淫於內其血不可不砭後服浮萍散出汗浮萍散治諸風疥癬癩瘡浮萍四兩當歸川芎赤芍藥荊芥麻黃甘草各二錢上銼二劑蔥白二根豆豉五六十個煎至八分熱服出汗治鵝掌風癬有蟲吃開羅岑樓傳黃丹輕粉各三錢豬臟頭燒油調搽痜瘡方桃梅煎陳白野方治痜頭瘡桃枝連葉七枚長四寸搗爛烏梅七個打碎白礬研一錢胡椒研末一錢川椒研末一錢上用香油二兩煎至一兩每早擦一次陀僧散治小兒頭上白痜瘡鵓鴿糞炒研末密陀僧花椒末各五錢硫黃一錢人言半分上為末香油調搽晚間洗去香粉散俞九河傳治小兒頭上肥瘡松香枯礬川椒各五分水粉三分上為末實放蔥內扎住兩頭白水煮沸用時去蔥皮擦患處皂礬散賈醫官傳治癩頭白痜瘡先用退殺豬湯洗瘡令淨用赤皮大蔥白三條三寸長劈開裝入皂礬每一條入礬一錢用紙包裹煨熟揉擦頭瘡即愈其發即長矣神雁膏陳小軒傳治白痜頭羊糞燒黑枯存性為末雁油調搽一二次即愈治肥瘡黃水瘡紅棗燒灰枯礬黃丹松香各一錢官粉五分銀硃三分上為末干則香油調搽濕則干糝之癜風方蜂房散余靈泉傳治白癜風露蜂房一個將生鹽築滿諸孔眼火燒存性去鹽後用膽礬天花粉蟬蛻各等分俱為細末均分用紙包三分將活鯽魚一對同酒煮熟無風處細嚼連刺飲酒後後癢自上而下趕入四肢金櫻丸懷園叔傳治白癜風苦參一兩何首烏半斤胡麻仁一兩牛蒡子酒炒一兩蔓荊子一兩白蒺藜二兩蒼耳子一兩蛇床子酒炒一兩牛膝酒洗二兩肉蓯蓉二兩蒼朮泔制一兩菟絲子酒製一兩金櫻子酒炒一兩上為末麵糊為丸如梧桐子每服七十丸溫酒送下三黃散治白癜風雄黃硫黃各五錢黃丹天南星各三錢枯礬密陀僧各三錢上為末先以薑汁擦患處薑蘸藥擦擦後漸黑次日再擦黑散則無恙矣治白癜風硫黃生白礬等分為末用絹包水煮一日搽治紫癜風官粉五錢硫黃三錢為末雞清調搽治赤白汗斑劉進士傳雄黃硫黃全蠍殭蠶白附子密陀僧各五分麝香二分上為末蘸生薑於患處擦之五日除根決效諸瘡方隔蒜灸法治一切瘡毒大痛或不痛或麻木如痛者灸至不痛不痛者灸至痛其毒隨火而散蓋火以暢達撥引郁毒此從治之法也用大蒜頭去皮切三文錢厚安瘡頭上用艾壯於蒜上灸之三壯換蒜復灸未成者即消已成者亦殺其大勢不能為害如瘡大用蒜搗爛攤患處將艾鋪上燒之蒜敗再換如不痛或不作膿及不起發或因瘡尤宜多灸灸而仍不痛不作膿不起發者不治此氣血虛之極也蔥尉法治虛怯人肢體患腫塊或作痛或不痛或風襲於經絡肢體疼痛或四肢筋攣骨痛又治流注跌撲傷損腫痛杖打刺痛及婦人吹乳乳癰陰證腹痛手足厥冷蔥頭細切杵爛炒熟敷患處冷則易之再尉腫痛即止其效如神豆豉餅治瘡瘍腫硬不潰及潰而不斂並一切頑瘡惡瘡江西淡豆豉為末唾作餅子如錢大厚如三文置患處以艾壯於餅上灸之干則易之如背瘡用漱口水調作餅復患處以艾鋪餅上灸之如未成者即消已成者能消其毒如有不效者氣血虛故也洪寶丹西園公方治一切腫毒散血消腫治湯蕩火燒金槍打撲出血不止如神天花粉三兩白芷二兩赤芍藥二兩鬱金一兩上為末熱用茶調冷用酒調塗患處如衄血不止水和塗後項上最能絶血路隔紙膏兩川叔傳治一切惡瘡腫毒頑瘡雞屎炒一兩松香生一兩百草霜八錢雄黃五分枯礬四分上為末香酒調用傘紙貼患處攤藥於紙上再將原紙返展蓋住神捷膏鄭中山傳治諸般頑瘡及內外臁瘡久年不愈者香油半斤先煎入黃蠟一兩松香五錢慢火熬至滴水成珠不散為度取出候冷加後藥乳香三錢沒藥三錢輕粉三錢血蠍三錢孩兒茶三錢枯礬三錢龍骨火煅三錢川椒四錢上為細末攪之煎膏內瓷器收貯若遇頑瘡先用花椒細茶艾葉濃煎水頻頻溫洗令淨卻用油紙以封刺孔比如瘡口大俱刺遍傷藥將孔面貼瘡上一日換三次二日後換一日一次每換藥必須洗淨方貼效斂瘡止痛生肌散杜桐岡傳治諸瘡及癰疽黃水熱泡等瘡官粉火煅黃色一錢黃柏末一錢黃連末五分乳香五分沒藥五分孩兒茶五分上為末摻患處散解毒黃賓江傳治諸瘡腫毒並喉閉赤眼暴發疼痛雄黃三錢白硼砂三錢銅杓微火炒膽礬六錢打碎先炒白色再炒紫色上共為細末治瘡或將燒酒或吐津抹濕瘡上將末藥著指磨上立消治眼用津抹濕眼胞將藥抹之立消喉閉吹喉中追風解毒湯兩川叔傳治血風瘡並濕熱生黴其形如釘高起寸許者連翹黃芩梔子黃柏防風荊芥羌活獨活全蠍殭蠶蒺藜金銀花威靈仙歸尾赤芍甘草上銼各等分水煎服寸金黃劉甘泉傳治一切紅腫熱毒瘡癤黃連黃芩黃柏大黃皮硝青黛白礬五倍子上各等分為末雞清調搽
