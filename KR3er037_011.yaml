body:
  text: 卷之十一婦人科脈女人尺脈常盛而右手脈大皆其常也若腎脈微澀或浮或滑而斷絶不勻或肝脈沉而急皆經閉不調之候也證夫女子十四則月水行男子十六則陽精溢此皆合乎陰陽之數各及其時故男子之精氣宜盛女子之月水宜調調經之道貴乎抑其氣以行其血血盛氣衰為從從則百病不生孕育乃成且婦人之病四時所感六淫七情所傷悉與男子治法同惟胎前産後七癥八瘕崩漏帶下之證為異故別著方究其所因多由月水不調變生諸證大概以經候如期為要或有愆期當審其冷熱而調之先期而行者血熱也法當清之過期而行者血寒也法當溫之然又不可不察其有無外感為之寒熱而後投藥且行經之際與産後一般將理失宜為病不淺若被驚則血氣錯亂經脈漸然不行逆於上則從口鼻中出逆於身則為血分勞瘵若其時勞力太過則生虛熱亦為疼痛之根若喜怒則氣逆氣逆則血逆逆於腰腿心腹背脅之間遇經行時則痛而重著過期又安若怒極而傷於肝則又有眼暈嘔吐之症加之經脈滲漏於其間遂成竅血淋漓不已凡此之時中風則病風感冷則病冷久而不治崩漏帶下七癥八瘕可立而待矣一診婦女右手寸脈浮長出於魚際者氣盛也蓋女人善懷多思多妒每事不遂意則鬱忿滿則氣無釋血益日消氣益日盛陰陽交爭乍寒乍熱食減形羸諸病蜂起宜越鞠丸主之然此脈之婦惟師尼寡婦長年閨女士大夫商賈之妻並失志之婦者有之一厥陰肝脈弦出寸口又上魚際者陰盛也此思男子不可得也蓋男子以精為主男子精盛以思室婦人血盛以懷胎故肝脈弦出寸口者則陰盛可知矣方四物湯批按此方治婦人諸疾之總司也當歸川芎芍藥地黃上銼一劑水煎溫服臨病加減用之經水行後作疼氣血虛也加四君子湯挾寒者加乾薑經水行過三五日腹中綿綿走痛者此血行而滯氣未盡行也加木香檳榔經水過多別無餘證加黃芩白朮若經血過多得五心煩熱日晡潮熱加胡黃連經水澀少加葵花紅花經水常不及期而行者血熱也用生地黃加黃連黃芩香附經水常過期而來者瘦人多應是血少倍當歸熟地黃加黃耆甘草少佐以桃仁紅花以為生血之引用也肥人大概是氣虛加痰阻滯升降然也去地黃加參耆甘草茯苓半夏陳皮香附經水常過期而紫黑成塊血熱也多作腹痛用生地加香附黃連玄胡索五靈脂乳香沒藥經水常過期而血色淡者痰多血少也用生地黃加二陳湯經水如黑豆汁者加黃連黃芩經水微少漸漸不通手足痠疼肌膚潮熱脈微數去地黃川芎加澤蘭葉三倍甘草半分經水不通陰虛血少小便澀而身體痛加白朮牛膝牡丹皮桃仁香附經滯不通加桃仁紅花經水適來適斷往來寒熱如瘧者加小柴胡湯血崩有熱加生地黃蒲黃黃芩一方加阿膠艾葉黃芩一方加荊芥穗止血甚妙崩中去血過多血臟虛冷加阿膠艾葉血崩淋漓不斷加炮附子赤石脂赤白帶下加香附官桂一方加香附白芷胎動不安下血加艾葉炒阿膠黃芩妊娠心腹痛加竹茹一塊胎死腹中加交桂白芷麝香産後腹脹加枳殼肉桂産後惡露腹痛不止加桃仁蘇木牛膝産後虛憊血熱煩悶加生地黃産後寒熱往來加柴胡麥門冬産後悶亂加茯苓遠志産後傷風頭痛加石膏甘草産後血痢腹痛加槐子黃連粟殼凡血氣痛加烏藥官桂冷氣痛四肢厥加良薑軍薑玄胡索腹中氣塊加木香血積塊痛加莪朮三稜官桂乾漆炒口乾煩渴加麥門冬乾葛烏梅小便閉澀加澤瀉木通大便閉加桃仁大黃脅肋脹滿加枳實半夏大渴煩躁加人參知母石膏骨蒸勞熱加知母地骨皮柴胡黃芩虛煩不眠加人參竹葉酸棗仁心氣不足恍惚加遠志酸棗仁辰砂另研咳嗽加桑白皮麻黃嘔吐加白朮人參藿香乾薑虛寒滑泄加官桂附子炮血痢加阿膠黃連一方加阿膠艾葉厚朴筋骨肢節疼及頭痛憎寒加羌活防風藁本細辛風寒眩暈加秦艽羌活臍中虛冷腰腹疼痛加玄胡索川楝子目暴赤作翳痛加防風防己龍膽草腹痛加厚朴枳實虛汗加煅牡蠣麻黃根虛勞氣弱咳嗽喘滿加薑製厚朴麩炒枳實調榮順氣湯治婦室經閉不調或前或後心腹疼痛當歸酒洗一錢川芎八分生地一錢白芍鹽水炒一錢香附便制一錢艾葉醋炒一錢丹皮酒洗一錢阿膠蛤粉炒一針白朮一錢二分甘草四分紅花一錢桃仁一錢去皮尖上銼一劑生薑三片水煎食前服腹痛加玄胡索一錢五靈脂八分醋炒沒藥一錢憎寒潮熱加柴胡一錢地骨酒炒一錢清經四物湯治經水不及期而來者及血虛有熱當歸一錢五分川芎五分白芍八分生地黃一錢阿膠炒五分艾葉三分條芩一錢宣黃連姜炒八分黃柏五分知母五分香附一錢甘草三分上銼一劑水煎空心服通經四物湯批按此方治經水不調之劑治經水過期不行者乃血虛有寒當歸一錢半川芎五分熟地一錢白芍一錢紅花三分香附一錢肉桂五分桃仁二十個去皮尖蓬朮一錢蘇木一錢木通八分甘草五分上銼一劑水煎空心服清熱調血湯治經水將來腹中陳陳作痛乍作乍止氣血俱實當歸川芎白芍藥生地黃黃連香附桃仁紅花玄胡索牡丹皮蓬莪朮上一劑水煎溫服有熱加柴胡黃芩順氣散瘀湯治經水行時著氣惱後得心腹腰脅痛不可忍脈弦急不勻乃瘀血作痛也當歸川芎白芍生地桃仁紅花青皮莪朮玄胡索水煎溫服四味調經止血散治婦人月水將來或將盡前後數日腹痛當歸玄胡索沒藥紅花各等分上為末每服二錢醇酒送下加減五積散批按此方治經行前後諸痛之劑治婦人遇經行時沿身疼痛手足麻痹或生寒熱頭痛眼目眩暈此乃觸經感冒依本方去乾薑加羌活牛膝薑蔥煎服咳嗽加杏仁五味子泄瀉去枳殼加肉豆蔻大補經湯治婦人氣血虛弱血海寒冷經水不調或時心腹疼痛或下白帶如魚腦髓或似米泔不分信期每月淋漓不已面色萎黃四肢無力頭目眩暈肌體羸瘦當歸六分酒炒川芎五分白芍酒炒六分熟地黃五分人參三分白朮去蘆四分白茯去皮四分黃耆四分陳皮四分砂仁三分香附六分阿膠蛤粉炒三分沉香另研三分小茴三分玄胡索四分吳茱萸三分肉桂三分粉草三分上銼一劑煎服滋陰百補丸批按此方治經水不調氣血大虛之劑治婦女勞傷氣血諸虛百損五勞七傷陰陽不和乍寒乍熱心腹疼痛不思飲食尫羸乏力香附米一斤去毛四制酒醋鹽湯童便各浸四兩浸三日淘淨各炒乾益母草半斤當歸酒洗六兩川芎四兩玄胡索人參二兩白朮去蘆四兩白芍炒三兩熟地薑汁炒四兩白茯二兩甘草炙一兩上為末煉蜜為丸如梧桐子大每服五六十丸空心砂仁湯或酒或醋湯白滾湯任下艾附暖宮丸治婦人百病南香附子去毛淨一斤分四制酒醋鹽湯童便各浸四兩三日焙乾為細末北艾葉溫水洗淨焙乾研爛篩去灰醋浸炒乾當歸酒洗川芎白芍酒洗熟地各二兩上為末醋糊為丸如梧桐子大每服八十丸淡醋湯下螽斯丸王同知傳批按此方養血順氣調經之劑治婦人赤白帶下經候不調或前或後或行時小腹作痛腿膝麻痹腰腹痛子宮不能攝養生地酒洗四兩熟地酒蒸四兩陳皮一兩白茯苓二兩川芎二兩赤芍二兩香附一斤童便浸春三夏二秋四冬五日當歸酒洗四兩枳殼麩炒二兩黃芩酒炒二兩玄胡索酒炒二兩青皮二兩蘇木一兩紅花一兩五靈脂一兩乾薑炒五錢粉草二錢上為末用艾煎湯入醋一盞打糊為丸如梧桐子大每服四五十丸酒下或白湯空心送下柴胡抑肝散治寡居獨陰無陽欲心萌而多不遂是以惡寒發熱全類瘧者蒼朮泔炒一錢香附一錢川芎七分神麯炒八分梔子炒一錢連翹五分柴胡二錢半青皮炒一錢赤芍二錢半生地五分丹皮一錢半地骨皮一錢甘草一錢上銼一劑水煎空心或食遠溫服抑陰丸治寡婦寒熱如瘧思男子而不得者柴胡五錢黃芩五錢赤芍一錢秦艽三錢生地黃二兩上為末煉蜜為丸如梧桐子大每服三十丸烏梅煎湯送下茯神散治婦人風虛與鬼通妄有所見聞言語錯亂者茯神一錢半茯苓人參石菖蒲各一錢赤芍藥五分上銼一劑水煎食前服治婦人腹中常常作痛上下不定經年積血故也青皮陳皮三稜莪朮香附烏藥乾薑各等分上銼散醋煮焙乾為末空心陳米湯調下治婦人玉戶生瘡作癢不可忍者皆因欲事損元硫黃生礬調水洗三五次杏仁燒灰油調搽虛勞脈氣虛脈細或緩而無力右脈常弱血虛脈大或數而無力右脈常弱陽虛脈遲陰虛脈弦真氣虛脈緊男子久病氣口脈強則生弱則死女人久病人迎脈強則生弱則死經云脈來細而微者氣血俱虛脈小者氣血俱少一說虛勞之脈或浮大或弦數大者勞也弦者亦勞也大者易治血氣未衰可斂而正也弦者難治血氣已耗而難補也若雙弦則賊邪侵脾如數則危殆矣證大抵男子之勞起於傷精女子之勞起於經閉婦女經閉成勞者多由積想思慮在心心傷則血逆竭而月水先閉火既受病不能榮養其子故不嗜食脾虛則金虧故發咳嗽腎水絶則木氣不充故多怒發焦四肢干痿此則傳遍五臟最為難治或者以為血熱而用涼藥解者或有以為血寒而用熱藥通者殊不知經水既少漸至不通手足骨肉煩疼漸至羸瘦漸生潮熱脈來微數此陰血不足陽往乘之水不能勝火以致火炎水涸治當養陰血為上慎勿以藥通之方清肺飲子桑文臺方批按此方清熱止血之劑治婦女虛勞發熱咳嗽吐血先服此清熱止血後服逍遙散加減調理當歸酒洗八分川芎八分白芍酒炒一錢生地酒洗一錢貝母去心八分麥冬去心一錢天冬去心一錢知母蜜炒八分蒲黃炒八分阿膠炒珠八分陳皮八分炒枳殼炒五分前胡一錢黃芩八分薄荷六分藕節十片甘草炙三分上銼一劑水一鍾半煎至一鍾食後徐徐服加減逍遙散治肝脾血虛發熱或潮熱或自汗盜汗或頭痛目澀或怔忡不寧頰赤口乾或月經不調或肚腹作痛或小腹重墜水道澀痛或腫痛出膿內熱作渴當歸酒洗白芍酒炒白朮土炒白茯柴胡各一錢甘草炙五分上銼一劑煨姜一片薄荷少許水煎服如發熱盛加地骨皮知母如手顫掉加防風荊芥薄荷如咳嗽加五味子紫菀如氣惱胸膈痞悶加枳實青皮香附如吐痰加半夏貝母栝蔞仁如飲食不消加山楂神麯如發渴加麥門冬天花粉如胸中作熱加黃連梔子如心慌心跳加酸棗仁遠志肉如久瀉加乾薑炒黑如遍身痛加羌活防風川芎以利關節如吐血加生地阿膠牡丹皮如自汗加黃耆酸棗仁如左腹血塊加三稜莪朮桃仁紅花如右腹氣塊加木香檳榔如怒氣傷肝眼目昏花加龍膽草黃連梔子白豆蔻如經閉不通加桃仁紅花蘇木如小腹痛加玄胡索香附米濟陰至寶丹雲林制治婦人諸虛百損五勞七傷經脈不調肢體羸瘦此藥專調經水滋血脈補虛勞扶元氣健脾胃養心肺潤咽喉清頭目定心悸安神魂退潮熱除骨蒸止喘嗽化痰涎收盜汗止泄瀉開鬱氣利胸膈療腹痛解煩渴散寒熱祛體疼大有奇效不可盡述當歸酒洗一錢白芍酒炒八分白茯去皮八分白朮去蘆一錢陳皮八分知母八分最能瀉虛中之火生用貝母八分去心香附便制八分柴胡酒炒三分薄荷三分地骨皮去皮八分甘草三分麥門冬去心八分上銼一劑用煨生薑三片水煎溫服二分散治婦人室女月事不調寒熱往來痰嗽狀若勞證遷延歲月久不成孕育勻經消痰去熱和表裡養陰陽倍飲食當歸川芎白芍熟地人參白朮白茯甘草柴胡黃芩半夏痰盛加橘皮上銼一劑薑棗煎服百合湯宋柏河傳治婦人血虛勞怯午後發熱夜出盜汗四更汗止熱退咽痛口乾噁心心慌頭痛當歸川芎白芍生地黃桔梗黃芩柴胡地骨皮百合麥門冬黃耆遠志甘草水泡去骨棗仁炒去殼蔓荊子上銼一劑水煎溫服逍遙五黃湯雲林制批按此方治虛勞嗽熱有汗者治婦人午後發熱汗出後熱退當歸酒洗半錢白芍酒洗一錢白朮土炒一錢白茯去皮一錢柴胡酒炒八分薄荷二分生地姜炒一錢黃芩酒炒一錢黃連姜炒一錢黃柏酒炒一錢知母生一錢半黃耆鹽水炒一錢神麯炒八分甘草炙四分香附便制一錢地骨皮酒炒一錢上銼一劑煨姜三片烏梅半個水煎溫服茯苓補心湯治婦人以血旺氣衰為本心生血肝藏血今血衰而氣盛者由心氣虛耗不能生血又不能制乎肺金使肺氣得以乘乎肝木肝之虧損則不能藏漸至枯涸不榮經絡故月事不調矣此藥專補心元之虛抑其肺氣之盛調和營衛滋養血脈其疾自愈兼治去血過多虛勞發熱及吐血衄血咳嗽痰喘上壅胸膈不利當歸川芎白芍酒炒熟地陳皮半夏姜炒白茯去皮桔梗去蘆枳殼麩炒前胡去蘆各一錢乾葛紫蘇各七分人參木香各五分甘草三分上銼一劑薑棗煎服清熱飲西園公制批按此方治虛勞嗽熱無汗者治婦人經閉發熱咳嗽吐血右脅痛紫蘇陳皮桔梗枳殼前胡半夏乾葛赤茯赤芍丹皮生地梔子黃芩甘草血虛加芎歸上銼一劑生薑煎服百補保真丸批按此方治虛勞調理之劑當歸酒洗四兩川芎四兩白芍酒炒四兩熟地酒蒸四兩生地酒洗四兩天冬去心麥冬去心各一兩二錢知母鹽炒二兩白朮土炒四兩陳皮去白二兩香附童便炒四兩上制忌鐵器木臼內杵為末醋糊為丸如梧桐子大每服百丸空心鹽湯送下加味歸脾湯治脾經失血少寐發熱盜汗或思慮傷脾不能攝血以致妄行或健忘怔忡驚悸不寧或心脾傷痛嗜臥少食或憂思傷脾血虛發熱或肢體作痛大便不調或經候不準晡熱內熱或瘰癧流注不能消散潰斂黃耆蜜炙人參白朮炒白茯苓當歸遠志肉酸棗仁炒龍眼肉各一錢木香甘草各五分上銼一劑薑棗煎服一婦人虛勞發熱盜汗咳嗽痰喘面紅經閉不通脈數有力諸醫以滋補百藥纍投並無寸效危篤之甚豫以大黃酒拌九曬九蒸四兩血竭五錢沒藥五錢上為末水丸每服七十丸用四物湯加紅花煎湯送下不二三服前疾悉除經亦通矣一婦人肺熱久嗽身如火炙肌瘦將成肺勞用紫菀款冬花木通枇杷葉杏仁桑白皮大黃減半各如常制上為末蜜煉為丸如櫻桃大食後夜臥各含化一丸經閉證夫經水陰血也屬衝任二脈主上為乳汁下為月水其為患有因脾虛而不能生血者有因脾郁傷而血耗損者有因胃火而血銷爍者有因脾胃損而血少者有因勞傷身而血少者有因怒傷肝而血少者有因腎水不能生肝而血少者有因肺氣虛不能行血而閉者治療之法若脾虛而不能行者調而補之脾鬱而不行者解而補之胃火而不行者清而補之脾胃損而不行者調而補之勞傷心血而不行者靜而補之肺氣虛而不行者補脾胃腎水虛而不行者補腎肝經云損其肺者益其氣損其心者調其榮衛損其脾者調其飲食適其寒溫損其肝者緩其中損其腎者益其精審而治之庶無誤矣丹溪曰經閉不通或因墮胎及多産傷血或因久患潮熱爍血或因久出盜汗耗血或因脾胃不和飲食少進而不生血治宜生血補血除熱調胃之劑隨證用之或因七情傷心心氣留結故血閉而不行宜調心氣通心經使血生而經自行矣治節齊曰經脈不通多有脾胃損傷而致者不可便認作經閉血死輕用通經破血之藥遇有此證便須審其脾胃如何若因飲食勞倦損傷脾胃少食惡食泄瀉疼痛或因誤服汗下攻克之藥傷其中氣以致血少而不行者只宜補養脾胃用白朮茯苓芍藥為臣使以黃耆甘草陳皮麥芽當歸柴胡等藥脾旺則能生血而經自行矣又有飲食積滯致使脾胃者亦宜消積補脾若脾胃無病果有血塊凝結方宜行血通經方通經湯劉近川方當歸川芎白芍生地大黃官桂厚朴枳殼枳實黃芩蘇木紅花烏梅一個生薑三片棗一枚水煎溫服二黃散祕方治婦人室女經脈不通服之如神大黃燒存性生地黃各三錢上為末作一服空心好酒調下通經散方上異人傳斑蝥去頭足大黃酒浸三錢藿香少許上斑蝥量疾遠近輕重用之如一年壯者用七八個每服七八分弱者五六個每服五六分如五六個月壯者五六個每服五六分弱者四五個每服四五分俱為末未服之先以熱水嗽口令淨即食棗三四枚將藥用溫酒一鐘調服再食棗三四枚靜臥勿令人攪擾待腹疼二三陳其經即行如腹不疼再進一服立通忌氣惱生冷油膩後服平胃散以復胃氣也神應丹祕方批按此方治經閉屬實熱者治婦人經脈不行五心煩熱口燥咽乾頰赤心怯潮熱胸膈不利減食多渴咳嗽唾稠痰大黃二兩臘二兩煮乾曬血竭五錢桃仁五錢紅花五錢上為末和勻酒糊為丸如梧桐子大辰砂為衣每服七十丸空心用醇酒送下通經調氣湯治婦人經閉不通併發熱咳嗽當歸酒浸一兩生地酒浸一兩川芎一兩白芍酒浸一兩柴胡八錢香附便制一兩丹皮八錢生芩六錢黃柏炒六錢桃仁一兩知母便炒八錢牛膝酒浸八錢紅花二錢上銼十劑水煎空心一服食遠一服加味八物湯治經閉屬虛熱者即四君合四物加柴胡黃芩小茴香附是也腹痛加玄胡索枳殼乾漆嘔吐噁心加良薑砂仁手足麻痹惡寒加肉桂咳嗽加杏仁五味子款冬花歸末破瘕湯治婦人經水不通腹中積塊疼痛歸尾酒洗一錢赤芍一錢白芍一錢青皮一錢烏藥七分香附醋炒錢半三稜一錢莪朮醋煮一錢官桂五分蘇木五分紅花五分上銼一劑水煎入酒一鍾空心服血竭散祕方治婦人血瘕作痛臍下脹滿月經不行發熱體倦當歸八分桂心六分芍藥炒六分玄胡索炒四分血竭六分蒲黃炒六分上為末每服二錢空心酒調下通經丸治經閉不通及血塊疼痛歸尾棗仁去皮尖大黃煨丹皮乾漆炒煙盡肉桂各一兩三稜五錢莪朮醋炒牛膝各一兩麝香八分上為末皂角五錢芫花二錢水煮糊為丸如梧桐子大每服五十丸米湯送下破血金丹祕方批按此方治經閉腹有血塊者治婦人月經不通腹痛有塊者香附十兩醋製艾葉四兩焙乾當歸二兩酒浸一宿醋煮焙乾紅花一兩焙乾桃仁一兩去皮尖上為末醋糊為丸每服二錢淡醋湯送下早晚各一服經通藥止一醉飲劉桐川傳托盤科根銼一大劑黃酒兩碗煎至一碗空心熱服汗出至足者立愈通經祕方用大船上多年灰條不拘多少用炭火燒通紅淬入好燒酒內取出待乾為末每服三錢好酒調下空心服第二服紅花酒調下第三服大黃酒調下三次要見紅如神芫花散祕方治婦人虛羸有鬼胎癥塊經候不通芫花根三兩炒黃色為末每服一錢桃仁煎湯調下當下惡物神效無極丸批按此方治經閉專治之劑治婦人血塊氣疼有爬床席十指出血錦紋大黃四兩每兩用酒醋童便鹽水各煮七次俱曬乾上合作一處蒸之曬乾又蒸又曬如此七次為末用當歸熟地各一兩半濃煎汁一碗煮糊為丸如梧桐子大每遇心疼氣痛用小茴香炒研七分煎湯送下三十丸有塊者一月之內下小小血粒自此除根不痛經脈不行紅花湯下崩漏脈洪數而疾漏下血赤白日下數升脈急疾者死遲者生緊大者死虛小者生證崩之為病乃血大下豈可為寒但血去後其人必虛當大補氣血為主東垣專主於寒而不言熱者亦間而有之但不知熱之多也丹溪曰有虛有熱虛則不溜熱則流通內經曰陰虛陽搏謂之崩崩漏之疾亦有陰陽若婦人年五十後經止數年矣忽經又行兼腹痛或身熱口渴者曰崩陰證也若婦人年三四十後經行三十日湧暴不止者陽證也曰漏治若崩漏初不問虛實先用四物湯加荊芥穗燈上燒防風升麻煎服如不止加蒲黃炒白朮升麻並諸止血藥止之一婦人血崩年四十以上悲哀太甚則心系急肺布葉舉而上焦不通熱氣在中故血走而崩面黃肌瘦慎不可服熱燥之藥蓋血熱而流行先以黃連解毒湯後以涼膈散合四物湯調治最效西園公治一婦人年六十二歲患血崩不止以黃連解毒湯四帖後服涼膈散合四物湯六帖即愈姑記以廣其傳方二聖湯劉嵩皋傳治血山崩如神何首烏切五錢甘草三錢用黃酒一碗煎至八分取出入刺刺芽汁一盞同服立效天靈散祕方治經血不止神效天靈蓋燒灰每服二錢黃酒調服立止黑龍丸祕方專治血崩如神及經水過多不止者尤效黑驢糞燒灰存性為末用麵糊為丸每服七十丸空心黃酒送下斷源散胡云閣傳批按此方專治血崩如神治血崩如泉流不止棉花子銅器炒煙盡為末每服二錢空心黃酒調下荊芥四物湯治崩漏初起不問虛實服之立止荊芥條芩當歸川芎白芍生地香附一方加艾葉炒阿膠炒去香附荊芥上銼水煎溫服如不止加防風升麻蒲黃炒白朮西園公加地榆良驗膠艾四物湯治血崩阿膠蛤粉炒珠艾葉醋炒當歸川芎白芍熟地蒲黃炒黃連黃芩生地梔子地榆白朮甘草上銼水煎空心服子芩丸治婦人四十九歲以後天癸當住每月卻行或過多不止條芩四兩醋浸紙裹煨七次當歸二兩酒洗加香附醋製二兩尤妙上為末醋糊為丸如梧桐子大每服五七十丸空心霹靂酒下日進三服當歸龍骨丸批按此方治血崩屬虛熱者治月事失常經水過多不止及帶下淋漓無問新久赤白諸證並孕婦惡露胎動不要及産後惡物不止或大人小兒泄瀉並治當歸白芍白茯黃連各五錢黃柏二兩龍骨一兩槐子五錢艾葉五錢炒木香二錢半西園公加黃芩白朮各五錢纍效丁香膠艾湯批按此方治血崩屬虛寒者治崩漏不止蓋心氣不足勞役及飲食不節所得其脈兩尺俱弦洪按之無力其證自覺臍下如冰求厚衣被以御其寒白帶白滑之物多間有如屋漏水時下鮮血右尺脈時微洪也四物湯加丁香阿膠艾葉煎空心熱服凡血崩乃經脈錯亂不循故道淖溢妄行一二日不止便有積淤之血凝成窠臼更藥澀住轉見增劇宜以五積散加防風荊芥再加醋煎投一二服次進獨行散以霹靂酒下二三服即止如不止再以諸止血藥治之帶下脈婦人帶下六極之病脈浮則為腸鳴腹滿緊則為腹中痛數則陰中癢痛生瘡弦則陰戶掣痛凡漏下赤白不止脈小虛滑者生實大緊數者死證帶下者榮衛滯氣之所成也經分赤白之殊感病有深淺之異所以男子遺精白濁女子帶下白淫赤屬榮白屬衛此病之常言也皆因喜怒憂思素有濕熱産育房勞傷於榮衛包絡使濁氣滲入膀胱故流穢物或如白涕或如紅津或黃如爛瓜或青如泥澤或黑如衃血皆合五臟之色也輕則來而不來重則來而無度下流不止面色無光使腰腿痠疼或便血淋瀝以致飲食減常精神短少皆帶下之所致也世俗皆行溫補燥熱澀劑從而效者或有因而延綿者止知下焦白帶之虛寒凝結濁物故為之帶下熱氣熏蒸則為腥腐之氣安獨言其虛寒者乎治治之當清上實下清濁自分理脾養血濕熱自解更能清心薄滋味然後溫補下元帶自除矣一云帶下是胃中痰積流下滲入膀胱當升之二陳湯加蒼朮白朮柴胡升麻甚者以吐法以提其氣一用二陳湯加二術以燥濕痰方清白散治白帶當歸川芎白芍炒生地酒洗過薑汁炒黃柏鹽水炒貝母樗根白皮酒炒各等分乾薑炒黑甘草各減半上銼一劑生薑煎服肥人多濕痰加白朮半夏赤帶加酒芩荊芥久下加熟地牡蠣氣虛加人參黃耆腰腿痛加鹿角膠或只以二陳湯加蒼朮白朮氣虛加人參血虛加芎歸升膀胱之濕二陳加升麻柴胡蒼朮白朮解帶散治婦人血氣不調濕熱白帶四肢倦怠五心煩熱痰鬱嘈雜歸身一錢半川芎八分白芍酒炒白朮炒各一錢二分蒼朮米泔浸炒香附醋炒丹皮酒洗茯苓去皮各一錢陳皮去白一錢玄胡炒八分甘草炙四分上銼一劑生薑煎空心服八妙丸治經脈不調濕氣白帶腹痛胃弱香附便制丹皮川芎酒炒玄胡索炒各二兩歸身酒洗生地薑汁炒白茯各二兩赤芍藥酒炒兩半上為細末酒糊為丸如緑豆大每五十丸空心滾水下腹痛酒下七十丸固經丸治赤白帶下屬濕熱者苦參五錢黃柏一兩炒梔子二兩炒香附一兩炒貝母二錢白朮七錢白芍七錢半山茱萸去核五錢乾薑二錢炒龜甲二兩酒炒樗根白皮五錢酒炒上為末酒糊為丸如梧桐子大每服八十丸空心滾水送下玉仙散祕方治赤白帶下屬寒者乾薑炒一兩香附炒一兩白芍炒一兩甘草生五錢上為末每服三錢空心黃酒送下朝元散雲林制治赤白帶下腹臍冷痛子宮虛寒白芷陳皮厚朴枳殼桔梗川芎白芍當歸茯苓蒼朮半夏乾薑官桂香附吳茱萸小茴香甘草上銼一劑生薑三片棗一枚水煎空心服一方加乳香沒藥各二錢半烏藥一兩酒煎入米糖一斤早晚隨量飲酒大效大溫經湯治婦人經水不調赤白帶下或如梅汁淋瀝或成片有隔兩三個月者此氣血虛弱漸生潮熱飲食少進四肢倦怠日久生骨蒸即成勞疾急當調經活血退虛熱先服加味八物湯後服此藥當歸八分白芍七分川芎五分熟地五分人參白朮土炒茯苓各五分甘草三分香附八分便制陳皮炒砂仁炒小茴各四分沉香三分另研吳茱萸炮玄胡索炒鹿茸酒炙各五分上銼一劑生薑煎服汗出不止加黃耆酸棗仁炒各四分潮熱加柴胡黃芩各五分咳嗽加杏仁桔梗五味子半夏四神丸賈蘭峰傳治白帶香附米八兩酒醋童便各浸二兩浸三日炒砂仁二兩炒蒼朮二兩米泔水浸牡蠣粉炒椿根白皮二兩蜜水炒上為末黃米煮飯為丸如梧子大每服五六十丸空心黃酒送下二氣丹丁平溪傳治赤白帶下舶上硫黃溶化傾入水中如此七次一兩硃砂一兩官桂一兩乾薑一兩炮大附子麵包煨去皮五錢鹿茸二兩酥炙麝香一錢上為末醋糊為丸如梧桐子大每服三十丸空心鹽湯送下如虛勞發熱先以四物湯四錢小柴胡湯六錢合和煎服後用十全大補湯烏雞丸京師傳治下焦虛寒赤白帶下臍腹冷痛烏雞一隻不刀血去毛用醋五大碗煮熱火煅存性成灰為末香附米十兩酒浸旬日用醋煮焙乾烏藥二兩淨艾二兩醋浸炒白米飯少許入杵臼內搗成餅火上炙令乾當歸三兩醋洗川芎白芍熟地各一兩小茴三兩醋炒山藥牡蠣各二兩破故紙醋炒五錢良薑五錢白姜一兩半丁香一兩不見火如赤白帶下不止加龍骨一兩五倍子一兩半上為末飯丸如梧子大每服五十丸空心醋湯下一婦人赤白帶下上熱下寒口出惡氣咽乾牙痛耳鳴上下流注疼痛發熱憎寒口吐酸水嘈雜噁心心腹氣痛時下五色相雜來而無度面黃肌瘦不思飲食當歸川芎赤芍生地陳皮半夏姜炒茯苓蒼朮米泔浸炒香附童便浸炒黃芩酒炒柴胡升麻丹皮甘草加地榆尤良上銼生薑煎服求嗣期嗣保胎論人生天地間莫不各具一太極也太極動而生陽靜而生陰乾道成男坤道成女父精母血陰陽奇偶之道也故精充則盛滿則溢此消長之道也結胎者男女精血也男屬陽而象乾女屬陰而象坤坤道資生陽主動故能施與陰主靜故能承受夫動靜相參陰陽相會必有其時乃能成胎孕人欲求嗣必先視經脈調否其或未調必用藥而調之經脈既調宜以人事副之庶不失其候也訣云三十時中兩日半二十八九君須算落紅滿地是佳期經水過期空霍亂霍亂之時枉費功樹頭樹里覓殘紅但解開花能結子何愁丹桂不成叢此蓋月經才絶金水方生斯時子宮正開乃受精結胎之候妙合太和之時過此佳期則子宮閉而不受胎矣然男女之分各有要妙存焉如月經盡一日至三日新血未盛精勝其血感者成男四日至六日新血漸長血勝其精感者成女又云陰血先至陽精後沖血開裹精精入為骨陰外陽內則成坎卦之象而男形斯成若陽精先入陰血後參精開裹血血入居本陰內陽外則成離卦之象而女形斯成蓋夫婦交合須擇旺相之日如春甲乙寅卯夏丙丁己午秋庚辛申酉冬壬癸亥子四季辰戌丑未之日須令女人興動於中陰陽和平精血調暢夜半之後生氣之時交而必孕孕而必育育而子堅壯且能賢明而福壽也大凡交會之際男女毋暴怒毋醉飽毋食炙爆辛熱毋用他術助長更忌朔望弦晦風雨雷電日月無光虹霓鬥動星辰之下神廟之中井灶尸柩之旁切不可交合受胎亦不吉也慎之慎之凡婦受妊之後常樂意忘憂運動血氣安養胎元早絶去嗜欲節調飲食內遠七情外避六淫性宜靜而不宜燥體宜動而不宜逸味宜涼而不宜熱食宜暖而不宜寒毋久立毋久坐毋久行毋久臥又宜卻去一切肥甘煎炙油膩辛辣酸鹹水果魚鱉狐兔鴿雀之類即無胎漏胎痛胎動下血子腫子癇等證及橫産逆産胎死腹中之患降生之後又無胎熱胎寒胎肥胎怯胎驚胎黃諸般胎毒之證矣其為妊婦苟不如法未産則胎動不常既産則胎毒不已百病由是而生焉先正所謂古者婦人妊人寢不側坐不偏立不蹕不食邪味割不正不食席不正不坐目不視邪色耳不聽淫聲口不出傲言夜則令瞽誦詩道正事生又則形容端正才過人矣斯言決有旨哉故古人多壽考兒少夭折者即此之由也嘗見今有稟性溫良之婦有妊不嗜欲於口生子少病而痘瘡亦稀亦可為師法矣今之妊婦可不慎諸治婦人孕育子嗣全在調經理脾血氣充旺調其經候去其嫉妒再服孕子方自然成孕肥盛婦人不能孕育者以其身中脂膜閉塞子宮而致經事不能行可用導痰之劑瘦怯婦人不孕育者以其子宮無血精氣不聚故也可用四物湯養血氣等藥方調經種玉湯姚少參方凡婦人無子多因七情所傷致使血衰氣盛經水不調或前或後或多或少或色淡如水或紫如血塊或崩漏帶下或肚腹疼痛或子宮虛冷不能受孕宜進此藥而效可通神歸身酒洗四錢南芎四錢白芍二錢熟地黃酒洗六錢白茯去皮三錢陳皮三錢香附炒三錢吳茱萸炒四錢官桂二錢乾薑炮三錢丹皮三錢玄胡索三錢熟艾二錢若過期而經水色淡者加桂薑艾如先期三五日色紫者不必加減上銼四劑生薑三片水一碗半煎一碗空心溫服渣再煎待經至之日服起一日一劑藥盡則當交媾必成孕矣縱不成孕經當對期此方屢試屢驗百發百中不可輕忽先天歸一湯王兵憲方人參八錢白朮一兩麩炒白茯去皮一兩甘草四錢川芎一兩當歸一兩二錢生地酒洗一兩白芍八錢砂仁七錢炒香附七錢陳皮六錢牛膝八錢酒炒半夏七錢湯泡丹皮七錢去骨上十四味均作十劑生薑三片水二鍾空心服渣再煎臨臥時經未行先服五劑後服五劑此藥盡即效如無他病只照本方服之如有他病宜照後加減服之經調脈和即當妊孕如婦人子宮久冷不孕加乾薑肉桂各五錢何以知其冷丈夫交會之際當自覺之如冷甚灸丹田七壯神效穴在臍下三寸如婦人子宮太熱則傷胎加黃柏知母柴胡各六錢何以知其熱亦丈夫當自覺之也如白帶白淫白濁時下俗云下寒非寒也乃婦人素虛濁氣下陷故也故有痰者亦然加白芷一兩升麻五錢或倍半夏如不能服藥灸中極七壯極效穴在臍下四寸氣不流通者加木香三錢如平素虛勞盜汗或惡寒發熱加黃耆肉桂咳嗽加阿膠貝母各四錢勞熱血枯加柴胡鱉甲勞甚腰背疼者灸膏肓二穴各七壯如飲食減少倍白朮陳皮加厚朴神麯炒各五錢肥人痰盛迷塞子宮加南星三稜各六錢如經水將行小腹作痛者有瘀血也加桃仁紅花各四錢如未效去人參加五靈脂六錢半炒半生用乳香三錢如腰腿痛者加杜仲一兩二錢羌活三錢桃仁四錢經行後作疼者虛也加熟地黃六錢當歸八錢五味子三錢腹脅有痞者去牛膝加三稜莪朮各六錢桃仁枳實各五錢前五劑加檳榔五錢腹有鬼胎者狀如懷胎非真胎因氣裹精而結無血也宜用桃仁乾漆肉桂麝香水銀之類丸藥以去之然後再服歸一湯以候經調仍然有子經水前期而至者加黃芩五錢炒蒲黃五錢經水過期而至加乾薑牡丹皮各五錢經水崩漏不止加蓮蓬殼灰五錢白芷八錢豬骨頭灰六錢熟艾三錢黃芩五錢平日有風寒濕氣疼痛加秦艽三錢羌活七錢乳香沒藥各五錢或加蒼朮有熱疼痛加黃柏心腹疼痛者加大腹皮木香各三錢檳榔五錢小便澀少不通加豬苓澤瀉亦不宜多服恐泄腎氣室女經脈澀滯不通者謂之天癸不調也前方內加劉寄奴六錢不應加衛茅三錢神效即鬼剪羽神仙附益丹徐憲副傳香附米一斤用童便浸透取出水洗淨烘乾為末再用香附四兩北艾一兩煮汁三分醋七分將前二味和合為丸如桐子大每服五七十丸空心臨臥淡醋湯送下不惟治婦人百病而生育之功效如神也濟陰丸京師傳常服順氣養血調經脈除白帶益子宮育胎孕香附米四兩一分醋浸一分米泔浸一分酒浸一分童便浸各浸三日焙乾為末益母草二兩忌鐵器艾葉一兩醋煮阿膠二兩蛤粉炒熟地黃二兩酒洗過薑汁炒川芎一兩當歸一兩五錢酒洗白芍藥一兩三錢鹽酒炒陳皮一兩去皮白朮一兩五錢土炒半夏湯泡薑汁浸香油炒白茯一兩去皮甘草炙三錢條芩一兩炒焦丹皮一兩酒洗吳茱萸五錢湯泡玄胡索四錢小茴鹽酒炒沒藥各五錢續斷一兩酒洗麥門冬一兩去心上為細末酒糊為丸如梧桐子大每服一百丸空心米湯送下溫酒白水亦可六味地黃丸加童便炒香附治婦人久無孕育者效如影響調經湯治月經不調者先用此方後經勻服孕子方抑氣湯效香附便制四兩甘草炙一兩茯神一兩五錢陳皮泡去白炒二兩上為末每服二錢空心用滾湯調下助陰孕子丸治女人欲子當抑氣以滋榮和平而去妒況女人性偏古人多用熱藥生子多夭近時氣運多熱惟清溫生血理脾之劑服之生子無病多壽山茱萸酒浸去核取肉二兩五錢當歸酒洗一兩熟地酒蒸二兩蛇床子炒去殼取淨肉二兩五錢川芎酒洗一兩白芍酒炒一兩子實黃芩酒炒二兩五錢丹參酒洗一兩白朮炒一兩五錢真阿膠蛤粉炒成珠五錢小茴炒一兩陳皮炒一兩縮砂仁去殼炒五錢香附米童便浸四兩炒乾微黑桑寄生真者五錢玄胡索炒七錢如素有熱加軟柴胡地骨皮芩連酒炒各七錢白帶加蒼朮米泔浸去皮鹽水炒一兩五錢柴胡酒炒五錢肥盛婦人乃脂滿子宮加半夏南星薑汁礬水煮各一兩上為末酒煮山藥粉糊為丸每日空心酒下一百丸或清米湯下金蓮種子丹人參三錢五味子三錢白芨一兩吳茱萸一兩細辛五錢白茯苓一兩牛膝二兩石乳香三錢菖蒲一錢當歸三錢酒浸厚朴一兩羌活三錢上為末以棗肉為丸梧子大每服十五丸無灰酒送下日進三服早寅中午晚酉時面朝東吞以壬子日服起有孕婦服之成雙胎二益丹毛惟中傳治婦人帶下暖子宮種玉木香丁香沉香麝香砂仁肉果草果吳茱萸官桂桂心肉桂潮腦當歸南星附子川椒血竭川烏草烏硫黃甘松三奈上各等分為末煉蜜為丸金箔為衣如棉花子大每一丸送至陰內行房後用之種子一月見效灸法治女人無孕或經生子後久不成孕及懷孕不成用稈一條長用十四寸令女人仰臥舒手足以所量稈心自臍心直垂下盡頭處以墨點記後以此稈心平折橫安前點處兩點盡處是穴按之自有動脈應手各灸三七壯炷如箸頭大神驗即胞門子戶穴也
