body:
  text: 卷之十心痛脈沉弦細動皆是痛證心痛在寸腹痛在關下部在尺脈象顯然堅實不大便者下之痛甚者脈必伏陽微陰弦短而澀者皆心痛也脈沉細而遲者易治浮大弦長皆難治病夫心痛者即胃脘痛也其種有九曰飲曰食曰風曰冷曰熱曰悸曰蟲曰疰曰去來痛名雖不同未有不由清痰食積鬱於中七情九氣觸於內之所致也治法須分新久若明知身受寒氣口得寒物而病於初傳之時當以溫散或溫利之藥若得稍久則成郁矣鬱則成熱又當以溫散藥內加苦寒之藥溫治其標寒治其本也由是古方多用山梔為君熱藥為之嚮導則邪易伏而病易安若縱恣口腹不謹調食則病復作必難治也此病日久不食亦不死若痛方止便吃還痛必須三五服藥後漸而少食庶獲痊愈其有真心痛者因太陽觸犯心君或汙血衝心而痛極手足青過節者旦發而夕死非藥所能治也治諸痛不可用補氣氣旺不通而痛愈甚故云通則不痛痛則不通也一凡痛在心連兩脅至兩乳下牽引背板匙骨下而痛者實熱也一凡痛在小腹連臍左右上下㽱痛手足厥冷者虛寒也一凡心痛以物拄按則痛止者挾虛也以二陳湯加炒乾薑和之一凡心痛因平日喜食熱物所以致流於胃口作疼痛用桃仁承氣湯下之若輕者用韭汁桔梗能提氣血藥中兼用之一凡心膈大痛攻走腰背發厥嘔吐諸藥不效者就吐中以鵝翎探之出痰積碗許而痛即止一蟲痛者必面上白斑唇紅又痛後便能食時作時止是也用二陳湯加苦楝根皮煎服上半月蟲頭向上易治下半月蟲頭向下難治或曰痛而久臥不安自按心腹時大叫或青或黃唇緩目無精光者蟲痛也又曰腹痛肚大青筋者取蟲丸主之一心痛卒急無藥以鹽置刀頭燒紅淬入水中乘熱飲之吐痰而愈此法治攪腸痧大痛已死者立效謹按痛則不通通則不痛夫胃脘心脾痛者或因身受寒邪口食冷物內有鬱熱素有頑痰死血或因惱怒氣滯蟲動作痛種種不同若不分而治之何能愈乎余曰是寒則溫之是熱則清之是痰則化之是血則散之是氣則順之是蟲則殺之庶乎臨證不眩惑矣方清熱解鬱湯西園公方治心痛即胃脘痛一服即止山梔仁炒黑一錢半枳殼麵炒一錢西芎一錢黃連炒七分陳皮五分蒼朮米泔浸七分香附一錢乾薑炒黑五分甘草五分上銼一劑生薑三片水煎熱服服後戒飯食大半日渣再煎服倉卒散祕方山梔仁炒黑五錢上銼一劑生薑三片煎服一方加川芎一錢尤妙一方單用梔子炒為末每服二三匙心痛腹痛薑湯調下痢作肚痛黃酒調下四肢浮腫米飲調下小便淋瀝白湯調下平氣散劉孟門傳治心痛蒼朮一錢五分梔子一錢五分當歸一錢青皮一錢陳皮一錢枳殼一錢木香一錢臨熟時入木香再煎甘草三分上銼一劑生薑三片水一大碗煎至七分通口服清郁散批按此方治心胃鬱火作痛調和之劑治胃中有伏火膈上有稠痰胃口作痛及噁心嘔吐清水或作酸水醋心煩悶陳皮一錢半夏一錢香油炒白伏苓一錢蒼朮一錢米泔浸炒川芎六分乾薑五分炒黑香附童便炒一錢神麯炒一錢黃連薑汁炒一錢梔子薑汁炒一錢甘草三分上銼一劑生薑三片煎服嘔吐甚加藿香四分砂仁四分此方為丸服亦妙宣氣散嚴發十傳治心胃刺痛牽引胸膈疼痛內有實熱脈數有力者梔子仁鹽酒炒滑石大黃木香上先將梔子以生薑煎湯余藥入湯內濃磨溫服在上必吐痰在下必瀉其痛立止外以蘿蔔子炒絹包頻尉痛處利氣丸方見諸氣門治心胃氣滯食積鬱熱作痛加減柴胡湯西園公制治實熱湊上心腹作痛發熱不止柴胡一兩黃芩七錢半半夏七錢半枳殼一兩赤芍一兩山梔子去殼四兩半生半炒上銼一劑生薑三片煎服利氣保安湯西園公制批按此方治心胃實熱作痛清熱之劑治氣痛已服通利之藥下後餘熱作痛或痛在小腹者柴胡青皮枳殼香附鬱金木通赤芍山梔仁各等分炒四聖散段千戶傳治心痛肚腹痛陰證絞腸痧神效五靈脂炒出煙桃仁麵炒黃色去皮尖草烏水泡一日一換浸七日去皮尖切作片用新瓦焙乾各用一兩青黛二錢入藥八錢為末上為末酒糊為丸如梧桐子大每服十五丸或十七丸用艾葉七片炒出煙陳酒一鍾入鍋去艾溫艾湯送下一用倉卒散治氣自腰腹間攻心痛不可忍腹中冰冷自汗如洗手足攣急厥冷山梔子大者四十九個連皮搗爛炒大附子一枚泡去皮上為末每服二錢酒煎八分溫服丁胡三建湯批按此方治心胃冷氣作痛辛溫之劑治冷心疼面青唇黑手足厥冷丁香良薑官桂各一錢五分上銼一劑水一碗煎七分用胡椒五十粒炒黃色為末調入湯藥內頓服救急奇方治男婦心疼禁了牙關欲死者隔年老蔥白三五根去皮須葉搗成膏將病人斡開口用銅匙將膏送入喉中用香油四兩灌送但得蔥膏下喉少時將腹中所停蟲病等物化為黃水微利為佳永不再發追蟲丸治蟲咬心痛乾漆五錢炒去煙雄黃二錢五分巴豆霜一錢上為末麵糊為丸如黍米大每服十二三丸有子苦楝根皮煎湯送下小金丹批按此方治心胃蟲攻作痛追逐之劑治蟲之作痛時痛時止痛則攻心口吐清水人中鼻唇一時青黑者是雄黃一錢薑黃一錢巴豆去油一錢三奈一錢丁香二十五個人言三分上為末用紅棗煮熟去核為丸如粟米六每服四五丸五六歲兒用六七丸或八九丸艾葉煎湯入醋少許不拘時送下心紅散徐薊川傳治心痛氣痛及治孕婦心疼銀硃雞糞炒焦乾為末上二味各等分和一處每服一錢熟黃酒調服即出冷汗立止治一切心腹胸腰背疼痛和錐刺祕方花椒為細末醋和為餅貼痛處上用艾搗爛鋪上發火燒艾痛即止加味枳朮丸治清痰酒積食積茶積肉積在胃脘當心而痛及痞滿噁心嘈雜噯氣吞酸嘔吐脾痰等證其效如神白朮三兩枳實麵炒黃色蒼朮米泔浸三宿焙豬苓去黑皮川芎麥蘖面炒黃色神麯炒微色半夏湯泡透各一兩澤瀉去毛赤茯苓去皮黃連陳壁土炒白螺螄殼炮各七錢縮砂仁草豆蔻黃芩陳壁土炒青皮去白萊蔔子炒乾生薑各五錢陳皮栝蔞子香附子童便炒厚朴薑汁製炒檳榔各三錢木香二錢甘草二錢吞酸加吳茱萸湯泡寒月五錢熱月二錢五分久病挾虛加人參白扁豆石肉各五錢時常口吐清水加炒滑石一兩牡蠣五錢上為細末用青荷葉泡湯浸晚粳米研粉作糊為丸如梧桐子大每服七十丸多至一百丸清米飲送下腹痛脈心腹痛不得息脈細小遲者生脈大而急者死腹痛脈反浮大而長者死臍下忽大痛人中黑者皆死尺脈弦則腹痛病凡腹痛有寒有熱有死血有食積有濕痰有虛有實若綿綿痛而無增減者是寒也時痛時止者熱也每痛有處不行移者死血也痛甚欲大便利後痛減者食積也痛而小便不利者濕痰也經云腹滿按之不痛為虛按之痛者為實凡腹中痛甚飲涼水一盞其痛稍可者屬熱痛當用涼藥清之清之不已而或繞臍硬痛大便閉實煩渴用涼藥下之利氣丸之類若飲水愈加作痛屬寒痛用溫藥和之和之不已而或四肢厥冷腹痛嘔吐瀉痢急服熱藥救之附子理中湯之類須詳脈力有無腹痛氣用氣藥如木香檳榔香附枳殼之類血用血藥如當歸川芎桃仁紅花之類如腹中常覺有熱而暴痛暴止者此為積熱宜調胃承氣湯下之如腹痛全不思飲食其人本體素弱而復冷痛者以人參養胃湯加肉桂木香吳茱萸或理中湯加良薑吳茱萸如飲食過傷而腹痛者宜利氣丸下之並食鬱氣滯作痛凡人腹痛至於腹中有塊起急以手按之便不見五更心嘈牙關矯硬噁心而清水出及夢中齧齒者此謂之蟲痛宜服化蟲丸加使君子方開鬱導氣湯西園公制批按此方治腹痛有熱者並一切腹痛之總司也治諸般肚腹疼痛一服立止蒼朮米泔浸製一錢陳皮五分香附童便浸炒一錢白芷一錢川芎一錢茯苓一錢乾薑炒五分滑石一錢山梔子炒一錢神麯炒一錢甘草少許上銼一劑水煎溫服行氣香蘇飲批按此方治腹痛有寒者治因氣惱或感寒或傷食一切肚腹疼痛方見傷食四合飲雲林制批按此方治痰積而氣滯而腹痛者陳皮半夏茯苓紫蘇厚朴香附枳殼鬱金甘草各等分上銼一劑生薑煎服消瘀飲祕方批按此方治瘀血而腹痛者當歸芍藥生地黃桃仁紅花蘇木大黃三錢芒硝三錢甘草上銼一劑水一鍾半煎至八分入大黃煎再入芒硝溫服肚腹疼痛如錐剜不可忍者用白芍黃連甘草各三錢金華酒一鍾水一鍾煎服腰痛脈腰痛之脈皆沉弦沉弦而緊者為寒沉弦而浮者為風沉弦而濡細者為濕沉弦而澀者為閃挫澀者惡血大者腎虛滑者浮者是痰也病夫腰者腎之外候一身所恃以轉移闔闢者蓋諸經皆貫於腎而絡於腰脊腎氣一虛腰必痛矣腰痛有五所感不同一曰陽氣不足少陰腎衰是以腰痛二曰風痹風寒濕著腰而痛三曰腎虛勞役傷腎而痛四曰墜墮險地傷腰而痛五曰寢臥濕地而痛又有三因而分之蓋太陽少陰多中寒少陽厥陰多中風陽明太陰多中濕此六經腰痛者為外因也若失志傷腎鬱怒傷肝憂思傷脾若此腰痛為內因也墜墮險地傷腰而痛為不內不外當以五種三因而推之不過從其所由汗下補瀉之法以療之風則散之寒則溫之濕則燥之熱則清之氣則順之血則和之此治之法也治因寒而痛見熱則減遇寒愈增宜五積散每服加茱萸五分一因風傷腎而痛者或左或右痛無常處引兩足五積散加防風全蠍一因濕而痛者遇天陰或久坐而發蓋腎屬水久坐濕地或為雨露所著濕流入腎以致腰痛宜滲濕湯或腎著湯一因濕熱宜操濕行氣用蒼朮黃柏杜仲川芎之類或當歸拈痛湯一因挫閃勞役而痛者五積散加黑牽牛一錢桃仁炒九枚陳酒煎服神效一因瘀血而痛者日輕夜重宜行血順氣丹溪補陰丸加桃仁紅花外用三稜針於委中穴出血以其血滯於下也一瘀血在足太陽足太陰足少陽三經腰痛宜川芎肉桂湯一瘀血腰痛以四物湯加桃仁紅花酒蘇木一因痰而痛者宜南星半夏加快氣之藥佐之使痰隨氣運一因腎虛者痛之不已用安腎主之一腎著為病體重腰冷如水飲食如故小便自利腰以下冷痛如帶五千錢治宜流濕兼溫散腎著湯主之一腰軟者腎肝伏熱治用黃柏防己一因氣滯而痛或俯仰挫閃宜烏藥順氣散加炒桃仁酒煎服一因腎氣虛弱為濕所乘流注腰膝或攣拳掣痛不可屈伸或緩弱冷痹行步無力以獨活寄生湯主之方補腎湯西園公制治一切腰痛破故紙酒炒小茴鹽酒炒玄胡索牛膝去蘆酒洗當歸杜仲酒炒黃柏酒炒知母酒炒上銼一劑生薑煎服屠尚書方治腰痛破故紙五錢杜仲酒炒一兩巴戟五錢淨葫巴戟五錢當歸五錢桃仁四十九個上銼一劑酒煎入乳香沒藥各三錢調熱服壯本丹祕方治腎虛腰痛久則寒冷此藥壯筋骨補元陽利大小養丹田治腰痛之妙劑杜仲酒炒一兩肉蓯蓉酒洗五錢巴戟酒浸去骨五錢破故紙鹽水炒一兩茴香一兩青鹽五錢上為末將豬腰子分開入藥在內縫住紙包煨熟每一個一服用黃酒送下加味青莪丸批按此方治腎虛腰痛之劑治腎虛腰痛或風寒乘之血氣相搏為痛杜仲薑汁浸炒十二個破故紙水淘十二兩芝麻同炒變色去芝麻瓦上焙乾為末沉香六兩胡桃去皮膈另研六兩黃沒藥另研乳香另研各六兩上為末用肉蓯蓉十二兩酒浸成膏和劑搗千餘杵丸如梧桐子大每服三十丸空心溫酒或鹽湯任下立安散批按此方治閃挫腰痛之劑治氣滯腰痛並閃挫腰痛腎虛腰痛當歸一兩官桂一兩玄胡索炒一兩杜仲薑炒一兩小茴炒一兩木香五錢牽牛一錢半生半熟上為末每服二匙空心陳酒調下一方去牽牛以酒煎服川芎肉桂湯批按此方治寒濕腰痛之劑治露宿寒濕之地腰痛不能轉側兩脅搐急作痛當歸尾一錢川芎一錢桃仁五個去皮尖研肉桂一錢防己三分蒼朮一錢羌活一錢半獨活五分柴胡一錢防風三分神麯五分炒甘草炙一錢上銼一劑陳酒煎食遠稍熱服追風通氣散方見癰疽治經年腰痛以本方加川萆薢玄胡索陳酒煎服脅痛脈脈雙弦者肝氣有餘兩脅作痛病夫脅痛者厥陰肝經為病也其病自兩脅下痛引小腹亦當視內外所感之邪而治之若因暴怒傷觸悲哀氣結飲食過度冷熱失調顛仆傷形或痰積流注於血與血相搏皆能為痛此內因也若傷寒少陽耳聾脅痛風寒所襲而為脅痛此外因也治之當以散結順氣化痰和血為主平其肝而導其氣則無有不愈矣治脅痛者肝火盛木氣實也有死血有痰流注有肝急者一木氣實用蒼朮川芎青皮柴胡芍藥甘草水煎服一痛甚者肝火盛以當歸龍薈丸薑湯下瀉肝火之要藥也一死血作痛用桃仁去皮留尖紅花酒拌焙乾川芎香附童便浸青皮水煎服一肝苦急食辛以散之川芎蒼朮血病入血藥中苦者惡也嫌也或小柴胡湯亦效一凡脅痛皆是肝木有餘也用小柴胡湯加青皮川芎芍藥龍膽草一凡脅痛用青皮必須用醋炒過一凡瘀血作痛用小柴胡湯合四物湯加桃仁紅花乳香沒藥煎服痛甚而元氣實者桃仁承氣湯下之方枳殼散治脅間如物刺是氣實也枳殼麵炒黃一兩五錢甘草炙七錢五分上為末每二錢濃煎蔥白湯下不拘時服當歸龍薈丸治瀉肝火盛之要藥因內有濕熱兩脅痛甚伐肝木之氣當歸龍膽草山梔子黃連大黃酒濕火煨蘆薈青黛各五錢木香二錢五分麝香五分另研加柴胡五錢青皮一錢上為細末神麯為丸如梧桐子大每服二十丸薑湯下治婦人脅痛香附子四兩醋一碗鹽一兩煮乾白芍藥二兩肉桂二兩玄胡索炒二兩上為末每服三錢空心滾湯調治諸痛尉法韭菜根搗爛醋拌炒絹包尉痛處臂痛病臂為風寒濕所搏或睡後手在被外為寒邪所襲遂令臂痛及乳婦以臂枕兒傷於風寒而致臂痛者悉依後三方內選用一有血虛作臂痛者蓋血不榮於筋故也一因濕臂痛蠲痹湯加蒼朮酒防己一因痰飲流入四肢令人肩背痠痛兩手軟痹導痰湯加木香薑黃方五積散方見中寒治臂痛因於寒者烏藥順氣散方見中風治臂痛因於氣者蠲痹湯方見痹痛治臂痛因於濕者加減茯苓丸批按此方臂痛因於痰者治濕痰壅滯經絡不通兩臂作痛不能梳洗及治手足疼痛麻痹行步艱難服之神效陳皮鹽水炒二兩半夏二兩用白礬牙皂生薑各一兩煎湯浸七日白茯苓去皮一兩五錢風化硝一兩三錢海桐皮酒洗一兩片子薑黃一兩木瓜一兩薄桂去皮五錢甘草炙四錢白芍酒炒二兩黃耆鹽水炒二兩上為細末薑汁竹瀝為丸如梧桐子大每服百丸空心白湯下三合散治背心一點痛用烏藥順氣散合二陳湯香蘇散加蒼朮羌活禦寒膏治體虛人背上惡寒或夏月怕脫衣及婦人産後被冷風吹入經絡故常冷痛或手足冷痛至骨又治腰痛及一切冷痹痛又治濕氣用生薑半斤取自然汁入牛膠三兩乳香末沒藥末各一錢五分銅杓內煎化就移在滾湯內燉以柳條攪至成膏又入花椒末少許再攪勻用皮紙將紙作殼子看痛處闊狹貼患處用鞋履烘熱尉之候五七日脫下或起小癮不妨㿗疝脈疝脈弦急積聚在裡牢急者生弱息者死沉遲浮澀疝瘕寒痛痛甚則伏或細或動病夫疝者小腹引卵腫急絞痛也有痛在睪丸者有痛在五樞穴者皆是厥陰肝之經也或無形無聲或形如瓜有聲如蛙自素問而下皆以為寒蓋寒主收引經絡得寒則引而不行所以作痛理固然也亦有踢水涉水終身不病此者無執在內故也大抵此症始於濕熱在經郁遏至久又得寒氣外來不得疏散而作痛若只作寒論恐為未備或曰厥陰一經鬱積濕熱何由而致豫曰大勞則火起於筋醉飽則火起於胃房勞則火起於腎大怒則火起於肝本經火積之久母能令子虛濕氣便盛濁液凝聚併入血隊流於厥陰厥陰屬木繫於肝為將軍之官其性急速火性又暴為寒所束宜其痛之太暴也有以烏頭梔子作湯飲之其效亦敏後因此方隨病加減與之無有不驗但濕熱又須分多少而治濕則多腫㿉病是也又有挾虛而發者當以參術為君而以疏導藥佐之脈甚沉緊而豁大無力者也其痛亦輕惟覺重墜牽引耳經有七疝寒水筋血氣狐㿉治一寒疝者囊冷結硬如石陰莖不舉或控引睪丸而痛得於寒濕也使內過勞也宜以溫劑下之禹功散加味五苓散下清木香丸或五積蟠蔥之類一水疝者腎囊腫痛陰汗時出囊或腫如水晶或癢而搔出黃水或小腹按之作水聲得於飲食醉飽使內過勞也汗出而遇風寒濕氣聚於囊中故多水也宜禹功散三花神佑丸導水丸逐中之劑下之一筋疝者陰莖腫痛或濃或痛裡急筋縮或莖中痛痛極則癢或挺縱不收或白物如精隨溲而下得於房室勞倦及邪術所使以降心火之劑下之瀉心湯主之一血疝者狀如黃瓜在小腹兩旁橫骨兩端紋中俗云便癰也得於春夏重感大燠勞於內氣流溢滲入脬囊留而不去結成癰腫膿少血多又或強制情欲當泄不泄亦成此疾宜玉燭散和血之劑下之一氣疝者上連腎區下及陰囊或因號哭忿怒則氣鬱而脹以針出氣而愈然針有得失宜散氣藥下之宜蕩疝丸或蟠蔥散主之或小兒亦有此疾俗云偏墜氣得於其父陰痿精怯強力入房因而有子胎中病也此疝不治惟宜灸築賓一穴在內上五寸腨分肉中灸五壯一狐疝者狀如仰瓦臥則入小腹行立則出小腹入囊中狐則晝出穴而溺夜則入穴而不溺此疝與狐相類亦與氣疝大同小異令人帶鉤鈴是也宜以逐氣流經之劑下之一㿉疝者陰囊腫墜如升斗不癢不痛得之地氣卑濕故江淮人多有之宜去濕之劑下之三花神佑丸之類如女子陰戶突出雖亦此類乃熱不禁故也不可便認為虛寒而溫之補之名曰瘕一元神虛弱受寒作小腸疝氣滾痛以蟠蔥散加故紙小茴川楝子木香之類一體壯實小腸氣痛或小便不通以八正散加破故紙小茴川楝子一小腹下毛際邊或左或右生氣核如桃狀按之則散時伏時見以五苓散加川楝子小茴香蔥白燈心煎湯下青木香丸五十七粒一治陽明受濕熱傳入太陽惡寒發熱小腹連毛際結核悶痛不可忍者以梔子炒枳殼炒桃仁炒山楂各等分生薑三片水煎服方禹功散治寒疝黑牽牛頭末一錢小茴香二錢五分加木香一錢上共為末每服三錢薑汁調下五積散治醉飽後色欲過度觸傷小腹致成疝氣其症自小腹痛連兩脅下心頭吊痛額上汗出依本方加玄胡索蟠蔥散治脾胃虛寒氣滯不行攻刺心腹痛連脅胸及膀胱小腸疝氣又治婦人血氣痛丁皮一兩砂仁一兩莪朮一兩五錢三稜一兩五錢檳榔一兩玄胡索七錢五分蒼朮一兩青皮一兩五錢乾薑五錢肉桂五錢茯苓一兩五錢甘草一兩上銼一劑生薑棗子蔥白水煎熱服臍下極冷痛加吳茱萸木香小茴香等味加味五苓散依本方加木香小茴香川楝子檳榔黑牽牛故紙木通青皮三稜莪朮等味上銼一劑水煎服橘核丸治四積㿗疝卵核腫脹偏有大小或堅硬如石或引臍腹絞痛腎囊腫脹或成瘡毒輕則時出黃水甚則成癰潰爛橘核炒海藻鹽酒炒昆布鹽酒炒桃仁麵炒去皮尖桂心五錢川楝肉炒海帶鹽水洗一兩枳實麵炒厚朴薑汁炒玄胡索炒木香五錢木通五錢上為末酒糊為丸如梧桐子大每服六七十丸空心陳酒鹽湯下如虛寒甚脈沉細手足冷者加川烏一兩如堅脹久不消加硇砂二錢醋煮旋入蕩疝丸黑牽牛取頭末破故紙炒小茴香炒川楝子去核炒各一兩青皮三錢陳皮三錢莪朮四錢木香四錢上為末酒糊為丸如梧桐子大每服五十丸空心溫酒送下青木香丸黑牽牛炒取頭末二兩檳榔二兩粟米飯裹煨去飯青木香一兩五錢破故紙二兩炒蓽澄茄二兩上為末水煮稀糊為丸如梧桐子大每服三十丸滾湯送下行氣香蘇散治偏墜氣初起疼痛憎寒壯熱依本方加小茴香木香三稜莪朮木通加減香苓散治偏墜氣初起憎寒壯熱發表分利藥輕者一服而愈枳殼陳皮香附蒼朮麻黃香薷豬苓澤瀉木通滑石車前子三稜莪朮川楝子玄胡索甘草上銼一劑生薑蔥白水煎熱服文蛤散治偏墜氣神效五倍子五六個燒存性上為末陳酒調服以醉為度神消散祕方治諸般疝氣外腎腫脹疼痛山梔子鹽水炒黑色一兩益智仁炒七錢橘核炒一兩青皮香油炒六錢檳榔一錢荔枝核八錢小茴香鹽水炒一兩上為細末每服二錢燒酒調服如不用酒以燈心草煎湯加鹽少許調服立效茴香安腎湯太醫院傳治左邊偏墜丸如雞鴨子人參一錢白朮一錢白茯苓去皮一錢澤瀉七分茴香一錢炒破故紙一錢黃柏八分木香五分檳榔一錢烏藥一錢香附一錢童便浸經宿砂仁一錢玄胡索五分升麻三分甘草炙五分荔枝核一錢上銼一劑飢時服三香酒祕方治偏墜氣南木香三錢小茴香三錢八角茴香三錢川楝肉三錢上合一服鍋內炒四味入蔥白蓮鬚五根水一碗淬入鍋將碗罩住候煎至半碗取出去渣加陳酒半碗合和入炒鹽一茶匙空心熱服神效四聖散祕方治疝氣外腎腫脹小茴香炒穿山甲炒全蠍炒南木香各等分上為末每服二錢陳酒調一服痛止木香金鈴丸嚴憲副傳治外腎腫痛諸般疝氣一服立效木香乳香沒藥大附子麵裹火煨小茴香鹽炒川楝肉玄胡索全蠍人參各等分上為末陳酒打糊為丸如梧桐子大每服百丸空心陳酒送下大小茴香丸長葛李大尹傳治疝氣如神大茴香一兩小茴香一兩吳茱萸一兩川楝子一兩川椒一兩上共為末連須蔥頭八兩同藥搗成餅子曬乾用黏米五合同藥餅研碎微火炒黃為末酒糊為丸如梧子大每服八九十丸空心鹽湯或酒下忌發氣物茴香丸治疝氣神效茯苓二兩炒白朮二兩炒山楂二兩炒枳實八錢八角茴香一兩炒吳茱萸一兩炒橘核三兩炒荔枝核一兩上為細末煉蜜為丸每服重一錢五分大空心細嚼薑湯送下灸法治一偏墜氣痛用萆麻子一歲一粒去皮研爛貼頭頂囟上卻令患人仰臥將兩腳掌相對以帶子綁住二中指於兩指合縫處艾麥粒大灸七壯即時上去腳氣脈腳氣之脈其狀有四浮弦為風宜汗濡弱濕氣宜滲遲澀因寒宜溫洪數為熱宜下微滑者虛牢堅者實結則因氣散則因憂緊則因怒細則因悲病夫腳氣者古謂之緩風又謂之厥者是古今之異名也有干濕之分其腳腫者名濕腳氣其不腫者名乾腳氣由脾胃兩經虛弱行動坐臥之間為風寒暑濕之氣所侵或內因飲食厚味所傷致濕熱下注而成如得之不便覺乃因他病發動而知先從腳起或先緩弱痹或行起忽倒或兩脛腫滿或足膝枯細或心下松悸或小腹不仁大小便澀或舉體轉筋骨節痠痛或惡聞食氣見食吐逆或胸滿氣急憎寒壯熱狀似傷寒是其候也或經一旬或半月復作漸而至於足筋腫大如瓜瓠者治治之之法用蒼朮白朮以治其濕黃芩黃拍知母以治其熱當歸芍藥生地黃以調其血木瓜檳榔以調其氣羌活獨活以利關節而散風濕兼用木通防己牛膝引諸藥下行及消腫去濕以為此證之大法矣兼用針焫導引其濕熱之氣外出也東垣曰濕淫所勝治以苦溫以苦辛發之透關節勝濕為佐以苦寒泄之流濕清熱為臣故立當歸拈痛湯治之其效捷於影響學者更宜詳究焉一凡腳腫名濕腳氣用五積散加檳榔木瓜青藤穿山甲一凡足疼痛皮不腫赤筋不拘急遇夜則痛甚此是氣虛而血不榮也宜十全大補湯加牛膝木瓜檳榔石南藤五加皮沒藥川烏之類或四斤丸若兩膝赤腫強急作熱而掣痛兩總筋拘急此血熱也宜人參敗毒散加赤芍藥大黃利氣丸下之一凡腳氣上攻胸膈悶滿大便不通宜三和散一凡腳氣攻注大小便不通用水中大螺螄三個以鹽一小撮和殼生搗爛置兩臍下一寸三分用帛緊緊繫之立通神效一凡兩膝腫痛腳脛枯細名曰鶴膝風以四物湯加黃耆人參白朮附子牛膝杜仲防風羌活甘草又宜五積散加松節林節方羌活導滯湯治腳氣初發一身俱痛或肢節腫痛便溺阻隔先用此藥導之後用當歸拈痛散以徹其邪羌活二錢獨活二錢當歸二錢防己一錢五分大黃四錢枳實炒一錢上銼一劑水煎空心服當歸拈痛散治濕熱腳氣為病四肢骨節煩痛肩背沉重胸脅不利兼遍身疼痛下注足脛腫痛腳膝生瘡赤腫及內外生瘡膿水不絶或癢或痛並宜服之羌活一錢人參苦參升麻葛根防風蒼朮米泔浸炒各四分甘草炙黃芩酒炒茵陳酒洗各一錢當歸酒洗豬苓澤瀉知母去毛酒浸白朮各五分上銼一劑水煎空心服神仙飛步丸雲林制批按此方治腳氣因濕熱者治腳膝疼痛當歸一兩川芎八錢白芍一兩五錢生地黃一兩黃柏酒炒二兩知母一兩蒼朮一兩牛膝一兩木瓜一兩杜仲一兩薏苡仁一兩防風七錢防己七錢威靈仙七錢羌活七錢桃仁七錢紅花七錢黃連酒炒一兩肉桂三錢黃芩酒炒一兩陳皮一兩半夏薑汁炒一兩白茯苓一兩上為末酒糊為丸如梧桐子大每服六七十丸空心鹽湯下五積交加酒雲林制治諸濕足膝麻木冷痹緩弱及腰痛腳氣下虛之疾白芷陳皮厚朴枳殼桔梗川芎白芍蒼朮當歸茯苓半夏官桂乾薑麻黃甘草小茴酒炒牛膝酒洗杜仲酒炒大附子制川烏吳茱萸檳榔木瓜草果砂仁破故紙酒炒羌活葫蘆巴威靈仙各等分上共合一斤用陳酒十壺薑十斤棗十格瓦罐炊熟每日空心溫服趁痛散祕方治濕氣攻注腰腳痛行步少力當歸酒洗二兩肉桂二兩玄胡索二兩萆薢二兩沒藥二兩杜仲酒炒一兩五錢上為末每服三錢空心溫酒下芙蓉丸魏憲副傳治腳腿疼痛一服即愈啞芙蓉乳香沒藥孩兒茶鹿茸去毛酒蒸官桂玄胡索酒浸微炒烏藥炙陳皮五加皮粉草炙各等分上為末麵糊為丸每服二錢酒煎葛根湯臨臥出微汗換腳丸祕方治腎虛下注腳膝或當風取涼冷氣所乘沉重少力移步遲緩筋脈攣痛不能屈伸腳心隱痛有礙履地大治干濕腳氣赤腫痛楚發作無時呻吟難忍氣滿喘急舉步艱難面色黧黑傳送祕澀並治當歸天麻防風羌活石南藤萆薢炙石斛去根黃耆肉桂大附子炮南星續斷薏苡仁各一兩蒼朮米泔浸一兩五錢川牛膝一兩酒洗木瓜四兩檳榔五錢上為末麵糊丸如梧桐子大每服五十丸空心酒下或木瓜湯下日二服二仙丹劉夷門傳批按此方治腳氣因寒濕者治腳疾腫痛拘攣川牛膝威靈仙各等分上為細末煉蜜為丸如梧子大每服五十丸空心酒下白滾湯亦可忌茶追風通氣散治腳氣加檳榔木瓜穿山甲水煎服治婦人腳氣一月一次足下浮腫手肢拘攣不伸頭疼心痛吐痰脹滿下元濕熱帶下行步艱辛當歸川芎白朮茯苓陳皮香附木瓜檳榔白芷天麻牛膝甘草上銼一劑生薑煎服痿躄脈尺脈虛弱緩而緊病為足痛或是痿病張子和云痿因肺熱相傳四臟其脈多浮而大不可作寒濕腳氣治病夫痿者謂手足痿弱無力以運動也內經謂諸痿起於肺熱又曰治痿獨取陽明蓋肺經體燥居上而主氣畏火者也脾土性濕居中而主四肢畏水也火性上炎若嗜欲無節則水失所養火寡於畏而侮所勝肺得火邪而熱矣木性剛急肺受熱則金失所養木寡於畏而侮所勝脾得木邪而傷邪肺熱則不能管攝一身脾傷則四肢不能為用而諸痿作矣瀉南方則肺金清而東方不實何脾傷之有補北方則心火降而西方不虛何肺熱之有故陽明實則宗筋潤能束骨而利機關矣治痿必須戒厚味節嗜欲庶可保其全安也陳無擇云痿躄之疾狀類柔風腳氣但柔風腳氣皆外所因痿則內臟不足所致也治之不可混作外因立治治丹溪曰有挾濕熱有痰有血虛亦有死血者有食積妨礙升降者上文論火起於肺熱實痿之本論此云然者蓋以其發而為所因所挾或有不同而主治亦當各著其所重也濕熱用東垣健步丸加燥濕降火之劑黃柏黃芩蒼朮之類濕痰用二陳湯加蒼朮白朮黃芩黃柏之類入竹瀝薑汁血虛用四物湯加黃柏蒼朮下用補陰丸氣虛用四君子湯加蒼朮黃柏黃耆之類食積用小調中湯加神麯麥芽山楂枳實之類色勞用補陰丸虎潛丸之類補之方清燥湯六七月間濕令大行子能令母實而熱旺濕熱相合而形庚大腸故寒冷以救之燥金受濕熱之邪絶寒水生之源源絶則腎虧痿厥之病大作腰下痿軟癱瘓不能動一履黃耆一錢五分蒼朮一錢白朮陳皮澤瀉各五分人參白茯苓升麻各三分麥門冬當歸身生地黃神麯末豬苓各二分黃柏酒炒柴胡黃連各一分五味子九個甘草炙二分上銼一劑水煎空心服滋筋養血湯雲林制專治血氣兩虛雙足痿軟不能行動久臥床褥川歸一錢熟地黃一錢五分白芍藥一錢五分川芎七分半人參八分五味子九粒麥門冬去心一錢黃柏一錢知母五分牛膝酒浸一錢杜仲酒炒一錢蒼朮一錢薏苡仁一錢防風六分羌活三分甘草三分筋骨痿軟加桂枝三分陳皮八分如覺心煩加黃連六分酸棗仁炒六分白茯神去木一錢上銼一劑薑棗煎服養血壯筋健步丸雲林制批按此方補虛除濕熱之劑治證同前黃耆鹽水炒一兩山藥一兩五味子一兩破故紙鹽水炒一兩人參一兩白芍酒炒一兩五分熟地黃四兩枸杞子一兩牛膝酒浸二兩菟絲子酒炒一兩川歸二兩酒洗白朮一兩炒杜仲薑汁炒二兩虎脛骨酥炙一兩龜板酥炙一兩蒼朮米泔浸三兩黃柏鹽水炒二兩防風六錢酒洗羌活五錢酒洗漢防己五錢酒洗上為末用豬脊髓七條煉蜜為丸如梧子大每服百丸空心鹽湯下鹿角霜丸方見中風批按此方補虛除濕熱之劑治血氣虛弱兩足痿軟不能行動久臥床褥之症蒸法治腎氣虛弱肝脾三經風寒濕停於腿膝使經絡滯而不行變成腳痹故發疼痛此榮衛通經絡川椒一把蔥三大莖鹽一把小麥面約四五升許酒一盞上用醋和濕潤得所炒令極熱攤臥褥下將所患腿腳就臥熏蒸薄衣被蓋得汗出勻遍約半個時辰撤去炒麩上就鋪褥中臥待一兩個時辰覺汗稍解勿令見風立效一婦人血氣兩虛虛中受孕新血供養胎元無血健用厥陰少陰二經以致兩腿足軟弱戰栗不能步履必待生産後大補氣血壯筋骨則行步輕健矣人參一錢白朮一錢炒茯苓一錢甘草五分炙川芎七分當歸一錢酒洗白芍二錢炒熟地黃一錢薑汁炒肉桂一錢去皮黃耆一錢鹽水炒牛膝一錢二分去蘆酒洗杜仲薑汁炒一錢二分木瓜一錢酒洗防風去蘆八分獨活一錢酒洗薏苡仁一錢大附子一錢制沉香三分研水入藥服不見火上銼一劑薑三片棗一枚水煎空心服痹痛脈脈澀而緊者痹少陰脈浮而弱弱則血不足浮則為風風血相搏則疼痛如掣風寒濕氣合而為痹浮澀而緊三脈乃備病夫痹者手足痛而不仁也蓋由元精內虛而為風寒濕三氣所襲不能隨時祛散流注經絡入而為痹其為病也寒多則掣痛風多則引注濕多則重著其病在筋者屈而不能伸應乎肝其證夜臥多驚飲食少小便數其病在脈者則血凝而不流應乎心其症令人痿黃心下鼓暴上氣逆喘不通嗌乾善噫其病在骨者則重而不能舉應乎腎其症手足不遂而多痛心腹脹滿其病在皮者多寒遇寒則急遇熱則縱應乎肺其證皮膚無所知覺氣賁喘滿其病在肌者多不仁應乎脾其症四肢懈怠發嗽嘔吐是名五痹至如白虎歷節風以其走痛四肢骨節如虎咬之狀而以其名之耳無非風寒濕三氣乘之也若飲酒當風汗出入水亦成斯疾久而不已令人骨節蹉跌丹溪云大率因血虛受熱其血已自沸騰或加之涉水受濕血得寒汙濁凝滯不得運行所以作痛夜則痛甚行於陰也治以辛熱之劑流散寒濕開通鬱結使血行氣和而愈更宜忌口節欲不宜食肉肉屬陽大能助火如此調治無有不安者治大法用蒼朮南星川芎白芷當歸黃芩酒在上者屬風加羌活桂枝桔梗威靈仙下者屬濕加木通牛膝防己黃柏方解表升麻湯治遍身壯熱骨節疼痛升麻一升羌活一錢蒼朮一錢防風八分柴胡七分甘草七分當歸五分藁本五分陳皮三分麻黃三分上銼一劑生薑蔥白水煎熱服出微汗靈仙除痛飲批按此方止痛發散之劑肢節腫痛痛屬火腫屬濕兼受風寒而發動於經絡之中濕熱流注於肢節之間而無已也麻黃赤芍各一錢防風荊芥羌活獨活白芷蒼朮威靈仙片黃芩枳實桔梗葛根川芎各五分歸尾升麻甘草各等分上銼一劑水煎服在下焦加酒炒黃柏婦人加紅花腫多加檳榔大腹皮澤瀉更加沒藥一錢住痛一云脈澀數者有瘀血宜桃仁紅花芎歸及大黃微利之疏筋活血湯雲林制患遍身走痛如刺左足痛尤甚左屬血多因酒色所傷筋脈空虛被風寒濕熱感於內熱包於寒則痛傷經絡則夜重宜以疏筋活血行濕此非白虎歷節風川芎六分當歸一錢二分酒洗白芍二錢半酒洗生地黃一錢半酒洗羌活六分白茯苓七分去皮蒼朮一錢米泔浸炒桃仁一錢炒牛膝二錢酒炒漢防己六分陳皮一錢去苗白芷六分龍膽草八分酒洗威靈仙一錢酒洗防風六分甘草四分炙有痰加南星半夏各一錢用薑汁白礬皂角煎湯浸一日如上體及臂疼加薄桂三分如下身並足疼受風寒濕熱所感加木瓜木通鹽炒黃柏薏苡仁炒各一錢如氣虛加人參白朮龜板各七分通經妙靈丸雲林制治同前兼治上下中疼痛黃連酒炒一兩蒼朮米泔浸炒二兩黃柏鹽酒炒二兩肉桂去皮四兩南芎五分當歸酒洗一兩白芍鹽酒炒一兩三錢漢防己酒洗三錢白芷二錢半桃仁去皮尖三錢威靈仙一兩酒浸蒸曬九次羌活酒洗三錢龍膽草酒洗一錢紅花酒洗五錢防風酒洗五錢龜板酥炙五錢杜仲薑汁炒八錢上為細末酒糊為丸如梧桐子大每服百丸空心陳酒下鹽湯亦可加味二妙丸批按此方止痛養血除濕熱之劑治兩足濕痹疼痛或如火燎從足附熱起至腰胯或麻痹痿軟皆是濕熱為病此藥神效蒼朮四兩米泔浸黃柏二兩酒浸曬乾川牛膝去蘆一兩當歸尾一兩酒洗防己一兩川萆薢一兩龜板酥炙一兩龜板難得敗者市貨者多不效不若以熟地黃代之庶幾可也上為末酒煮麵糊為丸如梧子大每服百丸空心鹽湯下舒筋立安散治四肢百節疼痛名曰白虎歷節風防風羌活獨活茯苓川芎白芷生地黃蒼朮紅花桃仁陳皮半夏南星白朮威靈仙牛膝木瓜防己黃芩連翹木通龍膽草酒浸木香少許大附子少許甘草各等分上銼一劑水煎入薑汁竹瀝服痛甚加乳香沒藥為末調服神通飲批按此方治白虎歷節風之劑治感風濕得白虎歷節風症遍身抽掣疼痛足不能履地者二三年百方不效身體羸瘦服此神效川木通二兩銼細長流水煎汁頓服服後一時許遍身發癢或發紅丹勿懼遍身上下出汗即愈治兩手疼痛麻木雲林制當歸川芎白芷黃芩酒炒黃連薑汁炒蒼朮羌活防風桔梗南星薑汁炒半夏薑汁炒桂枝甘草各等分上銼一劑生薑煎服治兩足疼痛麻木雲林制當歸白芍白朮蒼朮陳皮半夏茯苓黃柏酒炒川牛膝酒洗威靈仙桃仁紅花甘草各等分上銼生薑五片水煎入竹瀝同服治四肢百節流注走痛皆是濕痰或死血所致其病處或腫或紅當歸川芎白芷防己黃柏南星羌活蒼朮威靈仙紅花桂枝各等分上銼生薑水煎服行濕滋筋養血湯雲林制治遍身行痛乃氣血兩虛有火有濕當歸川芎白芍生地黃一錢薑汁炒人參六分白朮白茯苓威靈仙防己紅花七分牛膝黃連黃柏知母甘草四分蒼朮各等分上銼一劑薑棗煎服乳香定痛丸祕方批按此方治諸痛宜對症用之治諸風遍身骨節疼痛或腿膝痛及筋骨風蒼朮米泔浸二兩川烏炮去皮一兩當歸一兩川芎一兩乳香沒藥各三錢丁香五錢上為末棗肉為丸如梧子大每服五六十丸陳酒送下婦人濕痰流注肩背臂腰脅疼痛日夜不止行步不得陳皮半夏薑製茯苓當歸川芎白芷烏藥官桂枳殼防己蒼朮防風獨活木香香附貝母甘草各等分上銼一劑同薑煎服一婦人患四肢骨節疼痛嘔吐心痛脅脹遍身浮腫經年不愈五積散全料加羌活獨活柴胡前胡消渴脈心脈多浮腎脈多弱經云陰不足陽有餘則為熱中又云脈軟散當消渴氣實血虛也又云脈數大者生沉小者死實而堅大者生細而浮短者死病內經曰二陽結為之消又曰疸成為消中東垣曰二陽者陽明也手陽明大腸主津液病消則目黃口乾乃津液不足也足陽明胃主血若熱則消穀善飢血中伏火乃血不足也結者津液不足結而不潤皆燥熱為病也此因數食甘美而多肥故其氣上溢轉為消渴治當以養血滋陰生津降火蘭除陳氣也不可服膏粱芳草石藥其氣剽悍能助燥熱也歧伯曰實脈病久可治脈弦小病久不可治當分三消而治之高消者舌上赤裂大渴引飲心移熱於肺傳為膈消者是也以白虎加人參湯治之中消者善食而瘦自汗大便硬小便數叔和云口乾飲水多食肌虛疸成為消中是也以調胃承氣湯二黃丸治之下消者煩渴引飲耳輪焦乾小便如膏叔和云焦煩水易虧此腎消也以六味地黃丸治之總録所謂未傳能食者必發腦疽背癰不能食者必傳中滿膨脹皆不治之證也潔古老人分而治之能食而渴者白虎人參湯不能食而渴者錢氏白朮散倍加乾葛治之上中既立不復傳下消矣先哲用藥厥有旨哉然臟腑有遠近亦宜斟酌如心肺位近宜制小其服腎肝位遠其制大其劑皆適其至所為故如過與不及皆誅罰無過之地也如高消中消制之大急速過病所久而無中滿之病正謂上熱未除中寒復生者也非藥之罪失其緩急之故也治斯疾者宜加意焉治張潔古曰上消者肺也多飲水少食大小便如常此心火刑于肺金而渴生焉法當降火清金宜白虎湯加減治之軟石膏二錢半知母一錢甘草五分人參七分升麻一分黃柏一錢上銼一劑粳米一撮水煎食後溫服中消者胃也多飲食而小便黃赤蓋足陽明胃主血熱則消穀善飢血中伏火則津液消爍而渴矣治以調胃承氣湯三黃丸主之黃連黃芩大黃石膏各一兩上為末煉蜜丸如梧子大每服三十丸米湯下下消者腎也小便淋濁如膏煩渴引飲耳輪焦黑小便頻數能食者必發癰疸背瘡不能食者必傳中滿腹脹須分治之若能食而消者宜加減白虎湯主之石膏二錢半知母一錢甘草三分人參七分五味子十粒黃柏七分玄參五分上銼一劑粳米一撮水煎食後服若不食而消者宜加減白朮散主之人參白朮茯苓木香甘草黃柏知母各五分乾葛一錢五味子十粒上銼一劑水煎溫服丹溪曰三消者多屬血虛不生津液俱宜四物湯為主治上消者加人參五味麥門冬天花粉煎入生藕汁生地黃汁人乳飲酒人加生葛根汁中消者加知母石膏寒水石以降胃火下消者加黃柏知母熟地黃五味子以滋腎水又當間飲繅絲湯為上策一人被燒酒醉傷成消渴之疾飲水無度余以緑豆湯頻頻少飲用生冬瓜去皮細細嚼咽渴則又飲豆湯不一日而止渴也方生津養血湯批按此方治上消之劑治上消火盛制金煩渴引飲當歸一錢川芎八分白芍煨一錢生地黃酒洗一錢知母五分黃柏蜜水炙五分麥冬門一錢石蓮肉五分天花粉七分黃連八分烏梅五分薄荷五分甘草炙五分上銼一劑水煎溫服清涼飲子批按此方治中消之劑治消中能食而瘦口舌乾自汗大便結燥小便頻數黃耆一錢當歸身六分生地黃六分龍膽草酒洗錢半柴胡一錢升麻四分防己五分羌活一錢黃芩酒洗一錢防風五分杏仁十個生甘草五分炙甘草一錢上銼一劑水煎加酒一匙稍熱服人參茯苓散批按此方治下消之劑治腎消善飲而食小便頻數白濁如膏人參一分白朮二分茯苓五分澤瀉二分滑石一錢半寒水石一錢半乾葛五分連翹三分黃芩五分桔梗二分梔子仁二分薄荷五分大黃五分天花粉二分甘草七分縮砂二分上銼一劑水煎入蜜服腎消食前上消食後服繅絲湯治三消渴如神如無繅絲湯卻以原蠶繭殼絲綿煎湯皆可代之無時飲之大效蓋此物屬火有陰之用大能瀉膀胱中伏火引陰水上潮於口而消渴也玉泉散治消渴之神藥也白粉葛天花粉麥門冬生地黃五味子甘草糯米上銼一劑水煎服神仙減水法治三焦虛熱三消渴疾日夜飲水無度黃耆人參麥門冬黃連天花粉知母苦參白扁豆浮萍照水曬乾各一兩黃丹二錢上為末每服二錢新汲水調下神白散即益元散方見中暑治真陰素被虛損多服金石等藥或嗜炙爆咸物遂成消渴用溫水調服或大渴飲冷者新汲水尤妙祕方批按此方總治三消之劑治三消用退雄雞湯澄清飲之神效清神補氣湯消渴症才愈止有口乾腹不能拿或者又添舌白滑微腫咽喉咽津覺痛嗌痛時時有渴喜冷飲口中白沫如膏當歸身一錢生地黃一分黃連酒五分知母五分石膏四分柴胡七分升麻一錢半防風一錢荊芥穗一錢桃仁一錢杏仁五個紅花少許川椒二個細辛一分生甘草一分腎氣八味丸批按此方治消渴收功之劑治心腎不交消渴引飲
