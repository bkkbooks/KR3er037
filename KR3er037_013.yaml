body:
  text: 卷之十三幼科形氣發微論大哉醫乎其來遠矣粵自混沌既判鴻荒始分陽之輕清者以氣而上浮為天陰之重濁者以形而下凝為地天確然而位乎上地隤然而位乎下於是陽之精者為日東升而西墜陰之精者為月夜見而晝隱兩儀立矣二曜行焉於是玄氣凝空水始生也赤氣炫空火始生也蒼氣浮空木始生也素氣橫空金始生也黃氣際空土始生也五行備萬物生三才之道著矣是以人之生也稟天地陰陽假父母之精血交感凝結而為胞胎也乾道成男坤道成女始自襁褓以致齠齔逮其成童與夫壯年豈易然哉故一月之孕有白露之稱二月之胚有桃花之譬及至三月則先生右腎而為男陰包陽也先生左腎則為女陽包陰也其次腎生脾脾生肝肝生肺肺生心以生其勝己者腎屬水故五臟由是為陰其次心生小腸小腸生大腸大腸生膽膽生胃胃生膀胱膀胱生三焦以生其勝己者小腸屬火六腑由是為陽其次三焦生八脈八脈生十二經十二經生十二絡十二絡生一百八十絲絡絲絡生一百八十纏絡纏絡生三萬四千孫絡孫絡生三百六十五骨節骨節生三百六十五大穴大穴生八萬四千毛竅則耳目口鼻四肢百骸之身皆備矣所謂四月形象具五月骨節成六月毛髮生七月遊其魂兒能動左手八月遊其魄兒能動右手九月三轉身十月滿足母子分解其中延月生者必生貴子不足日月生者必生貧薄之人誕生之後有變蒸之熱長其精神壯其筋骨生其意志三十二日一變蒸生腎氣焉六十四日二變蒸生膀胱之氣焉腎與膀胱屬水其數一也九十六日三變蒸生心氣焉一百二十八日四變蒸生小腸之氣焉心與小腸屬火其數二也一百六十日五變蒸生肝氣焉一百九十二日六變蒸生膽氣焉肝與膽屬木其數三也二百二十四日七變蒸生肺氣焉二百五十六日八變蒸生大腸之氣焉肺與大腸屬金其數四也二百八十八日九變蒸生脾氣焉三百二十日十變蒸生胃氣焉脾與胃屬土其數五也變蒸已畢一期歲焉齒生髮長神智有異於前也故曰齒者腎之餘也發者血之餘也爪者筋之餘也籲人身之難得也如此哉方其幼也有如水面之泡草頭之露氣血未定易寒易熱腸胃軟脆易飢易飽為母者調攝不得其宜必不能免乎吐瀉驚疳之病矣及其長也嗜欲既開不能修養是以六氣迭侵於其外七情交戰於其中百憂纍其心萬事勞其神一蝸之氣安能無病焉小兒之瘡疹大人之傷寒尤其甚也所以黃帝問於歧伯曰余聞上古之人春秋皆度百歲而動作不衰今時之人年至半百而動作衰矣時世異耶人將失之歧伯對曰上古之人其知道者和於陰陽法於術數飲食有節起居有常不妄作勞故能形與神俱而盡終其天年度百歲乃去今時之人不然也以酒為漿以妄為常以欲竭其精以耗散其真不知持滿不時御神務快其心逆於生樂起居無節故半百而衰矣是故聖人不治已病治未病不治已亂治未亂夫病已成而後藥之亂已成而後治之譬猶渴而穿井鬥而鑄兵不亦晚乎病原論夫小兒者幼科也初生者曰嬰兒三歲者曰小兒十歲者曰童子兒有大小之不同病有淺深之各異形聲色脈之殊望聞問切之間若能詳究於斯可謂神聖工巧者矣蓋望者鑑貌辨其色也假如面部左腮屬肝右腮屬肺額屬心鼻屬脾頦屬腎肝病則面青肺病則面白心病則面赤脾病則面黃腎病則面黑是乃望而知之也聞者聽聲知其症也假如肝病則聲悲肺病則聲促心病則聲雄脾病則聲慢腎病則聲沉此屬於臟又大腸病則聲長小腸病則聲短胃病則聲速膽病則聲清膀胱病則聲微此屬於腑是乃聞而知之也問者問病究其原也假如好食酸則肝病好食辛則肺病好食苦則心病好食甘則脾病好食鹹則腎病好食熱則內寒好食冷則內熱是乃問而知之也切者切脈察其病也假如小兒三歲以下有病須看男左女右手虎口三關從第二指側看第一節名風關第二節名氣關第三節名命關辨其紋色紫者屬熱紅者傷寒青者驚風白者疳病黑者中惡黃者脾之困也若見於風關為輕氣關為重過於命關則難治矣至三歲以上乃以一指按寸關尺三部常以六七至為率添則為熱減則為寒浮洪風盛數則多驚沉遲為虛沉實為積是乃切脈而知之也大抵小兒之疾大半胎毒而少半傷於食也其外感風寒之症十一而已蓋小兒之在胎也母飢亦飢母飽亦飽辛辣適口胎氣隨熱情欲動中胎息輒躁或多食煎爆或恣味辛酸或嗜欲無節或喜怒不常皆能令子受患其為母者胎前既不能謹節産後又不能調護是以惟務故息不能防微杜漸或未滿百晬而遂與鹹酸之味或未及周歲而輒與甘肥之物百病由是而生焉小兒脾胃本自嬌嫩易於傷積且如乳食傷胃則為嘔吐乳食傷脾則為泄瀉吐瀉既久則成慢驚或為疳病乳食停積則生濕痰痰則生火痰火交作則為急驚或成喉痹痰火結滯則成癇吊或為喘嗽胎熱胎寒者稟受有病也臍風撮口者胎元有毒也鵝口口瘡者胃中有濕熱也重舌木舌者脾經有實火也走馬牙疳者氣虛濕熱也愛吃泥土者脾臟生疳也胎驚夜啼者邪熱乘心也變蒸發熱者胎毒將散也丹毒者火行於外也蘊熱者火積於中也中惡者外邪乘也睡驚者內火動也喉痹者熱毒也眼痛者火盛也膿耳者腎氣上衝也鼻塞者因感風邪也頭瘡者熱毒攻也臍瘡者風濕中也尾骨痛者陰虛痰也諸蟲痛者胃氣傷也陰腫疝氣者寒所郁也盤腸氣痛者冷所搏也脫肛者大腸虛滑也遺尿者膀胱冷弱也尿濁者濕滯脾胃也便血者熱傳心肺也下淋者膀胱鬱熱也吐血者榮衛氣逆也小便不通者有陰有陽也大便閉結者有虛有實也解顱鶴節者胎元不全也行遲發遲者氣血不充也龜胸者肺熱脹滿也龜背者風邪入脊也語遲者邪乘心也齒遲者腎不足也瘧者膈上痰結也痢者腹中食積也咳嗽者肺傷風也喘急者痰氣盛也心痛者蟲所齧也腹痛者食所傷也內傷發熱則口苦舌乾也外感發熱則鼻塞聲重也腹脹者脾胃虛弱也水腫者土虧水旺也黃疸者脾胃濕熱也癍疹者陰陽毒氣也自汗者氣虛也積者有常所有形之血也聚者無定位無形之氣也胃主納受也脾主運化也調理脾胃者醫中之王道也節戒飲食者卻病之良方也驚疳積熱者小兒之常病也望聞問切者醫家之大法也若夫療疾用藥如箭箭中鴻心者則又可以心悟而不可以言傳也孟子所謂梓匠輪輿能與人規矩不能使人巧斯言得之矣入門審候歌額上屬心火南左腮屬肝木東鼻準屬脾土中右腮屬肺金西下頦屬腎水北觀形察色辨因由陰弱陽強發硬柔若是傷寒雙足冷要知有熱肚皮求鼻冷便知是瘡疹耳冷應知風熱證渾身皆熱是傷寒上熱下冷傷食病五指稍頭冷驚來不可當若逢中指熱必定是傷寒中指獨自冷麻痘證相傳女右男分左分明仔細看觀面部五色歌面赤為風熱面青驚可詳心肝形此見脈證辨溫涼脾怯黃疳積虛寒㿠白光若逢生黑氣腎敗命須亡觀面部五臟形色歌心心經有冷目無光太陰黑目無光彩此心經冷也面赤須言熱病當面頰赤色此為心有熱也赤在山根驚四足山根赤色心經生風下至準頭惡也積看虛腫起陰陽三陰三陽虛腫心有積也肝肝經有冷麵微青面青為肝受冷主發驚也有熱眉胞赤又臨眉上有紅赤為肝有熱也髮際白言驚氣入髮際至印堂略白者為肝驚也食倉黃是積果深眉上有紅赤為肝有熱也脾脾冷應知面色黃面黃印堂反白者為脾冷也三陽有白熱為殃三陽上白者為脾熱也青居髮際主驚候髮際及印堂色青者脾驚也唇口皆黃是積傷上下唇黃為脾受積也肺肺受面白冷為由白色在麵皮及人中或青者皆肺冷也熱赤人中及嘴頭人中及嘴頭有赤者肺有熱也青在三根驚四足山根青色是肺受驚也熱居髮際積為仇髮際赤色乃有積也腎面黑當知腎臟寒面帶黑者腎有冷也食倉紅是熱須看食倉紅者腎有熱也風門黃可言驚入風門黃者腎有驚也兩目微沉積所幹兩目微沉是積在腎也虎口三關脈紋圖三關在第二指側看第三節三關紋色主病歌紫熱紅傷寒青驚白色疳黑時因中惡黃即困脾端又青色大小曲人驚並四足赤色大小曲水火飛禽蹼紫色大小曲傷米麵魚肉黑色大小曲脾風微作搐三關脈紋變見歌魚刺驚風證莫疑氣關疳病熱相隨命關見此為難治此是肝家轉到脾初節懸針瀉痢生氣關肺熱更疳凝三關直透黃泉近此候須知是慢驚水字生驚肺受風氣關咳嗽積痰攻醫人仔細詳虛實出命驚疳夾證凶乙定驚風肝肺隨氣關形見發無時此形若直命關上不久相將作慢脾曲蟲為候主生疳若見氣關積穢肝直到命關為不治須知心臟已傳肝雙環肝臟受疳深入胃氣關吐逆臨若是命關為死候枉教醫者更勞心流珠形見死來侵面上如斯也不生縱有神丹人不救醫人仔細更叮嚀傷寒斜向右傷食七堪儔雙釣傷冷定逢驚山字浮絲紋將發搐豐字引堪愁若遇傷風證脈斜向左朝形如新月樣向右氣疳留若是彎居左風疳藥可投形如三疊曲傷硬物為仇更有環生腳尤嫌上下鉤皆為傷冷候醫者用心求疳極如勞狀亂蟲皆可憂交了紋互疊腹面見因由更有青筋貫百中無一瘳小兒脈法總歌小兒有病須憑脈一指三關定數息遲冷數熱古今傳浮風沉積當先識左手人迎主外證右手氣口主內疾外候風寒暑濕侵內候乳食痰與積洪緊無汗是傷寒浮緩傷風有汗液浮洪多是風熱盛沉細原因乳食積沉緊腹中痛不休弦緊喉間作氣急緊促之時疹痘生緊數之際驚風至虛軟慢驚作瘛瘲緊實風癇發搐搦軟而細者為疳蟲牢而實者因便閉脈芤大小便中血虛濡有氣兼驚悸滑主露濕冷所傷弦急客忤君須記大小不勻為惡候二至為脫三至卒五至為虛四至損六至平和曰無疾七至八至病猶輕九至十至病勢極十一二至死無疑此訣萬中無一失小兒指脈歌小兒食指辨三關男左女右一般看皆知初風中氣候末是命關易亦難要知虎口氣紋脈倒指看紋分五色黃紅安樂五臟和紅紫依稀有損益紫青傷食多虛煩青黑紋時證候逆忽然純黑在其間好手醫人心膽寒若也直上到風關粒米短長分兩端如槍沖射驚風至分作指叉有數般弓反里順外為逆順逆交連病已難叉頭長短有可救如此醫人仔細看男兒二歲尚為嬰三歲四歲幼為名五六次弟年少長七齠八齔漸論情九歲為童十稚子有病關格辨其因十一癇疾號癲風疳病還同勞病攻痞癖定為沉重候退他潮熱不相同初看掌心中有熱便知身體熱相從肚熱身冷傷積定腳熱額熱是感風額冷腳熱驚所得瘡疹發來耳後紅小兒有積宜與塌傷寒三種解為宜食瀉之時須有積冷瀉須用與溫脾水瀉宜與澀臟腑先將滯竭散與之孩兒無事忽大叫不是驚風是天吊大叫氣促長聲粗誤吃熱毒悶心竅急須吐下卻和脾若灌驚藥真堪笑小兒死候歌眼生赤脈貫瞳人囟門腫起又作坑指甲黑色鼻乾燥鴉聲忽作肚青筋虛舌出口咬牙齒目多直視不轉睛魚口氣急啼不得蛔蟲既出死形真手足擲搖驚過節靈丹十救一無生驚風脈總見前病小兒疾之最危者無越驚風之證也蓋驚有急驚有慢驚有慢脾風三者之不同急者屬陽陽盛而陰虧慢者屬陰陰虧而陽盛慢脾者亦屬陰陰氣極盛胃氣極虛陽動而躁疾陰靜而遲緩其始也多由小兒氣血怯弱肌膚軟薄神氣未備臟腑未全在捧抱者愛護如執玉捧盈之類不令疏虞可也若被掀轟惡逆之音凶猛怪詫之物觸犯小兒則致面青口噤或聲嘶而厥發過則客色如故良久復作其身熱面赤口乾引飲口鼻中氣熱大小便黃赤色惺惺不睡牙關緊急壯熱涎潮上竄反張搐搦顫動唇口眉眼眨引頻並其脈浮數洪緊蓋熱盛則生痰痰盛則生風偶因驚而發耳則急驚屬於肝木風邪痰熱有餘之證治宜清冷苦寒瀉氣之藥以敗毒散之類慢驚之候多因飲食不節損傷脾胃以致吐瀉日久中氣大虛而致發搐發則無休止時其身冷麵黃不渴口鼻中氣寒大小便清白昏睡露晴目上視手足瘛瘲筋脈拘攣其脈沉遲散緩蓋脾虛則生風風盛則筋急俗云天吊風者即此候也此慢驚屬於脾土中氣虛損不足之候治宜和中甘溫補氣之劑以補脾湯之類慢脾風證蓋由慢驚傳次而至慢驚之後吐瀉損脾病傳已極總歸虛處惟脾所受故曰慢脾又名虛風其病則面赤額汗舌短頭低眼合不開困睡中搖頭吐舌頻吐腥臭噤口咬牙手足微搐而不收或身冷或身溫而四肢厥冷其脈沉微治法大要生胃回陽宜黑附湯之類俟胃氣漸復則用異功散溫平而調理之若其眼半開半合手足不冷證候尚在慢驚則不用回陽或已入慢脾而陽氣未甚脫者亦不可用硫黃附子凡服回陽湯劑手足漸暖者仍以醒脾散等繼其後以調之慢驚慢脾逆惡之候急驚搐搦暴烈之證大抵急驚易療而慢驚難痊至於慢脾危篤之疾雖神工妙手莫易治焉醫者宜分急慢脾風三證要察虛實冷熱四候慎毋混於一途而治故曰虛則補之實則利之冷者溫之熱者涼之是為活法又易曰化而裁之存乎變神而明之存乎人此之謂也若以一例而施之豈非刻舟求劍之術耶驚風不治證急驚眼睛翻轉口中出血而足擺跳肚腹搐動或神緩而摸體尋衣或證篤而神昏氣促噴藥不下通關不嚏心中熱痛忽大叫者不治慢驚四肢厥冷吐瀉咳嗽面黯神慘鴉聲胃痛兩脅動氣口生白瘡髮直搖頭眼睛不轉涎鳴喘嗌頭軟大小便不禁手足一邊牽引者皆不治慢脾身冷黏汗直臥如尸喘嗽頭軟背直口噤搖頭痰如牽鋸之聲面無潤澤之色縮唇氣粗者不治方探生散治小兒急慢驚風諸藥無效用此吹鼻定其生死雄黃一錢沒藥一錢乳香五分麝香一字上為末用少許吹鼻如眼淚鼻涕俱下者可治敗毒散治急驚風初起發熱手足搐搦眼上視等證並一切感冒風寒頭痛發熱咳嗽鼻塞身重及瘡疹欲出發搐並宜服之人參羌活獨活柴胡前胡茯苓枳殼桔梗川芎天麻全蠍殭蠶白附子地骨皮甘草各等分上銼生薑三片水煎服牛黃抱龍丸治小兒急慢驚風痰嗽潮搐及傷風瘟疫身熱昏睡氣粗風熱痰實壅嗽喘急一切發熱並宜服之並痘疹首尾可服此藥能鎮驚安神寧心定智除諸熱住痰涎止嗽定喘壯實小兒宜時少與服之則免痰熱驚風之證神效無比南星為末臘月納牛膽中陰乾百日取研一兩天竺黃五錢雄黃二錢半辰砂二錢半麝香一錢珍珠一錢琥珀一兩牛黃五分金箔十片為衣上為細末水煮甘草膏和為丸如芡實大金箔為衣每三歲兒服一丸五歲兒服二丸十歲兒服三五丸滾水待溫磨化服驚風薄荷湯磨化下珍珠丸海一傳批按此方治急驚風之劑治急驚風眼上視筋脈急擺頭搐搦涎潮壯熱風痰氣喘及臍風撮口痰嗽壅塞停乳肚腹脹硬等證南星泡半夏泡滑石各一錢半巴豆二十五個去殼去油輕粉五分硃砂五分上為末麵糊為丸如黍米大每服量兒大小加減驚風薄荷湯下傷食茶下一二歲三五丸以利為度補脾湯治小兒脾經不足土敗木來侮目晴微動搖微驚搐或潮熱往來脾胃有傷飲食少進或泄瀉嘔吐面色黃脈無力宜調理脾胃陳皮五分白朮一錢三分半夏七分黃耆蜜炙五分人參五分白茯苓七分當歸酒洗五分川芎五分白芍酒炒一錢黃連炒四分肉豆蔻煨五分乾葛五分神麯炒五分甘草炙四分上銼薑棗煎服一方去天麻殭蠶加南星泡半夏曲陳倉米二百粒煎服纍驗黑附湯附子三錢泡去皮白附子一錢甘草五分木香一錢半上銼每三錢生薑五片煎服若是手暖而蘇省即止異功散批按此方治慢脾風之劑治小兒吐瀉不思飲食此藥溫中壯胃療虛冷人參茯苓白朮炒各一錢半橘紅七分木香甘草炙各五分紫金錠子治急慢驚風大有神效人參白朮白茯苓茯神赤石脂醋煅七次辰朱各二錢半麝香五分牛黃五分殭蠶五分青礞石煅一錢五靈芝五分上為末糯米糊為丸如彈子大金箔為衣每一粒薄荷湯磨化服保幼化風丹治小兒四證八候去風痰散驚熱南星半夏川烏白附子各一兩水洗淨鬱金五錢上為末裝入臘月黃牛膽內陰乾百日取出研為末每一兩入雄黃硃砂硼砂𥔿硝各一錢片腦麝香各少許共為末煉蜜為丸豌豆大燈草薄荷湯研化下批按此方治一切急慢驚風之劑夫小兒有熱熱盛生痰痰盛生驚驚盛發搐又盛則牙關緊急而八候生焉搐搦掣顫反引竄視是也搐者兩手伸縮搦者十指開合掣者勢如相撲顫者頭偏不正反者仰向後引者臂若開弓竄者目直似怒視者睛露不活是謂八候也其四證者即驚風痰熱是也而化風丹悉能主之治小兒驚風並退只是聲啞不能言並諸病後不能言天南星去皮臍一個泡為末每半字或一字三五歲半錢用豬膽汁食前調下即言灸小兒驚風男左乳黑肉上女右乳黑肉上周歲灸三壯二三歲灸五七壯灸小兒慢驚慢脾危證藥力不到者但看兩腳面中間陷處有太衝脈即灸之又百會穴具穴直取前後髮際折中橫取兩耳尖折中在頭之中心端正旋毛處是也如有雙旋及旋毛不正者非艾炷約小麥許但灸三五壯而止灸後仍以醒脾散等補之諸疳脈小兒脈單細為疳勞虎口脈紋白色為疳病夫諸疳者謂肥甘飲食之所致也蓋小兒脾胃懦弱多為母之舐犢之愛不知調養之法遂令恣食甘肥瓜果生冷之物一切烹飪調和之味以其朝餐暮食漸成積滯膠固而不為疳者鮮矣或嬰幼缺乳粥飯太早耗傷形氣者又或因久患瘧痢吐瀉乃生諸病誤以下藥致損脾胃亡津液而然者皆能致身熱體瘦面黃肚大青筋蟲痛瀉痢等證治宜理脾胃消積化蟲清熱止瀉住痢以肥兒丸疳積餅為主此二方不問諸疳冷熱服之最效大抵疳之為病皆因過餐飲食於脾家一臟有積不治傳之餘臟而成五疳之疾何為五疳心肝脾肺腎也如疳在心則面赤口乾咬牙舒舌口舌生瘡身熱體瘦以安神丸主之疳在肝則面青筋膜遮睛搖頭揉目多淚頭焦發豎筋青腦熱瘦弱以補肝湯主之疳在脾則面黃身熱肚脹腹大好食泥土水穀不消泄下酸臭困睡減食肌瘦以益黃散主之疳在肺則面白咳嗽喘逆口鼻生瘡咽喉不利壯熱惡寒鼻流清涕以清肺湯主之疳在腎則面黑肌肉瘦而體生瘡身熱尿澀手足冰冷口臭乾渴以地黃丸主之內疳則目腫脹利色無常或沫清白漸而瘦弱此冷證也宜木香丸主之外疳鼻下赤爛自揉鼻頭有瘡不結痂繞目而生當用蘭香散治之大抵疳病當辨冷熱肥瘦而治其初病者為肥熱疳久病者為瘦冷疳冷則用木香丸熱則用黃連丸臨證宜審治焉方肥兒丸劉尚書傳消疳化積磨癖清熱代肝補脾進食殺蟲養元氣人參去蘆三錢半白朮去蘆三錢白茯苓去皮三錢黃連薑汁炒三錢半胡黃連五錢使君子去殼四錢半神麯炒三錢半麥芽炒三錢半山楂肉三錢半甘草炙三錢蘆薈二錢半碗盛泥封固置土坑中四面穀糠火煨透用之上為細末黃米糊為餅米湯化下或作小丸亦可每服二三十丸量兒大小加減服之疳積餅毛惟中傳治小兒五疳諸積肚大青筋面黃肌瘦飲食少進或瀉或痢或腹痛青皮去穰五錢陳皮五錢山楂肉五錢神麯炒五錢麥芽炒五錢砂仁炒五錢白朮去蘆六錢三稜煨五錢莪朮煨五錢木香五錢檳榔四錢甘草炙四錢小茴炒三錢使君子去殼二兩川楝子酒蒸去核三錢肉豆蔻煨四錢訶子去核四錢夜明砂炒三錢另研乾蟾蜍一大個川黃連去毛淨六錢清水浸取汁和藥末上焙乾為細末用好細白麵六斤微炒黃以砂糖十兩水煮化和前面藥得所印作餅子每重一錢每服三五餅任意嚼吃五積餅山東德府傳批按此方治一切諸疳一消一補平和之劑治小兒疳積食積蟲積肉積氣積冷積腹脹大如鼓青黃肌瘦泄瀉發熱不能服藥者三稜醋炒一錢莪朮醋炒一錢青皮去穰一錢陳皮一錢木香一錢黃連薑汁浸炒一錢川楝肉二錢檳榔二錢神麯炒三錢麥芽炒三錢砂仁三錢使君子肉五錢胡黃連五錢白朮炒六錢龍膽草六分山楂肉二兩乾蟾蜍五隻上為細末用炒過白麵五斤黑糖二斤並前藥和勻用印印作餅子約重一錢每服三五餅服過半月大效安神丸治邪熱驚啼心疳面黃頰赤壯熱麥門冬去心五錢白茯苓五錢山藥五錢甘草炙五錢硃砂一兩龍腦一字牙硝五錢上為末煉蜜為丸如芡實大每服半丸砂糖水磨化下慢驚用參朮煎濃汁化下補肝湯治肝疳眼閉不開內有朦霧生地一兩熟地一兩川芎二錢半赤茯苓二錢半枳殼炒二錢半黃連二錢半杏仁水泡去皮二錢半半夏曲二錢半天麻二錢半地骨皮二錢半甘草炙二錢半上銼每二錢姜三片黑豆十五粒水煎臨臥服益黃散治脾疳脾胃虛寒體黃腹大好食泥土肺疳氣喘口鼻生瘡等證人參一錢白朮一錢陳皮一錢青皮五分訶子皮五分甘草炙五分丁香二分上銼一劑水煎溫服古方無參術清肺湯治肺熱疳慝蝕為穿孔汁臭或息肉桑白皮炙紫蘇前胡黃芩當歸連翹天門冬去心防風赤茯苓桔梗甘草生地黃各等分上銼每二錢水煎食後服地黃丸治腎疳肌肉極瘦生瘡疥寒熱乍作頭極熱足冷如冰肝疳白膜遮睛筋疳瀉血骨疳喜臥冷地又治胃怯不言解頤小兒年長不能行者專服有效熟地黃酒洗三錢山茱萸酒蒸去核取皮三錢乾山藥三錢澤瀉三錢牡丹皮三錢白茯苓三錢上為末煉蜜為丸如梧桐子大每五七丸空心熱水化下年長者量增丸數木香丸治瘦冷疳及疳在內木香二錢半青黛二錢半檳榔二錢半肉豆蔻二錢半麝香一錢另研續隨子一兩去油蝦蟆大壯者三個燒存性上為細末煉蜜為丸如緑豆大每服三五丸至一二十丸薄荷湯下食前服黃連丸治肥熱疳胡黃連五錢川黃連五錢硃砂二錢半另研上為細末和勻填入豬膽內用淡漿煮以杖子如銚子上用線約之勿著底候一時取出研入蘆薈麝香各一分飯為丸麻子大每服五七丸至一二十丸米飲下一方是蝦蟆半兩焙乾不燒蘭香散治外疳鼻下赤爛蘭香葉二錢燒存性銅青五分輕粉五分上為細末干敷之小蘆薈丸治疳積瘰癧結核耳內生瘡或疝氣囊癰下疳潰爛或莖出白津股腹有瘡或體瘦熱渴大便不調牙齦蝕落頰腮腐爛等證胡黃連一兩黃連一兩蘆薈一兩木香一兩白雷丸一兩青皮一兩鶴蝨草一兩白蕪荑炒一兩麝香二錢上為細末蒸餅為丸如麻子大每服一錢空心米湯下一小兒下疳潰爛發熱作痛一小兒莖中作癢不時搔捻一小兒腎莖中潰痛小便閉澀日晡尤甚一小兒目癢出水或項中結核或兩眼連札或陰囊瘙癢年餘矣俱屬肝火用此立愈大蘆薈丸治五疳皮黃肌瘦髮直尿白肚大青筋好食泥炭米茶之物或吐或瀉蒼朮米泔浸炒陳皮厚朴姜炒青皮枳實炒檳榔神麯炒山楂去子麥芽炒三稜煨莪朮煨砂仁茯苓黃連胡黃連蕪荑仁使君子青黛蘆薈各等分上為細末使君子殼煎湯浸蒸餅為丸如彈子大每一丸清米湯化服黃土丸治小兒疳積在脾面黃腹脹咬指甲撏眉毛揉口鼻泥土炭茶紙之類黃土一兩陳皮一兩木香二錢半黃連五錢巴豆去殼二十粒不去油上為細末面丸如緑豆大每歲十丸黑豆汁下直候泄五七次疳積盡與益黃散助藥後與疳藥常服癖疾脈脈沉細為癖積病天地氣運固有南北之殊小兒病患亦有彼此之異北方小兒患癖積者十恆八九南方小兒患癖疾者百無二三是何謂而致之蓋南方水土薄弱飲食柔軟易於克化厥疾少矣北方水土厚實麵食堅硬難於運動厥疾生焉亦由脾胃之不和也故東垣以脾胃為人之主脾胃和一疾不生虧則百病生焉小兒脾胃本自柔脆臟腑尚且嬌嫩為之母者多不知調護之法惟務姑息之愛不問鹹酸甘肥之味瓜果生冷之物及糍粽濕面油膩煎炙之類諸股稠黏乾硬難化之物順其所欲食之過多損傷脾胃脾胃既傷則不能消化水穀水穀不化則停滯而痰發發熱既久則耗傷元氣元氣虛則不能運動其血血遂不行而停滯不散留於脅肋之間遂成血塊居於皮裡膜外不能移動始則有如錢大發熱則日漸長其形如龜如蛇如豬肝肺者長短大小之不一也內有血孔貫通外有血筋盤固其筋直通背脊之下與臍相對之間有動脈之處乃癖疾之根夫人身之血脈則晝夜循環無端一周流及此其血則貫入筋內由筋入孔由孔入癖蓋癖得血養而漸長邪得血助而漸盛於是正氣愈憊而血愈枯矣發為潮熱以致諸疾或頭出虛汗或胸前項下跳動或肚大青筋毛焦發堅或面黃肌瘦四肢乾枯淹延日久則毒氣發出變生諸症有變為牙疳口臭宣露出血者有變為頭面腫大口鼻潰爛者有變為一切瘡毒流膿出血者有變為肢體浮腫腹脹氣喘者有變為寒熱往來似瘧非瘧者有變為痰嗽喘熱衄吐下血者有變為嘔吐瀉痢脫肛下墜者有變為心腹疼痛疝氣偏墜者皆癖毒攻出之所致也變證多端難以悉舉乃九死一生之病非一方一法所能愈也治治之先宜針灸之法以斷其根使血不貫入筋內則癖無血所養癖即自敗矣外以膏藥貼之內以湯丸攻之大抵宜補脾養氣以治其本清熱消塊以治其標標本兼濟又當執其權衡以量兒之壯弱病之輕重若壯而輕者則治標之藥多於治本之劑若弱而重者治本之劑多於治標之藥大概肥兒丸烏金丸阿魏丸千金保童丸之類乃半攻半補平和之劑宜對證選用於針灸之後可收十全之功也臣斯疾者宜詳究焉方淨府散西園公方治小兒腹中癖塊發熱口乾小便赤柴胡一錢黃芩八分半夏薑汁浸炒八分人參二分白朮去蘆七分白茯苓去皮一錢豬苓七分澤瀉一錢三稜煨一錢莪朮煨一錢山楂肉一錢胡黃連三分甘草三分上銼一劑薑棗煎服抑肝扶脾散雲林制補元氣健脾胃退熱消癖人參五分白朮土炒八分茯苓八分陳皮六分青皮炒六分甘草三分龍膽草酒洗八分白芥子炒八分柴胡酒洗三分山楂肉八分神麯炒六分黃連薑汁炒一錢胡黃連三分上銼一劑薑棗煎服肥兒丸方見諸疳治癖疾如神烏金丸徐副使傳治癖塊發熱一料除根牛黃二錢蘆薈三錢琥珀五錢胡黃連五錢人參六錢白朮乳汁炒六錢黃連七錢檳榔七錢三稜醋煮七錢莪朮醋煮七錢地骨皮七錢水紅花子炒七錢百草霜三錢伏龍肝三錢上為細末糯米糊為丸如緑豆大每服三十丸陳皮湯送下阿魏丸鮑思齊傳白朮五兩用酥油炒三兩土炒二兩蒼朮三兩米泔水浸二日去皮再用芝麻二兩同浸磨下取粉曬乾半夏薑製一兩白茯苓去皮一兩陳皮一兩黃連酒炒二兩山楂去核一兩麥芽炒一兩枳實麵炒二兩蘿蔔子炒二兩當歸二兩紅花一兩楮實子炒二兩牛黃一錢水紅花子炒三兩小桃紅子炒三兩蘆薈一兩阿魏一兩酥油二兩人中白火煅五錢黃蠟三兩二味同化入藥末內桃仁去皮一兩海帶二兩紫菜三兩干鹼炒二兩三稜煨一兩莪朮煨一兩胡黃連一兩沉香一兩上煉蜜為丸如梧桐子大每二三十丸水紅花子煎湯送下白湯黃酒俱可千金保童丸批按此方治癖退熱半攻半補之良劑也消癖化積清火退熱殺蟲消疳開膈除脹養胃和脾進食大人小兒並宜服之人參五錢白朮五錢茯苓去皮三錢半蘆薈一錢胡黃連二錢黃連炒三錢半蕪荑仁三錢使君子去殼三錢半夜明砂炒三錢半蚵皮二個炒龍膽草去蘆三錢半柴胡三錢蒼朮米泔水浸炒三錢半青皮炒三錢半陳皮三錢半砂仁二錢半木香三錢半檳榔三錢半三稜煨三錢半莪朮煨三錢半香附炒三錢半枳實麩炒三錢神麯炒五錢山楂去核三錢半麥芽炒五錢蘿蔔子炒五錢水紅花子炒五錢加阿魏二錢上為細末豬膽汁為丸如緑豆大每三五十丸食前米飲送下此病切忌豬肉宜食鴿子蝦蟆至寶丸許昌僧傳阿魏二錢蘆薈二分天竺黃二分雄黃二分沒藥二分穿山甲炒成珠二分胡黃連二分白草烏童便浸一宿二分硇砂二分上為細末用好酒和成一塊入銅鍋內再入酒半茶鍾熬成膏勿令火大恐傷藥力量可丸取出丸如豌豆大每一丸黃酒化下十歲以上服二丸臨臥服待其自然汗出三日服一次重者五七服輕者三三丸熱即退塊亦消須要忌口一方加血竭二分蟾酥三分白草烏用三分尤效一提金祕方阿魏箬炙二錢血竭一錢雄黃一錢硃砂一錢乳香一錢沒藥一錢沉香五分木香五分天竺黃五分蘆薈五分穿山甲七片炒成珠全蠍一錢木鱉子七個上為細末每用五分雞子一個小頂取破將藥入內紙裹蒸熟空心食之神效妙靈散楊見序傳阿魏箬炙一錢蘆薈二錢半大黃一錢天竺黃一錢雷丸二錢半甘草水浸半日去皮炒胡黃連二錢蜈蚣二條大者一錢紅足者佳瓦上焙去頭足地上出火毒乾漆五錢砂鍋慢火炒放地上去火毒上為細末用蜜水拌勻置碗內以豬尿泡封口懸鍋內重湯煮半炷香為度埋土中一宿次日取出每服九釐或茶或酒或米湯下五黃丸劉繼洲傳退熱如神牛黃一分蘆薈二分阿魏二分天竺黃一分雄黃一錢胡黃連二分蜈蚣二條去頭尾上為細末黃蠟五錢鐵杓化開為丸如緑豆大每五七丸量兒大小黃酒送下或將黃蠟煎雞子入藥於內嚼吃亦可將軍散劉繼洲傳批按此方治癖專攻之劑川大黃酒浸蒸五錢蕎麥麵炒黃三錢阿魏一錢上為細末每服三分燒