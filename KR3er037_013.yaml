山藥一兩木香五錢砂仁五錢肉豆蔻七錢甘草炙三錢上為細末煉蜜為丸如龍眼大每服一丸不拘時清米湯研化服治小兒脾虛泄瀉李椹澗傳山藥半生半炒為細末每服一二錢空心黑砂糖水調服痢病方三神丸劉州判傳治瀉痢南草烏光圓者用三兩一兩燒存性一兩去皮尖火煨一兩去皮尖生用上為末水打麵糊丸如緑豆大每三五丸或八九丸水瀉熟水待冷送下去血黃連甘草湯下白痢乾薑湯下俱用冷服忌一切熱物雞肉魚胙腥膩等物鐵門拴魏進士傳治赤白痢疾五種泄瀉文蛤炒黃色一兩黃丹二錢白礬半生半枯三錢上為細末黃蠟一兩熔為丸如緑豆大每服大人十五丸小兒五七丸茶一錢姜二錢煎湯下鳳凰煎治休息痢及疳瀉日久不能愈者雞子一枚打破用黃蠟一塊如指大銚內熔以雞子拌炒熱空心食之一方治噤口痢並瀉用燒餅一個乘熱分作兩邊將一邊納木鱉子泥搭臍上冷則易之一方治熱痢黃連細茶生薑各等分水煎服封臍治痢良方張西齊傳王瓜藤經霜曬乾燒存性上為末香油調納臍中立效點眼治噤口痢方李興湖傳首胎糞炙干一錢雄黃五分胡黃連四分片腦少許上為細末點兩眼大眥即效治小兒久瀉久痢不止及滿口生瘡白爛如泥疼痛叫哭諸藥不效者張魏川傳巴豆一個去殼瓜子仁七個燒錢灰一個上共搗一處如泥津調貼在兩眉間正中待成泡揭去即已瘧疾方芫花散治小兒瘧疾芫花根為末每用一二分三歲兒用二分以雞子一個去頂入末攪勻紙糊頂口外用紙裹糖灰火煨熟嚼吃天靈散天靈蓋燒存性為末每服五釐黃酒調下立止痰嗽方蜜梨噙治咳嗽痰喘甜梨一個刀切勿斷入蜜於梨內麵裹火煨熟去面吃梨保金丸宗杏川方南星半夏白礬生牙皂巴豆去殼杏仁去殼另研各等分上為末合一處再研令勻棗肉為丸如梧桐子大每三丸針挑燈上燒存性研爛茶清調下一方治咳嗽發熱氣喘吐紅人參天花粉等分上為末每服五分蜜水調下一方治小兒喉中痰壅喘急用巴豆一枚去殼搗爛作一丸以棉花包裹男左女右塞鼻中痰即墜下氣喘方一捻金治小兒風痰吐沫氣喘咳嗽肚腹膨脹不思飲食小兒肺脹咳嗽多人看作風喉大黃檳榔二牽牛人參分兩來湊五味研成細末蜜水調量稀稠每將一字下咽喉不用神針法灸上其證肺脹喘滿胸高氣急兩脅搧動陷下作坑兩鼻竅張悶亂嗽渴聲嗄不嗚痰涎潮塞俗云馬脾風若不急治死於旦夕也盜汗方治小兒盜汗潮熱往來柴胡胡黃連各等分上為細末煉蜜為丸如雞豆子大每一丸至三丸銀器中用酒少許化開更入水五分重湯煮二三十沸放溫食後和渣服蟲痛方治小兒蟲積腹痛巴豆一枚去殼槌去油硃砂一粒同研勻用雞子一個開頂微去白入藥在內攪勻仍將紙糊口用稈圈坐在鍋內水煮熟令兒食之或以茶清送下即打下所積蟲神效追蟲取積散周佐溪傳治小兒蟲積食積熱積氣積或肚大青筋腹脹而痛雷丸錫灰檳榔蕪荑仁木香大黃煨黑醜使君子鶴蝨各等分上為細末煉蜜為丸或蜜或砂糖水調服每二三匙臍風方五通膏周景陽傳治小兒臍風撮口生地黃生薑蔥白蘿蔔子田螺肉各等分上共搗爛搭臍上四周一指厚抱住候一時有屁下泄而愈香螺膏鑑泉兄傳治小兒臍風腫硬如盤田螺三個入麝香少許搗爛搭臍上須臾再易腫痛立消獨神散治小兒臍風用全蠍七個去蠍尾每個用中一節共七節火烤乾為細末乳汁送下小兒頭上微汗出即已夜啼方安神散治小兒夜啼不止狀若鬼神蟬蛻七個下半截為末初生抄一字薄荷湯入酒少許調下或者不信將上半截如上服復啼如初古人立法莫知其妙花火膏治邪熱乘心焦躁夜啼燈花三顆以乳汁調抹兒口或抹母乳上令兒吮之一方用燈心燒灰敷乳上令兒吮之一方加硃砂一字共為末用白蜜調兒睡抹口內丹毒方泥金膏治小兒一切無名腫硬炊赤但是諸般丹瘤熱瘭濕爛大人亦同此法陰地上蚯蚓糞熟皮硝比蚯蚓糞三分之二一處研細新汲水濃調厚敷患處干則再上赤龍散治赤毒火毒走注伏龍肝不拘多少用雞清調敷患處
