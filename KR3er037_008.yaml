body:
  text: 卷之八健忘證夫健忘者陡然而忘其事也盡心力而思量不來為事有始無終言談不知首尾皆主於心脾二經蓋心之官則思脾之官亦主思此由思慮過多傷於心則血耗散神不守舍傷於脾則胃氣衰憊而慮愈深二者皆令人事卒然而忘也蓋心生血因血少不能養其真臟或停飲而氣鬱以生痰氣既郁脾不得舒是病皆由此作治然治之法必先養其心血理其脾土凝神定智之劑以調理亦當以幽間之處安樂之中使其絶於憂慮遠其六淫七情如此日漸安矣方歸脾散治憂思過度勞傷心脾令人轉盼遺忘心下怔忡黃耆炙人參白朮茯神去木當歸遠志酸棗仁龍眼肉各二錢二分木香一錢甘草炙五分上銼作一劑薑棗煎服加減補心湯治諸虛健忘等證人參三錢白朮三錢陳皮五錢白茯苓五錢當歸身五錢白芍五錢炒生地黃五錢遠志泡去心五錢石菖蒲三錢麥門冬去心五錢酸棗仁五錢炒甘草三錢黃柏酒炒五錢知母酒炒五錢上銼一劑水煎服加味定志丸陳白野方治健忘當歸身酒洗川芎白芍藥生地黃酒洗切各二兩人參六錢石菖蒲二兩遠志甘草水泡去骨薑汁炒三兩上為細末煉蜜為丸如梧桐子大每服二錢臨臥白湯送下紫河車治癲狂健忘怔忡失志及恍惚驚怖入心神不守舍多言不定此藥大能安心養血定神聰明湯治不善記而多忘者白茯神遠志肉甘草水泡石菖蒲去毛一寸九節者佳上各三兩制後共為極細末每日用三五錢煎湯空心食後服一日不拘數次久久服之能日誦千言狀元丸治健忘開心通竅定智寧神多記石菖蒲去毛一寸九節者佳地骨皮去木白茯神去皮木遠志肉甘草水泡去心各一兩人參去蘆三錢巴戟天去骨五錢上為末用白茯苓去皮二兩黏米二兩共打粉外用石菖蒲三錢打碎煎濃湯去渣煮糊為丸每日食後午時臥時服三十五丸怔忡驚悸脈心中驚悸脈必大結飲食之悸沉伏動滑病夫怔忡者心中躁動不安惕惕然如人將捕是也多因富貴戚戚貧賤不遂所願而成屬血虛有慮便動屬虛時作時止者痰因火動瘦人多是血少肥人屬痰夫驚悸者驀然而跳躍驚動如有欲厥之狀有時而作者是也屬血虛或時覺心跳亦是血虛蓋人之所主者心心之所養者血心血一虛神氣不守此驚悸之肇端也又曰驚者恐怖之謂怔忡健忘驚悸三證名異而病同方硃砂安神丸治血虛心煩懊憹驚悸怔忡胸中氣亂硃砂五錢水飛過另研黃連酒洗六錢生甘草炙二錢半生地黃一錢半當歸二錢半上為細末蒸餅為丸如黍米大每服三五十丸食後臨臥津咽下安神補心湯當歸一錢二分川芎七分白芍一錢炒生地黃一錢二分白朮一錢茯神一錢二分遠志甘草水泡去心八分酸棗仁炒八分麥門冬去心二錢黃芩一錢二分玄參五分甘草三分一方去遠志麥門冬黃芩玄參加陳皮柏子仁酒炒黃連銼一劑水煎服養心湯治憂愁思慮傷心驚悸不寧及勤政勞心痰多少睡心神不足黃耆蜜炙八分白茯苓一錢茯神一錢半夏曲六分當歸一錢川芎七分甘草炙三分辣桂少許遠志去心薑汁炒八分柏子仁七分五味子十四個酸棗仁炒七分人參五分生地黃一錢上銼薑棗煎食前服治停水怔忡加檳榔赤茯苓參歸腰子治心氣怔忡而自汗者不過一二服即愈人參五錢當歸五錢豬腰子一個上先將以腰子用水二碗煎至一碗半將腰子細切入二味藥同煎至八分吃腰子以藥汁送下有吃不盡腰子同上二味藥渣焙乾為細末山藥糊為丸梧子大每三五十丸米湯下琥珀定智丸劉尚書方專補心生血定魄安魂扶肝壯膽管轄神魂驚戰虛弱氣乏之病並皆治之南星半斤先將地作坑用炭十斤在坑內燒紅去灰淨用好酒十餘斤傾在坑內大瓦盆蓋覆周圍以炭火擁定勿令泄氣次日取出為末真琥珀一兩皂角水洗去油大硃砂二兩公豬心割開入內用線縛住懸胎煮酒二碗幹人乳用薑汁製好揀參去蘆三兩白茯苓去皮三兩白茯神去皮木三兩石菖蒲二兩豬膽汁炒遠志水泡過去心二兩豬膽煮過曬乾再用薑汁製上為末煉蜜為丸如梧子大每夜臥時鹽湯送下五七十丸曬乾人乳法用人乳數碗入瓦盤內莫攪動四周曬乾刮一處干則再刮乳干以薑汁拌曬用鎮心湯雲林驗方治心慌立應當歸一錢二分川芎七分生地黃八分片芩八分黃連六分梔子仁七分炒酸棗仁一錢炒遠志一錢制麥門冬去心一錢白芍八分上銼一劑生薑煎服虛煩病夫虛煩者心胸煩擾而不寧也多是體虛之人攝養有乖榮衛不調使陰陽二氣有所偏勝也又或陰虛而陽盛或陰盛而陽虛內經曰陽虛則外寒陰虛則內熱陽盛則外熱陰盛則內寒令之虛煩多是陰虛生內熱所致虛勞之人腎水有虧心內火蒸其煩必躁吐瀉之後津液枯竭煩而有渴惟傷寒大病之後虛煩之證卻無霍亂臨病宜審之巢氏病源曰心煩不得眠心熱也但虛煩不得眠者膽冷也方溫膽湯治病後虛煩不得臥及心膽虛怯觸事易驚短氣悸乏或復自汗並治半夏七錢竹茹枳實各三錢陳皮四錢半白茯苓去皮甘草炙二錢二分半上銼作一劑薑棗煎服一方加酸棗仁炒遠志肉五味子熟地黃人參竹葉石膏湯方見傷寒治大病後表裡俱虛內無津液煩渴心躁熱與傷寒相似但不惡寒身不疼痛不可汗下宜服之不寐病不寐有二種有病後虛弱及高年人陽衰不寐者有痰在膽經神不歸舍亦令不寐治虛者用六君子湯加炒酸棗仁黃耆痰者用溫膽湯減竹茹一半加南星炒酸棗仁傷寒不寐者當求之本門酸棗仁炒熟便補膽虛寒不眠生用便瀉膽實熱而多睡驚悸健忘怔忡失志不寐心風皆是膽涎沃心以致心氣不足若用涼劑太過則心火愈微痰涎愈盛而病益深宜理痰氣方高枕無憂散雲林制治心膽虛怯晝夜不睡百方無效服此一劑如神人參五錢軟石膏三錢陳皮半夏薑汁浸炒白茯苓枳實竹茹麥門冬龍眼肉甘草各錢半酸棗仁炒一錢上銼水煎服溫膽湯方見虛煩治大病虛煩不得眠此膽寒也依本方加人參茯神遠志尤良酸棗仁丸治膽氣實熱痰迷不睡酸棗仁炒二兩柏子仁炒另研三兩遠志去心三兩生地黃酒洗五錢防風三兩去蘆枳實五錢青竹茹二錢半上為末煉蜜為丸如梧子大每服七十丸不拘時熱水下治勞心膽冷夜臥不睡定志丸加炒酸棗仁炒柏子仁共為末蜜丸如梧子大硃砂乳香為衣每服五十丸棗湯送下便濁脈兩尺脈洪數必便濁遺精心脈短小因心虛所致必遺精便濁病夫赤白濁者由腎水虛少膀胱火盛小便去澀所以成濁也蓋思慮過度嗜欲無節俾心腎不交精元失守為赤白二濁之患焉赤者心虛有熱由思慮而得之白者腎虛有寒因嗜欲而致也河間謂白濁亦屬乎熱丹溪謂胃中濁氣下流滲入膀胱赤者濕熱傷血分白者濕熱傷氣分治大率皆是濕痰流注宜燥中宮之濕用二陳湯以治痰加蒼朮白朮以燥濕加柴胡升麻以提胃中之氣全在活法以治之也如醉飽後色欲不節傷脾損腎脾來乘腎土剋水也至小便黃濁其脈脾部洪數腎脈微澀其證尿下桶如山梔子汁澄下桶底如石灰腳或如血點凝結在內法當補養脾胃宜四炒固真丹主之方清心蓮子飲批按此方治赤濁之劑治心中發熱煩躁思慮憂愁抑鬱小便赤濁或有沙漠夜夢走泄遺瀝澀痛便赤如或酒色過度上盛下虛心火炎上肺金受克故口苦咽乾漸成消渴四肢倦怠男子五淋婦人帶下赤白五心煩熱此藥溫平清心養神祕精大有奇效石蓮肉人參各二錢半黃耆赤茯苓各二錢麥門冬地骨皮黃芩車前子各一錢半甘草一錢一方有木通上銼一劑水煎溫服熱加柴胡薄荷各一錢半上盛下虛加酒炒黃柏知母各一錢滋腎飲治白濁初起半月者極效川萆薢去皮麥門冬去心遠志去心黃柏酒浸菟絲子酒炒五味子酒炒上各等分銼作劑竹葉三個燈草七根大黃少許水煎空心服萆薢飲治真元不足下焦虛寒小便白濁頻數無度漩白如油光彩不定漩腳澄下凝而膏糊益智仁川萆薢石菖蒲烏藥一方加茯苓甘草上銼作劑水煎入鹽一捻空心溫服腎虛加山藥牛膝杜仲便濁加澤瀉麥門冬三神湯東泉叔方批按此方治白濁之劑治遺精白濁蒼朮七錢川萆薢七錢小茴香一兩上銼生薑三片煎入鹽一捻同服水火分清飲批按此方赤白濁兼治之劑治赤白濁益智仁一錢萆薢一錢石菖蒲一錢赤茯苓一錢二分豬苓一錢車前子一錢澤瀉一錢白朮一錢陳皮一錢枳殼一錢甘草五分麻黃一錢上銼一劑半酒半水煎空心溫服久病去麻黃易升麻遺精脈遺精便濁當驗於尺結芤動緊二證之的病夫精者五臟六腑皆有而腎為都會關司之所又聽命於心焉蓋遺精之證有四一曰夢中交而遺者乃心虛神交也二曰下元虛敗精不禁而遺者乃腎虛精滑過也三曰壯年氣盛久節勞欲經絡壅滯而遺精乃曠夫滿而溢也四曰情縱於中所願不得而遺者乃情不遂欲而泄也若夫壯年氣盛及情動於中者但舒其情自愈至若夢中交泄則當治其心腎虛精滑則當固其真斯治之要也夫夢遺精滑者世人多作腎虛治而用補腎澀精之藥不效殊不知此證多屬脾胃飲食厚味痰火濕熱之人多有之蓋腎藏精精之所生由脾胃飲食化生而輸歸於腎今脾胃傷於濃厚濕熱內郁中氣濁而不清則其化生之精亦得濁氣腎主祕藏陰靜則寧今所輸之精既有濁氣則邪火動於腎中而火不得寧靜故遺而滑也此證與白濁同丹溪論白濁為胃中濁氣下流滲入膀胱而云無人知此其色心太重妄想過度而致遺滑者自從心腎治之但兼脾胃者多又當審察治之治凡二八童男陽氣暴盛故情動於中志有所慕而不得遂成夜夢而遺精也其心脈數腎脈澀慎不可補清心乃安惟清心蓮子飲臨臥服及定主丸主之夜夢鬼交而遺宜溫膽湯去竹茹加人參遠志石蓮肉酸棗仁炒白茯神方養心湯治用心過度心熱遺精恍惚多夢或驚而不寐者人參山藥茯神麥門冬當歸身白芍石蓮肉遠志酸棗仁雞頭實蓮花須子芩酒洗上銼一劑加生薑三片棗一枚水煎服氣虛加黃耆白朮血虛加熟地黃遺久氣陷加川芎升麻去子芩定心丸批按此方治妄想太過遺精之劑治妄想太過遺精人參白朮茯苓枳實麵炒石蓮肉去心陳皮韭子炒各一兩半夏遠志去骨酸棗仁各五錢牡蠣煨三錢甘草多一錢半上為末神麯糊為丸如梧子大每服五十丸空心鹽湯下久則加乾薑炒黑三錢樗根白皮五錢加味二陳湯批按此方治痰滲下遺精之劑治遺精陳皮一錢半夏一錢半薑泡茯苓一錢半鹽水炒白朮一錢桔梗一錢石菖蒲七分黃柏二分知母三分梔子炒黑一錢半升麻一錢酒炒柴胡一錢酒炒甘草一錢上銼一劑生薑煎服樗根白皮丸批按此方治濕熱傷脾遺精之劑治濕熱傷脾遺精之劑白朮枳實麵炒茯苓柴胡升麻各二錢黃柏鹽水炒知母鹽水炒牡蠣煅各三錢韭子炒一兩芍藥炒五錢上為末神麯糊為丸每服五十丸空心鹽湯下久不止加樗根白皮七錢黃連清心湯治心有所慕而作夢遺此君火既動而相火隨之治在心黃連生地黃當歸人參遠志茯神酸棗仁炒石蓮肉甘草上銼作劑水煎服三黃丸治遺精有熱者黃芩瀉肺炎黃柏降陰火大黃瀉陽明之濕熱上為末煉蜜為丸如梧桐子大每服五七十丸白湯下批按此方治實熱遺精之劑西園曰遺精是用心過度積熱所致當用黃連今用黃芩未知孰是保精湯雲林制治陰虛火動夜夢遺精或發熱當歸川芎白芍生地黃薑汁炒沙參麥門冬去心黃柏酒炒知母蜜炒黃連薑汁炒梔子童便炒乾薑炒黑牡蠣火煅山茱萸去核取肉上銼水煎空心服固精丸治心神不安腎虛精自泄黃柏酒炒知母酒炒各一兩牡蠣煅芡實蓮蕊茯苓遠志去心山茱萸肉各三錢上為末煮山藥糊為丸如梧子大硃砂為衣每服五十丸空心鹽湯送下百粉丸西園公制批按此方治腎虛火動遺精之劑治腎虛火動遺精黃柏童便炒知母童便炒蛤粉略炒牡蠣火煅山藥酒炒上為末搗爛飯為丸如梧子大每服五七十丸空心鹽湯溫酒任下固本鎖精丹祕方批按此方治精氣兩虛遺精之劑治元陽虛憊精氣不固夢寐遺精夜多盜汗遺泄不禁並治此藥大補元氣澀精固陽神效黃耆二兩半人參二兩半枸杞子二兩鎖陽二兩五味子二兩半石蓮肉二兩半山藥二兩海蛤粉二兩半黃柏二兩酒拌曬乾炒黑色上為末用白朮六兩水五碗煎至二碗倒過術汁另放再用水四碗煎至二碗去渣與前二碗同煎熬至一碗如膏搜和前藥末為丸如梧子大每服五十丸加至六七十丸空心溫酒或淡鹽湯下白龍丸賈閣老傳批按此方治精滑止澀之劑治虛勞腎損夢中遺精白淫滑泄盜汗等症鹿角霜二兩龍骨生用一兩牡蠣火煅二兩上為細末酒打麵糊為丸如梧子大每三五十丸空心服或鹽湯或酒下不惟治遺之疾且能固精壯陽神效縮陽祕方張嶺南傳水蛭尋起九條入水碗養住至七月七日取出陰乾稱有多少入麝香合香三味一般多研細末蜜少許為餅遇陽興時即將少許擦左腳心即時痿縮過日復興再擦淋閉脈少陰脈細而微為氣淋婦人則陰中生瘡盛大而堅者生虛弱而澀者死鼻頭色黃小便必難脈浮弦澀為不小便關格頭汗者死病夫淋者小便淋瀝澀痛欲去不去不去又來曰淋蓋因恣食膏粱之味濕熱之物或燒酒炙爆之類郁遏成疾以致脾土受害乏力不能運化精微清濁相混故使肺金無助而水道不清漸成淋閉之候或謂酒後房勞或七情鬱結以致心腎不交水火無制清陽不升濁陰不降而成天地不交之痞古方有五淋之別氣砂血膏勞也氣淋則小便澀滯常有瀝不盡砂淋則莖中痛溺不得卒出乃精氣結成砂石與溺俱出出則痛止血淋則遇熱即發小便澀痛有血不痛者名溺血膏淋則尿濁如膏浮凝如脂勞淋則遇房勞即發痛引氣中也又云小腸有氣則小便脹小腸有血則小便澀小腸有熱則小便痛治之但當行滯清熱疏利小便不可用補氣藥蓋氣得補則愈脹血得補則愈澀熱得補則愈盛又有挾冷而淋者其狀先寒戰而後小便謂冷氣與正氣交爭冷氣勝則寒戰而淋正氣勝則寒戰解而得便溺也治當逐散寒邪扶正氣則自平矣治閉者小便急滿不通也有氣虛有血虛有痰有熱有風閉皆宜吐之以提其氣氣升則水自降蓋氣承載其水也譬如滴水之器上竅閉則下竅不出使吐之是開上竅之法也氣虛以參朮升麻等先服後吐或就參耆藥中調理探吐之血虛四物湯先服後吐或芎歸湯探吐痰多二陳湯先服後吐痰氣閉塞二陳加木通香附探吐實熱者當利之或八正散大便動而小便自通遺尿失禁經曰膀胱不利為癃不約為遺大抵熱則燥澀為癃寒則不禁為遺亦有虛熱而滑者法當溫補其溺自禁或灸關元五壯亦效東垣曰小便遺失者肺氣虛也以參耆補之小便不禁或頻數古方多以為寒而以溫澀之藥殊不知屬熱者多蓋膀胱火邪妄動水不得寧故不能禁而頻數來也故年老人多頻數者是膀胱血少少陽火偏旺也治法當補膀胱陰血瀉火邪為主而佐以收澀之藥如牡蠣山茱萸五味子之類不可用溫藥也病本屬熱故宜瀉火因水不足故火動而致小便多水益虛矣故宜補血補血瀉火治其本也澀之收之治其標也治五淋用補中益氣湯有殊效按此方治淋多謂膀胱之氣虛損不能運用水道故滯而不通而成諸淋也用此養元氣故有效焉方五淋散治肺氣不足膀胱有熱水道不通淋瀝不出或尿如豆汁或如砂石或冷淋如膏或熱淋尿血赤茯苓一錢二分赤芍藥二錢山梔子二錢當歸一錢甘草五分條黃芩六分一方加生地黃澤瀉木通滑石車前子各等分上銼散水煎空心服八正散治心經蘊熱臟腑閉結小便赤澀癃閉不通及熱淋血淋如酒後縱欲而得者則小便將出而痛既出而癢以此藥主之車前子瞿麥萹蓄滑石山梔仁大黃木通甘草各等分上銼作劑燈心煎空心服小便淋滴頻數無度加牛膝琥珀散太醫院傳治血淋神方琥珀二兩當歸一兩半蒲黃二兩生地黃一兩半瞿麥一兩血餘四兩燒灰梔子一兩大小薊各一兩半甘草三錢酸漿草自然汁五碗上共研為末將酸漿草汁和諸藥曬乾為末每服三錢空心米飲調下阿膠散祕方治血淋阿膠二兩炒豬苓澤瀉赤茯苓滑石各一兩車前子五錢上銼水煎空心服治血淋用乾柿餅燒存性為末每服二錢空心米飲調下高尚書方治小便下血多是濕熱五苓散加蒼朮三分一劑而愈散滯茴香湯黨都堂傳治諸淋並婦人赤白帶下小茴香一錢當歸一錢烏藥一錢荊芥穗一錢黃連一錢木通一錢扁竹一錢砂仁八分薄荷八分香附子五分上銼一劑淡竹葉十片水煎空心溫服琥珀鬱金丸治水火不既濟膀胱因心火所熾而浮囊中積熱或癃閉不通或遺泄不禁或白濁如泔水或膏淋如膿或如梔子汁或如砂石米粒或如粉糊相似疼痛不已俱熱證也此藥治之黑牽牛頭末二兩炒大黃酒浸二兩黃連一兩黃芩二兩鬱金一兩滑石四兩真琥珀二兩研茯苓四兩上共為末水丸如梧子大每服五十丸空心熟水下六味地黃丸治老人虛寒者患死血作淋痛不可忍倍茯苓澤瀉又治小便頻數不禁去澤瀉用益智仁批按此方治諸淋之劑治冷淋諸藥不效用四君子湯加豬苓澤瀉木通連進二服又以菟絲子研極細用雞翎管吹入小便孔內極效通關丸治小便不通熱在下焦血分兼治諸淋黃柏二兩酒炒知母二兩酒炒肉桂三錢滑石二兩木通一兩上為末水丸梧子大每服百丸白水下一方治小便不通腹脹疼痛欲死野地蒺藜子不拘多少焙黃色為末溫黃酒調服一方用蚯蚓五七條研爛投涼水一碗攪勻澄清去泥滓飲水即時通大解熱疾不知人事欲死者服之立效一方用頃麻燒灰存性為末黃酒調服登時就通一方用皮硝煎化青布蘸水搭臍上並上便上熱則易之即通若小便不通兩尺脈俱沉微乃陰虛也曾服通滑之藥不效者用大附子一個重一兩者炮去皮臍鹽水浸透澤瀉切作四劑每劑燈草七根煎服治小便不通諸藥無效或轉胞至死此法用之小便自出用豬尿胞一個傾出水用鵝毛去頭尾插入竅孔內線縛定以口吹氣令滿胞內線管下再扎住將管口放在小便頭上向孔竅解後下線手搓其氣透里小便自然出神效批按此方治小便不通之劑一陰陽關格前後不通尋常通利大腑小水自行中有轉胞一證諸藥不效失救則脹滿悶亂而死豫嘗以甘遂末水調敷臍下內以甘草節煎湯飲之及藥汁至臍二藥相反胞自轉矣小水來如泉湧此急救之良訣也縮泉丸治脬氣不足小便頻數一日夜百餘次益智仁天台烏藥大如臂者上各等分為末酒煮山藥打糊為丸如梧子大每五七十丸臥時鹽湯送下既濟丸治小便不禁菟絲子酒製益智仁炒茯苓韭子炒肉蓯蓉酒洗當歸熟地黃各五錢黃柏知母各鹽酒炒三錢牡蠣煅石棗酒蒸去核各三錢五味子一錢上為末麵糊為丸每百丸空心鹽水下一方治小便不禁有熱者用去桂五苓散加黃連黃柏梔子石棗五味子水煎服一方治虛弱不禁用五苓散合四物湯加石棗五味子水煎空心服一方治遺尿失禁破故紙炒為末每服二三錢空心熱水調下又宜氣海穴灸之一方批按此方治小便不禁之劑治夜多小便益智仁二十個和皮銼赤茯苓二錢水煎臨睡熱服虛老人宜八味地黃丸加益智仁去澤瀉關格脈兩寸俱盛四倍以上經曰人迎大四倍於氣口大四倍於人迎名曰關此謂俱盛四倍蓋以其病甚而至於上則遏絶下則閉塞關格俱病者言之病夫關格者謂膈中覺有所礙欲升不升欲降不降欲食不食此為氣之橫格也必用吐以提其氣之橫格不必在出痰也有痰以二陳湯探吐之吐中便有降有氣虛不運者補氣藥中升降丹溪曰此證多死寒在上熱在下也寒在胸中遏絶不入無入之理故曰格熱在下焦填塞不通無出入之由故曰關格則吐逆關則不得小便內經曰人迎與氣口俱盛四倍以上為關格關格之脈羸不能極於天地之精氣則死矣方兩枳三陳湯治關格上焦痰壅兩手脈盛是也陳皮半夏各二錢白茯苓一錢半南星枳殼枳實甘草各一錢上銼一劑水煎服用鵝毛於病人咽喉探吐之如病虛弱不可用也一方治關格吐逆小便不通藿香平胃散合五苓散加薑棗煎服閉結脈多伏沉而結脾脈沉數下連於尺為陽結二尺脈虛或沉細而遲為陰結右尺脈浮為風結老人虛人脈結脈雀啄者不治多面黃可候病夫閉結者大便不通內經云北方黑色入通於腎開竅於二陰藏精於腎又云腎主大便大便難者取足少陰夫腎主五液津液潤則大便如常若飢飽失節勞役過度損傷胃氣反食辛熱厚味之物而助火邪伏於血中耗散真陰津液虧少故大便結燥然結燥之病不一有熱燥有風燥有陽結有陰結又有年老氣虛津液不足而結燥者法云腎惡燥急食辛以潤之結者散之如少陰不得大便以辛潤之太陰不得大便以苦瀉之陽結者散之陰結者溫之仲景云小便利而大便硬不可攻下以脾約丸潤之食傷太陰腹滿而食不化腹響而不能大便者以苦泄之如血燥而不能大便者以桃仁酒製大黃通之風結燥者以麻仁大黃利之如風滯而不通者以郁李仁枳實皂角仁潤之大抵治病必究其原不可一概用巴豆牽牛之類下之損其津液結燥愈甚復下復結極則以至導引於下而不通遂成不救噫可不慎哉治凡臟腑之閉不可一例治療有虛實之分胃實而閉者能飲食小便赤當以利氣丸三黃丸脾藥丸之類下之胃虛而閉者不能飲食小便清利厚朴湯主之蓋實閉物也虛閉氣也若胃中停滯寒冷之物大便不通心腹作痛者備急丹主之若食傷太陰氣滯不通者利氣丸主之大便閉服承氣湯之類不通者以四物湯加檳榔枳殼桃仁紅花方潤腸湯祕方治虛老人大便閉結蜂蜜一兩香油五錢朴硝一撮上合一處水一鍾煎數服溫服東流飲谷同知傳批按此方治實熱閉結之劑治大便熱結閉塞良方細茶一撮生芝麻一撮生桃仁七枚大黃一錢或二三錢甘草五分上用長流水生擂碎服立效厚朴湯批按此方治胃虛閉結之劑治胃虛而閉不能飲食小便清利厚朴薑汁炒二錢六分白朮四錢枳實麵炒一錢半陳皮二錢半夏一錢八分甘草炙二錢上銼作二劑每生薑三片煎食遠溫服三和湯治七情之氣結於五臟不能流通以致脾胃不和心腹痞悶大便閉結羌活紫蘇去梗木瓜沉香各一錢木香白朮檳榔各七分半川芎甘草炙陳皮各七分半大腹皮一錢上銼一劑水煎不拘時服六磨湯批按此方治氣滯閉結之劑治氣滯腹急大便閉結沉香木香檳榔烏藥枳殼大黃上各磨濃汁合一處重湯煮溫服之即通通幽湯治大便難幽門不通上衝吸門不開噎塞不便燥閉氣不得下治在幽門以辛潤之當歸一錢生地黃熟地黃甘草炙各五分升麻桃仁各一錢紅花三分大黃煨火麻仁各三錢上作一劑水煎去渣調檳榔末五分食前稍熱服潤腸丸治老人血少腸胃乾燥大便閉結幾日不行甚至七八日難下色如豬糞小如羊糞者當歸生地黃枳殼桃仁火麻仁各等分上為末煉蜜為丸如梧子大每四五十丸清米飲下活血潤燥丸批按此方治血虛閉結之劑治久病腹中有實熱者脾胃中伏火大便閉澀不思飲食及風門血閉時常結燥當歸梢一錢防風三錢羌活一兩大黃一兩濕紙裹煨皂角仁燒存性一兩半桃仁一兩仁火麻二兩半研上為末煉蜜為丸如梧子大每五十丸白湯下二三服後須以蘇子麻仁粥每日早晚服之二味不拘多少研爛水濾取汁煮粥食之能順氣滑大便治大便不通神方方外異人傳批按此方治閉結下取之劑皮硝一撮水化香油一盞皂角末少許用竹管一頭套入穀道中一頭以豬尿胞將三味入內放竹管里用手著力一捻藥入即通顛倒散周芑崖方治臟腑實熱或小便不通或大便不通或大小便俱不通大黃三錢滑石三錢皂角三錢如大便不通加大黃三錢如小便不通加滑石三錢如大小便俱不通大黃滑石各加三錢為末空心溫酒調下倒換散治大小便不通大便不通大黃一兩杏仁三錢小便不通大黃三錢杏仁一兩水煎服治大小便不通按此方治大小便不通之劑六七月間尋牛糞中有大蜣螂不拘多少用線串起陰乾收貯用時取一個要全者放淨磚上四面以灰火烘乾以刀從腰切斷如大便閉用上半截小便閉用下半截各為末新汲水調服二便俱閉則全用之痔漏脈沉小實者易治浮洪而軟弱者難治病夫痔漏者肛門邊內外有瘡也若成㿔不破者曰痔破潰而出膿血黃水浸淫淋瀝久不止者曰漏也由乎風熱濕燥合而致之其狀有五曰牡曰牝曰脈曰血曰腸痔是也又有酒痔氣痔蟲痔翻花痔螻蛄痔古方分為二十四種名狀不同究其所因亦不過久嗜辛熱炙爆新酒及房欲憂思蘊積熱毒憤郁之氣所成也或藏於肛門之內或突出肛門之外蘊積深者其狀大蘊毒淺者其狀小大如雞冠蓮花核桃之狀小如牛奶雞心櫻桃之形或流膿水或出鮮血有妨行坐痛苦無任久而不愈則成漏矣治治宜祛風除濕清熱解毒斯得痔漏之要者也二十四症痔歌痔症分三八憑君仔細看莫交年月久見者膽心寒菱角看形怪蓮花不可觀穿腸並鼠奶酒色兩相干莫願翻花怨蜂窠亦不寬雌雄同氣血子母及腸盤玄珠尤可怪勾腸痛苦鑽核桃與流氣見者便心酸栗子於中大雞心在外安珊瑚形可惡那更脫肛難內痔紅不出搭腸里內盤垂珠更難治日久有雞冠切莫輕刀火令君性命殘用功無半月去病更除根方秦艽蒼朮湯治痔病若破為之漏疾大便閉澀必作大痛皆由風熱所乘食飽不通氣逼大腸而作也受病者燥氣也為病者胃濕也胃刑大腸則化燥火以乘燥熱之實勝風附熱而來是濕熱風燥四氣而合故大腸頭成塊者濕也大痛者風也若大便燥結者主病兼受火斜熱結不通也秦艽去蘆一錢桃仁去皮研一錢蒼朮米泔浸七分皂角仁燒存性一錢防風七分黃柏酒浸五分當歸梢五分澤瀉五分檳榔二分大黃二分不可多用上銼一劑水煎空心服若久漏加鹿茸一錢海藻一錢甘草五分服藥日忌生冷硬物及酒濕面大料物乾薑之類犯之則藥不效矣祕方治痔瘡坐臥不得諸藥不效惟此藥妙發時一點即好用大田螺八九個針破頂蓋入白礬末少許置地上尖底埋土中其頂蓋仰天經一宿次日取蓋上水水汁以雞翎搽瘡上五七次止痛即消治痔瘡祕方用半新馬桶一個入新磚一個放桶底上再用新磚一個燒紅於磚上上用全蠍兩三枚燒煙患人坐桶上熏之不二三次即愈治痔瘡劉夷門傳用大雄雞一隻置地板上卻不與食吃伺飢甚卻移於淨地上用豬胰子四兩銼碎旋餵雞令其撒糞旋收之如此兩三日候雞糞積至四兩曬乾入後藥明礬四兩膽礬五錢葉子雌黃六錢雄黃一錢朴硝一兩上各為細末或砂鍋或銀鍋雖完大者先將雞糞一兩鋪在鍋底次以膽礬次以雌黃然後盡下白礬在內再以雞糞蓋在上面用新碗蓋鍋頂簇炭火煅青煙盡為度放冷取出細研入乳香沒藥各五錢同研極細入盒內收之每用時令患人縮一腳用藥少許以津唾吐在手心中調勻以新筆蘸藥敷之一日三五次一夜兩三次先用溫湯洗淨軟綿挹干方可敷藥敷後有黃水淋瀝不止最妙三二日痔乾枯剝落倘硬煎湯頻洗忌毒物酒色效神繭散古方治諸痔有神效蠶繭內入男子指甲以滿為度外面用童子發縛裹燒存性蜜調敷之仍於臘月八日取黑牛膽入槐角子以滿為度百日開用空心酒吞十餘粒極妙五九散徽王方治痔漏如神白牽牛頭末一兩大黃一兩五倍子一兩干蓮蕊一兩礬紅五錢以皂角煉紅黃連三錢當歸五錢沒藥一錢乳香一錢竹葉焙乾上共為末初服五分二服六分三服七分四服八分五服九分為止每日清晨用牙豬肉湯半碗加無灰酒一小鐘調下忌豬腸肚驢肉燒酒三八全應丸張明山方瘡漏效驗刺蝟皮一個連刺酒浸曬乾當歸酒洗二兩槐角酒浸炒二兩黃連酒炒二兩地骨皮酒炒乾二兩甘草蜜炙二兩乳香二錢核桃十八個內取隔三十六片上為末醋糊為丸如梧子大每服三十五丸白湯或酒早晚二服一月後平復地干丸古方治痔漏通用槐角二兩涼血當歸身一兩黃耆一兩生地黃二兩生血川芎五錢阿臍五錢以上皆補虛黃連一兩瀉火連翹一兩瀉經脈中火黃芩一兩瀉大腸火枳殼一兩寬腸秦艽一兩去大腸風防風一兩地榆一兩涼血升麻一兩散火白芷五錢引諸藥入大腸上為末酒糊丸如梧子大每服五六十丸加至七八十丸空心米湯下或酒任下祕方治痔漏用蜜半盞煉成絲用雄膽一分入蜜內再煉入水成珠不散將豬綜綿裹拈成拈將蜜搽在拈上乃用真冰片熊膽各半分研細搽在拈上插入漏眼內底至盡頭則止如眼多醫好一個不可一起上拈如外皮肉潰爛用黃蠟黃丹麻油煎膏貼瘡上縛緊一七見效如外肉效遲恐瘡久受風濕用五倍子花椒煎水洗每一眼用拈三根至夜換治痔瘡方周雙橋傳用鱉魚一個放在壇內入麝香一二分於內燒滾水傾入壇內泡鱉令患人將大便坐於壇口上熱氣熏蒸良久將水洗痔不記遍數卻將鱉頭燒灰摻上再將鱉肉作羹食之神效治痔瘡方刺蝟皮雄黃北艾上為末每作核桃大炷子用竹筒如小酒杯一杯大長尺余一頭留節鑽一竅裝入於內燒煙令竅透瘡口熏之久則癢不可當稍歇再熏洗痔漏陳教諭傳花椒艾葉蔥頭五倍子皮硝馬齒菜茄根上為散水煎先熏後洗當時痛止指日可愈追風補腎十漏十金丹治漏庚申甲子成除日合當歸二兩人參一兩生地一兩熟地二兩麥門冬二兩破故紙二兩小茴一兩大茴三兩肉蓯蓉二兩山藥二兩白茯苓二兩鹿茸一兩大附子一個川烏一兩丁香五錢木香一兩青木香一兩砂仁一兩厚朴一兩青皮一兩陳皮一兩枳殼二兩枳實三兩香附四兩烏藥一兩白芷二兩肉豆蔻一兩天麻一兩杏仁二兩松節四兩硇砂五錢乳香一兩沒藥一兩上為末煉蜜丸如彈子大金箔為衣每服一丸空心酒化下按治痔之法不過涼血清熱而已至於治漏初則宜涼血燥濕久則宜澀竅殺蟲而兼乎溫散也或曰痔漏屬火何故而用溫澀之藥殊不知痔止出血始終是熱漏流膿水始是濕熱終是濕寒此方雖溫散又兼補養故丹溪云漏當大補氣血為主有所自矣懸癰治治懸癰此瘡生穀道外腎之間初發甚癢狀如松子四十日赤腫如桃治遲則破而大小便皆從此出不可治矣方國老湯治懸癰用橫紋大甘草一兩截長三寸許取出山澗東流水一碗不用井水河水以甘草蘸水文武火慢炙不可急性須用三時久水盡為度劈視草中潤透卻以無灰酒二碗煮至一碗溫服一日一服半月消盡為度將軍散大黃煨貝母白芷甘草節上為末酒調空心服虛弱加當歸一半腸澼脈便血則芤數則赤黃實脈癃閉熱在膀胱病夫腸澼者大便下血也又謂腸風臟毒是也皆由飽食炙爆生冷酒色並傷坐臥當風榮衛氣虛風斜冷氣進襲臟腑因熱乘之血滲腸間腸風斜氣入臟臟毒是臟中積毒風則散之熱則清之寒則溫之虛則補之停滯則疏滌之治腸風下血必在糞前是名近血色清而鮮其脈必浮宜敗毒散主之臟毒下血必在糞後是名遠血色黯而濁其脈必沉滯香連丸主之臟寒下血無痛脈沉微經云陽虛陰必走宜以薑桂之類溫則血歸經也積熱下血純下鮮血甚則兼痛脈洪數宜三黃丸主之或敗毒散加黃連腸風者邪氣外入隨感隨見所以其色清也臟毒者蘊積毒久而始見所以其色濁治腸風以散風行濕藥治臟毒以清濕涼血藥又要看其虛實新久之不同新者實者宜降之瀉之虛者久者宜升之補之故治法有所異也方枳殼散治大便下血枳殼二兩炒黃連一兩槐花五錢炒地榆五錢白芍一兩甘草二錢半上銼五劑水煎空心服一方加當歸生地黃防風各五錢海上方治腸風下血痔漏脫肛絲瓜根經霜一二次收採洗淨夜露十餘宿懸當風處陰乾每服三五錢銼散水煎熱去渣滴香油如錢大空心溫服忌雞燒酒一日一服即放乾柿散治腸風臟毒腸澼神效乾柿不拘多少焙乾燒存性每服二錢米飲調下槐黃丸周後峰傳治腸風臟毒便血痔漏神效黃連四兩酒炒槐花四兩炒上為末入豬大腸頭長一尺內扎住用韭菜二斤水同煮爛去菜用腸藥搗爛丸如梧子大如濕加神麯丸每服八十丸空心米湯下解毒四物湯京師傳批按此方治下血虛弱之劑治大便下血不問糞前糞後腸風臟毒等證當歸酒洗八分川芎五分白芍炒六分生地黃一錢黃連炒六分黃芩炒八分黃柏炒七分梔子炒黑七分地榆八分槐花炒五分阿膠珠六分柏葉炒六分上水煎空心服腹脹加陳皮六分氣虛加人參三分白朮三分木香三分腸風加荊芥五分氣下陷加升麻五分心血不足加茯苓六分虛寒加炒乾薑五分脫肛病夫脫肛者肛門翻出也乃虛寒下脫其病或由腸風痔漏久服寒涼坐弩而下脫或因久痢裡急窘迫而脫下又有産婦用力過多及小兒叫號怒氣久痢久瀉不止風邪襲虛而脫也蓋肺與大腸為表裡肛者大腸之門肺實熱則閉結肺寒虛則肛出腎主大便故肺腎虛者多有此證治若大腸濕熱用升陽除濕湯若血熱用四物湯加條芩槐花血虛四物湯加白朮茯苓兼痔加槐花黃連升麻虛熱用補中益氣湯加芍藥腎虛六味地黃丸方升陽除濕湯自下而上者引而竭之柴胡升麻防風豬苓澤瀉蒼朮陳皮神麯炒麥芽炒甘草上銼水煎空心溫服胃寒腸鳴加益智半夏提氣散黃耆人參白朮當歸白芍乾薑炮柴胡升麻羌活甘草上水煎服治肛門邊腫硬痛癢用白礬三分碎研用熱童便二盞化開洗痔上一日二三次洗之二槐丹劉桐川傳治脫肛槐角槐子各等分上為末生羊血調成塊曬乾或微焙乾毋令血熱每服二錢空心黃酒送下祕方用鱉一個水煮留湯洗肛將鱉食之又留骨燒存性敷肛上神效治脫肛用烏龍尾鼠糞和之燒煙於桶內令坐其上熏之數次即上不脫為效腋氣方烏龍丸許昌徐憲副方治腋氣神方當歸一兩酒洗懷生地黃一兩搗爛白茯苓二兩去皮連蕊五錢焙枸杞子一兩炒石蓮肉一兩焙丁香五錢木香五錢青木香五錢乳香五錢京墨五錢冰片一分半研上為末用陳米飯荷葉包燒過搗爛入地黃為丸如黃豆大麝香一分黃酒化為衣每服三四十丸臨臥半飢半飽用砂仁一二分炒入黃酒內送下婦人加烏藥三錢醋炒香附米三錢童便炒收功後藥徐憲副傳人參當歸生地黃乳香沒藥官桂木香各一錢麝香八味用酒浸過青皮陳皮白芷良薑麻黃米殼甘草各一錢上銼水煎服出汗外用川椒枯礬各一兩為末擦腋下終身忌鱖魚羊肉去大小便不可與女同廁祕傳奇方治體氣大田螺一個巴豆去殼膽礬一豆許麝香少許上將螺用水養三日去泥土揭起螺靨入礬豆麝在內以線拴住放瓷器內次日化成水須五更時將藥以手自抹腋下不住手抹藥直候腹內欲行臟腑卻住手先要揀空地面去大便黑糞極臭是其驗也以厚土蓋之不可令人知之如不盡再以藥水抹之又去大便以日用後藥擦之永去病根枯礬一兩蛤粉五錢樟腦一錢上為末每以少許擦之治體氣方枯礬一錢輕粉三分蛤粉二錢密陀僧五分上為末研勻每少許擦之諸蟲方化蟲丸治蟲咬心痛並腹中痛有塊按之不見往來痛無休止鶴蝨三錢胡粉炒枯礬苦楝根檳榔各五錢上為末麵糊丸如梧子大每十五丸米飲入真芝麻油一二點打勻服之其蟲下者化為水大者自下下蟲散治大人小兒腹內有蟲使君子一錢去殼檳榔一錢雄黃五分上為末每服大人二錢苦楝根煎湯下遇仙丹古方黑牽牛四兩半生半炒三稜五錢莪朮五錢茵陳穗五錢檳榔五錢俱生用上為末每藥末四兩用飛羅面一兩卻將皂角五錢煎水煮麵糊丸如梧子大每服三錢壯盛者五錢小兒減半五更雞鳴時茶清送下凡人得病皆因飲酒食肉生冷過度致使心膈脹滿嘔惡吞酸常吐清水面黃肌瘦不思飲食或成氣塊初病未覺漸成大患此藥能治五勞七傷山嵐瘴氣水腫肚腹脾胃心肺諸病齁䶎咳嗽痰涎壅滯酒積氣塊翻胃吐食十膈五噎嘔逆噁心腸風痔漏血毒積痢熱氣上攻頭目瘡癩下部淋瀝女人血蠱氣腫寒熱往來婦人月水不調赤白帶下鬼胎小兒五疳蟲積誤吞銅鐵食惡毒物並治病淺者一服見效病根深者再進一服必候惡物下盡為度所下其蟲曰穿心蟲曰血鱉蟲曰傳尸蟲積血蟲細蟲長蟲寸白蟲其狀不一或作五色或如爛魚凍若一次未見蟲積更看第二三次下來病根才去此乃玉莖略按玉莖略疑係王經略之誤因赴度東安撫在任得沾山嵐瘴氣肚腹脹滿百藥無效偶遇道人付此藥一劑服之下蟲一條形狀如蛇長三寸余病乃愈傳留此方騰空去世稱遇仙丹也
